является лидер, растёт сплочённость. Но совместная работа приводит и к конфликтам.\n- «Алый парус». Гордость за свой отряд и радость общим успехам. При поражениях дети отказываются признавать ошибки. Растёт ответственность и требования друг к другу.\n- «Горящий факел». Пик: крепкая дружба, взаимопонимание, сотрудничество вместо соперничества. Нужно поддерживать общими делами.\n## Стили руководства\n- «Разящие стрелы»: конкретные требования и призывы. Для 1-3 стадий.\n- «Возвращающийся бумеранг»: сотрудничество, советы, консультации. Для 3-4 стадий.\n- «Снующий челнок»: уговоры и компромисс. Только вспомогательно.\n- «Плывущий плот»: уступки и полное согласие. Малоэффективен, применять редко.\n## Периоды смены и позиция вожатого\n- Подготовительный (около 10 дней до смены): изучить информацию о лагере, коллектив, подготовить документы, сходить на оргсовещание.\n- Организационный (1-3 день): познакомить детей, создать безопасную атмосферу, познакомить с темой смены, выявить лидеров. Позиция: организатор, который руководит всем. С первого дня показать авторитет, быть в меру требовательным, не быть агрессивным и не принуждать. Стиль: «разящие стрелы».\n- Основной: организовать досуг по интересам отряда, укреплять дружбу, формировать самоуправление и традиции, создавать ситуации успеха. Позиция: руководить через самоуправление, координировать и советовать.\n- Заключительный (последние 2-3 дня): подвести итоги, похвалить каждого, наградить сувенирами, создать дружеское прощание (заключительный огонёк, письма друг другу). Позиция: друг, создающий атмосферу.\n- Постлагерный (3-10 дней после): собрание, анализ смены.\n## Кризисные точки смены\n- 3-й день: неоправданные ожидания.\n- 7-й день: усталость от однообразия.\n- 9-й день: кризис одиночества, формирование групп.\n- 13-й день: передел власти, «бунт стариков».\n- 17-й день: старики-всезнайки.\n- 19-й день: страх расставания.\nДля коротких смен (7-10 дней) кризисы сдвигаются и сжимаются: ждите их раньше, чем кажется.\n## Типажи в отряде\n- Лидер: помощник и опора вожатого, его должен выбрать сам отряд. Выявлять через игры на лидерство.\n- Душа компании: «психолог отряда», ему рассказывают секреты и переживания.\n- Серый кардинал: скрытый лидер, влияет на всех. Вожатый может использовать это.\n- Аутсайдер: живёт вне коллектива. Почаще игры на сплочение, создавайте ситуации, где он раскроется.\n## Дисциплина и самоуправление\n- Дисциплина - подчинение установленным правилам. Подавайте пример, выводите правила вместе с отрядом, хвалите соблюдающих, анализируйте дисциплину.\n- Если нарушают: попробуйте понять причину и поговорите, не наказывайте за мелкие проступки, чаще поощряйте, учитывайте возраст."},{"t":"Режим дня","cat":"Каждый день","b":"- 8:00 подъём, зарядка, личная гигиена\n- 9:00 завтрак\n- 9:30 линейка, время добрых дел\n- 10:30-13:30 отрядные дела, мастерские, тренинги\n- 13:30 обед\n- 14:00-16:00 дневной отдых\n- 16:00 полдник\n- 16:15 самоуправление, поручения\n- 17:00-19:00 подготовка к вечернему мероприятию, тренинги, отрядные дела\n- 19:00 ужин\n- 19:30-21:00 вечернее мероприятие\n- 21:00 построение, второй ужин, свеча, личная гигиена\n- 22:00 отбой у младших, 22:30 у старших"},{"t":"Дежурный командир (дежком)","cat":"Каждый день","b":"- Проверяет и организует быт: в корпусе есть питьевая вода и стаканчики, в каждой кабинке туалетная бумага.\n- Отвечает на вопросы вожатых в течение дня.\n- Проводит утреннее и вечернее построение.\n- Готовит вечернее мероприятие: место, реквизит, проверяет, что все выполнили свои задачи.\n- Собирает информацию для начальника дружины.\n- Дежурит в тихий час в корпусе."},{"t":"Столовая","cat":"Каждый день","b":"- Пока отряд собирается у крыльца, вожатый проверяет, правильно ли накрыт стол и хватает ли еды и приборов. Потом зовёт отряд.\n- Отряд собирается весь и не заходит, пока вожатый не позовёт. Все моют руки.\n- В столовой не кричим и не бегаем. Вожатые едят со своими отрядами.\n- Традиция: когда весь отряд сидит и у всех есть еда, командир встаёт и говорит: «Отряд ..., скажем друг другу приятного аппетита», и отряд отвечает хором. В конце, когда все доели и никто не вышел, командир говорит: «Скажем нашим поварам спасибо», и отряд отвечает хором.\n- Посуду уносим, для этого назначается дежурный патруль."},{"t":"Время добрых дел, тихий час и поручения","cat":"Каждый день","b":"## Время добрых дел\nВремя сделать что-то хорошее для всего лагеря: убрать зону вокруг корпуса, помыть краски, поточить карандаши, починить что-то. Дети должны сами найти доброе дело.\n## Тихий час\nВ корпусе должно быть действительно тихо. Дети сидят по комнатам, дежком дежурит в коридоре.\n## Поручения\nКаждый день отряды получают поручение: чистота в корпусе, подарок одному человеку из каждого отряда, подарок дружине (песня, сценка). После полдника есть время подготовиться."},{"t":"Совет дружины","cat":"Каждый день","b":"Орган детского самоуправления, его проводит начальник дружины. Приходит по одному человеку от отряда (дружинники) с летописями. Дружинники оценивают свои отряды по критериям: поведение на построении, отрядный дух, зарядка и другие. Назвали оценку, остальные соглашаются или спорят. Оценки заносят в Экран соревнований, туда же идут дополнительные баллы (за победы, за хорошее для дружины) и штрафные (за нарушения правил лагеря). Читаются и оцениваются летописи."},{"t":"Первая беседа с отрядом: правила смены","cat":"Первые дни","b":"Проводится в первый день, после заселения. Говорите своими словами, коротко, спокойно, с примерами. Подстройте под правила своего лагеря. Техника безопасности для детей вынесена на отдельную страницу, её тоже проговаривают в первые сутки.\n## Четыре главных правила\n- Живём по одному режиму: подъём в 8:00, отбой в 22:00 у младших и в 22:30 у старших. Игры и отрядные дела, мастерские и кружки обязательны для всех.\n- Лагерь это территория спорта и чистого воздуха. Алкоголь, курение и любые вещества запрещены, и вожатые живут по тому же правилу.\n- Уважаем друг друга: не обижаем, не унижаем, не ругаемся.\n- Берём бережно своё и чужое. Чужое без спроса не берём.\n- За территорию без вожатого не выходим. Нарушители правил отправляются домой.\n## Как обращаться\n- На «ты»: к ребятам, вожатым, инструкторам, начальникам и директору.\n- На «вы»: к врачу, медсёстрам, уборщицам, охране, работникам столовой и хоздвора.\n## Природа и здоровье\n- Берегите ветки и кусты, не ловим кошек и не тащим их в корпус.\n- Ягоды и фрукты с территории не едим: они могут быть незрелыми и вредными.\n- Одеваемся по погоде: в жару головной убор, в прохладу и от комаров длинные рукава и штаны.\n## Распорядок дня\nПодробный режим смотрите на странице «Режим дня» в разделе «Каждый день». Детям достаточно показать его на плакате в корпусе и пройти по пунктам.\n## Главное правило\nЧто болит, потерялось, тревожит или не нравится, скажите мне. Все вопросы тоже мне. Родители далеко, а я рядом и решу быстрее. Вместе мы справимся с любой трудностью."},{"t":"ТБ для детей: что проговорить в первые сутки","cat":"Первые дни","b":"Правила безопасности, которые вожатый объясняет детям простыми словами. Коротко, по пунктам, с примерами. Лучше дважды: в первый день и перед первым выходом за территорию.\n## В автобусе\n- Едем без остановок, заранее сходить в туалет.\n- В салон берём только ручную кладь (рюкзак, сумочку): на коленях или под креслом. Большой багаж в грузовой отсек. В проходе вещи не стоят.\n- Куртки и кепки снять. Все пристёгнуты до конца поездки. Если ремень не работает, зовите вожатого.\n- По салону не ходим. Кого укачивает, садится вперёд и говорит по цепочке вожатому.\n- В автобусе не едим. Мусор убираем в карман и выбрасываем потом в урну.\n- На выходе проверить верхние полки и карманы кресел.\n## Жизнь в корпусе\n- В первый день вещи из чемоданов разложить по шкафам и тумбочкам, чемоданы отнести в чемоданную. Проверить, не осталось ли в них важного.\n- Следим за порядком в тумбочках и комнате, по очереди дежурим.\n- Воду из бутылей пить можно и нужно. Чайники и кипятильники из дома не нужны: если привезли, убрать в чемоданную.\n- Душ раз в два дня. Утром и вечером время личной гигиены. Срочно помыться можно в корпусе.\n- Одежду стираем сами в постирочной в назначенный день. Грязное складываем в отдельный пакет, мокрое сушим, а не прячем в шкаф.\n## Электробезопасность\n- Уходя из комнаты, выключаем свет и вынимаем приборы из розеток. Ночью в розетках ничего быть не должно.\n- Вилку тянем за корпус, а не за провод. Мокрыми руками приборов не трогаем.\n- Не подходим к оборванным и лежащим на земле проводам и к деревьям, на которых они висят.\n- Странную розетку, провод или вилку не трогаем, а говорим вожатому.\n## Питание\n- Еда в лагере вкусная и полезная. Чипсы, сухарики, газировку не едим.\n- Всё, что привезли из дома, сдаём вожатому в «Сладкий шкаф»: складываем в пакет, вожатый подписывает. Сладости выдают на тихий час и после приёмов пищи.\n- Скоропортящееся (фрукты, овощи) съесть в первый вечер, иначе придётся выбросить.\n## Здоровье\n- Плохо себя чувствуешь: сразу скажи вожатому и идёшь в медпункт.\n- Таблетки из дома сам не принимаешь. Осмотр врача надёжнее.\n## Выход за территорию\n- Одеваемся по погоде. В сезон насекомых обязательны головной убор и желательны длинные рукава и штанины.\n- У вожатого аптечка, у детей бутылки с водой. Ценные вещи оставить в лагере.\n- За территорией слушаемся вожатого вдвое быстрее.\n- Идём парами колонной. Впереди вожатый-ведущий, сзади замыкающий. Никто не обгоняет ведущего и не отстаёт от замыкающего. «Дырок» в колонне не оставляем.\n- Идём по левой стороне дороги, по обочине, как можно ближе к краю. На проезжую часть не выходим.\n- Если едет машина, ведущий или замыкающий кричит «Машина!», все прижимаются к краю.\n- Дорогу переходим только все вместе, по команде ведущего.\n- Нужно отойти в сторону: подойти и предупредить.\n- В магазины не заходим и еду не покупаем."},{"t":"Организационный период: цели и чек-лист окончания","cat":"Первые дни","b":"Орг-период это первые три дня смены. В это время закладываются отношения с детьми, правила отряда и роли на всю смену.\n## Задачи орг-периода\n- Познакомить детей друг с другом, с вожатым, начальником дружины и кружководами.\n- Показать территорию, режим, традиции лагеря.\n- Выработать общие нормы поведения.\n- Дать попробовать себя в разных видах деятельности и заметить лидеров.\n- Придумать отрядный план и цель на смену.\n## Чек-лист окончания орг-периода\n- Дети знают имена друг друга, вожатого, начальника дружины, кружководов.\n- Знают условия проживания, режим, территорию и традиции.\n- Выработаны общие нормы, и дети сами приводят друг друга к норме.\n- Дети говорят «мы».\n- Сформированы представления о смене.\n- Есть отрядный план и цель на смену.\n- Дети «обжили» пространство.\n- Попробовали себя в разных видах деятельности.\n- Выявлены лидеры, и они включены в самоуправление.\n## Как провести первые три дня\n- День заезда: спокойная встреча, внимание каждому, шутка вместо напряжения. Цель: хорошее первое впечатление.\n- Первая беседа: правила лагеря равны для всех, вожатых тоже. Вы отвечаете за каждого ребёнка и решаете его трудности.\n- Первое мероприятие: яркое, чтобы было видно, что с вами интересно и вы держите ситуацию.\n- Вечерняя свеча: личный разговор, первые нормы жизни в отряде.\n- Конец орг-периода: дети проверят вас на прочность. Оставайтесь спокойным, тёплым и последовательным."},{"t":"Правила отряда, должности и проект на смену","cat":"Первые дни","b":"## Как составить правила отряда\n- Правил 3-5.\n- Формулируем в положительной форме («ходим по тропинке» вместо «не ходим по бордюру»).\n- Правила регулируют отношения внутри отряда.\n- Их выполняют все, они значимы для каждого и посильны.\n- Чёткие и однозначные.\n- У нарушений есть логические последствия, которые проговорили сами дети.\n## Должности в отряде\nКомандир отряда (меняется каждый день), летописец, санитар, фотограф, завхоз, «человек-внешний вид». Можно добавить свои. Чередуйте обязанности, чтобы в деле побывал каждый («карусель поручений»).\n## Проект и цель отряда по SMART\n- Конкретная: какой навык развиваем, как выглядит результат.\n- Измеримая: по какому показателю поймём, что цель достигнута.\n- Достижимая: реально ли за смену.\n- Значимая: учтены интересы детей, вожатых и родителей.\n- Ограниченная по времени: к какой дате.\nРазбейте путь на этапы: что получим на каждом и сколько это займёт.\n## Название, девиз, символы\n- Название должно отражать, какими вы хотите быть. Как корабль назовёшь, так он и поплывёт.\n- Придумайте эмблему, которую каждый сможет носить на одежде, кричалку, талисман-мирилку.\n- Отрядные фишки (свой способ передвижения, приветствие, музыка для сбора) сплачивают, но не перестарайтесь со странностями: дети боятся выглядеть смешными."},{"t":"Знакомство с детьми и адаптация","cat":"Первые дни","b":"## Что вожатому узнать о детях\n- О каждом: чем интересуется, что умеет, чего боится.\n- Особенности здоровья, аллергии, хронические болезни, лекарства (спрашивайте у родителей и записывайте).\n- Возрастные особенности и как их учитывать.\n- Заведите список интересов детей: он пригодится для дел и поручений.\n## К чему детям нужно приспособиться\nПодумайте, что может вызвать дискомфорт и как с этим помочь, в каждой сфере: территория лагеря, место проживания, питание, режим, взрослые, другие дети, отряд, программа, связь с родителями.\n## Фразы поддержки\nПодготовьте 5-10 фраз, которые помогают начать разговор: «Я рядом», «Расскажи, что случилось», «Давай подумаем вместе».\n## Если ребёнок в лагере впервые\n- Он боится расставания с родителями, чувствует себя потерянным, не понимает лагерных слов и традиций.\n- При встрече сразу уделите новичкам внимание и объясните, где они и что будет. Не отдавайте всё внимание «старичкам».\n- Попросите «старичков» провести экскурсию и рассказать, какой это классный лагерь. Они любят помогать, главное направить.\n- Бытовые моменты (общая комната, душ, меню, уборка) обыграйте, чтобы привыкание шло быстрее.\n- Тоскующим детям помогают письма родителям и фото, которые вы отправляете им в сообщении, а также игрушка-засыпушка.\n- Родителям новичков нужно больше подробностей: документы, что взять, питание, проживание.\n## Чем помогает тоскующему ребёнку\n- Занять делом и общением, не оставлять одного.\n- Дать рассказать о доме, не стыдить за слёзы.\n- Талисман-мирилка, ритуалы перед сном, браслет-договор из ниточки."},{"t":"Здоровье отряда: заранее и в течение смены","cat":"Здоровье и безопасность","b":"Лечить - дело медиков. Ваша задача: знать о детях заранее, замечать, вовремя вести в медпункт и не заниматься самолечением. Любая жалоба на самочувствие - повод пойти в медпункт.\n## До смены и в первые дни\n- Запаситесь: влажные салфетки, антисептик для рук, пластырь, перекись, вата.\n- Расспросите родителей: особенности здоровья, аллергии, хронические болезни, лекарства. Запишите себе и предупредите коллег.\n- Себя тоже берегите: если вам плохо, скажите руководителю. Больной вожатый не может полноценно работать с детьми.\n## Бронхиальная астма\n- Следите за состоянием после физической нагрузки и больших мероприятий в душном помещении.\n- Перед выходом за территорию проверьте, что лекарство у ребёнка с собой. В течение смены спрашивайте, не закончилось ли, чтобы родители успели привезти.\n- Предупредите коллег о диагнозе.\n- При приступе: срочно ингалятор и срочно к врачу.\n## Энурез\n- Бывает чаще ночью, у детей 5-12 лет; родители могут не сказать. Заметите по запаху днём.\n- Попросите клеёнки под простыню; не давайте много пить перед сном и обязательно отправьте в туалет; при необходимости будите ночью (у кого-то раз, у кого-то по графику, например каждые 2 часа). Распределяйте ночные подъёмы с коллегами.\n## Лекарства по времени\nСтавьте будильник или напоминание в телефоне и приводите ребёнка в медпункт вовремя: от этого зависит его состояние.\n## Простуда\nГлавное - не допустить.\n- Одежда по погоде, даже летом бывает холодно. Обувь сухая: мокрую сушите, пока ребёнок ходит в сухой; если запасной нет, найдите.\n- Носки, застёгнутые куртки; осенью, зимой и весной шапка, перчатки, шарф.\n- После долгого пребывания на прохладе - тёплый чай.\n- Если уже есть простуженные: поменьше общения лицом к лицу и обнимашек, несколько раз в день в медпункт на процедуры; при массовых заболеваниях водите отряд на профилактику.\n- У старших рост заболеваний может быть связан с одним вейпом на всех: проверяйте детей на курительные приборы.\n## Рвота и понос\n- Часто после родительского дня: предупредите родителей, что резкая смена питания вредна, и просите не перекармливать.\n- Если плохо - в медпункт.\n- Профилактика: мыть руки всем перед каждым приёмом пищи (антисептик, если нет воды), каждый ест из своей тарелки.\n## Боль в животе без рвоты и поноса\nПричины разные: у девочек старше 10 лет это могут быть критические дни (уточните аккуратно, как обычно протекают), запор, переедание. Во всех случаях ведите в медпункт и уточните, что делать дальше.\n## Головная боль\nПричин много: от температуры до переутомления. Покажите врачу. Если ребёнок потерял сознание: пусть кто-то позовёт врача к вам, обеспечьте свежий воздух и оставайтесь рядом до прихода медиков.\n## Перегрев и солнечный удар\nЛетом головные уборы обязательны. В жару следите, чтобы дети много пили. При любых жалобах в медпункт."},{"t":"Травмы и неотложные случаи: что делать","cat":"Здоровье и безопасность","b":"Главное правило: не паникуйте, не лечите сами, сообщите медикам и руководителю, оставайтесь с ребёнком. Идеальная схема: один остаётся с ребёнком, второй бежит за врачом.\n## Мелкие ранки и порезы\nОбрабатывайте все ранки, у детей и у себя: вы не знаете, какие у детей прививки (риск столбняка). Перекись всегда с собой. Ребёнка с раной ведите в медпункт.\n## Аллергическая реакция\n- Знайте все аллергии своих детей, уточняйте у родителей, предупреждайте коллег.\n- Следите за заменой аллергенных продуктов в столовой, это контролируете вы.\n- Сильная реакция (например, отёк Квинке) происходит резко. Задача: как можно быстрее доставить ребёнка к медикам. Один несёт ребёнка, второй бежит вперёд в медпункт, чтобы медики были готовы.\n## Ушибы и переломы\n- Лёгкая травма (упал, ободрал колено): в медпункт обработать рану.\n- Болит рука или нога: попросите пошевелить один раз, насколько возможно. Не вправляйте, не ощупывайте кость. Зафиксируйте конечность; если ребёнок может идти, ведите в медпункт, если нет - несите на руках или носилках, обязательно зафиксировав.\n- Упал на спину и не может двигаться: не шевелить. Позвать врача к месту травмы и обеспечить транспортировку в медпункт.\n## Электротравма\nИзолируйте ребёнка от источника тока, при необходимости отключите сеть. Сами ребёнка не трогайте. Оставайтесь с ним, попросите коллегу сбегать за врачом.\n## Укусы насекомых\n- Клещи: после каждого выхода за территорию полный осмотр: за ушами, локти, подмышки, подколенные ямки, паховая область, волосы. Нашли клеща - не вытаскивайте сами, сразу в медпункт.\n- Комары, пчёлы, мошки: репелленты на одежду, крем на кожу. Дети не должны брызгать друг другу в лицо.\n## Кровотечение\n- Кровь на лице: без паники найдите источник, осмотрите голову. Носовое: помогите умыться, приложите вату или салфетку, можно лёд на переносицу и затылок. Голову НЕ запрокидывать. Если кровь из головы, губы, брови, помогите умыться и ведите в медпункт.\n- Сильный порез: венозная кровь тёмно-вишнёвая, течёт медленно. Плотно прижмите чистую салфетку, вату или марлю, везите к медикам. Если место неудобное, отправьте напарника за носилками и врачом, а сами зажимайте рану.\n- Артериальная кровь ярко-алая, бьёт фонтаном. Наложите жгут выше раны, запишите время, отправьте напарника за помощью, оставайтесь с ребёнком и следите за ним.\n## Ожоги\nЛёгкий ожог: под холодную воду, затем в медпункт. Нельзя:\n- мазать маслом (никаким), кремами, мазями, яичным белком, сметаной;\n- наносить препараты с пантенолом на свежий ожог;\n- отрывать прилипшую одежду;\n- прокалывать пузыри;\n- следовать народным советам.\nЛучше предупредить опасность, чем разбираться с последствиями."},{"t":"Лайфхаки: заезд, общение, быт","cat":"Лайфхаки","b":"## Заезд\n- Бумажным скотчем подпишите чемодан каждого ребёнка и сфотографируйте их: в конце смены не вспомнить.\n- Заранее подготовьте папку с подписанными файлами для документов каждого ребёнка.\n- В дорогу: мусорные пакеты и пустая бутылка на случай, если кому-то станет плохо. Укачивает - посадите вперёд.\n## Общение с детьми\n- Не давайте обещаний, которые не сможете выполнить.\n- Не давайте почувствовать себя \"маленьким\", оставляйте место самостоятельности.\n- Формулируйте положительно, без \"не\": не \"не ходи по поребрику\", а \"иди по тропинке\".\n- Говорите простыми словами. Чтобы вас услышали, присядьте на уровень глаз.\n- Извиниться перед ребёнком - нормально.\n- Не ругайте: дайте почувствовать последствия и отвечать за них. Организуйте самоуправление.\n- Почемучкам отвечайте вопросом \"а как ты думаешь, почему?\"\n- Пословицы, поговорки, прибаутки легко усваиваются.\n- Записывайте отрядные выступления и пересматривайте вместе.\n- Никакого сарказма: это пассивная агрессия.\n## Обычные моменты интереснее\n- Тематические подъёмы с музыкой; спасибо и приятного аппетита на языках мира.\n- Салон красоты для девочек с каталогом причёсок.\n- Важные поручения детям, но столько, сколько вы сможете проконтролировать. Всё, что могут сделать сами, делают сами.\n- Особый способ передвижения по лагерю между делами.\n- Игры-тормозилки (\"тише едешь - дальше будешь\", \"стоп-кадр\") помогают держать дисциплину.\n- Танцевальные зарядки; аудиосказка, если сами не можете почитать.\n- Перед сидячим делом \"выбегайте\" детей. Максимум времени проводите с отрядом на улице.\n## Гигиена и вещи\n- Куклы или комикс, показывающие, как одеваться и что брать в душ. Дети раскладывают вещи на кровати, вожатый проверяет.\n- После душа занятие: рисование, раскраски.\n- Ведите учёт трусов и носков, чтобы знать, когда пора стирать; младшие могут постирать мелочь сразу в душе. Перед большой стиркой сфотографируйте грязные вещи.\n- У каждого мешочек для грязного белья, вы следите, чтобы он наполнялся.\n- Мойте руки с мылом перед едой.\n- Подпишите полочки, кровати, вещи.\n## Еда\n- Не съеденное, что можно унести (фрукты, печенье), забирайте на свободное время.\n- Носите антисептик, воду и стаканчики: так всегда можно устроить пикник.\n- Яблоко, порезанное на дольки, точно съедят."},{"t":"Лайфхаки: упростить себе работу и помочь ребёнку","cat":"Лайфхаки","b":"## Упростить жизнь вожатому\n- Чек-листы в вожатской (сбор в душ, проведение мероприятия).\n- Список в вожатской: кто что взял и кто вернул. Список интересов детей.\n- Гардероб, легко превращающийся в костюмы. Запасные головные уборы (можно смешные).\n- Вожатский рюкзак на все случаи: стаканчики, книга, ручки, листы, раскраски. Ручки и фломастеры в каждый карман.\n- Вся ерунда пригодится: ленточки, бисер, старые обои.\n- Будильники на мероприятия и искусственные дедлайны. Плейлист для смены.\n- Знайте игры на любой случай и тренируйте насмотренность.\n- Главное, займите детей, пока они не заняли себя сами: их выбор будет не самым безопасным.\n- Вожатый садится во главе стола. Чистую комнату не топчем, чтобы не было бардака.\n- Перед тем как запустить отряд в помещение, проверьте его на поломки, сфотографируйте и отправьте руководителю.\n## Чтобы ребёнку стало легче\n- Название отряда отражает, какими вы хотите быть: как корабль назовёшь, так и поплывёт. Эмблема, которую можно носить на одежде.\n- Правила отряда (3-5), общая цель отряда, ритуалы - дети чувствуют себя в безопасности.\n- Талисманы-мирилки. Игрушка-засыпушка против подкроватных монстров.\n- Ниточка-договор: браслет, закрепляющий договорённость; в трудный момент напоминайте о нём.\n- Письма от скучающих по дому детей родителям; фото родителям отправляйте сами.\n- Чёткие понятные промежутки времени (\"телефоны сдаём, когда идём на полдник\").\n- Проверьте \"заборчики\" (личные доски): злое заклейте стикерами, оставьте доброе.\n- Добрые дела с отрядом (например, покормить птичек).\n- Дети должны знать, где вас найти: покажите вожатскую.\n## Мероприятия\n- Стихи с малышами: каждому по строке, костюмы, красивый выход.\n- Будьте с детьми на сцене или в кулисах, подсказывайте вопросом из зала, учите текст с движениями. Вы режиссёр-постановщик.\n- Мероприятие запоминается, если у него есть легенда и яркий костюм. Антураж - это музыка, запахи, свет.\n- Проверьте технику за 3 часа до начала. Задействуйте несколько каналов восприятия.\n## Отрядный уголок\n- Каждый ребёнок делает свою фигурку с именем и датой рождения, вы приклеиваете её на подготовленный фон. Уголок должен быть \"говорящим\".\n- Рубрики, которые меняются (как одеться сегодня, график дежурств), и чек-лист событий смены.\n- Фон штампами (ладошки), трафареты, объём.\n## Как собрать чемодан\nРебёнок выкладывает вещи стопкой на кровать, обувь рядом. Вожатый откладывает чистую красивую одежду для дороги. Сначала в чемодан обувь, потом одежда, сверху мешок с грязным бельем.\n## Что не забыть взять\nЗапасные ножницы, вкусняшки для себя и напарника, грим, влажные салфетки, запасные зубные щётки (дети их теряют), бумажный скотч."},{"t":"Нашивка «Медик»","cat":"Нашивки","b":"При возникновении любой ситуации, причиняющей дискомфорт, необходимо сообщить вожатому, тем более в случае внештатной ситуации. Руководитель похода оценивает обстановку, объяснит отрядному медику, как оказать помощь, окажет ее сам или, в сложном случае, вызовет спасателей.\n\nВ походе может возникнуть ситуация угрозы здоровью и потребоваться оказание первой помощи.\n\n## Состояния, при которых оказывается первая помощь:\n\n1. Отсутствие сознания.\n2. Остановка дыхания и кровообращения.\n3. Наружные кровотечения.\n4. Инородные тела верхних дыхательных путей.\n5. Травмы различных областей тела.\n6. Ожоги, эффекты воздействия высоких температур, теплового излучения.\n7. Отморожение и другие эффекты воздействия низких температур.\n8. Отравления.\n9. Приступ Бронхиальной астмы\n\n## Мероприятия по оказанию первой помощи проводятся в следующем порядке:\n1. Мероприятия по оценке обстановки и обеспечению безопасных условий для оказания первой помощи.\n2. Определение наличия сознания у пострадавшего, определение признаков жизни у пострадавшего.\n3.Мероприятия по обзорному осмотру пострадавшего и временной остановке наружного кровотечения\n4. Проведение сердечно-легочной реанимации до появления признаков жизни\n5. Мероприятия по подробному осмотру пострадавшего в целях выявления признаков травм, отравлений и других состояний, угрожающих его жизни и здоровью, и по оказанию первой помощи в случае выявления указанных состояний.\n6. Наложение повязок при травмах различных областей тела, в том числе окклюзионной (герметизирующей) при ранении грудной клетки;\n7. Проведение иммобилизации.\n8. Придание пострадавшему оптимального положения тела.\n9. Контроль состояния пострадавшего (сознание, дыхание, кровообращение) и оказание психологической поддержки.\n10. Передача пострадавшего бригаде скорой медицинской помощи, другим специальным службам, сотрудники которых обязаны оказывать первую помощь в соответствии с федеральным законом или со специальным правилом.\n\nПищевое отравление.\nПризнаки отравления\nНаиболее типичными признаками отравления служат: тошнота, рвота, боль в области желудка и кишечника, диарея. Помощь при отравлениях следует начать с промывания желудка большим количеством (3-4 л) воды комнатной температуры до чистых промывных вод. Для этого Вы должны попросить пациента выпить за один прием как можно больше тепловатой, чуть подсоленной воды (на 1 стакан тёплой воды ½ чайной ложки соли) и вызвать рвоту, нажимая пальцами на корень языка. Такую манипуляция Вы должны повторить 2 - 3 раза, после чего дать 2 - 3 столовые ложки размятого активированного угля.\n\nВ случае диареи необходимо восполнить потерю жидкости. Для этого нужно давать раствор регидрона.\n\nБронхиальная астма\n\nМеханизм этого острого состояния закидается в том, что в результате стресса испуга физ нагрузки или аллергической реакции возникает отек слизистой оболочки бронхов, что ведёт к их захлопыванию и прекращению подачи воздуха в легкие\n\nПриступ БА как правило начинает резко, внезапно\n\nПострадавший хватается за горло руками, жадно глотает воздух, кашляет, появляется громкая одышка, чувство скованности в груди\n\nПомощь\n\nСамое главное - прекратить воздействие неблагоприятного фактора (исключить аллерген, стресс, успокоить пострадавшего)\n\nКак правило астматик знает что он астматик,а значит недалёко у него должен быть ингалятор\n\nЕсли этого нет, необходимо срочно обеспечить покой (как физический так и эмоциональный), дать приток свежего воздуха (открыть окна и двери настеж),снять стесняющую одежду, уложить пострадавшего на ровную твёрдую поверхность и не давать двигаться. Либо помочь пострадавшему принять такое положение : руками опереться на спинку стула / стол и перенести вес тела. Таки образом вы подключите дополнительные мышцы спины и облегчите дыхание\n\nКровотечения\nПризнаки артериального кровотечения\nПервое, что необходимо установить при кровотечениях, какие кровеносные сосуды повреждены - вены, артерии, капилляры. Именно от этого будет зависеть первая помощь. При повреждении артерии кровь имеет ярко-алый цвет и фонтанирует из раны. Учитывая, что артериальная кровь поступает от сердца к периферии, кровотечение можно остановить, пережимая поврежденный сосуд выше места повреждения.\nПережать артерию можно, лишь прижав ее к кости. Если кровотечение происходит из раны средней и нижней трети плеча, предплечья и кисти, прижимают плечевую артерию, если кровотечение из ран в области плечевого сустава, подмышечной, подключичной области, прижимают подключичную или сонную артерию. Если источник кровотечения на нижних конечностях, прижимают бедренную артерию.\n\nПомощь при артериальных кровотечениях\nПальцевое прижатие.\n\nДля экстренной остановки кровотечения необходимо прижать артерию к кости пальцами либо, если это бедренная артерия, - кулаком. Однако долго удерживать пальцы с таким усилием Вам не удастся, поэтому пока Вы удерживаете артерию пальцами, кому-то надо срочно подготовить материалы для остановки кровотечения.\n\nСпособ форсированного сгибания конечности используется, если артериальное кровотечение не сопровождается переломами конечности. При кровотечении из кисти и предплечья с внутренней стороны сустава подкладывают бинт в упаковке , руку сгибают до отказа в локтевом суставе и фиксируют ее с помощью бинта в таком положении к плечу. При кровотечении из ран плеча и подмышечной области руку до отказа заводят за спину и сгибают в локтевом суставе. Конечность фиксируют с помощью бинта. При кровотечении из нижней конечности бинт подкладывают под колено, сгибают ногу в колене до отказа и фиксируют ее к бедру. При кровотечении из бедра ногу сгибают и в коленном, и бедренном суставах. В область паха при этом подкладывают большой и тугой комок из ваты или одежды.\n\nТаким образом вы пережимаете основную артерию, из которой идёт кровь, но оставляете коллатераль, по которой конечность продолжает получать кровь.\n\nпри кровотечении из сонной артерии: Руку пострадавшего на противоположной стороне от поражения поднять вверх, согнуть в локтевом суставе, положив предплечье на голову. Наложить давящую повязку , зафиксировав бинт на плече поднятой руки\n\nЛибо зафиксировать в подмышечной области на противоположной стороне, если поднять руку не представляется возможным\n\nНаложение жгута.\n\nКрайне не рекомендуется применять этот метод, тк он максимально травматичный. Сделайте все, для того чтобы не пришлось применять его.\n\nНа месте пальцевого прижатия необходимо наложить несколько туров артериального жгута, подложив под него марлевые салфетки и вату. О правильном наложении жгута свидетельствует прекращение кровотечения из раны (после первого же тура затянутого жгута) и отсутствие пульсации ниже места наложения жгута. Слабо наложенный жгут только усилит кровотечение.\n\nЖгут может быть наложен не больше, чем на 2 ч летом и на 1 ч зимой, поэтому под жгут необходимо вложить записку, где будет указано время наложения жгута.\nПосле этого пациента следует немедленно госпитализировать, причем та часть тела, где наложен жгут, не должна быть закрыта одеждой.\n\nПризнаки венозного кровотечения\nЕсли кровь темно-красного цвета и поступает из раны медленной либо слабо пульсирующей в такт дыханию струей, у Вашего пациента венозное кровотечение. Кровотечение из крупных вен (бедренной, подключичной, яремной) представляет опасность для жизни больного как вследствие быстрой кровопотери, так и возможности воздушной эмболии. Кроме случаев травматического повреждения вен венозное кровотечение возможно при разрыве кровеносных сосудов в слизистой оболочке носа или варикозных вен нижних конечностей. Носовые кровотечения, обусловленные принятием аспирина, повышением артериального давления, могут не прекращаться длительное время и требуют госпитализации больного. Первая помощь при любых венозных кровотечениях предусматривает наложение давящей повязки, холод и возвышенное положение.\n\nПомощь при венозных кровотечениях\nНаложение давящей повязки и воздействие холодом.\n\nДавящая повязка накладывается ниже раны, поскольку венозная кровь поднимается от периферических сосудов к сердцу. Такая давящая повязка состоит из нескольких стерильных марлевых салфеток или неразмотанного бинта (тампон), на которые накладывают эластичный бинт в несколько слоёв . О правильности наложения повязки свидетельствует остановка кровотечения, но сохранение пульсации ниже места прижатия.\n\nСверху бинта в проекции к источнику кровотечения хорошо наложить пузырь со льдом или грелку, наполненную холодной водой. Не забывайте, что через 30-40 мин холод необходимо убрать на 10 мин, чтобы восстановить общий кровоток в этой области. Если кровотечение происходит из конечности, ей следует придать возвышенное положение.\n\nПри носовом кровотечении крыло носа прижимают к его перегородке, хорошо предварительно ввести в носовой ход комочек ваты. На область переносицы или затылка прикладывают холод на 3-4 мин с перерывами в 3-4 мин до прекращения кровотечения. Голову запрокидывать не надо, потому что кровь будет стекать по задней стенке глотки, что может вызвать асфиксию при попадании в легкие или рвоту при попадании в желудок\n\nПризнаки капиллярного кровотечения\nМедленное истечение крови со всей поверхности раны - показатель капиллярного кровотечения. При всей кажущейся безобидности такой раны, остановка такого кровотечения представляет большие трудности, если больной страдает плохой свертываемостью крови (гемофилией).\n\nПомощь при капиллярных кровотечениях\nНаложение давящей повязки. Если в Вашей аптечке есть гемостатическая губка, ее следует наложить на рану, после чего сделать давящую повязку. Если такой губки нет, то на рану накладывают несколько слоев марлевых салфеток, которые фиксируют давящей повязкой.\nВ любом случае, если рана находится на конечности, ей следует придать возвышенное положение и обеспечить покой и холод (пузырь со льдом).\n\nОбморок\nПричины обморока\nВнезапная кратковременная потеря сознания (обморок) может наступить от различных причин. В основе обморока лежит кислородное голодание мозга. Оно может вызываться спазмом сосудов головного мозга (испуг, сильная боль), недостаточным содержанием кислорода во вдыхаемом воздухе (душное помещение), резким снижением давления. Но кроме кратковременных функциональных сосудистых нарушений обморок может быть следствием серьезных внутренних повреждений или заболеваний, например внутреннего кровотечения, нарушения ритма сердца. Обмороки могут быть и проявлением эпилепсии.\nПотере сознания часто предшествуют приступы дурноты, слабости, тошноты. Больной падает или медленно опускается на землю. Лицо у него бледнеет, зрачки становятся узкими, однако реакция на свет сохраняется живая (при поднесении источника света к глазам зрачки сужаются). Артериальное давление снижено, пульс слабого наполнения. В горизонтальном положении больного обморок, как правило, быстро прекращается, возвращается сознание, щеки розовеют, больной делает глубокий вдох и открывает глаза. Но не следует успокаиваться при окончании обморока, необходимо уточнить причину возникновения этого состояния.\n\nПомощь при обмороке\nЕсли есть возможность, уложите больного на спину, приподняв его ноги. Если положить больного невозможно (на улице, в транспорте), усадите его и попросите опустить голову ниже колен или до уровня колен. Все стесняющие части одежды надо расстегнуть и обеспечить приток свежего воздуха. Разотрите или опрыскайте холодной водой кожу лица, шеи. Поднесите к носу больного ватку с нашатырным спиртом, потрите ей виски\n\nОжоги\nВиды ожогов\nВ зависимости от повреждающего фактора ожоги разделяют на термические (горячей жидкостью, пламенем, раскаленным металлом), электрические и химические.\n\nПо глубине поражения выделяют 4 степени: I степень - покраснение и отек кожи, II степень - на фоне покраснения и отека кожи образуются пузыри, наполненные жидкостью, III степень - некроз кожи, IV степень - некроз кожи и подкожной клетчатки, мышц, костей.\n\nПлощадь ожогов ориентировочно определяется с помощью правила девяток и правила ладоней. Площадь ладони взрослого человека составляет около1 % площади тела. По правилу девяток крупные части тела составляют 9 или 18 % площади поверхности тела. Например, поверхность головы и шеи, поверхность руки составляют по 9 %; поверхность ноги, передняя поверхность туловища - по 18 %. Ожоги считаются тяжелыми, если общая поверхность повреждений составляет более 10 %.\nПомощь при ожогах\nПервый Ваш шаг должен быть направлен на прекращение повреждающего действия термического агента. Горящую одежду надо либо сорвать, либо накинуть на нее одеяло. Затем Вы должны срезать (не снимать!) одежду и сбросить ее. Для быстрого охлаждения кожи при термических ожогах лучше всего обливать ее холодной водой. При химических ожогах пораженную кожу сначала обмойте большим количеством воды в течение 10 - 30 мин, а затем - нейтрализующими растворами: при ожогах кислотами - раствором соды, при ожогах щелочами - слабым раствором уксусной кислоты. Обработайте место вокруг ожога спиртовым раствором йода (нельзя прямо в рану,иначе повреждение будет глубже) для предотвращения инфицирования\n\nДайте пострадавшему 1 - 2 г ацетилсалициловой кислоты и 0,05 г димедрола. (Если площадь ожога больше 10-12%)\n\nЕсли площадь ожога превышает 15 %, дайте пострадавшему выпить не менее 0,5 л воды с пищевой содой и поваренной солью (1/2 ч.л. соды и 1 ч.л. соли на 1 л воды).\nНа ожоговые раны наложите сухие стерильные повязки и срочно госпитализируйте.\n\nОтморожение\nФормы и степень отморожения\nПри отморожении ткани повреждаются холодом - длительный спазм сосудов с последующими тромбозами ведет к трофическим и некротическим нарушениям в тканях. Отморожение возникает при температуре окружающей среды ниже 0 °С. Наиболее часто происходит отморожение пальцев, несколько реже - ушей, носа, щек, стоп. Поражение возникает тем быстрее, чем больше влажность воздуха и ниже температура. При тяжелом отморожении и охлаждении организма возможны одышка, тахикардия, падение артериального давления.\nВ начальном периоде отморожения кожа поврежденного участка бледная, холодная, нечувствительная. Пострадавший ощущает онемение. По мере согревания появляется сильная боль и развиваются видимые повреждения тканей, в зависимости от степени отморожения.\n\nПомощь при отморожениях\nПрежде всего, надо согреть отмороженную область. Конкретные способы зависят от обстановки. Пострадавшего доставьте в помещение. Если у Вас есть возможность, то отогрейте отмороженную область в ванне с водой, температуру которой постепенно повышайте от 36 до 40 °С в течение 15 мин. Одновременно массируйте конечность от периферии к центру. Через 30 мин кожу насухо вытрите, наложите сухие стерильные повязки с толстым слоем ваты снаружи.\nПри отморожении лица и ушных раковин разотрите их чистой рукой или мягкой тканью до порозовения, обработайте вазелиновым маслом. Нельзя для растирания пользоваться снегом. Он вызовет повреждение поверхностного слоя кожи.\nНаряду с местными мероприятиями необходимо согреть пациента, напоив его горячим чаем и укутав одеялом. Если отморожение сопровождается появлением пузырей и некрозом, обязательно госпитализируйте пациента.\n\nЭлектротравма\nПризнаки воздействия электрического тока\nЭлектрический ток оказывает местное и общее воздействие. Местно в зоне действия тока возникает ожог без окружающего покраснения и болевых ощущений. Общая реакция в легких случаях выражается в испуге, возбуждении или заторможенности, сердцебиении, аритмии. При тяжелой электротравме нарушаются функции мозга, сердца, дыхания, вплоть до их прекращения и смерти.\nПомощь при поражении электрическим током\nПрежде всего, освободите пострадавшего от источника тока - оттолкните от пострадавшего электрический провод с помощью деревянной сухой палки (ручка швабры, скалка), резинового коврика или других изолирующих материалов. Помните о мерах собственной безопасности!\n• Если пострадавший в сознании, без видимых тяжёлых ожогов и травм, положите его на спину, расстегните стесняющую дыхание одежду.\n• Не позволяйте двигаться. Не давайте пить - Это вызовет рвоту и нарушение дыхания.\n• При отсутствии сознания, но сохранившемся дыхании уложите пострадавшего на бок на твёрдую горизонтальную поверхность, обеспечьте приток свежего воздуха. Обрызгайте водой, разотрите и согрейте тело.\n• Если нарушено дыхание и сердцебиение, немедленно приступайте к проведению искусственного дыхания и непрямому массажу сердца, не прекращайте из до полного появления самостоятельного дыхания и сужения зрачков или до прибытия врача.\n\nВнезапная смерть\n## Внезапная смерть сопровождается следующими неоспоримыми признаками:\n• Отсутствие сознания.\n• Отсутствие самостоятельного дыхания.\n• Отсутствие пульсации на центральных артериях (сонной, бедренной).\n• Расширение зрачка и отсутствие реакции на свет.\n## Причинами внезапной смерти может быть:\n• электроудар;\n• нарушения сердечного ритма (при ишемической болезни сердца, миокардитах, пороках сердца);\n• кровоизлияние в мозг при аневризмах или атеросклерозе сосудов, особенно на фоне повышенного давления;\n• массивная кровопотеря при разрыве аневризмы аорты или других крупных сосудов;\n• анафилактический шок;\n• асфиксия, попадание инородного тела в трахею.\nВнезапная смерть не предполагает немедленного перехода человеческого организма в состояние трупа. Этому переходу предшествует состояние клинической смерти. Это последняя обратимая фаза умирания, при которой, несмотря на отсутствие кровообращения и дыхания, в течение некоторого периода временя сохраняется жизнеспособность всех тканей и органов. Этот период времени, в течение которого возможны реанимационные мероприятия, колеблется от 3 - 5 мин (при обычных условиях) до 20 мин (в условиях низкой температуры).\n\nПомощь при внезапной смерти\nРеанимационные мероприятия необходимо начинать тотчас же, а еще лучше - не допуская полной остановки сердечной деятельности и дыхания. Если причиной смерти послужили асфиксия или утопление, освободите полость рта от мешающих дыханию предметов. Выдвините челюсть, выньте и зафиксируйте язык.\n\nУложите больного на жесткую ровную поверхность, расстегните стесняющую одежду. Встаньте сбоку от больного и наложите одну ладонь на нижнюю треть грудины (у мужчин это будет линия, проходящая через соски) - по центру. Кисть другой руки положите перпендикулярно на тыльную сторону первой.\n\nНачинайте сильные толчки руками с частотой 60 - 70 в минуту. Грудина при этом должна смещаться не менее, чем на 4 - 6 см в сторону позвоночника. После 30 нажатий приложите свой рот через платок ко рту пациента, плотно обхватив его губами и зажав его нос, и сделайте 2 энергичных выдоха. Грудная клетка пациента должна подняться. Затем продолжите массаж сердца. Если у Вас есть помощник, то он может осуществлять массаж сердца (30 толчков), а Вы - искусственную вентиляцию легких (2 выдоха).\nЭффективность реанимационных мероприятий подтверждается появлением самостоятельных сокращений сердца (пульс на сонной артерии), сужением зрачка, порозовение кожных покровов. При появлении дыхания реанимационную помощь можно прекратить и срочно госпитализировать пациента.\nПри отсутствии благоприятных признаков реанимацию проводят в течение 30 мин, после чего прекращают массаж сердца и вентиляцию легких.\n\nВывихи и переломы\nПризнаки вывиха\nВывихами называются стойкое смещение суставных частей сочленяющихся костей, сопровождающееся повреждением суставной сумки.\n\n## Признаками вывиха служат:\n• изменение формы сустава;\n• нехарактерное положение конечности, •изменение длины (чаще укорочение)\n\n• боль;\n• пружинящая фиксация конечности при попытке придать ей физиологическое положение;\n• нарушение функции сустава.\nНаиболее часто встречаются травматические вывихи, обусловленные чрезмерным движением в суставе. Это происходит, например, при сильном ударе в область сустава, падении. Как правило, вывихи сопровождаются разрывом суставной сумки и разъединением сочленяющихся суставных поверхностей. Попытка сопоставить их не приносит успеха и сопровождается сильнейшей болью и пружинящим сопротивлением. Иногда вывихи осложняются переломами - переломовывихи. Вправление травматического вывиха должно быть как можно более ранним.\n\nПомощь при вывихах\nПоскольку любое, даже незначительное движение конечности несет нестерпимую боль, прежде всего, Вы должны зафиксировать конечность в том положении, в котором она оказалась, обеспечив ей покой на этапе госпитализации. Для этого используются транспортные шины, специальные повязки или любые подручные средства. Для иммобилизации верхней конечности можно использовать косынку, узкие концы которой завязывают через шею. При вывихе нижней конечности под нее и с боков подкладывают шины или доски и прибинтовывают к ним конечность. При вывихе пальцев кисти производят иммобилизацию всей кисти к какой либо ровной твердой поверхности. В области суставов между шиной и конечностью прокладывают слой ваты.\n\nПри вывихе нижней челюсти под нее подводят пращевидную повязку (напоминает повязку, надеваемую на руку дежурным), концы которой перекрестным образом завязывают на затылке.\nПосле наложения шины или фиксирующей повязки пациента необходимо госпитализировать для вправления вывиха.\n\nПризнаки перелома\nПереломами называют повреждение кости с нарушением ее целостности. Переломы могут быть закрытыми (без повреждения кожного покрова) и открытыми (с повреждением кожного покрова). Возможны также трещины кости.\n## Признаками перелома служат:\n• деформация конечности в месте перелома;\n• отек;\n• невозможность движения конечности;\n• укорочение конечности;\n• похрустывание костных отломков под кожей;\n• боль;\n• при переломе костей таза - невозможность оторвать ногу от поверхности, на которой лежит пациент.\n\nЕсли перелом сопровождается повреждением кожного покрова, его нетрудно распознать при наличии костных отломков, выходящих в рану. Сложнее установить закрытые переломы. Основные признаки при ушибах и переломах - боль, припухлость, гематома, невозможность движений - совпадают. Ориентироваться следует на ощущение похрустывания в области перелома и боль при осевой нагрузке. Последний симптом проверяется при легком поколачивании вдоль оси конечности. При этом возникает резкая боль в месте перелома.\n\nПомощь при переломах\nПри закрытых переломах, точно также как и при вывихах, необходимо обеспечить иммобилизацию конечности и покой. Средства иммобилизации включают шины, вспомогательные приспособления. При переломах костей бедра и плеча шины накладывают, захватывая три сустава (голеностопный, коленный, бедренный и лучезапястный, локтевой и плечевой). В остальных случаях фиксируют два сустава - выше и ниже места перелома. Ни в коем случае не надо пытаться сопоставить отломки костей - этим Вы можете вызвать кровотечение.\nПри открытых переломах перед Вами будут стоять две задачи: остановить кровотечение и произвести иммобилизацию конечности. Если Вы видите, что кровь изливается пульсирующей струей (артериальное кровотечение), выше места кровотечения следует наложить жгут (см. Первая помощь при кровотечении). После остановки кровотечения на область раны наложите асептическую (стерильную) повязку и произведите иммобилизацию. Если кровь изливается равномерной струей(венозное кровотечение), наложите давящую асептическую повязку и произведите иммобилизацию.\nПри иммобилизации конечности следует обездвижить два сустава - выше и ниже места перелома. А при переломе бедренной и плечевой кости обездвиживают три сустава (см. выше). Не забудьте, что шину не укладывают на голую кожу - под нее обязательно подкладывают одежду или вату.\n\n## Перелом таза:\n• Уложить пострадавшего на ровную поверхность на спину.\n• Ногам придать положение «лягушки» (широко раздвинутые, согнутые в коленях ноги), подложив под колени валик.\n• Транспортировать только лежа!\n## Перелом позвоночника:\n• По возможности не поворачивать и не переворачивать пострадавшего.\n• При отсутствии возможности прибытия помощи на место транспортировать (лежа!!!) пострадавшего на ровной твердой поверхности (например, дверь, щит из досок).\n\nТепловой (солнечный) удар\n\nПри солнечном ударе\n• При лёгком перегревании выведите пострадавшего в прохладное проветриваемое место, расстегните воротник, ремень, снимите обувь.\n• Смочите ему лицо и голову холодной водой.\n• Дайте выпить немного минеральной воды или слегка подсолённой воды.\n• Уложите пострадавшего, приподняв ему голову; дайте холодное питьё и разденьте.\n• Положите на голову смоченное холодной водой полотенце и наложите холодные примочки на область шеи.\n• До прибытия врача охлаждайте тело холодными примочками, пить давайте только после того, как больной придёт в себя.\n\nУкусы змей\n\n• Не давайте пострадавшему двигаться.\n• Успокойте укушенного: паника и возбуждение ускоряют кровоток.\n• Зафиксируйте с помощью шины укушенную конечность.\n• Приложите к месту укуса растёртые или разжёванные листья подорожника.\n• Давайте обильное питьё.\n• Не прижигайте место укуса марганцовкой, не накладывайте жгут, не давайте алкоголь. Можно попытаться удалить яд с помощью резиновой банки.\n•Конечность стоит держатьниже уровня тела\n\nУкусы животных\n\n• Не пытайтесь немедленно останавливать кровь (кровотечение способствует удалению слюны собаки из раны).\n• Промойте рану чистой водой.\n• Несколько раз продезинфицируйте кожу вокруг укуса йодом, раствором марганцовки, одеколоном, наложите повязку.\n• Обратитесь ко врачу.\n\nПри ужалении насекомыми\n(осами, пчёлами и др.)\n• При ужалении 1 - 2 насекомыми удалите пинцетом или ногтями жало вместе с ядовитым мешочком. Осторожно, чтобы не раздавить мешочек до извлечения жала.\n• На место отёка положите пузырь со льдом.\n• Если оса случайно попала в рот, нужно сосать кусочки льда, пить сильно охлаждённую воду.\n• Зуд от укуса комаров, пчелы (после вытаскивания жала) можно устранить, натерев кожу нашатырным спиртом, раствором питьевой соды (1/2 чайной ложки на стакан воды), или разрезанной луковицей, долькой чеснока, кашицей из поваренной соли, или млечным соком одуванчика.\n\nПри ушибе\n• Обеспечить пострадавшему полный покой.\n• Наложите на место ушиба холодный компресс (смоченный холодный платок, полотенце) или пузырь со льдом.\n\nПомощь при утоплении\n• Быстро извлеките пострадавшего из воды.\n• Удалите изо рта ил, грязь.\n• Поверните пострадавшего на живот, затем обеими руками трясите так, чтобы из дыхательных путей и желудка вытекла вода. Приподнимите за ноги.\n• Начинайте делать искусственное дыхание. После появления самостоятельного дыхания, напоите пострадавшего горячим чаем, укутайте в одеяло.\n\nПри попадании инородного тела\nв дыхательные пути\n• Прежде всего, освободите рот от остатков пищи пальцем, обёрнутым марлей, платком, повернув голову набок.\n• Сказать “покашляйте сильнее”\nЕсли в течение уже 30 сек никакого улучшение то сразу выполнять манёвр Хеймлиха\n\nВстаньте за спиной пострадавшего.\nОбхватите его торс обеими руками, накройте кулак правой руки ладонью левой руки и сделайте костяшкой большого пальца правой руки пять сильных нажатий на верхнюю часть живота. Направление - вверх и на себя. Восстановление дыхания - признак удаления инородного тела из дыхательных путей.\n\nПринципы формирования аптечки\nВ сложном и дальнем путешествии у каждого участника должна быть личная аптечка, в которую входят простейшие средства для оказания первой помощи.\nЛекарства, предназначенные для лечения пострадавших, состояние которых подразумевает транспортировку, берутся из расчета двух пострадавших и транспортировке их из наиболее отдаленного участка маршрута. \"Лекарства, применяемые при болезнях желудка и кишечника\" берутся в увеличенном количестве. При использовании препаратов на маршруте при первой возможности необходимо восполнить их запас. В случае отсутствия в аптеке нужных вам медикаментов замените их аналогичными, проконсультировавшись с фармацевтом аптеки.\n\nУпаковка аптечки\nАптечка должна иметь упаковку, сохраняющую форму и предохраняющую содержимое от деформации при переноске в рюкзаке и вне его.\nВ этом отношении, пожалуй, наиболее удобны пластиковые ящики для инструментов, продающиеся в хозяйственных магазинах.\nОни во многом похожи на профессиональные укладки, используемые бригадами \"Скорой помощи\" и спасательными формированиями. При выборе конкретного типа укладки надо обратить внимание на надежность замков и соединения ящика с крышкой. Даже при попадании в воду аптечка должна сохранять герметичность.\nМногие медикаменты приходят в негодность при соприкосновении с водой. Рекомендуется сделать амортизирующие прокладки внутри упаковки всей аптечки и отдельных блоков лекарств. Способ проверки прост - в аптечке, сброшенной в рюкзаке на твердую поверхность с высоты нескольких метров, ничего не должно разбиться. Для удобства использования лекарств все надписи на них в случае изоляции стекла, использовании самодельных упаковок должны быть восстановлены.\nДолжны быть указаны название лекарства, концентрация ( если это необходимо), срок годности. Внутри аптечки на тот случай, если ей будет пользоваться человек, не обладающий достаточными знаниями, должен быть вложен список медикаментов с показаниями к применению, дозировкой и противопоказаниями.\nОтдавайте предпочтение легким упаковкам лекарств. Самая тяжелая и неудобная упаковка - стекло.\nСтарайтесь свести его количество к минимуму. Если в аптечке все же присутствуют лекарства в стеклянной упаковке, их нужно обклеить лейкопластырем (это не относится лишь к ампулам). Это создает некоторую амортизацию, а если уж стекло разобьется, то осколки большей частью останутся на пластыре. В ряде ситуаций может потребоваться переноска аптечки отдельно от рюкзака. На этот случай она должна быть оснащена лямкой или ручками для транспортировки. Лучше всего упаковывать ее в небольшой рюкзачок. По внешнему виду аптечка должна легко отличаться, скажем, от ремнабора. Традиционное обозначение - красный крест на упаковке (на верхней ее стороне).\nДля удобства использования и переноски аптечки предлагается \"блочная\" ее укладка. Все имеющиеся медикаменты делятся на 2 части : аптечка экстренной помощи и все остальное. К первой группе относятся те лекарства, которые применяются в неотложных ситуациях, требующих немедленного реагирования. Эта часть аптечки хранится в легкодоступном месте и в аварийной ситуации должна извлекаться в считанные секунды. Предполагается, что состав ее разумно минимален.\nВ основной аптечке целесообразно объединить в блоки лекарства одной группы, что значительно облегчит их поиск. В этом смысле упоминавшиеся ранее ящики для инструментов удобны тем, что разбиты на секции, по которым удобно разложить медикаменты.\nТакже в индивидуальную аптечку могут входить лекарства, которые по тем или иным причинам принимаются человеком во время путешествия. О приеме этих лекарств необходимо поставить в известность руководителя группы.\nСписок аптечки с примерным расчетом количества, для группы в 15 участников для одно-двухдневного похода в теплое время года. В графе \"количество\" для таблетированных медикаментов указано количество таблеток. В таком виде список удобен для закупки медикаментов в аптеке, для проверки комплектации аптечки после похода.\n\nThis is how Claude Code surfaces messages the user sends mid-turn - within the running turn, often alongside the next tool result, rather than as a separate conversation turn. Address the message above as you continue this turn.\n<\/system-reminder>"},{"t":"Нашивка «Матрос»","cat":"Нашивки","b":"Специальность «матрос» можно получить тем, кто уже имеет нашивку узлового и штурмана.\nЗнать типы весельных судов, силовой набор судна.\nЗнать и уметь подавать сигналы бедствия.\nЗнать и выполнять правила безопасности на судне.\nЗнать и исполнять правила поведения на воде, уметь пользоваться спасательными средствами, правильно и быстро одевать спасжилет.\nОвладеть и практически выполнять команды рулевого.\nУметь пользоваться компасом.\nЗнать основные правила плавания по внутренним водным путям.\nПринять участие в водных программах.\nУстройство шлюпки\n\nШлюпками называются малые гребные, парусные и моторные беспалубные суда. Они изготовляются из дерева, металла, пластмасс и из резинотканей - надувные.\n\nУстройство шлюпки: 1 - киль, 2 - форштевень 3 - ахтерштевень 4 - транцевая доска 5 - шпангоуты 6 - обшивка, 7 - привальный брус, 8 - планширь, 9 - буртик, 10 - подлегарсы. 11 - банка, 12 - носовой решетчатый люк 13 - кормовое сиденье, 14 - кница, 15 - стойка, 16 - кильсон, 17- пробка, 18 - рым, 19 - брешгук; 20 - шпунтовый пояс: 21 - ширстрек, 22 - руль, 23 - рым, 24 - фалинь; 25 - оковка, 26 - подуключина 27 - наметка, 28 - гнездо дли нагеля. 29 - ванг-путенс, 30 - фасонный обушок, 31 - обух с гаком, 32 - флюгарка\n\nСовокупность продольных и поперечных брусьев, представляющих каркас шлюпки, называется набором. В основу набора кладется дубовый брус - киль, продолжением которого в носовой части шлюпки является вертикальный брус - форштевень, а в кормовой - вертикальный брус - ахтерштевень. На всех шлюпках, кроме шлюпок типа вельбот, к ахтерштевню крепится транцевая доска.\n\nС внутренней стороны шлюпки немного выше расчетной ватерлинии по бортам прокладываются дубовые брусья - подлёгарсы, на которые накладываются банки, носовой решетчатый люк и кормовое сиденье.\n\nДно шлюпки закрывается съемными щитами - рыбинами, имеющими упоры для ног гребцов. В корме дно закрывается кормовым решетчатым люком.\n\nУправляется шлюпка рулем, который навешивается в диаметральной плоскости на специальный крюк и петлю или на металлический стержень, укрепленный на ахтерштевне или транцевой доске.\n\nШлюпки снабжаются необходимыми для плавания предметами: веслами, румпелями, отпорными крюками, уключинами, лейками, анкерками, семафорными флажками, якорем. Одним из основных предметов снабжения являются весла. На вельботах и спасательных шлюпках применяются распашные, а на всех других типах шлюпок - вальковые весла.\n\nВальковое весло имеет следующие наименования частей: рукоять, валек, веретено и лопасть. Одна сторона лопасти имеет грань - для прочности, вторая (рабочая) сторона лопасти гладкая. Правильное положение весла при гребле - рабочей стороной в корму. Лопасть весла имеет металлическую оковку, которая предохраняет ее от раскалывания.\n\nВесла должны быть подогнаны так, чтобы сидящие на одной банке гребцы не мешали друг другу (расстояние между рукоятями весел следует иметь около 15 см). При гребле одна рука гребца лежит на вальке, а вторая держит весло за рукоять.\n\nУпоры для ног располагают так, чтобы ноги у сидящего гребца были несколько согнуты в коленях, а колени находились немного ниже тазобедренных суставов.\n\nГребцы, сидящие на загребной банке, называются загребными. Они назначаются из наиболее сильных и выносливых. Баковые гребцы должны отличаться ловкостью, чтобы своей оплошностью не помешать действию других гребцов.\n\nПосадка гребцов производится по команде «Гребцы - на шлюпку!», а выход из шлюпки по команде «Гребцам - выйти из шлюпки!» На шлюпке должен соблюдаться образцовый порядок.\n\nОчередность посадки гребцов в шлюпку зависит от расположения шлюпки. Если она стоит носом к трапу, то первым в нее садится старшина, за ним - загребные, за загребными - средние (гребцы средней банки), а затем - баковые. Если посадка производится с кормы, то первыми заходят баковые, за ними все остальные по порядку номеров банок. Старшина шлюпки садится последним. При посадке в шлюпку гребцы обязаны очистить обувь от пыли и грязи. Гребцам запрещается ходить по банкам, облокачиваться о планширь, выставлять руки и локти за борт.\n\nВ первоначальной стадии обучения следует отработать действия гребцов по следующим командам: «Уключины вставить!» Гребцы, повернувшись вполоборота к своим бортам, внешней рукой вставляют уключины в гнезда так, чтобы они были развернуты вдоль планширя. «Весла разобрать!» Гребцы внутренней рукой берут свое весло за рукоять, а внешнюю руку продевают под весло так, чтобы валек оказался на локтевом сгибе. Используя локтевой сгиб как ось рычага, нажимают на рукоять и кладут лопасть весла на планширь за вторую уключину, считая свою первой. Вальки весел должны быть прижаты к борту на высоте планширя. Корпус гребцов развернут вполоборота к своему борту, а голова - в сторону лопасти своего весла. «Весла!» Равняясь по загребным, гребцы поднимают весла на локтевом сгибе, заносят их перпендикулярно диаметральной плоскости шлюпки и серединой «кожи» вкладывают в уключины. Освободившуюся внешнюю руку кладут ладонью на валек так, чтобы руки лежали ладонями вниз на ширине плеч. Лопасть весла должна быть развернута стороной с гранью вверх и иметь небольшой наклон к воде.\n\n«На воду раз!» Равняясь по загребным, гребцы наклоняют туловище, вытягивают руки вперед, быстро заносят лопасти весел в сторону носа шлюпки, делая при этом вдох. Для уменьшения сопротивления воздуха лопасти при заносе должны идти горизонтально, и лишь в конце движением кистей рук весло разворачивается от себя так, чтобы передняя кромка лопасти имела небольшой наклон к воде. Ноги гребца согнуты в коленях, голова поднята (рис. а).\n\n«Два!» Гребцы одновременно опускают лопасти на 2/3 в воду и, отклоняясь корпусом назад, с силой проводят лопасть в воде, делая при этом выдох. При выполнении этого приема основную нагрузку принимают на себя мышцы спины, руки на первой фазе гребка находятся в вытянутом состоянии. После того как туловище пройдет вертикальное положение, руки сгибаются и с силой подтягивают рукоять весла к груди, ноги выпрямляются (рис б).\n\nВо время гребка лопасть должна идти в воде в вертикальном положении и в этом же положении выниматься из нее. Окончив гребок, весло разворачивают на себя, чтобы при заносе его для следующего гребка кромка лопасти, обращенная к носу, была несколько выше кромки, обращенной к корме. В конце заноса лопасть разворачивается для нового гребка. После выполнения приема по счету «Два!» сразу же следует команда «Раз!»,по которой производится занос весел для нового гребка.\n\nПри подходе к борту корабля, к пирсу и в других случаях, когда необходимо убрать весла, подается команда «Шабаш!» Выполняя эту команду, гребцы под-кладывают локтевой сгиб внешней руки под валек весла и, нажимая другой рукой на рукоять, вынимают весла из уключин, заносят их лопастями к носу и без шума, но быстро укладывают к бортам. Первыми укладывают свои весла боковые, затем - гребцы средней банки и, наконец, - загребные. Гребцы должны уметь грести на разных банках и на обоих бортах. Для того чтобы при отходе от корабля (пирса) дать шлюпке ход вперед, подается команда «Протянуться!» По этой команде загребной и баковый того борта, который ближе к кораблю или пирсу, протягиваются отпорными крюками вперед. Когда шлюпка приобрела ход, старшина перекладывает руль от борта корабля или пирса, дает команду «Оттолкнуть нос!», по которой баковый, продолжая протягиваться длинным отпорным крюком, с силой отталкивает нос, и отпорные крюки укладываются на рангоутный чехол.\n\nОсновные команды при движении на веслах\n\n«Отваливай!» - объединяет действия гребцов по четырем командам: «Протянуться!», «Оттолкнуть нос!», «Уключины вставить!» и «Весла разобрать!» (на шлюпках с распашными веслами по этой команде гребцы выполняют действия и по команде «Весла!»). Осмотревшись за бортами, командир подает следующие две известные нам команды: «Весла!» и «На воду!» Командир шлюпки должен подавать команды отчетливо, громким голосом и обязательно в момент, когда лопасти весел находятся в воде и еще не доведены: до траверза. Поданная команда исполняется гребцами после окончания гребка.\n\nДля временного прекращения гребли подается команда «Суши весла!», по которой гребцы поднимают лопасти из воды и выравнивают их в горизонтальном положении параллельно поверхности воды. При этом весла устанавливаются перпендикулярно диаметральной плоскости шлюпки нерабочей стороной лопасти вверх. Для уменьшения скорости движения шлюпки или полной ее остановки подается команда «Весла в воду!» По этой команде гребцы опускают 1/3 лопасти ребром в воду и, удерживая валек на высоте груди, корпусом налегают на него. После достижения цели, в зависимости от обстановки, подается команда «Суши весла!» или «Шабаш!» «Табань обе!» По этой команде гребцы одновременно заносят весла к корме, опускают лопасти в воду и начинают грести в обратном направлении, давая шлюпке ход назад. Никогда не следует подавать эту команду на шлюпке, имеющей ход вперед.\n\n«Весла по борту!» По этой команде гребцы одновременно и быстро заносят лопасти к корме (при движении шлюпки назад - к носу) так, чтобы они были прижаты к борту в вертикальном положении. Для возобновления, гребли предварительно подается команда «Суши весла!» «Навались!» или «Легче гресть!» Эти команды подаются для увеличения или уменьшения скорости хода шлюпки. При выполнении этих команд установившийся темп гребли не меняется. «Весла на валек!» Гребцы, не вставая с мест, вынимают весла из уключин и ставят их вертикально лопастями вверх, развернув лопасти вдоль шлюпки. Внешняя рука гребца, вытянутая вдоль шлюпки, держит весло за «кожу», а другая рука - за валек. Корпус гребца при этом должен быть прямой, а голова повернута лицом в сторону кормы.\n\nЭта команда подается на шлюпках с вальковыми веслами для приветствия, при прохождении особо узких мест, линии финиша на гонках, а также при посадке в шлюпку большого числа людей. Как только минует надобность в этом приеме, подают команду «Весла!» «Береги весла!» Команда подается при опасении, что весла могут быть повреждены, задев за какой-нибудь предмет. Гребцы внимательно следят за лопастью своего весла, при необходимости несколько втягивают весло внутрь шлюпки или поднимают лопасть, пропуская гребок. «Весла под рангоут!» (на шлюпках с вальковыми) или «Весла под планширь!» (на шлюпках с распашными веслами).\n\nЭти команды подаются для отдыха. Гребцы, не вынимая весел из уключин, закладывают их рукояти под рангоутный чехол (под планширь противоположного борта закладываются рукояти распашных весел). Лопасти должны быть подняты горизонтально на одном уровне. Обе эти команды подаются с положения, соответствующего команде «Суши весла!» После отдыха подается команда «Весла!», по которой гребцы принимают положение, соответствующее команде «Суши весла!» При снятии шлюпки с мели или прохождении мелководных участков подается команда «Весла на укол!» По этой команде гребцы поднимают весла лопастями вверх, опускают их в воду и, упираясь рукоятями весел в грунт, стараются сдвинуть шлюпку с мели. Для продолжения гребли подается команда «Весла!» и т. д. Команда, поданная без указания борта, касается всех гребцов, а команда, предваряемая словом «правая» или «левая», касается только гребцов соответствующего борта.\n\nУправление шлюпкой на веслах\n\nПри движении шлюпки прямым курсом заданное направление удерживается по отдаленному неподвижному предмету, по компасу или створу. Возникающие отклонения от курса старшина шлюпки немедленно исправляет небольшим поворотом руля.\n\nУправление шлюпкой по отдаленному предмету заключается в том, что ее форштевень должен все время удерживаться в створе с предметом.\n\nУправление по створу считается наиболее точным и удобным. В качестве створа можно использовать два отдаленных друг от друга береговых предмета, расположенных на одной линии с курсом шлюпки. Правят так, чтобы удерживать шлюпку на линии избранного створа. Если створные знаки или избранные в качестве створа предметы начнут расходиться, то нужно изменить курс в ту сторону, в которую отошел ближний (передний) знак от дальнего (заднего).\n\nПри плавании на течении необходимо курс шлюпки располагать так, чтобы дойти до намеченной точки кратчайшим путем. Угол сноса будет зависеть от скорости течения, скорости движения шлюпки и других факторов. Он подбирается опытным путем, сообразуясь с обстановкой, но в каждом случае курс располагается под некоторым углом к течению. Следуя на течении по створам, нос шлюпки не будет направлен на створ.\n\nЧасто возникает необходимость резко изменить курс, развернуться с помощью весел на месте, остановить движение шлюпки и т. п. Чтобы сделать быстрый поворот, подается команда «Правая (левая) - в воду!» При наличии движения руль перекладывается в сторону того же борта. По окончании поворота подается команда «Обе - на воду!»-При необходимости сделать разворот шлюпки на месте гребцам каждого борта может быть подана отдельная команда. Первая команда обычно подается правому борту. В этом случае следует подать команды: «Правая табань!» (или «Правая в воду!»), «Левая на воду!» Подход шлюпки к кораблю осуществляется с кормы под углом 30 - 40° к его диаметральной плоскости. Учитывая инерцию движения, заранее подают команду «Шабаш!» и направляют шлюпку параллельно курсу корабля. Загребной ближнего к кораблю борта отпорным крюком задерживает корму шлюпки у трапа, а баковые принимают с корабля трос для крепления. Подход к пирсу (стенке) осуществляется таким же образом. Подойдя к пирсу, удерживают шлюпку отпорными крюками и высылают одного из баковых на берег для приема и крепления фалиней.\n\nГребля в рафте\n\n## Цикл движения включает в себя:\n\n· захват,\n· проводку,\n· занос весла.\n\n## Проводка в свою очередь состоит из:\n· тяговой части\n· выноса весла.\n\nСначала исходное положение для гребка. В рафте садятся на баллон сверху, свесив ноги внутрь рафта и уцепившись ступнями за какие-нибудь петельки.\n\n· туловище гребца вертикально,\n· грудь перпендикулярна продольной оси рафта,\n· плечи опущены,\n· руки прямые,\n· верхняя рука вытянута вперёд,\n· кисть верхней руки расположена по высоте примерно на уровне подбородка,\n· нижняя рука вытянута вниз и немного вперёд,\n· лопасть весла погружена в воду максимально близко к гребцу так, чтобы древко не касалось баллона рафта.\n\nИз этого положения нужно сделать вынос и занос весла, то есть перейти к исходному положению для захвата. Корпус гребца наклоняется вперёд с одновременным разворотом плечевого пояса в сторону верхней руки. Одновременно с этим нижняя рука плавно, но быстро двигается вперёд-вверх по дуге, при этом в начале этого движения она сгибается в локте и затем выпрямляется. Верхняя рука двигается немного вверх и одновременно сгибается в локте. Кисть верхней руки во время заноса разворачивает лопасть весла внешним ребром вперёд.\n\nВ результате исходное положение для захвата выглядит следующим образом:\n\n· по возможности, максимальный разворот плечевого пояса,\n· при этом из-за наклона корпуса плечо верхней руки оказывается выше плеча нижней руки,\n· локоть верхней руки не должен быть опущен ниже линии кисть - плечо,\n· кисть расположена примерно на уровне лба по высоте,\n· нижняя рука вытянута вперёд-вниз,\n· лопасть весла почти касается воды.\n· Основные движения - захват и тяга. Они выполняются слитно и заканчиваются исходным положением для гребка, которое было описано выше.\n\nЗахват начинается разворотом плечевого пояса, разгибанием верхней руки вперёд (ни в коем случае не вверх), тягой прямой нижней руки вниз-назад и одновременным подъёмом туловища. Нужно стремиться к тому, чтобы верхняя рука разгибалась быстро, но плавно с усилием толкая ручку весла вперёд и не давая ей подняться вверх. Время, за которое рука выпрямится, должно составлять примерно треть от суммы движений захват - тяга. Нужно следить, чтобы нижнюю руку не сгибать в локте, и чтобы плечо не поднималось вверх.\nНа самом деле нижняя рука должна сгибаться в самом конце гребка для того, чтобы удлинить тягу и сделать удобнее вынос весла. Но многие сгибают руку слишком рано, и им трудно в дальнейшем отучиться от этой привычки. Поэтому сначала лучше приучить себя грести с прямой нижней рукой, и только потом начинать сгибать её в нужный момент. Такая последовательность намного облегчает процесс обучения.\n\nСамая большая ошибка новичков - попытка грести практически одной нижней рукой. Они держат верхнюю руку полностью согнутой в локте, и только нижней совершают и занос весла и непосредственно гребок. От такой работы рука очень быстро устаёт. Необходимо использовать обе руки, особенно во время заноса весла, а для этого стараться меньше сгибать верхнюю руку в локте и не опускать её вниз. Вторая очень распространённая ошибка - гребля согнутой в локте нижней рукой. Верхняя рука должна толкать, а нижняя - прямая - тянуть.\n\nСинхронность\n\nНадо добиться синхронной гребли всех членов экипажа. Когда правые и левые гребут, и начало гребка у них не совпадает по времени, или когда гребок одних длиннее гребка других, нос рафта совершает колебательные движения из стороны в сторону. Это сильно снижает скорость судна. Синхронность времени начала гребка и его продолжительности очень важна. Носовые гребцы должны смотреть друг на друга и следить за одновременным началом гребков. Средние смотрят на носовых, а кормовые на средних. Таким образом, лопасти всех должны входить в воду строго одновременно. Здесь очень многое зависит от первой пары - любая несогласованность приводит к потере скорости рафта. Очень важно предварительно договориться, кто на кого и когда смотрит и подстраивает свой гребок под гребок напарника. Ошибки синхронности лучше всего видны с кормы, и рулевые в этих случаях должны подсказывать экипажу, кто кого опережает или отстаёт.\n\n## Как забраться в рафт из воды:\n\nВзяться вытянутыми руками за обвязку рафта или за шнуровку дна (если рафт перевёрнут);\nЛечь на воду, стараясь, чтобы тело было расположено на поверхности воды;\nПодтянуться на руках, по возможности придав телу большую скорость и, сразу же вытолкнуть себя вверх - руки при этом остаются внизу в районе пояса. Это движение напоминает выход силой на перекладине.\nКогда верхняя часть туловища перевесит нижнюю, упасть внутрь рафта.\nСигналы бедствия\n\nSOS (СОС) - международный сигнал бедствия в радиотелеграфной (с использованием связи.\n\nСигнал представляет собой последовательность «три точки - три тире - три точки», передаваемую без пауз между буквами . SOS не является аббревиатурой, это отдельный символ азбуки Морзе.\n\nщшлСигналы бедствия могут быть поданы и другими способами: выпуск клубов дыма оранжевого цвета; пламя от горящей смоляной бочки; ракеты, выбрасывающие красные звезды, выпускаемые поодиночке через короткие промежутки времени; красная парашютная ракета либо фальшфейер красного цвета; медленное, повторяемое поднятие и опускание рук, вытянутых в стороны; взрывы, производимые с промежутками около одной минуты; сигнальные костры, расположенные треугольником."},{"t":"Нашивка «Художник»","cat":"Нашивки","b":"Если ты любишь рисовать и готов развивать своё мастерство, то нашивка «Художник» ждёт тебя! Чтобы получить нашивку, необходимо сдать теорию и практику.\n\n## Теория:\n1. Перечисли не менее пяти направлений живописи, кратко охарактеризуй их особенности и назови наиболее ярких представителей того или иного течения.\n\n2. Перечисли десять русских художников и назови по одной известной работе каждого из них.\n\n## Практика:\n\n1. Участвуй в течение всей смены в максимально возможном количестве оформительских работ. Список оформительских работ должен содержать не менее 5 позиций, например, оформление отрядного уголка, стенгазеты, «древо смены», выполнения поручения «уют» и прочее.\n\n2. Выпусти стенгазету.\n\n3. Подготовь набросок на тему (на выбор: иллюстрация к любимой сказке, портрет, пейзаж, натюрморт) карандашом, углём, акварелью, тушью или масляной краской.\n\n## Полезная информация:\nЧтобы понять, кто такой художник, давай обратимся к происхождению этого слова. Славянское слово «художник» (болг. Художник; укр. Художник) является древним заимствованием из готского языка (handags), а в германских языках восходит к обозначению руки (ср. нем. Hand, дат. Hånd, норв. Hånd, англ. Hand). Художник буквально - «с умелыми руками».\n\nКто же такие художники, и чем они занимаются?\nСуществует огромное разнообразие профилей и специализаций художников. Это деятели искусства, настоящие творцы. Зародилась данная профессия в глубоком прошлом. Еще первобытные люди изображали на стенах пещер сюжеты быта. Именно первобытные рисовальщики дали начало творческим процессам и зарождению живописи. Особой популярностью художники пользовались в период античности. Это искусство стремительно развивалось, а мастера получили уважение. Но с приходом средневековых «темных времен» наступила эпоха простоя во всех сферах искусства. Живопись и художники не стали исключением. Живопись приравнивалась к бесовскому промыслу и каралась смертью. Признавались только мастера, которые работали над церковными фресками.\n\nС наступлением эпохи Возрождения искусство и художественный промысел начинают стремительно развиваться. Творцов уважали. Многие стремились познать тонкости мастерства художников; массово организовывались школы искусств. Мастера принимали подмастерьев, которые становились их последователями. В наши дни профессия художника имеет ряд разновидностей, которые зависят от стилистики, типа расходных материалов и профиля деятельности.\n\nНаправления в изобразительном искусстве Грани, разделяющие направления, такие тонкие, что порой трудно определить, где заканчивается один вид, и начинается другой. Но мы всё же попробуем разобраться:\n\nИз русских художников-импрессионистов: Константин Коровин, Игорь Грабарь.\n\nТворчество крупнейших русских художников\nМожет быть, ты уже знаком с творчеством великих русских художников и сможешь назвать других мастеров и их картины?\n\nКаждый знает, чтобы стать настоящим художником, нужно не только разбираться в направлениях живописи и помнить названия работ великих мастеров, но, самое важное, нужно много рисовать! В нашем лагере у тебя будет много возможностей проявить себя в этом деле.\n\n## Требования к оформлению стенгазеты:\n\n1. В первую очередь на листе нужно сделать поля, ширина которых должна быть не менее двух сантиметров. Это необходимо для того, чтобы газета зрительно отделялась от стены.\n\n2. Затем размечается место под заголовок. Как правило, для этого отводится около одной пятой площади стенгазеты. Между заголовком и основным текстом правильно будет оставить немного свободного места, чтобы они не сливались.\n\n3. Далее площадь стенгазеты нужно разметить под материалы, которые будут в ней размещены. Текстовые материалы и иллюстрации желательно чередовать. Наиболее интересные материалы размещаются в центре газеты, менее важные - по краям.\n\n4. Очень важно, чтобы композиция газеты была уравновешенной: обе части должны быть заполнены одинаково.\n\n5. Текстовые материалы лучше напечатать на отдельных листах, а затем их наклеить на газету.\n\n6. Если необходимо выделить какой-либо материал или объединить несколько посвященных одной теме заметок, их можно обвести рамкой или выполнить на цветной бумаге.\n\n7. Конечно, оформить стенгазету невозможно без фотографий и рисунков, при этом очень важно разместить их максимально эффектно. Желательно, чтобы рисунки были выполнены профессионалом (т.е. тобой, будущий художник!)\n\n8. Эффектно в стенгазете смотрится
