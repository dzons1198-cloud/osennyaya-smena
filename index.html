ость ISO - чувствительность матрицы к свету. Максимальное ISO - матрица становится более чувствительной, и можно сделать снимок даже при малом свете. Но чем больше ISO, тем более «шумная», «зернистая» фотография.\n\nЭкспозиция - ключевое понятие в фотографии. Формируется подбором комбинации выдержки и диафрагмы, которые еще называются «экспопара». Задача фотографа - подобрать комбинацию так, чтобы обеспечить необходимое количество света для создания изображения на матрице.\n\nТочка фокусировки или просто фокус - это та точка, на которую вы «навели резкость».\n\nДополнительное оборудование\n\nЭкспонометр и флешметр - устройства для определения световых условий съёмки.\n\nОсветительное оборудование. Для съёмки в условиях недостаточной освещённости используются различные осветительные приборы и отражатели. Наиболее массовыми среди них стали фотовспышки,\n\nШтативы используются для предотвращения «смаза» при недостаточной освещённости, съемке панорам, при больших выдержках, для установки дополнительного осветительного оборудования, для многократной съемки на один кадр и т. д.\n\nСветофильтры используются для компенсации цветовых и пространственных недостатков освещения, получения специальных эффектов.\n\nКомпозиция\n\nЧто же такое композиция? Композиция (от лат. compositio) означает составление, соединение, сочетание различных частей в единое целое в соответствии с какой-либо идеей.\n\nПеред тем как жать на кнопку затвора камеры, определитесь со смысловым центром и найдите его в окружающем пространстве, выделите мысленно, что является главным, самым интересным для вас. Далее воспользуйтесь правилом золотого сечения или правилом третей. В чем его смысл? Пространство кадра мысленно разбивается двумя горизонтальными и двумя вертикальными линиями на равные части. Из трех горизонтальных и трех вертикальных полос получается некая сетка с точками пересечения линий.\n\nНаиболее важные элементы кадра рекомендуют располагать вдоль этих линий или же в точках их пересечения. Дело в том, что подобная асимметрия изображения воспринимается более естественно.\n\n## Типичные композиционные ошибки, которых нужно избегать:\n\n· Обрезанные части людей или достопримечательностей.\n\n· Нарушение пропорций тела человека (например, при съемке сверху человек будет казаться с большой головой и короткими ногами).\n\n· «Заваливание» горизонта (непараллельность линии горизонта на фотографии горизонтали на мониторе).\n\n· Нахождение в кадре постороннего объекта.\n\n· Несбалансированная композиция (Расположение по центру кадра - пожалуй, самая известная и самая распространенная ошибка).\n\n· Пустая или перегруженная композиция, когда в кадре либо много пустого места, либо, напротив, «фотомусора» (ярких и привлекающих внимание элементов кадра, никак не относящихся к основной идее именно этой фотографии).\n\nУдачной фотоохоты, друг!\n\n## Что почитать владельцу фотоаппарата:\n\nАгафонов А.В., Пожарская С.Г. Фотобукварь. М., 1993.\n\nДыко Л., Головня А. Фотокомпозиция. М., 1962.\n\nЛапин А.И. Фотография как… М., 2004.\n\nФриман М. Дао цифровой фотографии. Идеальная композиция. М., 2011.\n\nФрост Ли. Вопросы и ответы. М., 2004.\n\n## Электронные источники:\n\nЗаика А. Фотографируем мобильным телефоном. СПб., 2005 // http://soul-foto.ru/photo_books/А.%20А.%20Заика.%20Фотографируем%20мобильным%20телефоном.%202005.pdf\n\nКак сделать хорошую фотографию // http://lightroom.ru/photomaster/44-63.html\n\nКниги по фотографии // http://fotoknigi.org/all-books/\n\nОстровская Т. 100 советов начинающему фотографу на каждый день // http://photo-element.ru/philosophy/100/100.html"},{"t":"Нашивка «Скалолаз»","cat":"Нашивки","b":"К сдаче на скалолаза допускаются те, у кого уже есть нашивка узлового.\nЗнать технику безопасности при нахождении на скалах, при работе с веревками, при страховке, при подъеме и спуске.\nЗнать и уметь использовать специальное снаряжение (различные веревки, спусковые и страховочные устройства, карабины, обвязки).\nПродемонстрировать инструктору технику скалолазания-восхождения по скальной стенке.\nТехника безопасности на скале\n\n· Любая страховка осуществляется только подготовленным участником, имеющим опыт и навык страховки.\n· Передвижение по скале возможно только с соблюдением правила трех точек опоры.\n· Страховочное снаряжение должно быть проверено. Оно должно выдерживать нагрузки, превышающие возможные в данном случае.\n· Не разрешается использовать старые верёвки, верёвки с надрывами оплётки, с намертво затянувшимися узлами или с подплавленной оплёткой. Также, если верёвка была перебита, долгое время находилась на открытом солнце или подверглась большему количеству рывков, чем рассчитана.\n· Не допускается использование карабинов с заедающей или не работающей муфтой.\n· Не допускается использование спусковых устройств и карабинов с протёртыми частями более 1 мм.\n· Не разрешается использование обвязок с расползшимися швами, с надрывами, с сильно протёртыми основными петлями.\n\n## Категорически запрещается:\n· Работать на любой скальной поверхности в одиночку.\n· Отвлекать страхующего во время работы.\n· Разворачиваться спиной к скале.\n· Держаться за веревку в местах соприкосновения ее с поверхностью скалы.\n· Использовать при страховке саморазвязывающиеся узлы.· Нагружать страховочную веревку (хвататься за нее).\n· При отсутствии умений спускаться прыжками - упираться в скалу коленями, локтями, головой, садиться, находясь на маршруте.\n\nВеревки, применяемые в скалолазании.\n\nСкалолазными веревками являются специальные веревки с особыми динамическими и прочностными качествами, применяемые в альпинизме, скалолазании и спелеологии.\n\nИзготавливаются скалолазные веревки в основном из полиамида (капрон, нейлон) - такие веревки [в отличие от веревок из растительных материалов] прочны, эластичны, износостойки, устойчивы к воздействию химических веществ (кроме кислот).\n\nИногда веревки изготавливаются из полиэстера (менее эластичны и веревка хуже держит узлы) и редко из кевлара (самые прочные веревки, но наименее долговечные и плохо держат узлы).\n\n## Типы веревок:\n- Крученные\n- Плетенные (также называют веревки кабельного типа)\n\n{Дополнительно: при одинаковой толщине и материале крученная веревка в сравнении с плетенной имеет лучшие прочностные и динамические характеристики. Однако плетенная веревка состоит из несущей сердцевины и защищающей ее оплетки, так что она больше защищена от механических повреждений и солнечного ультрафиолета}.\n\n## Веревки по способу применения делятся на:\n- Динамические\n- Статические\n- Вспомогательные (репшнуры)\n\n## Динамические веревки:\n\nПрименяются для страховки на маршруте (скальном или ледовом), в основном с нижней страховкой.\n\nОсновное свойство - амортизировать динамический удар, возникающий при срыве с фактором падения больше 1\n\n## Недостатки:\n\nмягкие, как правило сильно промокают и обмерзают;\nпри соприкосновении со скалой трутся больше, чем статические;\nнельзя использовать под постоянными статистическими нагрузками (перила, переправы);\nсильно вытягиваются на дюльфере.\n## Статические веревки:\n\nПрименяются в спелеологии, в верхней страховке (амортизируют динамический удар с фактором падения равным 0 {нулю} или 1 {одному}), для перил, для переправ, при спасательных работах и в промышленном альпинизме.Основное отличие от динамических веревок ­ малая степень удлинения под нагрузкой.\n\nВАЖНО: при работе со статической веревкой как страховочной, категорически запрещается допускать ситуацию, при которой скалолаз окажется выше, чем точка крепления веревки {либо точка перегиба веревки через карабин}.\n\nУзлы, применяемые в скалолазании\n\n## Эффективность узла:\n\nЭто показатель остаточной прочности веревки (каната, троса) в узле от номинальной прочности веревки, выраженный в процентах.\n\nСилы, действующие на веревку внутри узла, не распределяются равномерно по всему ее поперечному сечению. Часть нитей, находящихся на внешней стороне дуги, натягивается довольно сильно. Чем сильнее изогнута веревка, тем в большей степени уменьшается ее прочность. В зависимости от узла, прочность веревки обычно ослабевает на 30-­60%\n\nУзлы, наиболее часто применяемые в альпинизме, скалолазании и спелеологии (в скобках указана эффективность узла):\n\nГрепвайн (56%) - соединение веревок, самостраховка (вместе с узлом прусика или с австрийским схватывающим);\nВстречная восьмерка (47%), встречный проводник (41%) ­- связывание двух веревок одинакового диаметра;\nДевятка (70%), двойная восьмерка (55%) -­ самостраховка (петля для встегивания карабина);\nДвойной булинь (53%) -­ закрепление полной страховочной обвязки на теле скалолаза;\nАвстрийский проводник (51-­53%) - крепление страховочных усов к обвязке, исключение из натяжения перетёршегося сегмента веревки;\nЗаячьи уши (с основой­ ­-­­ не проводником, а двойной восьмеркой) - ­страховка двумя карабинами.\nВАЖНО: прочность узла зависит от материала троса, от способа плетения, от диаметра, нагрузки, направления нагрузки, вида узла и т.д.\n\n-­ Узлы на мокром тросе менее прочны на приблизительно 25% (на четверть);\n\n­- Чем тоньше канат, тем менее прочен узел;\n\n-­ Если материал троса более скользкий, узел менее прочный; и т.д.\n\nКарабины и другое снаряжение\n\nАльпинистские карабины\n\n- {общими словами} это металлические «кольца» с защелкой (называемой муфтой), которые присоединяются к веревочным страховкам.\n\nПрочность и надежность карабина практически во всем зависит от материала, из которого он изготовлен.\n\n## Используемые материалы:\n\n- Стальные карабины: самые надежные среди всех материалов. Недостаток - тяжесть.\n\n- Дюралюминиевые карабины (сплав алюминия с разными металлами): наиболее универсальный вариант. В несколько раз легче аналогичных стальных карабинов.\n\n- Титановые карабины: наследие СССР. Считаются «морально устаревшими». Основные недостатки - дороговизна, риск появления микротрещин, плохая теплопроводность (может стать причиной потери прочности карабина во время трения веревки).\n\n-Пластиковые карабины - НЕ МОГУТ быть использованы как соединительный элемент веревки, отлично подходят для развески альпинистского снаряжения.\n\n## Карабины по форме и размеру:\n\nВ альпинизме применяются различные формы и виды карабинов, однако можно выделить несколько ключевых:\n\n-Овальные карабины: симметричны и хорошо распределяют нагрузку\n\n-Трапециевидные карабины: наиболее популярны; создают равномерное распределение нагрузки по конструкции.\n\n-Грушевидные карабины: благодаря такой форме веревка безопасно скользит по карабину; также к такому карабину можно присоединить несколько креплений снаржения.\n\n-Рапиды: соединительные звенья без защелки с муфтами. В рапидах муфта после закручивания создает цельную конструкцию. То есть в таких карабинах нагрузка может идти в любых направлениях. Используют как постоянный элемент крепления в страховочных системах.\n\n## Виды муфт на альпинистских карабинах:\n\n1) Классическая ручная муфта: блокируется вручную, при необходимости. Недостатки: есть вероятность сорвать резьбу либо закрутить слишком сильно, муфта может самостоятельно раскрутиться.\n\n2) Автоматическая двухтактная муфта: просто и быстро открывается/блокируется. Недостатки: есть вероятность самостоятельного раскрытия карабина при трении о веревку или снаряжение; на морозе может промерзнуть и перестать открываться.\n\n3) Автоматическая трехтактная муфта: надежнее двухтактной в плане самопроизвольного раскрытия. Недостатки: чувствительна к загрязнению, может замерзнуть.\n\n## Выбраковка альпинистских карабинов:\n\nПри наличии одного из нижеследующих дефектов карабин запрещается использовать:\n\n- Коррозия\n- Зазор или выход наружу клепки защелки\n- Общий износ корпуса (истончение), наличие засечек на корпусе глубиной больше 1 мм.\n- Автоматические муфты не закрываются сами либо закрываются не до конца.\n- Деформация самого карабина.\n\nЖумар\nЖумар\nЭто приспособление для подъема по веревке. Он хорошо скользит вверх и не едет вниз.{Официальное название - «зажим»}\n\nВАЖНО: при использовании жумара нельзя допускать, чтобы он находился ниже уровня пояса.\n\nСпусковое устройство «Восьмерка\"\nСпусковое устройство «Восьмерка\"\nПредназначено для спуска по одинарной или двойной веревке. Используется с веревками практически любого диаметра. Наличие выступов (рожек) обеспечивает дополнительную фиксацию веревки.\n\nПринцип работы «восьмерки» основан на использовании силы трения.\n\nТо есть спускающийся либо страхующий контролирует (и регулирует) скорость спуска усилением торможения свободного конца веревки, либо изменением угла между свободным концом и «восьмеркой».\n\n## Как «восьмерка» встегивается в страховочную систему:\n\nКарабин, в который встегиваются восьмерка с веревкой, может быть закреплен на анкере или дереве, а также может крепиться на обвязке страхующего человека.\n\nСтраховка на скалах и скалодромах\n\nСтраховка ­ это набор инструментов и устройств для безопасного занятия скалолазанием, который помогает избежать любого рода травм как во время лазания по скалодрому, так и во время падения.\n\n## Страховка на скалах и скалодромах бывает нескольких видов:\n\n1) Верхняя страховка\n2) Нижняя страховка\n3) Гимнастическая страховка\n4) Спортивный мат (crash-pad)\n5) Автоматическая страховка\n\n## Верхняя страховка:\n\nПрименяется на ровных вертикальных стенах или стенах с небольшим нависанием. Точки страховки находятся выше скалолаза. Веревка проходит через эти точки и спускается к скалолазу. В процессе лазания он движется вверх-вниз, вправо-влево, а страхующий выбирает лишнюю веревку либо выдает ее при излишнем натяжении веревки.\n\nПри падении в случае срыва скалолаз повисает на веревке немного ниже того места, до которого он смог подняться, а нагрузка при рывке и риск получить травму являются минимальными.\n\n## Нижняя страховка:\n\nНижняя скалолазная страховка используется только опытными скалолазами, так как требует наличия хорошей физической формы и наличия определенных навыков и опыта.\n\nОрганизация страховки происходит таким образом, что веревка идет вниз от лезущего. Точки страховки расположены либо вдоль всего маршрута, либо установлены в наиболее подходящих местах. Задача скалолаза ­ лезть все выше и «прощелкивать» страховочную веревку в точки страховки, до которых он доберется, либо «выщелкивать» веревку из точек страховки при спуске. Страхующий при этом постепенно выдает либо выбирает веревку.\n\nВ случае срыва последняя точка страховки находится ниже, чем скалолаз, и высота падения может составлять несколько метров. Такой способ требует большого мастерства от страхующего.\n\nДля нижней страховки возможно использовать только динамическую веревку.\n\n## Гимнастическая страховка:\n\nОсуществляется вторым человеком (страхующим) при помощи рук, в некоторых случаях может потребоваться толчок всем телом. Задача гимнастической страховки - обеспечить безопасное приземление на малой высоте.\n\n## Спортивный мат:\n\nИспользуется в основном для боулдеринга (скалолазание на низких стенках и без веревочной страховки) либо как дополнительное амортизирующее покрытие для иных видов скалолазания.\n\n## Автоматическая страховка:\n\nЭто специально созданное для скалодромов устройство, позволяющее безопасно заниматься высотным скалолазанием без партнера.\n\nПри подъеме к вершине страхующая веревка под собственным натяжением втягивается в устройство. При срыве или отпускании рук происходит плавный равномерный спуск скалолаза на страховочной веревке (спуск происходит с одинаковой комфортной скоростью независимо от веса скалолаза."},{"t":"Нашивка «Реммастер»","cat":"Нашивки","b":"Реммастер - это умелые руки и Самоделкин в одном лице.\nКто, как не он, поможет залатать рюкзак и исправить заевшую «молнию»? Реммастер, кроме стандартного походного ремонтного набора, имеет еще под рукой и личный небольшой ремнабор (нитки, иголки, пару пуговиц разного размера, пару заплаток разного материала, изоленту, ножницы, быстровысыхающий клей). К реммастеру всегда бегут за советом и помощью, и он должен:\n\n## До похода:\n\nСоставить список ремнабора для похода с учетом возможных поломок и порчи имеющегося снаряжения.\nУкомплектовать и упаковать ремнабор.\nПройти инструктаж по ремонту снаряжения.\n## В походе:\n\nПо требованию участников выдавать и собирать необходимые инструменты для ремонта личного.\nСледить за сохранностью ремнабора, не допускать потери инструмента.\nРемонтировать групповое снаряжение.\nПомогать ремонтировать личное снаряжение.\n## После похода:\n\nОбеспечить сохранность ремнабора после похода.\n\nПолезная информация: Рекомендуемый список ремнабора\n\nНапильник (треугольный) и брусок для правки топоров.\nИглы швейные различной толщины.\nНитки различных расцветок (капроновые и хлопчатобумажные).\nВсевозможные шнурки.\nКуски ткани - капрон, брезент, х/б и т.д. для заплат.\nНаперстки - 2 шт.\nСтропы различной ширины.\nЛипучка (полоски шершавой материи).\nПряжки, самосбросы и прочая рюкзачная фурнитура.\nКуски проволоки разной толщины и жесткости.\nПассатижи.\nСупер-клей.\nНожницы (маленькие).\nЗажимы (стопоры) для веревочек (рюкзачные).\nБегунки для молний и сами молнии.\nРезинки (ленточные и жгутовые).\nСкотч, изолента.\nКусочки шкурки разного номера.\nЧехол для ремнабора.\nПри отправлении в водный или альпинистский поход ремнабор составляется с учетом специфики этого похода.\n\nШвы и их виды\n\nШвы нужны, чтобы скрепить части ткани, обработать край или срез изделия. Швы различаются по назначению, виду и длине стежка. Некоторые швы предназначены для тонких эластичных материалов, также существуют множество декоративных швов. Их можно выполнить двумя способами: ручным и машинным. Любой шов состоит из стежков, повторяющихся по всей длине шва. Стежок - это переплетение нити, которую продевают через ткань иголкой.\n\nРис. швов: а) обметочный; б) крытый; в) крестовый; г) стебельчатый\nРис. швов: а) обметочный; б) крытый; в) крестовый; г) стебельчатый\nОбметочный шов нужен для того, чтобы предотвратить распушивание и разрушение края ткани изделия. Крытый шов нужен при зашивании отверстий после наполнения чехлов, крестовый накладывают при сшивании плотных и крепких тканей, а самым прочным является стебельчатый шов.\n\n## Пришивание пуговиц:\n\nВдень в иголку нитку и сделай узелок. Воткни иглу в ткань и вытяни нитку (рис. а).\n\nПовтори то же самое еще раз. Затем надень пуговицу одним отверстием на нитку, а через другое отверстие продень иглу и около нитки проколи материю насквозь. Пришивая пуговицу, не затягивай стежка. Пуговицу следует держать пальцами левой руки так, чтобы между ней и материалом оставалось расстояние примерно 3 мм. Чтобы крепко пришить пуговицу, достаточно сделать по шесть стежков в каждую пару ее отверстий (рис. б). При последнем стежке иголку с кой продевают сверху через отверстие пуговицы, не прокалывая, однако, материала. Иглу с ниткой протяни между пуговицей и материалом и несколько раз обмотай вокруг нитей под пуговицей, образуя таким образом «ножку» (рис. г), после чего закрепи нить под пуговицей (рис. д). Пуговицы можно пришивать параллельными стежками или крестиком (рис. в). Для придания прочности можно применять подкладку, а если изделие из плотной ткани - под пуговицу, которую подкладывается с изнаночной стороны.\n\nПришивание пуговиц\nПришивание пуговиц\n## Прямой разрыв ткани:\n\nНа рисунке а) изображён разрыв ткани, под бук­вой б) показано, как надо подогнуть края материи, чтобы они не осыпались при пришивании и не разошлись потом из-под шва. Подгибаем на изнаночную сторону, положив ткань лицевой стороной на стол. В этом положении смё­тываем края швом «вперёд иголку» (в). Затем подстрижем все торчащие из ткани кончики ниток, и нач­нём шить основным швом «строчка». Затем медленно, частыми мелкими стежками швом «через край» (г), мы идём вдоль прорыва от одного конца до другого (и даже немного дальше). Закрепляем нитку на конце несколь­кими колками на одном месте и отрезаем ножницами. Теперь можем выдернуть первоначальную, стягивающую нитку, а если она скрылась под новым швом, те можно и оставить. Прогладим шов горячим утюгом, чтобы мате­рия не отдувалась и не морщилась. Гладить надо с из­нанки.\n\nПрямой разрыв ткани\nПрямой разрыв ткани\n## Сложный разрыв ткани:\n\nКладём свою вещь на стол так, чтобы всё место разрыва было на твёрдой ровной поверхности. Разглаживаем порвавшиеся концы и, если в таком положении они не держатся, слегка стягиваем их один к другому несколькими стежками, стараясь не порвать и не увеличить отверстие. Затем намётываем и шьём, начиная с более коротких линий разрыва, оставляя самый длинный на самый конец работы. Каждое место разрыва надо начинать шить немного дальше, на крепком месте. Лучше всего применять шов «строчка» (б). После того как закрепили всё отверстие, подрезаем «усики» и начинаем окончательное зашивание швом «через край» сначала самых коротких линий, потом длинных, заканчивая каждый шов несколько дальше того места, где начался разрыв, постепенно сводя стежки на нет путём их укорочения. Намёточную нитку выдёргиваем и заглаживаем шов горячим утюгом. Окончательный результат видим на рисунках: в) - на изнанке, г) - на лицевой стороне.\n\nСложный разрыв ткани\nСложный разрыв ткани\n## Ставим заплаты:\n\nРазрыв может иметь разные формы (рис. а). Надо уметь подрезать его края так, чтобы было по возможности небольшое отверстие, но в то же время с проч­ными, надёжными для зашивания краями (б). Эти края надо обшить. Подбери форму в соответствии с рисунком ткани, чтобы будущий шов проходил незамет­но, скрытым в линиях рисунка. Вырезать нужно не только сам прорыв, но и ненадёжные (подорванные или протёртые) места. Затем нужно подобрать форму заплаты и наложить её на место прорыва с левой стороны («левой» называют изнаночную сторону). Рису­нок заплаты должен подходить к рисунку ткани (в).\n\nСтавим заплаты\nСтавим заплаты\n## Советы умелым рукам:\n\nПорвалась ткань и образовалась дырка - аккуратно поставь заплатку.\n\nОторвалась оттяжка от кострового тента - в уголок от тента вложи маленькую шишку и вокруг нее закрепи новую оттяжку.\n\nПрожгли костровой тент - поставь заплатку из соответствующего материала (брезент).\n\nСломалась пластмассовая дуга от палатки - скрепи «остатки» дуги с металлическим прутом или палкой (временно), замени новой дугой.\n\nРасходится молния, и «собачка» не работает - слегка подожми края «собачки» плоскогубцами.\n\nА вообще следи, реммастер, чтобы со снаряжением обращались аккуратно, - меньше чинить придется!"},{"t":"Нашивка «Костровой»","cat":"Нашивки","b":"## До похода:\n\nПодготовить материалы для розжига костра (спички, сухое горючее) и упаковать их для походных условий. Особенно внимательно отнесись к запасу растопки для похода зимой или в дождливую погоду.\n## В походе:\n\nПодготовить место для костра, соблюдая правила безопасности.\nЗнать не менее пяти типов костров и их использование.\nУметь разжигать костер в условиях зимнего, летнего похода, в дождливый день.\nПодготовить и поддерживать костер для повара.\nУметь грамотно тушить костер.\nУметь тушить пожар песком и знать, когда применяется этот способ.\nУбрать костровище после снятия группы со стоянки.\n## Полезная информация для теоретической части:\n## Виды костров (по их назначению):\n\n· для приготовления пищи\n· для обогрева\n· для сушки вещей\n· сигнальные (дымовые)\n\nРазжигание костра\n\nРастопка. Разжигание костра начинается с заготовки растопки, которую делают из мелких еловых веточек, бересты (снятой, конечно, не с живой березы), сухого мха, лишайника, стружек, лучин. Подготовленную растопку-запал укладывают под сложенный шалашиком или колодцем мелким хворостом и поджигают, а сверху аккуратно накладывают более толстые дрова.\n\nРазжигание костра без спичек. При утере спичек (или если они отсырели и не могут быть подсушены) огонь для костра добывается более сложным путем. В солнечную погоду для этого используется лупа (линзы объектива фотоаппарата и даже стекла от часов или очков). Можно попробовать с помощью кремня (подбирается из окружающих камней) высечь искры на трут или добыть огонь, быстро раскатывая ватный жгут между двумя сухими дощечками. Однако эти способы весьма трудоемки и без практики редко дают нужные результаты.\n\nДрова для костра. Вблизи населенных пунктов в качестве топлива могут использоваться дрова, не пригодные для хозяйственных нужд населения, например, мелкий валежник, сухое криволесье, старые пни, хвойный опад.\n\nВ таежных районах обычно всегда достаточно хвороста, валежника, сухостоя. При заготовке топлива следует, однако, иметь в виду, что сырые и гнилые дрова дают много дыма, но мало тепла; мелкий хворост прогорает в первые две-три минуты; осиновые и пихтовые дрова плохи тем, что слишком сильно «стреляют» искрами.\n\nДля приготовления пищи лучше использовать валежник березы и ольхи, который горит ровно и почти без дыма. Если надо развести большой жаркий костер, например, зимой при вынужденном ночлеге, то наилучшими будут дрова из соснового, кедрового и елового сухостоя.\n\nВалка сухостоя. Заготавливая для костра сухостой, сначала определяют естественный наклон дерева и место его возможного падения. Затем просматривают вероятный путь падающего дерева, чтобы убедиться, что оно не зависнет на соседних кронах. И только после этого делают подруб на треть диаметра ствола с той стороны, куда намечено валить дерево\n\nВторой подруб делают с противоположной стороны примерно на ладонь выше первого. Подрубая дерево, надо чередовать нанесение ударов под острым углом с прямыми ударами, которыми «выбирают» древесину. Если дерево не падает под действием собственного веса, то используют деревянный клин или рычаг - вагу, которым направляют его падение на свободную площадку (можно использовать веревку). При этом необходимо соблюдать меры предосторожности. Людей не должно быть не только на месте предполагаемого падения, но и сзади дерева, так как оно может отскочить назад комлем.\n\nЕсли дерево толстое, то для его валки следует использовать двуручную пилу. Определить, имеет ли турист дело с живым или засохшим на корню деревом, можно по его вершине (но не по коре или нижним ветвям). Если вершина сухая, значит, и все дерево сухое. Помните, что в зимний период ВСЕ лиственные деревья сбрасывают листву, и лучше валить сосну.\n\nВиды костров (по их форме)\n\n«Шалаш»: дрова укладываются в виде шалаша. Внизу между поленьями помещается растопка. Дает большое и ровное пламя. Предназначен для варки пищи в одной посуде (позволяет сконцентрировать пламя под котлом), просушивания одежды и освещения бивака. Образует мало углей. Требует много дров.\n\n«Нодья»: два сухостойных еловых бревна толщиной 30-40 см и длиной 1.5-3 м кладут параллельно друг другу на землю и по всей длине между ними разводят костер. По мере разгорания бревен их сдвигают вплотную, закрепляют распорками и сверху кладут третье бревно. Очень надежный и жаркий костер длительного действия, применяемый для обогрева при ночлеге (бревна не нужно поправлять в течении ночи), создания атмосферы ночных посиделок, сушки вещей. Также можно готовить пищу для большой группы людей, используя только два нижних бревна\n\n«Колодец»: дрова укладываются в виде сруба, внутреннее пространство заполнено мелкими дровами по типу «шалаша» или «кучи-малы». Складывается из коротких поленьев средней толщины. Дает очень высокое мощное пламя. Удобен для приготовления пищи, обогрева и сушки одежды. Сгорает довольно быстро, образуя много горячих углей. Для большого праздничного костра берутся большие бревна.\n\n«Звезда»: несколько бревен кладется на землю в виде звезды, зажигается в центре. По мере того, как бревна сгорают, их подвигают внутрь. Костер длительного действия, вокруг него можно располагаться на ночлег. При небольшом размере костра, дающем жаркое узкое пламя, на нем можно готовить пищу в одной посуде.\n\n«Полинезийский» («Ямка»): для такого костра вырывают ямку, обкладывают стенки поленьями (или камнями), а на дне разводят огонь. Горит очень долго за счет того, что в углублении не хватает воздуха, и горение постепенно переходит в тление, дает много углей и золы. Используется при нехватки дров. Не заметен.\n\n«Охотничий»: из трех бревен на подкладке; горит 6-8 часов без особого ухода (требуется лишь периодически продвигать вперед и сближать горящие концы бревен). Пригоден для односторонних заслонов.\n\n«Таежный»: костер длительного действия. Дает большое жаркое пламя и много углей. Используется для варки пищи в нескольких посудах, просушки одежды и ночлега. Бывает трех типов («крест-накрест», «на полено», «помост»), но во всех используется один и тот же принцип - усиление горения в узкой щели между поленьями.\n\na) «Крест-накрест»: на груду углей нужно положить рядом три полена, на них сверху - еще два или три под углом к первому ряду. Место пересечения рядов поленьев должно находиться над углями.\n\nб) «На полено»: на одно толстое бревно с подветренной стороны кладется одним концом несколько поленьев потоньше так, чтобы угли оказались под ними.\n\nв) «Помост»: угли нужно разровнять на небольшой площадке и сверху положить несколько ровных поленьев близко друг к другу, оставив между ними небольшие щели. Поленья в этом случае будут гореть по всей длине, наиболее сильно - в местах соприкосновения.\n\nКостер с отражателем - хорошо использовать для обогрева ночью, за счет отражающего тепла. Эффективно использовать для обогрева односкатного шалаша.\nДымовые костры служат для сигнализации и для защиты от гнуса и комаров. На обычный костер поверх топлива накладываются хвойные смолистые ветви или зеленая трава.\n\n«Деревянный примус» или, как его еще называют, «Таежная свеча»: необходимо взять толстое сухое бревно и спилить из него невысокий (20-40 сантиметров) цилиндр. Смолистые породы деревьев для этих целей лучше не выбирать - они будут давать слишком много искр и «стрелять» расплавленной смолой. Бревно нужно аккуратно расколоть топором вдоль посередине и вырубить сердцевину для образования небольшого канала диаметров 5-7 сантиметров. На выходе должно получиться что-то вроде толстой деревянной трубы. Теперь обе половинки нужно плотно скрепить друг с другом, обмотав проволокой или прибив гвоздями, иначе свеча быстро прогорит по щелям. Забиваем примус бумагой или берестой, устанавливаем таким образом, чтобы с нижнего конца в него поступал воздух.\n\nТаежная свеча\nТаежная свеча\nПоджигаем и получаем полноценную конфорку из натурального материала. Преимуществ по сравнению с костром у такого очага несколько. Во-первых, не нужно никаких дополнительных приспособлений для того, чтобы закрепить на нем сковородку или котелок - поверхность примуса и так плоская. Во-вторых, он не занимает много места и не требует постоянной поддержки огня. При этом он способен гореть и давать внушительный жар в течение долгого времени. В-третьих, его можно легко держать в руке и при желании готовить пищу хоть на ходу, хотя такое вряд ли кому-то придет в голову. Наконец, затушив свечу за ненадобностью, ее со временем можно будет использовать повторно.\n\nКостер в зимнем путешествии\nКостер в зимнем путешествии\nКостер в зимнем путешествии. При неглубоком снежном покрове костер разводят в специально выкопанной снежной яме. Рытье такого котлована довольно трудоемко и производится двумя-тремя туристами с помощью дюралевых лопат, ведер, котелков, кусков фанеры. Перекладину для костра устанавливают на треногах из лыжных палок или опирают на края ямы, предварительно подложив на снег лыжные палки.\n\nНа глубоком снегу и при наличии бросовых сырых или гнилых бревен лучше не рыть костровую яму, а разводить огонь на специальном помосте. Помост укладывается из нескольких сырых бревен, под которые для большей устойчивости следует положить еще две поперечные валежины.\n\nНаиболее быстро развести костер зимой можно на металлической сетке, которую натягивают между деревьями. Эта сетка с размером ячеек 3-4 мм (толщина проволоки - 0,5 мм) используется также при организации ночлега у костра для защиты спящих от искр «стреляющих» дров. Сетка сворачивается в рулон и переносится в боковом кармане рюкзака.\n\n## Разведение костра в экстремальных условиях:\n\nДостать сухие дрова в мокром лесу можно под раскидистыми еловыми и сосновыми ветками, во внутренней части сухостоя. Кроме того, костровой всегда должен иметь с собой растопку, защищенную от воды. Можно использовать искусственные материалы: горючую фотопленку, оргстекло, бумагу, сухой спирт, свечки-таблетки. Свечной огарок нужно установить на земле, и над ним соорудить шалашик из тонко нащепленной лучины или тонких еловых веточек.\nНеобходимо укладывать веточки так, чтобы они создавали укрытие от дождя для растопки, а более толстые ветки должны прикрывать собой мелкие. Мелкие веточки разгорятся и подсушат более толстые дрова.\nЧтобы более толстые веточки лучше загорались, на них можно настрогать стружку таким образом, чтобы она оставалась на ветке, а не отделялась от нее («Буратино»).\nПоленья необходимо располагать так, чтобы к дождю они были обращены корой и по ним скатывалась вода, не проникая к огню. Используйте такие конструкции, при которых поленья располагаются близко друг к другу и образуют нечто вроде крыши, под которой укрываются угли, - «шалаш», «нодья», «таежный».\nКостры типа «колодец» и «звезда» для разведения под дождем совершенно не годятся, поскольку огонь ничем не прикрыт и быстро заливается водой.\nПо возможности над костром для защиты от дождя нужно натянуть тент. Вокруг горящего костра разложить сырые дрова для просушки.\n## Техника безопасности у костра:\n\nЛучше всего разводить костер на уже использовавшемся кем-то до вас костровище, чтобы лишний раз не повреждать почву.\nКостер должен находиться от деревьев на расстоянии не меньше 4 метров. Место кострища очистить от мусора.\nНельзя разводить костры на торфяниках, на камнях, на корнях деревьев, среди хвойных молодняков, на старых горельниках, в буреломах или на участках ветровального леса, на лесосеках с оставленными порубочными материалами и заготовленной древесиной, в местах с сухой травой, а также под кронами деревьев.\nПо площади костра должен быть снят слой дерна. Ширина полосы должна быть не менее полуметра. Снятый дерн уложить в безопасном месте и поливать все время пребывания на стоянке. Во время ухода со стоянки дерн надо уложить на прежнее место.\nКострище необходимо окопать или обложить камнями.\nКостровой трос натягивается между двух деревьев, если такие есть неподалеку от костра, выше человеческого роста, а котел опускают над пламенем с помощью металлических крюков. К деревьям костровое крепится веревками, а не самим тросом, т.к. тот повреждает кору дерева. Лазить под тросиком нельзя. Иногда используются рогатины, если земля позволяет их крепко установить. Рогатины необходимо регулярно поливать водой, чтобы они не загорелись.\nВо время приготовления пищи возле костра находится ТОЛЬКО дежурный патруль.\nДежурный, готовящий пищу на костре, должен быть одет в рабочую одежду, не синтетику, т.к. при попадании на неё искр одежда расплавляется и налипает на кожу. Волосы должны быть убраны. Ни в коем случае нельзя находиться у костра в шортах, шлепанцах, босиком или в резиновых сапогах.\nКостровые рукавицы всегда должны быть под рукой. Если рукавицы мокрые, то пользоваться ими нельзя - можно обжечься паром.\nДужки котлов должны быть укреплены и заделаны, а крышки, которые, кстати, ускоряют закипание котла, должны легко одеваться на котлы.\nПри закипании вода может выплескиваться через край. В этом случае нельзя суетиться и пытаться снять котел с огня - вычерпайте немного воды поварешкой и подрегулируйте пламя сдвиганием дров.\nГотовая пища ставится в недоступное для всех, кроме дежурных, место, чтобы случайно никто не уронил, не обжегся и не лишил отряд еды.\nОбувь, одежду и снаряжение нельзя оставлять сушиться у костра без присмотра. Одежду и спальники можно сушить у костра на безопасном расстоянии от него.\nПоленница должна быть всегда укрыта от дождя (даже если светит солнце) и находиться вне досягаемости костра. В ней всегда должен быть запас дров.\nТушат костер песком или водой. Горящий костер ни в коем случае нельзя оставлять без присмотра, особенно в сухую погоду.\nДрова для разведения утреннего костра приготавливаются с вечера."},{"t":"Нашивка «Мастер театра»","cat":"Нашивки","b":"У костра и на спектакле, на поэтическом вечере и общедружинной игре заводилами всегда будут те, кто стремится к получению этой нашивки. Артистические навыки пригодятся вам всегда, не только в лагере!\n\n## Мастер театра должен:\n\nЗнать краткую историю театра, устройство античного и современного театров.\nЗнать жанры театра и эстрады.\nИметь представление о сценарии, частях спектакля.\nВыразительно читать стихи и отрывки прозы.\nВладеть основами актерского мастерства, уметь гримироваться, подобрать и изготовить костюм.\nПоставить с отрядом не менее 2-х точек.\nПровести костер.\n## Полезная информация:\n\nТеатр - это настоящий праздник! А еще он соединяет разные искусства: музыку, архитектуру, живопись, кинематограф, фотографию и т. д. Театр очень сильно влияет на человека, ведь зритель через катарсис (очищение с помощью страдания) меняется к лучшему. Театр бывает очень разным. Есть такие виды театрального искусства: балет, детский, драматический, кукольный, мюзикл, оперетта, оперный, пантомима, театр зверей, театр одного актёра, театр пантомимы, театр пародии, театр песни, театр поэзии, театр танца, театр теней, театр эстрады, уличный театр и др. Театр может быть классическим и современным. Может быть авторским, ансамблевым или режиссерским (смотря кто имеет большее значение). Театр может быть пластическим и притчевым, театром восточным и европейским - и так до бесконечности! В театре, кроме артистов и режиссеров, работает много людей. Это драматург, помощник режиссера, художник, костюмер, гример, реквизитор, бутафор, осветитель, звукооператор и др.\n\nСуществует немало театральных жанров: буффонада, водевиль, драма, комедия, мелодрама, монодрама, мюзикл, опера, пастораль, трагедия, трагикомедия, феерия и др. Есть и эстрадные жанры: разговорные (интермедия, декламация, конферанс, монолог, пародия, скетч, сценка, фельетон) и музыкально-разговорные (куплет, литературный монтаж, сатирический дуэт, частушка, шансонетка).\n\nВ основе театрального действа всегда лежит конфликт - принципиальная движущая сила театрального произведения. Любой спектакль, прежде чем блистательно (или провально) пройти, попадает на сцену только после нескольких обязательных этапов:\n\n· Выбор литературной основы спектакля.\n\n· Распределение ролей.\n\n· Утверждение графика работы над спектаклем.\n\n· Репетиционный процесс (разучивание артистами текста, танцев, песен и пр., изучение исторического контекста); одновременно изготовление материальной части (костюмов, реквизита, декораций и пр.); одновременно организация проката спектакля (график представлений в самом театре и на гастролях, распространение билетов, рекламная компания).\n\n· Генеральная репетиция, показ спектакля, анализ спектакля.\n\nВ любом спектакле есть действия (или акты). Акты делятся на картины (или сцены). Между актами объявляются антракты (перерывы). В начале спектакля может быть пролог (в опере или балете - увертюра). Краткое содержание музыкального спектакля называется либретто. После третьего звонка входить в зал нельзя, ты будешь мешать актерам. Есть два признака, по которым в зрителе сразу узнается настоящий театрал: как ты проходишь между рядами и когда ты уходишь домой. Проходи к своему креслу лицом к сидящим, а после спектакля не торопись в гардероб, а похлопай артистам.\n\nКраткая история театра\n\nАнтичный театр возник из культовых обрядов древности (охота, земледелие, заупокойный плач). В честь бога виноделия Диониса виноградари в козлиных шкурах славили виноградную лозу. Мистерии (празднества) длились несколько дней, были нерабочими, все население было обязано веселиться. От певцов в шкурах, изображающих спутников Диониса - сатиров, и пошел первый театральный жанр - трагедия (трагос - по-гречески «козел»). Но на праздниках были не только козлиные песни, но и радость. Вот и второй жанр - комедия («комос» - необузданное веселье). Трагедии и комедии сочинялись чаще всего на мифологические или исторические сюжеты. Создатель греческой трагедии Эсхил сочинил около 90 пьес, сохранилось шесть (наиболее известная трагедия - «Прикованный Прометей»). Софокл преобразовал театр, увеличил число актеров (до трех человек) и хористов, ввел расписные декорации. Из семи его сохранившихся трагедий одна из самых сильных - «Антигона». Эврипид создал около 90 драм; его новшества - глубокая разработка женских ролей и сочинение музыки для своих пьес. «Облака» отца древнегреческой комедии Аристофана (насмешки над Сократом) или «Лягушки» (подтрунивание над Эврипидом) читать смешно до сих пор!\n\nВ Древней Греции театры были открытыми, строились амфитеатром. Зрители сидели на каменных скамьях (театронах), артисты выступали на круглой или квадратной площадке (орхестре, где посередине стоял алтарь Диониса). За орхестрой находилась скена - небольшое здание для переодевания артистов и хранения реквизита. Отсюда и пошло слово «сцена». Одна из сторон скены со стороны зрителей служила декорацией. То, что происходило за скеной, показывалось с помощью особой машины. Сначала чествовали почетных посетителей спектакля, потом приносили жертву Дионису, затем звучали флейты и выходил хор. Представление начиналось (в античности всегда в стихах!). Сюжет пьесы показывал только один день. Все роли играли мужчины. Главным действующим лицом был хор (12 человек). Актёры (изначально их на сцене было всего двое) выступали в огромных ярко раскрашенных масках и на котурнах (сандалиях с толстой подошвой). Маски были нужны, чтобы зрители даже издалека видели выражение лица, а широко раскрытый рот маски усиливал голос актера. Женщины (исключая гетер) не везде допускались на представления, особенно на комедию, и сидели, как правило, отдельно от мужчин. В Греции профессия актера считалась престижной, а в Риме - позорной (играли рабы и вольноотпущенники).\n\nСредневековый западноевропейский театр развивался десять столетий, с V по XV век. В начале средневековья театральные представления считались ересью и преследовались инквизицией. Драматические традиции сохранялись лишь в народных ритуальных играх и карнавалах (в православных странах масленице). Постепенно на этих праздниках родилась первая ветвь театрального искусства средневековья - народный театр. С IX века развивается вторая ветвь средневекового театра - церковная. Между церковными и народными театральными традициями находились ваганты - странствующие комедианты из числа бывших священнослужителей и семинаристов. Их жестоко преследовала церковь, и к XIII веку они исчезли. С XIV века на улицах Европы забурлили мистерии - зрелищная часть праздников и ярмарок (расцвет во Франции). Мистерии организовывались городскими властями и цехами ремесленников; авторами становились ученые, юристы, врачи. Во время мистерий ремесленники соревновались, какой цех лучше покажет свои таланты. Для этого нанимались специалисты по пошиву костюмов; были даже «руководители игры» (современные режиссеры). Постоянные участники мистерий объединялись в Братства, но к XVI веку мистерии были запрещены как «бесовские игрища».\n\nТеатра эпохи Возрождения (Ренессанса) ориентировался на забытое уже античное искусство, а также идеи гармоничной и свободной личности. В эпоху Возрождения сформировались два типа театров: репертуарный (с постоянным составом артистов и медленно сменяемым репертуаром) и антрепризный, где играли приглашенные лица. В Италии возродились комедия, трагедия, пастораль, были созданы опера и балет. Большой вклад с середины XVI века внесла итальянская Комедия дель арте, импровизированный уличный театр масок (Пульчинелла, Коломбина и др.) - первый в мире профессиональный театр. Английский театр начинался со студенческих спектаклей Оксфорда и Кембриджа; расцвет пришелся на эпоху драматургии Шекспира. Лондонский театр «Глобус» перенес акценты на игру актеров, поднял проблемы взаимоотношения личности и общества.\n\nНа театральное искусство Нового времени оказали серьезное влияние войны, революции, технический прогресс. Французская классическая сцена выросла на основе классицизма. Жан Расин описывал в пьесах светское общество Франции. Жан Батист Мольер высмеивал социальные и бытовые проблемы («Мещанин во дворянстве», «Тартюф»). Пьер Корнель разработал теорию драмы, сформулировал суть конфликта как двигателя любой пьесы: столкновение чувства и долга, страсти и разума. Итальянец Карло Гоцци впервые вывел на сцену сказку («Любовь к трем апельсинам»). Популярны становятся французские «слезные комедии», английские «мещанские трагедии». Английские театры заполнила невиданная раньше простонародная публика.\n\nПостепенно театр стал все больше ориентироваться на вкусы толпы, обслуживать буржуазную публику. Режиссерский театр и возник на рубеже XIX-XX веков как форма протеста против бульварного театра. Другой театр - эпический - создал немецкий драматург Бертольд Брехт. Эпический театр не погружал зрителя в другую эпоху, а давал отчет о событии, специально отстраняясь от привычных оценок и образов.\n\nТеатр России\n\nОбрядовые формы (опахивание деревни, праздники пробуждения медведя, жертвоприношения богу солнца Яриле и др.) привели к возникновению фольклорного русского театра. Этот театр был представлен в разных формах - кукольный /с Петрушкой/, балаган /с медвежьей потехой/, странствующие гусляры с акробатами. Первыми русскими профессиональными актерами были скоморохи, упоминания о которых встречаются с XI века. Скоморохи участвовали в городских и сельских праздниках, потешали бояр и царей, но с XVI века стали преследоваться церковью. В XVII-XVIII веке при духовных коллегиях и академиях развивается школьный театр. Ученики выходили «с репетициями» из стен академий и выступали перед светским зрителем. Спектакли были посвящены религиозным темам.\n\nВ XVII веке при царе Алексее Михайловиче появляется придворный театр. Спектакли на библейские и исторические темы шли до 10 часов, а зрители после «позорища» (зрелища) шли в баню смывать грех. Одним из первых русских драматургов был богослов и ученый Симеон Полоцкий. Петр I приказывает построить на Красной площади в Москве «комедиальную храмину», доступную для всех, но общедоступный театр так и не был еще создан. При Анне Иоановне чаще стали играть придворные спектакли, маскарады и театрализованные шествия (свадьба шутов в Ледяном доме). При Елизавете Петровне при дворе гастролировали иноземные труппы, появляются учебные театры в Сухопутном Шляхетном корпусе и Московском университете. В 1756 г. в Петербурге был открыт первый русский постоянный публичный театр, основой для которого послужила труппа из Ярославля во главе с первым профессиональным русским актером Федором Волковым. Директором театра стал драматург Александр Сумароков. С конца XVIII века распространяются крепостные театры, откуда вышло много известных актеров (Прасковья Жемчугова, Екатерина Семенова, Михаил Щепкин и др.).\n\nВ начале XIX века начинается разделение театров на оперно-балетный и драматический, складывается сеть Императорских театров (три в Петербурге, два в Москве). Николай I был страстным театралом, внимательно следил за постановками, лично цензуровал либретто и награждал авторов понравившихся пьес. Национальный репертуар был связан с именами Н.В. Гоголя («Ревизор», «Женитьба»), А.С. Грибоедова («Горе от ума»), А.С. Пушкина («Борис Годунов»), М.Ю. Лермонтова («Маскарад»). М.И. Глинкой создается русская национальная опера («Жизнь за царя», «Руслан и Людмила»). Лучшими из десяти опер П.И. Чайковского считаются «Евгений Онегин» и «Пиковая дама», а из трех балетов невозможно выбрать лишь один.\n\nС творчества А.Н. Островского начинается современный русский театр, изображающий жизнь обычных людей («Свои люди - сочтемся», «Лес», «Не все коту масленица» и пр.). Идеи Островского (мастерство речевых характеристик героев, ставка на актерский ансамбль, отрешенность актера от своей личности) продолжила школа К.С. Станиславского. Расцвет отечественного театра продолжается во второй половине XIX века; в центре всего стоит актер, на сцене торжествует реализм, богатый репертуар позволяет выбрать лучшие произведения. Государственная монополия на театры (запрет на частные драматические театры в Москве и Петербурге) была отменена в 1882 году, и количество театров мгновенно увеличивается в несколько раз. Драматургия А.П. Чехова, Л.Н. Толстого, М. Горького открывает новую эру отечественной сцены. Константин Станиславский вместе с Владимиром Немировичем-Данченко создали режиссерский Московский Художественно-общедоступный театр (1898 год). До Станиславского замысел и ход спектакля определял исполнитель главной роли. По системе Станиславского главным действующим лицом становился режиссер, а актер должен был учиться искусству сопереживания, по-настоящему вживаться в образ. На рубеже XIX-ХХ веков создается условный театр В.Э. Мейерхольда (акцент на зрительскую фантазию, отказ от жизнеподобия, приоритет костюма, грима, декораций, а не сценического слова. Развиваются малые формы - кабаре («Бродячая собака»).\n\nПосле революции 1917 г. открываются новые театры (например, театры юного зрителя), проводятся агитационные мистерии, спектакли-митинги и пр. Театры разделились на традиционные и экспериментальные, но довольно быстро новшества были признаны опасными и прекратились. Во время войны на фронт выезжали театральные бригады с концертами и спектаклями. Послевоенный и современный театр связан с расцветом режиссуры (А.В. Эфрос, Г.А. Товстоногов, Ю.П. Любимов, Л.А. Додин и др.). Современный театр всегда ищет новые формы; его истоки относятся к экспериментами Всеволода Мейерхольда 1920-х годов. Современному театру свойственны «осовременивание классики», perfomance и яркие шоу, нестандартность мест проведения спектаклей, смесь жанров в одной постановке, ведущая роль режиссера (а не актера), появление именно своего зрителя для каждой труппы, коммерциализация и гротескность постановок.\n\nПеред спектаклем или костром\n\nТы сейчас не просто хороший парень или красивая девочка из отличного отряда, ты - актер, играющий определенную роль. И, значит, надо вжиться в роль, войти в образ. Если самостоятельно это сделать сложновато, настройся накануне. Послушай тематические песни, перечитай пару историй. Профессиональные артисты применяют «заводящие» жесты, характерные именно для этого образа. Дело в том, что любой жест выводит нас из того состояния, в котором мы сейчас находимся, и актеры заранее придумывают для своих ролей эти движения. Попробуй:\n\n· Распрями плечи. Руки тяни к небу. Голова приподнята, на лице улыбка. Постой так несколько секунд…\n\n· Или потри ладошками друг о друга (вот-вот будет что-то очень радостное!)\n\n· Или кулаком правой руки ударь по левой.\n\nПридумай для себя десяток таких жестов, которые резко изменят твое состояние перед выходом на сцену. А теперь посмотри, не пора ли на выход?\n\nПеред выступлением волнуются все. Все! Даже опытные артисты. Но публика не должна этого заметить. Есть несколько способов быстрого расслабления: глубокий вдох, задержка дыхания на две секунды, резкий выдох, и так несколько раз. Только осторожно, может закружиться голова. Или представь, что в зале сидит один человек, и ты будешь все показывать лишь ему. Или присядь несколько раз, помаши руками. Все это поможет тебе успокоиться. Готов? Начали!\n\nРабота с залом\n\nАктер должен выступать на авансцене, лицом к залу, не скрещивая рук и ног (если только это не предусмотрено ролью). Говорить надо громко, четко, выше уровня голов сидящих, с улыбкой смотреть на зрителя. Паузы между словами должны быть немножко больше, чем в обычной речи (так будет лучше слышно). Если в зале возник шум (например, смех после какой-то реплики со сцены), замри и пережди шум, сделав вид, будто ничего не произошло. Запомни еще несколько советов:\n\n· Перед выступлением необходима генеральная репетиция в костюмах и с реквизитом.\n\n· Мебель по сцене нужно только носить (не таскать).\n\n· За закрытым занавесом и кулисами нельзя разговаривать.\n\n· Важно заранее определить все перемещения актеров по сцене, в том числе их выход на сцену и уход.\n\n· В выступлениях не надо использовать таблички.\n\n· В полном зале звук тише, чем в пустом.\n\nА теперь представим, что тебе надо провести костер. Что для этого нужно?\n\n· Придумать тему костра и согласовать ее с вожатым, начальником дружины и принимающим на нашивку.\n\n· Выбрать и согласовать дату/место проведения костра.\n\n· Сообщить тему и место проведения все отрядам дружины.\n\n· Составить порядок выступлений отрядов, продумать, чем будут наполнены промежутки между выступлениями.\n\n· Придумать новые игры с залом или выбрать наиболее подходящие из существующих.\n\n· Выбрать песни, договориться с гитаристами об их исполнении.\n\n· Придумать вызывалки и благодарилки для каждого отряда.\n\n· Заблаговременно предупредить инструктора и кострового о необходимости разжечь костер к установленному времени.\n\n· Продумать свой образ (при необходимости придумать предысторию и вводное слово).\n\n· Участвовать в организации рассаживания отрядов на места в зрительном зале или вокруг костра.\n\n· Выступить с вводным словом, перечислить правила костра и обсудить тему костра со зрителями.\n\n· Провести костер в соответствии с продуманным планом.\n\nИгры с залом должны иметь четкий ритм, повторяемость движений и слов, убыстряющийся темп. Если игры легки для запоминания, если ты вовлек в игру всех, а не только первый ряд, - успех как ведущему тебе обеспечен. Кричалки и игры с залом не требуют от играющих длительной и большой подготовки. Даже если необходимо разучивать слова, то все это делается по ходу, уже само разучивание слов и есть игра. Если для играющих подготовки не надо, то вот ведущему необходимо готовиться тщательно. Ведь ты устраиваешь целое представление, театр одного актера. Ты стоишь перед полным залом, а сидящие в нем по взмаху твоей руки выполняют различные действия. Ты одновременно и актер, и дирижер, и конферансье, и статист, ты - ведущий игры. Будь веселым, жизнерадостным, ироничным, добрым. Играй сам, и тогда зал тоже будет играть вместе с тобой.\n\n· Будь внимателен к своему внешнему виду, ты же на виду у всех.\n\n· Выходя играть, всегда имей больший запас игр, чем нужно.\n\n· Будь внимателен к тем словам, которые используешь при общении с залом.\n\n· Шути в меру. Помни о том, что шутка иногда может и обидеть человека.\n\n· Всегда начинай с приветствия. А если ты играешь в первый раз, то неплохо бы и представиться.\n\n· Объясняя правила игры, пользуйся понятными словами. Не бойся повториться, но и не переусердствуй.\n\n· Используя при объяснении правил жестикуляцию, не маши слишком сильно руками. Это плохо смотрится со стороны.\n\n· Частенько приходится работать с микрофоном. Заранее попробуй, как звучит твой голос, как лучше держать микрофон, чтобы слова получались четкими, без всяких лишних звуков. И помни, что микрофон для того и служит, чтобы ты не кричал.\n\n· Если зрители шумят, не надо успокаивать нарушителей дисциплины как вожатый; делай это в образе. Например, если играешь царя, пригрози казнить или удалить из светлицы (из зала). Не отзывайся на свое имя, показывай удивление, когда к тебе обращаются по имени.\n\n· Если в подобранных играх ребятам предстоит выходить на сцену, то продумай, как это сделать лучше.\n\n· Не забывай говорить спасибо, да и просто хвалить играющих. А еще лучше, если ребята сделают это сами:\n\n· Заканчивая играть, особенно если потом будет происходить следующее действие, или играть продолжит кто-то другой, не забудь попрощаться и передать слово, представив следующего за тобой человека.\n\nЕсли вдруг ты уронил эту распечатку, быстро подними и сядь на нее - так поступают все артисты. Ни пуха, ни пера тебе на сцене!\n\nЧто прочитать дополнительно о театре?\n\nБазанов В. Техника и технология сцены. М.,1976.\n\nВсеобщая история театра / ред. М. Терешина. М., 2012.\n\nГиппиус С.В. Актерский тренинг: гимнастика чувств. СПб., 2007.\n\nГребенкин А.В. Сценическое движение: пособие для руководителей театральных студий и шк. искусств. М., 2003.\n\nГринер В.А. Ритм в искусстве актера. М., 1992.\n\nИстория русского театра / ред. В. Людвинская. М., 2011.\n\nКарпов Н.В. Уроки сценического движения. М., 1999.\n\nКипнис М. Актерский тренинг. М., 2009.\n\nКозлянинова И.П. Произношение и дикция. М., 1997.\n\nКолчеев Ю.В., Колчеева Н.М. Театрализованные игры в школе. М., 2000.\n\nЛеонов А.А. Развитие речи учащихся. М., 2009.\n\nМетодика выразительного чтения / под общей ред. Т.В. Завадской. М., 1985.\n\nОсновы актерского мастерства по методике З.Я. Корогодского. М., 2008.\n\nТюханова Е.Л. Театр и дети. М., 2007.\n\nЧеботаревская Т.А. Путешествие по театральной программе. М., 1975.\n\nЧто такое театр. Книга для детей и их родителей. М., 1997.\n\nЯ познаю мир: Театр: Дет. энцикл./ И.А.Андриянова-Голицина. М., 2002.\n\n## Электронные источники:\n\nТеатральное искусство. Энциклопедия «Кругосвет» // http://www.krugosvet.ru/enc/kultura_i_obrazovanie/teatr_i_kino/TEATR.html\n\nЭнциклопедический словарь юного зрителя // http://padaread.com/?book=31074&pg=4"},{"t":"Нашивка «Завхоз»","cat":"Нашивки","b":"Сокращенное наименование нашивки «Завхоз» расшифровывается как заведующий хозяйственной частью.\n\nЭто человек, без которого не обходится ни один поход. Прежде всего завхоз обеспечивает ребят из отряда необходимыми предметами походного обихода, следит за сохранностью снаряжения и его починкой совместно с рем. мастером.\n\nОсновные обязанности завхоза\n## До похода:\n1. Составить список группового снаряжения с учетом особенностей маршрута.\n2. Получить снаряжение и проверить его.\n3. Организовать ремонт снаряжения.\n4. Составить список ответственных за снаряжение.\n5. Совместно с поваром подготовить продукты для похода.\n\n## В походе:\n1. Следить за сохранностью снаряжения и его состоянием.\n2. При необходимости перераспределить снаряжение.\n3. Организовать необходимый ремонт снаряжения совместно с рем.мастером\n4. Обеспечить сохранность пищевых продуктов\n\n## После похода:\n1. Организовать просушку и ремонт снаряжение.\n2. Собрать или раздать снаряжение на хранение участникам.\n\n## Полезная информация:\n\n## Общественное снаряжение:\n1. Палатки по количеству человека + одноместная продуктовая. Отвечает за продуктовую палатку завхоз, доступ к ней также имеет повар.\n2. Тенты для палаток.\n3. Костровой тент\n4. Плотная пластиковая пленка 2х3 метра (для туалета).\n5. Топор (1-2 на отряд).\n6. Пила.\n7. Лопата.\n8. Костровой набор (тросик и крючки) + рукавицы.\n9. Котлы (3 шт. на отряд), либо 2 котла и чайник.\n10. Ремнабор\n11. Спички и свечки в непромокаемой упаковке.\n12. Поварешки (2 шт. на отряд).\n13. Скатерть или клеенка (на земле еду не готовим!).\n14. Расходка (веревка для изготовления патента /«лесная» полка/, привязывания тента и пр.).\n15. Волчатник (красно-белая флажная лента для ограждения территории стоянки).\n16. Аптечка.\n17. Ножи, консервные ножи, разделочные доски.\n18. Канистры для воды.\n19. Средство для мытья посуды, две и более губки.\n20. Мусорные мешки.\n\nЗавхоз пропагандирует бережное отношение к общественному снаряжению. Например, пилы и топоры должны храниться в чехлах, когда не используются на пилке-колке. Такой вид хранения предусмотрен техникой безопасности и продлевает срок службы инструментов.\n\n## Личное снаряжение:\n1. Рюкзак большой с полиэтиленовым вкладышем.\n2. Спальный мешок («спальник») с вкладышем.\n3. Пенополиуретановый коврик («пенка», туристское название «каремат»).\n4. Туристская сидушка («поппер», «хабейник»).\n5. КЛМПН: кружка, ложка, миска, нож.\n6. Штормовка и штаны к ней.\n7. Пакеты для упаковки вещей.\n\n## Список необходимых вещей:\n1. Непромокаемая длинная куртка с капюшоном.\n2. Теплый свитер с горлом.\n3. Длинные штаны (лучше хлопчатобумажные).\n4. Головной убор.\n5. Основная обувь: крепкие разношенные ботинки.\n6. Легкая обувь: кроссовки и т.п.\n7. Шорты, футболки.\n8. По смене нижнего белья на каждый день.\n9. Носки хлопчатобумажные (пара на день) и шерстяные.\n10. Пижама или другая одежда для сна.\n11. Гигиенические принадлежности: мыло в мыльнице, зубная паста, щетка, полотенца, шампунь и пр.\n12. Ремонтный набор: нитки, иголки, шнурки и пр. в упаковке.\n13. Туалетная бумага, носовые платки.\n14. Личная аптечка.\n15. Фонарик, компас.\n16. Шлепанцы\n17. Купальный костюм.\n\n## Также не забываем:\n1. Блокнот с ручкой.\n2. Деньги и документы.\n3. Часы\n4. Фотоаппарат\n5. Батарейки\n6. Гитару\n\nЗавхоз отвечает за наличие и сохранность продуктов в пищевой палатке, поэтому должен знать основные правила упаковки и хранения продуктов в походе.\n\nПравильная подготовка и упаковка продуктов перед походом позволяет предохранить их от порчи и, следовательно, предостеречь туристов от отравления. При правильной упаковке продуктов они без потерь используются в походе, что дает возможность легко вести учет их расхода.\n\nПеред походом все продукты необходимо перебрать, уложить в мешочки или специальные емкости. Большинство продуктов нуждается в водонепроницаемой упаковке. Их необходимо разложить в мешочки по 1-2 кг, так их легче укладывать в рюкзак и учитывать расход.\n\nЧтобы не тратить время на отыскивание нужных продуктов, на мешочках надо сделать надписи. Мешочки шьют из ткани, внутрь закладывают мешочек из полиэтилена немного большего размера, чтобы он не испытывал разрывной нагрузки. Внешний (матерчатый) мешок предохраняет внутренний (полиэтиленовый) от случайных повреждений.\n\nХлебобулочные изделия. Хлеб стоит брать на первые 3-5 дней, т.к. большой запас свежего хлеба тяжел в переноске и плохо сохраняется. Купленные в магазине сухари перед походом необходимо дополнительно просушить. Сухари, приготовленные самостоятельно, надо упаковать в компактные пачки для одноразового употребления.\n\nМясные и рыбные продукты. Консервы нужно брать в жестяных банках, т.к. стеклянные банки тяжелы и менее прочны. Жестяные банки рекомендуется предварительно осмотреть - нет ли на них вздутий (бомбажа), который может быть связан с накоплением газов в результате жизнедеятельности вредных микроорганизмов. Такие консервы, особенно мясные и рыбные, опасны для здоровья.\n\nКолбаса полукопченая при нормальной температуре воздуха сохраняется довольно долго. Однако, чтобы поверхность колбасы не плесневела, надо смазать ее жиром. Ни в коем случае нельзя брать в поход нестойкие вареные колбасы.\n\nМасло и молочные продукты. Сливочное масло быстро портится, поэтому его нужно съесть в первый день похода. Растительное масло удобно транспортировать в небольшой пластмассовой бутылке, предназначенной для хранения пищевых продуктов.\n\nСухое молоко или сливки перекладывают из банок (особенно это касается банок с железными крышками и картонными стенками) в полиэтиленовые мешочки, которые помещают в матерчатые мешки.\n\nКрупы и макаронные изделия. Рис и пшено перед походом нужно вымыть и высушить, а гречневую крупу - поджарить и просеять. Из макаронных изделий в поход рекомендуется брать рожки, т.к. макароны и вермишель при переноске легко крошатся. И крупы, и рожки упаковывают в мешочки.\n\nСахар и кондитерские изделия. Сахар желательно брать в виде песка. Он удобен в переноске, не рвет упаковку. Сахар должен храниться в водонепроницаемой упаковке.\n\nЧай, кофе, какао лучше всего брать в металлических коробках, причем коробки надо предварительно просушить, а затем всыпать в них содержимое без бумажной упаковки - в таком случае поместится значительно больше.\n\nДругие продукты. Соль, так же как и сахар, требует водостойкой упаковки. Даже в водонепроницаемых мешках соль быстро намокает, и масса ее резко увеличивается, когда мешок открывают утром и вечером во время росы. Если в соль добавить 8% крахмала, она будет несколько меньше намокать. Соду хранят в водонепроницаемом мешочке. Молотый перец надо пересыпать в металлическую коробочку и заклеить липкой лентой.\n\nУдачи, Завхоз!"},{"t":"Нашивка «Летописец»","cat":"Нашивки","b":"Что нужно для получения нашивки «Летописец»\n\n1) зачтенная отрядная летопись (за 21 день - если смена летняя; за точное число дней смены межсезонной, включая дни приезда и отъезда);\n\n2) опубликованный (или принятый редактором к опубликованию) материал для общелагерной газеты «Растопка».\n\n## Летописец должен:\n\n## Во время смены:\n\nЕжедневно вести отрядную летопись. В летописи не перечисляются режимные моменты (подъем, зарядка, построение и пр.), а рассказывается про события, интересные детали, впечатления, споры - все, чем описываемый день отличается от предыдущего. Пиши разборчиво, грамотно, аккуратно; текст дополняется иллюстрациями.\nЕжедневно сдавать летопись на проверку в Совет дружины.\nВыбрать наиболее важную, на твой взгляд, новость из отрядной жизни, написать про нее заметку и сдать редактору «Растопки». Новость должна быть оперативной (если событие произошло вчера, самое позднее, когда про него надо написать, это сегодня). Заметка пишется с интересными подробностями, мнением участников, твоими размышлениями. Не забудь про необычный заголовок, поставь свою подпись.\n## Перед походом:\n\nЗапастись всем необходимым для ведения летописи (тетрадь, твердая подставка, ручки, карандаши, фломастеры и т.д.).\n\n## В походе:\n\nЕжедневно записывать в летопись походные события, не просто перечисляя («пришли», «ушли»), а фиксировать все необычное, интересное. Расскажи о трудности пути, о темах костров, о вкусе сваренной поварами каши, о встреченных звериных следах и пр. детали.\nПродумать материал о походе в «Растопку».\n## После похода:\n\nСдать оставшуюся канцелярию завхозу отряда.\nНаписать и сдать редактору «Растопки» материал про поход (самое позднее - на следующий день после возвращения из похода).\n## Полезная информация:\n\nЛетописцем назначит тебя отряд, но нашивку летописца вручают не каждому. Летописец - это историк отряда. Тщательно, честно и подробно он ведет рассказ о каждом дне смены. Иногда трудно найти свободное время для ведения летописи, но откладывать записи на «потом» нельзя, все забудется.\n\nЛетопись твоего отряда должна отличаться от дневников других отрядов. Но, если ты будешь просто перечислять: «встали», «сходили в лес», «поиграли», то все будет одинаково. Пиши, как отряд отреагировал на победу в игре, какие проблемы у вас возникли при знакомстве, чему вы смогли научиться в кружке, почему плохо дежурил патруль или за что наградили твоего соседа. Описывай необычные детали каждого лагерного дня, старайся передать настроение, мысли и чувства твоего отряда. Старайся писать по-своему, подбирая наиболее подходящие слова и выражения. И только тогда твою летопись будет интересно читать!\n\nКроме текста, в летописи должны быть иллюстрации (это могут быть рисунки, карикатуры, схемы, вырезки, возможно, даже фотографии). Вполне можно изобразить соотрядников в костюмах ролевой игры, а сбор черники - как график с количеством собранных ведер. Не подходи к рисункам формально, они дополняют и украшают твои слова.\n\nЧитай записи за день на вечерней свечке, ведь отряд должен знать, что записано в его ежедневной истории. Прислушивайся к советам ребят и вожатого, что нового внести в летопись, а что дополнить. Каждый день на Совете дружины твою летопись будут читать и оценивать. Учись принимать критику и старайся исправлять недостатки текста. В конце смены летопись будет сдана начальнику дружины, поэтому можешь сфотографировать страницы на память и в городе разослать друзьям.\n\nКак сделать так, чтобы твой материал приняли для опубликования в «Растопке»?\n\nПиши про самое интересное, что происходит в отряде или в патруле. Старайся писать быстро (если ты принесешь редактору заметку про игру, которая закончилась три дня назад, редактор не возьмет текст, потому что новость устарела).\n\nСтарайся думать, про что пишешь. Мало просто сообщить, что произошло в лагере. Можно поразмышлять, почему это произошло, хорошо это или плохо, узнать мнения о событии у ребят и взрослых.\n\nСтарайся писать необычно, откажись от речевых штампов вроде «усталые, но довольные», «плечо друга всегда поддержит» и т.д. Подбирай свои слова, свои способы выразить мысль.\n\nНе пиши сразу про все - это невозможно. Возьми какой-то один факт и опиши его ярко, с интересными деталями, своим мнением.\n\nПомни, что ты пишешь заметку (или любой другой жанр) в лагерную газету, а не доклад на взрослую конференцию. Забудь про «заумные» слова, пиши просто и понятно.\n\nНе забудь и про заголовок, который привлечет внимание твоих читателей."},{"t":"Путь следопыта: законы, заповеди и дух","cat":"Следопытство","b":"## Смысл\nДвижение следопытов - путь, по которому мальчики и девочки растут в граждан страны: учатся заботиться о себе и помогать тем, кто нуждается в помощи. Оно воспитывает верность, честность, уважение, силу духа, оптимизм, умение ценить друзей и беречь природу. Следопыт живёт по законам и заповедям следопытов.\n## Заповеди\n- Не навреди природе живой и мёртвой.\n- Слабому телом подставь плечо, слабому духом помоги поверить в себя.\n- Закаляй тело и дух, помни: мир вокруг будет таким, каким станешь ты сам.\n## Законы\n- Следопыт верен Богу, предан Родине и семье.\n- Следопыт брат всякому другому следопыту.\n- Следопыт выполняет приказания руководителей.\n- Следопыт вежлив, услужлив и скромен.\n- Следопыт трудолюбив и настойчив.\n- Следопыт никогда не падает духом.\n- Следопыт в ответе за свои поступки.\n- Следопыт чист в мыслях, словах и делах.\n- Следопыт - пример всем.\n## Как их знают\nСледопыты учат законы наизусть. Волчата и белочки должны их понимать и уметь привести примеры из жизни. На построении законы и заповеди читают следопыты, волчата, белочки и те, кто уже сдал два испытания. Ребёнка, которого вы вызовете, предупредите заранее.\n## Принципы работы\n- Работа на природе.\n- Работа в малых группах.\n- Обучение через дело.\n- Общественная полезность.\n- Инициатива и ответственность."},{"t":"Испытания: молчанка, ночёвка, активитеты и нашивки","cat":"Следопытство","b":"## Общие правила\n- Испытания проверяют честность и всегда добровольны. Для любого нужно разрешение родителей.\n- Принимать испытания могут только следопыты.\n- Вожатый отряда, следопыт он или нет, может запретить сдавать испытание сейчас, например за плохое поведение. Испытание требует повышенной ответственности, а вожатый отвечает за жизнь и здоровье детей.\n- Если испытание не получилось, следующая попытка через день по календарю. За смену три попытки на каждое испытание.\n- Когда все испытания сданы, будущий следопыт проходит беседу о законах следопытов.\n## Бобрята (6-8 лет), оранжевый галстук\n- Молчанка 2 часа.\n- Ночёвка 2 часа.\n## Волчата и белочки (8-11 лет), оранжевый галстук с зелёной каймой\n- Молчанка 4 часа.\n- Ночёвка всю ночь, в паре (мальчики с мальчиками, девочки с девочками), с десятью предметами на двоих.\n- Три активитета (один обязательно костровой) или одна нашивка.\n## Следопыты (с 12 лет), галстук с синей и зелёной полосами\n- Молчанка 24 часа.\n- Ночёвка всю ночь, одному, с тремя предметами.\n- Две нашивки, одна из которых туристическая.\n## Нашивки и активитеты\n- Нашивка: нужно сдать теорию и практику гильдии, среди принимающих обязательно один взрослый.\n- Активитеты выдают детям 6-10 лет. Чтобы получить активитет, нужно активно участвовать в мероприятии. Это нашивки по достижениям для младшего возраста.\n- В справочнике 17 нашивок: часть туристические, часть творческие. Они собраны в этом же разделе ниже.\n## Молчанка и ночёвка простыми словами\n- Молчанка: весь отмеренный срок участник не говорит ни слова. Нужен спокойный день и контроль взрослого, чтобы ребёнок мог вернуться к речи в любой момент, если что-то случилось.\n- Ночёвка (ночное бдение у костра): участник ночью следит за костром и сохраняет его. Берёт с собой допустимое число предметов. Вожатый заранее проверяет безопасность места и одежду по погоде."},{"t":"Символика, галстуки и посвящение","cat":"Следопытство","b":"## Девиз и клич\n- Девиз «Будь готов!» - символ постоянной готовности.\n- Клич «Всегда готов! За Россию!» - символ служения Родине.\n## Салют\nСалют следопыта - знак единства всех братьев и сестёр. Он напоминает о трёх дорогах: к себе, к людям и к Богу. Кольцо из большого пальца и мизинца значит, что сильный должен защищать слабого, а младший слушаться старшего.\n## Галстук\n- Бобрята: оранжевый.\n- Волчата и белочки: оранжевый с зелёной каймой.\n- Следопыты: оранжевый с синей и зелёной полосами.\n- Узелки на галстуке напоминают о добром деле, которое следопыт стремится сделать каждый день.\n- В символике движения также лилия, роза ветров, образ Георгия Победоносца.\n## Посвящение\n- Галстук вручают на посвящении. После этого прошедший испытания может отдавать салют и становится полноправным участником.\n- Посвящают только достойных, тех, кто заслужил галстук поведением и отношением. Руководители и следопыты могут не посвятить даже того, кто сдал все испытания.\n- За нарушение следопытского поведения галстук могут запретить носить на время (решает руководитель на построении), а за грубое нарушение снять (решает совет следопытов)."},{"t":"Лесные имена","cat":"Следопытство","b":"- Лесное имя даётся следопыту, который носит галстук не меньше года, при безупречном поведении.\n- Имя выбирает лесной совет: те, у кого лесное имя уже есть.\n- О церемонии наречения и её времени спрашивать не принято, о ней не рассказывают.\n- Лесное имя вышивают на уголке галстука.\n- Прозвища и лесные имена входят в «следопытские разговоры» наравне с символикой и гимнами. Слово «лесное имя» не совпадает с позывным: это знак доверия и признания."},{"t":"История движения: коротко","cat":"Следопытство","b":"Это конспект для «следопытских разговоров» с отрядом. Опирается на заметки лагеря, даты и имена проверяйте по источникам перед выступлением.\n## Короткая версия для младших\n- Возрастные категории: бобрята, волчата и белочки, следопыты.\n- Что такое испытания и нашивки.\n- Символы: цвета галстука, салют, лилия, девиз, узелки.\n- Лесные имена и гимны.\n## Длинная версия для старших\n- Эрнест Сетон-Томпсон и идеи, взятые из жизни индейцев.\n- Роберт Баден-Пауэлл, разведчики и первый палаточный лагерь в 1907 году.\n- Олег Пантюхов и первый скаутский костёр в России 30 апреля 1909 года.\n- Пионерия в 1920-х.\n- Современные организации и следопыты сегодня.\n- Проекты в городе: школа вожатых, редакторы и другие.\nСовет: каждую часть разговора начинайте с вопроса к детям («как вы думаете, зачем...») и заканчивайте игрой или песней."},{"t":"Легенда о дружбе «Родник» (краткий пересказ)","cat":"Следопытство","b":"Конунг Хельгас с семьёй остановился на отдых в лесу. Его сын Свен исследовал местность и встретил мальчика Вихоря, который строил на дереве смотровую площадку. Они не сразу доверились друг другу, но подружились, построили площадку вместе и ночью у костра поклялись остаться друзьями навек. Потом пути их разошлись.\nЧерез несколько лет на деревню Вихоря напали разбойники. Вихоря отправили за помощью, его ранили стрелой, а лес подожгли. Раненый, без воды и сил, он вспомнил друга. В ту же ночь Свен проснулся от тревожного сна. Жрец сказал, что помочь можно, только если дружба не на словах, а в сердце, и Свен был готов отдать за друга всё, что мог. Вихорь в это время очнулся рядом с родником: вода брызнула ему в лицо.\nДля беседы после чтения: что такое настоящая дружба, на что вы готовы ради друга, чем настоящая помощь отличается от слов."},{"t":"Тренинг «Планета чувств» для подростков 13+","cat":"Разное","b":"cat: Разное\nСерия из упражнений для Сов. Идёт спокойно, в тёмной или полутёмной комнате, без давления: никого не заставляем рассказывать и не комментируем рисунки вслух.\nШаг 1 (15 мин). «Материки чувств». На ватмане четыре «материка»: ощущения (тепло, холод), драйвы (голод, желание спать, двигаться), эмоции (радость, страх, гнев), чувства (любовь, ревность: сложные и переплетённые с мыслями). Ребята называют слова, вожатый клеит стикеры. Разбираем тонкости: гнев - эмоция, агрессия - действие; радость - активная, удовольствие - спокойное; грусть тихая, тоска и горе с болью; вина - нарушение своих правил, стыд - страх, что подумают другие. Проводить быстро, иначе скучно.\nШаг 2 (30 мин). «Радуга чувств». Каждой эмоции из списка дают свой цвет. На листе рисуют две необычные радуги: чувства последних дней и чувства «обычно». Фоновая музыка нейтральная, без слов. Не озвучивайте выводы по рисунку. Если видите много тёмных тонов, поговорите наедине после занятия.\nШаг 3. Деление на группы по преобладающей эмоции.\nОбида: «Дерево чувств» (30 мин). Из пластилина: ствол - я, ветви - события, плоды - эмоции (у каждой свой цвет и форма), корни - причины и мои мысли. Потом такое же дерево для хорошего события. Пластилин лучше бумаги: можно мять и переделывать.\nБоль: «Мелодия моего тела» (60 мин). Сидя с закрытыми глазами «слушают» по очереди части тела (темя, глаза, плечи, руки, грудь, живот, ноги), примерно по 20 секунд. Голос спокойный и обычный. Молчащие места не интерпретируем. Затем под нейтральную музыку «танец эмоций» 15-20 минут, свет приглушается, можно закрыть глаза. Музыку убирают постепенно.\nГнев: «Выколачиваю гнев» (около 15 мин). Скалкой или палкой бьют по кипе газет, матрасу, старой груше. Между участниками большое расстояние, после упражнения перерыв и спокойное дело. Нельзя бить людей и твёрдые предметы.\nСнятие напряжения: «Золотистый поток» (20 мин). Сидя, глаза закрыты, ведущий мягко описывает золотистый свет, стекающий по лицу, плечам, рукам, груди, спине, ногам и уносящий всё мутное. Каждой зоне по 10 секунд. Полезно, когда сильно разозлился: сначала успокойся, потом решай.\nПозитив: «Место личной силы» (20 мин). Визуализация: облако-кресло везёт над зелёным островом, ты выходишь на мягкую траву и ощущаешь силу земли, потом возвращаешься.\n«Голос поколений» (60 мин, для опытных ведущих). В демонстрации с добровольцем шаг за шагом играется роль матери, отца, дедушки, бабушки и произносятся их типичные фразы. Потом человек говорит «Я - это я» и обсуждает, какие установки получил. В паре то же. Фразы, которые не нравятся, можно переписать. Может вызвать слёзы, это нормально. Проводить только если есть доверие в отряде и рядом психолог или опытный старший.\nБезопасность: упражнения про семью, боль и гнев вызывают сильные чувства. Новичку лучше проводить их вместе с педагогом-психологом. Если ребёнок расплакался или замкнулся, остаться рядом, не требовать объяснений, после занятия поговорить один на один и сообщить психологу."},{"t":"Мини-тренинг для Жаворонков 6-8 лет: «Мы такие разные, но вместе»","cat":"Разное","b":"cat: Разное\nЦель: помочь детям замечать настроение другого, не чувствовать себя одинокими, пережить общие эмоции. Три занятия по 30-40 минут, каждое строится одинаково: приветствие, сказка, игра, общий финал.\nФинальный ритуал «Молодцы!»: дети ставят кулачки столбиком друг на друга и громко говорят «Молодцы!», убирают кулачки.\nЗанятие 1 «Кактус». Приветствие: вожатый присаживается перед каждым ребёнком, соединяет свои ладони с его ладошками и говорит «Здравствуй, (имя)». Сказка (рассказывайте своими словами): на клумбе вырос колючий кактус, цветы его сторонились, он обижался. Когда пришёл хулиган топтать цветы, кактус защитил их ценой своих иголок, цветы поблагодарили его, и на месте иголок выросли цветы. Затем лёгкая медитация: дети встают, закрывают глаза, представляют клумбу, цветы тянутся к солнцу и нежно касаются друг друга. Основная мысль: непохожий не значит плохой.\nЗанятие 2 «Енот». Приветствие «Назови себя»: каждый называет имя так, как хочет, чтобы его называли сегодня. Сказка про Крошку Енота и Того, кто сидит в пруду (можно показать на песке маленькими фигурками): енот идёт за раками, встречает зверей, которые пугают его, у пруда видит в воде «Того, кто сидит» - тот строит такие же рожи, поднимает камень и палку. Мама говорит просто улыбнуться, и отражение улыбается в ответ. Вывод: с миром надо говорить так, как хочешь, чтобы с тобой говорили. Игра «Зеркало»: пары, у каждого тазик с песком (кинетическим), первый лепит «мордочку» страха, злости, радости, не говоря какой, второй угадывает, потом меняются.\nЗанятие 3 «Волшебники». Приветствие: дети - волшебники и отгадывают желания соседа слева. Сказка про злого ко
