аппликация, для которой можно использовать журнальные иллюстрации. Но при этом следует соблюдать меру, чтобы не переборщить с цветовыми пятнами.\n\n9. Всегда интересны в стенгазете фотографии. Они сами по себе привлекают внимание, но еще более удачным решением станет размещение аккуратно вырезанных изображений на каком-либо необычном фоне. Можно использовать фотографию в качестве одного из элементов крупного рисунка.\n\n10. Особое внимание при оформлении стенгазеты следует уделить цветовой гамме. Чересчур пестрые газеты утомляют взгляд, отвлекают внимание от содержания. Путь художника только начинается на этих страницах. Мир творца необъятен и прекрасен. И ты, если захочешь, можешь идти дальше и изучать его самостоятельно!\n\n## Что почитать юному художнику:\n\nАлленова Е.М., Борисовская Н.А. и др. Русские художники от А до Я. М., 2009.\n\nГнедич П.П. Шедевры русской живописи. М., 2005.\n\nЗайцев А.С. Наука о цвете и живопись. М., 1986.\n\nКовалев Ф.В. Золотое сечение в живописи. М., 2013.\n\nПавлинов П.Я. Для тех, кто рисует. М., 1965.\n\nРевякин П.П. Техника акварельной живописи. М., 1959.\n\nРостовцев Н.Н. История методов обучения рисованию. М., 1982.\n\nСамин Д.К. 100 великих художников. М., 2004.\n\n## Электронные источники:\n\nКак оформить стенгазету // http://www.kakprosto.ru/kak-1023-kak-oformit-stengazetu\n\nПрофессия художник //http://edunews.ru/professii/obzor/Tvorcheskie/hudojnik.html\n\nРусские художники // http://www.artvedia.ru/history/1\n\nСтили и направления в изобразительном искусстве\n\n// http://studopedia.ru/1_4083_stili-inapravleniya-v-izobrazitelnom-iskusstve.html\n\nШедевры мировой живописи // http://rarities.artrussia.ru"},{"t":"Нашивка «Штурман»","cat":"Нашивки","b":"Штурман ведет отряд. Это очень почетно и одновременно очень ответственно. Суметь прочесть карту и грамотно построить маршрут сможет далеко не каждый. Тебя будут спрашивать, долго ли еще идти, «наш» или «не наш» этот поворот, где находится отряд и как называется вооон та горка. На все вопросы ты должен давать четкие и уверенные ответы, а для этого нужно серьезно подготовиться.\n\n## Штурман должен:\n\n## До похода:\n\nОзнакомиться с картами района, где будет проходить поход.\nСовместно с руководителем похода разработать и тщательно изучить нитку маршрута и график похода. Составить маршрутный лист.\nУметь читать карту, определять на глаз расстояния, время, направление ветра, определять азимуты по карте и на местности.\n## В походе:\n\n1. Вести отряд.\n2. Обеспечить упаковку и хранение карт в походе.\n3. Показывать летописцу объекты съемок.\n## После похода:\n\nСоставить отчет о маршруте.\nСдать оставшиеся карты и компас.\n## Полезная информация:\n\nПравила ориентирования на местности\n\nОриентирование на местности - определение своего положения (точки стояния) относительно сторон горизонта и окружающих объектов (ориентиров). Ориентирование позволяет сделать правильный выбор направления движения и выдерживать его в пути.\n\nДля ориентирования на местности обычно пользуются картой и компасом\n\nКарта (план) - уменьшенное изображение земной поверхности, выполненное в определенном масштабе.\n\nЧтобы правильно пользоваться картами, планами, туристскими схемами, необходимо знать их масштаб. От масштаба зависят полнота и детальность изображения местности на карте. Масштаб карты показывает, во сколько раз изображение местности уменьшено на карте. Например, если написано М 1:10000, это значит, что в 1 см на карте изображено 10000 см на местности. Для простоты мысленно убираем два последних нуля и сразу получаем метры, то есть в 1 см карты 100 метров местности.\n\n## Карта читается с помощью условных знаков. Все знаки принято делить на:\n\n· масштабные - изображают местные предметы, которые «укладываются» в масштаб карты (озера, крупные города и т. п.);\n\n· внемасштабные - изображают объекты, которые не могут быть выражены в данном масштабе (мосты, колодцы, башни);\n\n· пояснительные - цифры, надписи, другие обозначения.\n\nВсе многообразие объектов на местности выражают на картах с помощью цвета:\n\nЧерный цвет используют для обозначения искусственных сооружений: домов, дорог, тропинок, нанесения границ лесных и полевых угодий, а также для изображения скал и камней.\nГолубым цветом показывают водоемы, реки, озера, болота, линии магнитного меридиана или линии севера карты.\nКоричневым цветом обозначают рельеф (ямы, холмы, обрывы, овраги и т.п.). В обозначении большей части объектов рельефа используется горизонталь. Горизонталь - это линия карты, соответствующая определенному уровню высоты на местности. Н - высота сечения рельефа, показывает разницу высот между горизонталями. Например, если на карте холм изображен тремя горизонталями, то при Н=5 м его высота будет от 15 до 20 метров. Бергштрих - короткая, перпендикулярная горизонтали черточка, показывающая направление стока воды. Бергштрих демонстрирует направление склона и помогает определить, холм или яма изображены на карте.\nЖелтым цветом показаны открытые и полуоткрытые участки (луга, поляны).\nЗеленым цветом обозначают лесные заросли, кустарники, посадки молодых деревьев. Чем хуже проходимость леса, тем насыщеннее зеленый цвет на карте.\nБелым цветом изображают чистый, легко пробегаемый лес (чаще всего на картах для спортивного ориентирования).\nКрасным или фиолетовым цветом показывают старт, финиш, контрольные пункты, дистанцию, а также участки, запрещенные для бега.\nУсловные знаки, обозначающие внемасштабные объекты (микроямки, воронки, вышки), а также знаки, показывающие породу растительности, на карте ориентированы точно по линиям севера. Это же относится и ко всем надписям на карте. Штриховка всех болот всегда имеет направление, перпендикулярное линиям севера.\n\nКарта чаще всего напечатана таким образом, что верх карты - это направление на север. Если это не так, направление на север специально обозначается.\n\nДля определения своего местоположения карту необходимо сориентировать, т.е. держать ее горизонтально так, чтобы направление карты на север совпадало с направлением компаса на север. Красная стрелка компаса должна смотреть в верх карты и быть перпендикулярна ее кромке.\n\nНужно иметь в виду, что вблизи линий электропередач, железных дорог, металлических предметов показания компаса искажаются.\n\nОпределить стороны света можно также по солнцу, луне, звёздам, особенностям местных предметов (коре деревьев, расположению мхов и лишайников, натёкам смолы и др.), но эти способы являются менее точными.\n\nЕсли карта сориентирована правильно, то место своего положения можно определить по видимым ориентирам.\n\nИз всего многообразия объектов местности для ориентирования обычно используют характерные, выделяющиеся на местности предметы, или ориентиры - точечные, линейные и площадные.\n\nТочечные ориентиры - предметы, изображенные на картах внемасштабными условными знаками (отдельные строения, башни, трубы, пункты геодезической сети, курганы, воронки), или точки пересечения линейных ориентиров и изломов контуров (развилки дорог, перекрестки просек, слияние ручьев, углы и выступы контуров леса, луга, населенного пункта).\n\nЛинейные ориентиры - объекты, имеющие существенную длину на местности и изображенные на карте линейными условными знаками (дороги, реки, каналы, берега озер и морей, линии связи и электропередачи, лесные просеки, вытянутые формы рельефа - овраги, хребты, впадины).\n\nПлощадные ориентиры - объекты с хорошо выраженными контурами, занимающими определенную, сравнительно небольшую площадь (озеро, болото, луг, опушка леса, роща, населенный пункт).\n\nНадежными ориентирами служат высокие, резко выделяющиеся на общем однообразном фоне объекты: горные вершины, отдельные скалы, искусственные сооружения башенного типа (вышки, колокольни, трубы и т. п.).\n\nПри отсутствии надежных ориентиров обычно прибегают к движению по азимуту, для чего определяют на карте магнитные азимуты и расстояние до определенных ориентиров. Азимут - угол между направлением магнитной стрелки компаса на север и направлением на заданный ориентир. Этот угол измеряется в градусах по ходу часовой стрелки от 0 до 360. Движение по азимуту заключается в определении на местности нужного направления и выдерживании его в пути до выхода к намеченному пункту.\n\nТехническое описание маршрута (маршрутный лист) должно включать в себя:\n\n· Сведения о количестве и состав участников группы.\n\n· Начальную и конечную точки маршрута.\n\n· Маршрут похода с разбивкой по участкам, указанием их протяженности и времени прохождения.\n\n· Расположение и длительность стоянок и привалов.\n\n· Всевозможные подъезды и отъезды.\n\n· Возможность использования аварийного транспорта по нитке маршрута.\n\n· Ключевые, поворотные и реперные (точка отсчета) точки.\n\n· Точки пересадок с транспортных средств.\n\n· Ключевые азимуты.\n\n## Отчет о маршруте дополнительно включает в себя:\n\n· Характер пути, применявшаяся техника движения на каждом участке.\n\n· Пройденное расстояние и затраченное время.\n\n· Описание метеоусловий на маршруте.\n\n· Список всех преодоленных естественных препятствий.\n\n· Хронометраж времени, проведенного на привалах и отдыхе.\n\nТехника ведения группы\n\n· Обязательно наличие ведущего (направляющего) и замыкающего, поддерживающих связь во время движения\n\n· Более сильные участники следуют в замыкающей группе, чтобы сохранять общий темп движения и, при необходимости, разгрузить уставших.\n\n· Все участники должны находиться в визуальном контакте, не допускать разрывов.\n\n· Ведущий задает темп движению группы, выбирает наиболее безопасный и удобный путь, предупреждает идущих следом об опасности и препятствиях на пути.\n\n· Необходимо следить за продолжительностью переходов и привалов. Существуют две основные схемы движения в походе:\n\n30 минут перехода на 10 минут привала (для младшего возраста);\n50 минут перехода на 10 минут привала.\n· Не реже, чем раз в три перехода, делается большой привал продолжительностью не менее одного часа.\n\n· При переходе на большие расстояния обязательно горячее питание в середине дня.\n\nЛегких тебе дорог!"},{"t":"Нашивка «Узловой»","cat":"Нашивки","b":"## Требования для сдачи на нашивку:\n\nЗнать не менее 10 узлов разного назначения и способы их применения (как минимум по одному из каждой категории).\nЗнать типы веревок (по материалу, нагрузке, толщине) и их применение.\nЗнать, как хранить веревку (как бухтовать и в каких условиях содержать); факторы, которые портят веревку.\n## Веревки:\n\nВеревка - самое общее название свитой или спущенной в несколько прядей толстой нити.\nТрос - витое или крученое из прядей разного материала, похожее на веревку изделие.\nКанат - синоним троса. Также слово употребляют по отношению к более толстому тросу сравнительно с тонкими веревками.\nВ настоящее время четкой границы между понятиями нет.\n\n## Материалы веревок:\nВАЖНО: приведенный ниже материал не является обязательным для полного заучивания. Главное - просто знать в общих чертах теорию, подробно расписанный материал является ознакомительным.\n\nДля производства веревок используются различные материалы.\n\n## 1) Натуральные (растительные) материалы:\n- Пеньковые тросы (из вымоченных конопляных стеблей)\n- Хлопковые и льняные тросы (из промышленных отходов соответственно хлопка и льна)\n- Джутовые тросы\n- Манильские тросы (из растения Абака) и др.\n\n2) Синтетические материалы (тросы целиком изготовлены из волокон, полученных искусственным путем):\n- Полиамид (нейлон) -используется в промышленном и спортивном альпинизме. Высокая прочность и устойчивость к перетиранию\n- Полиэфир (низкий запас прочности, но при этом сохраняет прочность при намокании; тонет и стоит дорого)\n- Полипропилен (наиболее популярные и наиболее дешевые, плавает на поверхности воды, не проводит электричество)\n- Полиэтилен, Полиэтен, Кевлар и др.\n\n3) Стальные тросы\n\n## Свойства синтетических тросов:\n\nПлюсы: При одинаковом диаметре и длине прочнее и легче, чем тросы из растительных материалов. Эластичнее и выше способность к растяжению. Не теряют прочности при намокании и не гниют.\n\nМинусы: узлы легче проскальзывают, неустойчивы к воздействию кислот. После растяжения потеря исходной формы. Нейлоновые веревки сильно намокают и теряют при этом 15% прочности.\n\n## Свойства натуральных веревок:\n\nПлюсы: Экологически чистые, высокая степень сцепления, нескользящие узлы и прочные крепления. При правильном изготовлении устойчивость к воздействию окружающей среды и большинства химических соединений\n\nПеньковый канат обладает высокой разрывной нагрузкой, устойчив к воздействую ультрафиолетового излучения, к воздействию соленой воды и практически не подвержен гниению.\nДжутовая веревка достаточно прочная, не подвержена воздействию внешней среды, не накапливает статическое электричество. Отталкивает влагу, что препятствует образованию плесени.\nМанильский шпагат совершенно не боится ни соленой, ни пресной воды, не тонет, не гниет. Прочный и при этом эластичный.\nХлопковые и льняные веревки имеют небольшую растяжимость и используются в основном для технических, упаковочных и хозяйственных целей.\nМинусы: При намокании склонность к гниению, тяжесть, трудозатратное производство и как следствие дороговизна.\n\n## Типы веревок:\n\n## Вкратце, не вдаваясь в подробности, веревки бывают:\n- Плетеные (состоят из несущей нагрузку сердцевины и защищающей ее оплетки)\n- Крученые (на заключительном этапе производства пряди, образующие веревку, скручиваются между собой)\n\nНесмотря на то, что крученые веревки получаются крепче и эластичнее плетеных, плетеные веревки лучше защищены от механического повреждающего воздействия и от воздействия ультрафиолета, что определило предпочтение туристов и других людей чаще всего использовать именно такие веревки.\n\n## Слипание оплетки и сердцевины:\n\nПри производстве плетеных веревок сразу после сплетения прядей трос пропускают через область повышенной температуры (на сколько я находил информацию, пропускают через пар). Данная мера приводит к тому, что внешняя оплетка «прилипает» к сердцевине, что предотвращает в некоторой мере проскальзывание сердцевины относительно оплетки.\n\nЧем опасно проскальзывание? Тем, что в какой-то момент, после активного использования веревки сердцевина может полностью уйти и внутри веревки останется полость, что с большой долей вероятности под нагрузкой приведет к обрыву веревки.\n\nТак же рекомендуется почаще осматривать веревку на наличие обламывания сердцевины - ощущается как ямка внутри веревки, которая нащупывается пальцами. Также нужно осматривать веревку на наличие сильных перетирания внешней оплетки, что тоже несет в себе риски.\n\nУсадка веревки\n\nПосле того, как веревка была произведена, сама веревка со временем усаживается - происходит процесс постепенного укорачивания фактической длины веревки.\n\nТо есть, если вы хотите использовать веревку длиной 50 метров, рекомендуется покупать веревку длиной как минимум 60 метров, так как она со временем усядет и станет короче.\n\n## Эффективность узла:\n\nЭто показатель остаточной прочности веревки (каната, троса) в узле от номинальной прочности веревки, выраженный в процентах.\n\nСилы, действующие на веревку внутри узла, не распределяются равномерно по всему ее поперечному сечению. Часть нитей, находящихся на внешней стороне дуги, натягивается довольно сильно. Чем сильнее изогнута веревка, тем в большей степени уменьшается ее прочность. В зависимости от узла, прочность веревки обычно ослабевает на 30-­60%\n\n## Что портит веревку:\n\nВ процессе эксплуатации на веревку воздействует множество факторов, которые постепенно приводят ее в негодность для дальнейшего использования:\n\nСамый главный фактор - само время. Максимальный срок годности веревки - 10 лет с момента выпуска (а не с момента покупки в магазине). Этот срок сокращается до 3-6 лет при нечастом использовании и несоответствующем хранении.\nВоздействие солнечных лучшей (разрушение под воздействием ультрафиолета)\nГрязь (попадание грязи, песка на веревку и между волокнами)\nНатяжение (веревка теряет форму - деформируется)\nЗавязывание узлов (так как узел неравномерно перераспределяет нагрузку на разные участки внутри веревки)\nВоздействие химических веществ\nТоптание, хождение по веревке, просто лежащей на земле\nТрение оплетки о карабины (актуально для верхней страховки), деревья, другие веревки\nНамокание (веревка теряет прочность и легче деформируется, либо гниет)\nВоздействие плесени, микроорганизмов\n## Хранение веревки:\n\n## Для веревки крайне важным является правильное хранение:\n\nВ неплотной бухте, иначе будет слишком сильный перекрут оплетки относительно сердцевины\nВ идеале в специальной сумке для веревок\nХранить в сухом и прохладном месте (лучше, чтобы оно было чистым)\nИсключить попадание солнечных лучей (также не стоит оставлять веревку надолго на солнце)\nНе хранить рядом с нагревательными элементами\nНе хранить вблизи ядовитых химикатов\n## Отбраковка веревки:\n\n## Веревкой нельзя пользоваться, если:\n\nОна попала в контакт с аккумуляторной кислотой\nИмеет повреждение оплетки до сердечника\nИмеет прощупываемое повреждение сердечника\nИмеет повреждение оплетки вследствие теплового нагрева (из-за трения) более чем на 100 градусов либо оплетка проплавилась вплоть до сердечника\n## Узлы для соединения веревок одинакового диаметра:\n## Прямой узел:\n\nПрямой узел\nПрямой узел\nУзел легко вяжется. Из-за переменной нагрузки сильно ползёт (самопроизвольно развязывается)\n\nХодовые концы должны быть длиной 15-20 см, чтобы можно было завязать контрольные узлы.\n\nОба рабочих конца веревок должны располагаться с одной стороны относительно узла (на рисунке оба находятся сверху), иначе это будет уже другой узел - воровской - менее прочный.\n\nНеправильно завязанный прямой узел (верх и низ узла визуально будут несимметричны и узел поедет при сильном затягивании) именуется бабьим и является менее крепким.\n\n## Рыбацкий узел:\n\nПо сути, две контрольки вяжутся вокруг двух разных веревок и при затягивании просто упираются друг в друга. При сильной нагрузке может поползти и развязаться.\n\nТакже легко развязывается, если неправильно завязан.\n\n## Грейпвайн (в народе грепвайн, иногда грипвайн):\n\nЭффективность узла- 95%.(если не доверяете моим данным, перепроверьте).\n\nНе требует контрольного узла (контрольки).\n\nСложность вязания. Придется потренироваться. Неправильно завязанный грейпвайн не будет выдавать такую поражающую эффективность.\n\nПосле нагрузки трудно развязать.\n\n## Змеиный узел (кровный узел):\n\nЭффективность узла - 87%\n\nНедостаток - трудно завязывать, требует много веревки.\n\nДостоинства - один из самых крепких соединяющих узлов. Очень надежен при соединении лесок одного диаметра.\nЕсли соединяемые веревки заметно различаются по диаметру, рекомендуется более тонкий конец сложить вдвое, что должно несколько повысить прочность узла.\nНа каждой стороне должно быть не менее 5[пяти] витков.\n\n## Встречные узлы:\n## 1) Встречный проводник:\n\nПосле завязывания \"контрольки\" (а), необходимо второй веревкой “пойти” навстречу ходовому концу первой веревки, то есть полностью повторить узел, чтобы он получился двойным. Не ползет. Эффективность узла - 41%.\n\n## 2) Встречная восьмерка :\n\nЭффективность узла- 47%\n\nВ отличие от встречного проводника, вначале одной веревкой завязывается не проводник, а восьмерка.\n\nНа завязывание узла веревки тратится больше, чем на встречный проводник, однако узел получается надежнее.\n\n## \"Цеппелин\" (кунгурский узел):\n\nНадежный соединяющий узел, состоящий из двух простых узлов.\n\nУзел можно развязать даже после серьезной нагрузки,\n\nоднако под нагрузкой узел развязать невозможно.\n\nУзел может быть использован на тросах и веревках из любого материала и любого диаметра (ВАЖНО: относительно друг друга веревки должны быть одной толщины).\n\n## Соединяющий австрийский проводник (Ездовой узел):\n\nВизуально похож на серединный австрийский проводник\n\nИмеет высокую прочность связывания тросов, легко развязать.\n\n## Охотничий узел:\n\nВ отличие от узла Цеппелин две начальные петли не просто соприкасаются друг с другом, но и соединены, как звенья цепи.\n\nИспользуется для соединения веревок примерно одного диаметра.\n\n## Хирургический узел:\n\nПредставляет собой измененный прямой узел, где первый полуузел делают в 2 оборота. При этом нужно следить за направлением полуузлов - сначала в одну сторону, потом в другую.\n\n## Узлы для соединения веревок разного диаметра:\n## Шкотовый узел:\n\nНе затягивается под нагрузкой.\n\nПолзет при переменных нагрузках.\n\nИспользуется для связывания веревок как одинакового, так и разного диаметров.\n\nОбязательны контрольные узлы.\n\nБолее толстая веревка должна использоваться в узле как обычная петля.\n\n## Брамшкотовый узел:\n\nПо сути - немного улучшенный дополнительным оборотом веревки вокруг петли Шкотовый узел.\n\nПетля - из более толстой веревки, а ходовым концом тонкой обкручиваем ее как показано на рисунке.\n\nНезатягивающийся узел. Должен быть хорошо расправлен.\n\nАкадемический узел\n\nПетля делается более толстой веревкой. При большой нагрузке не так сильно затягивается, как “прямой” узел, легче развязывать.\n\n## Второй вариант академического узла:\n\nДанный вариант является модификацией хирургического узла, где вторая петля также делает два оборота.\n\n## Докерский узел:\n\nХорошо подходит для связывания веревок разной толщины.\n\nПолзет при переменных нагрузках.\n\n## Узел Олбрайта:\n\nУниверсальный узел с большим количеством применений. Относительно легко завязывается, подходит для соединения веревок разного типа.\n\nНезатягивающиеся петли\n## Проводник:\n\nЭффективность узла - 50%\n\nВяжется одной веревкой, которая складывается вдвое и на конце ее завязывается простой узел, чтобы получилась петля.\n\nБыстро завязывается. Итоговая петля находится под углом к основной веревке. Сильно ослабляет веревку. После нагрузки трудно развязывается.\n\n## Восьмерка:\n\nЭффективность узла - 55%\n\nПрименяется в альпинизме. Не требует контрольного узла. Основное применение - закрепление карабина на основной веревке.\n\nПосле нагрузки трудно развязать. Трудно завязать без перехлестов, что ослабляет веревку.\n\n## Девятка:\n\nЭффективность узла - 70-74%\n\nУзел не имеет крутых изгибов, поэтому обладает высокой эффективностью.\n\nНа завязывание Девятки уходит веревки больше, чем на Восьмерку, также при завязывании Девятки легче запутаться.\n\nКак утверждается, после нагрузки развязать его легче, чем Восьмерку.\n\n## Серединный австрийский проводник (“пчелка”):\n\nЭффективность узла - 51-53% между основными концами; 67% - с петлей.\n\nПрименяется: для изоляции на петле перетершегося участка веревки; для крепления страховочных усов к обвязке; для организации точек крепления на базовой веревке; для крепления в связке среднего участника (за что именуется часто \"узел среднего\").\n\n## Двойной проводник:\n\nЭффективность узла - 53-75%\n\nПо сути, в начале нужно завязать узел Пустышка сложенной вдвое веревкой (следить, чтобы получившиеся петля и двойная петля были связаны напрямую - если потянуть за петлю, то двойная петля будет уменьшаться). Затем одинарная петля перекидывается через весь узел на другую сторону и узел затягивается.\n\n## Заячьи уши:\n\nЭффективность узла - 53-75%\n\nСхема завязывания узла похожа на схему Двойного Проводника. Отличие - в начале завязывается не проводник, а восьмерка.\n\n## Совершенная петля:\n\nТрудно развязать так как под нагрузкой сильно затягивается\n\nПрост в связывании, не скользит на синтетической леске\n\nИспользование: в рыбалке для привязывания крючка; привязывание веревки к опоре.\n\n## Эскимосская петля:\n\nНадежен.\n\nПод нагрузкой узел затягивается не сильно.\n\nГлавный плюс - возможность регулировать величину петли после завязывания узла.\n\n## Булинь (беседочный узел):\n\n«Король всех узлов» (древний узел, прост, универсален в применении)\n\nЭффективность узла- 60-75%\n\nНа петле со стороны свободного конца требует контрольку, так как ползет при переменной нагрузке.\n\n## Полуторный булинь:\n\nИмеет меньшую склонность ползти при переменной нагрузке, чем беседочный узел.\n\nЗавязывается беседочный узел, затем свободный (рабочий) конец по новой частично повторяет узел (похожая механика использовалась при завязывании встречного проводника и встречной восьмерки).\n\nТребует контрольку.\n\n## Казачий узел (обратный булинь):\n\nКак утверждается, в отличие от беседочного узла, не развязывается и отлично держит как постоянную, так и переменную нагрузку.\n\nПо сути, похож на беседочный узел, отличается от него лишь тем, что свободный (рабочий) конец веревки обматывается вокруг не нагружаемого (основного) конца, а вокруг конечной петли.\n\n## Двойной булинь:\n\nДвойной веревкой формируется петля, через которую просовывается середина веревки и \"перекидывается\" через весь узел (похожая механика использовалась при завязывании двойного проводника и заячьих ушей).\n\nИспользовался для связывания верхней и нижней страховочных обвязок.\n\n## Затягивающиеся петли:\nПростейшая из затягивающихся петель.\n\nВяжется крайне быстро, без опоры внутри петли при натяжении саморазвязывается.\n\n## Древесная удавка:\n\nКогда в лесу необходимо повесить тент,обычно между двумя деревьями натягивают веревку, поверх которой после растягивают сам тент. К первому дереву веревка крепится как раз при помощи древесной удавки, так как после того, как убрать нагрузку, узел легко развязывается.\n\nКо второму дереву веревка крепится при помощи штыков (это название узла).\n\nУзел вяжется одной веревкой вокруг опоры. Опора обносится сначала ходовым концом, который служит для прикрепления веревки, а затем ее рабочим концом, которым непосредственно пользуется турист. Далее ходовым концом веревки делается несколько оборотов вокруг рабочего конца (не менее трех). Затем узел затягивается.\n\n## Карабинная удавка:\n\nВторой способ быстро закрепить веревку на дереве: подходит как для натягивания тента, так и для организации перила при переправе через реку.\n\nНа конце веревки завязывается незатягивающаяся петля (например, восьмерка), за которую к веревке цепляется карабин.\n\nДальше карабин обноситься вокруг дерева и \"встегивается\" в веревку. Веревка натягивается и крепиться ко второму дереву.\n\n## Штыки:\n\nПосле затягивания второго \"полуштыка\" становится незатягивающейся петлей.\n\nВяжется на натянутой веревке, так удается сохранить нужную форму узла.\n\nТребуется завязать не менее 3 штыков плюс обязательно вяжется контролька, так как узел может поползти.\n\nУзлы для привязывания веревок к опоре\nВ целом, для этой задачи подходят все затягивающиеся петли, но необходимо выделить некоторые узлы, которые являются петлями, но без опоры не используются.\n\nСреди таких узлов уже были упомянуты \"штыки\", но их я описал ранее, так как решил не разносить \"штыки\" с \"удавками\" далеко друг от друга, поскольку в походе чаще всего они используются в паре.\n\n## Стремя (выбленочный узел):\n\nЯвляется затягивающимся узлом и применяется для прикрепления тросов к предметам с гладкой поверхностью.\n\nТакже без опоры узел может использоваться как опора для ноги (и в таком виде используется при подъеме человека по вертикально висящей веревке).\n\n## Констриктор:\n\nПрименение: фиксация чего-то веревкой либо самой веревки.\n\nНедостатки: при сильном затягивании практически невозможно развязать.\n\nХорошо затягивается, если он завязан на круглых предметах без острых ребер. После затягивания ходовой и коренной концы веревки идут перпендикулярно оси предмета, к которому крепится веревка.\n\n## Двойной констриктор:\n\nВсе то же самое, что у констриктора, только он еще крепче.\n\n## Схватывающие узлы:\n\nЭто специальные подвижные узлы, применяемые в альпинизме, скалолазании и спелеотуризме. Предназначены для автоматической фиксации на веревке при срыве.\n\nМогут применяться для натяжения веревки (в системе полиспаст), для верхней страховки, для самостраховки на вертикальной веревке, при подъеме (работает как жумар), при спуске и т.д.\n\nОбычно схватывающие узлы вяжутся из замкнутой петли репшнура. При завязывании схватывающие узлы необходимо тщательно расправлять и подтягивать, иначе возможно проскальзывание узла по веревке, что из-за высокого трения ведет к перегреву и как следствие, расплавлению репшнура. При сильном рывке схватывающий узел может разрушить оплетку основной веревки.\n\nВероятность проскальзывания зависит также от отношения диаметров репшнура и основной веревки. Чем это отношение больше, тем лучше.\n\nСхватывающие узлы не рассчитаны на динамический рывок.\n\nЭффективность узла - 69,1-73,5%\n\nУзел завязывается репшнуром (6-7мм) на основной веревке (диаметром 9-14мм). Контрольный узел не нужен, если репшнур предварительно завязан в петлю узлом “встречный” или “грейпвайн”.\n\nПри страховке перемещается рукой вверх или вниз по основной веревке. Срабатывает при нагрузках в любом направлении. Плохо работает на мокрой или обледенелой веревке.\n\nСуществует два варианта узла - прямой и обратный. Прямой вариант обычно применяется для натяжения навесной переправы (вяжется из двойного 6-8мм репшнура, при этом делается 4-6 оборотов петли вокруг веревки снизу вверх(от себя)).\n\nОбратный вариант узла часто применяется для самостраховки на вертикальных перилах (как и прусик). При этом делают 3, максимум 3 оборота петли вокруг перильной веревки сверху вниз.\n\n## Узел Бахмана:\n\nУзел является разновидностью “схватывающего” и может применяться в тех же целях.\n\nДля самостраховки применяется достаточно редко.\n\nКарабин своей длинной стороной прикладывается к основной веревке. Репшнур простегивается в карабин, складывается вдвое и 2-4 раза обматывается вокруг основной веревки и длинной стороны карабина, при каждом витке простегиваясь через карабин.\n\nПод нагрузкой репшнур прижимает карабин к веревке и исключает его перемещение.\n\nВ отличие от прусика, для которого есть строгие правила перемещения узла вдоль веревки, карабин в узле Бахмана играет роль ручки, за которую можно вести узел вдоль веревки. Если карабин нагружен весом(либо страхует человека),то он должен быть замуфтован.\n\nДополнительные узлы\n## Бухтование веревки \"восьмеркой\":\nСамый предпочтительный способ бухтования веревки, особенно длиной от 20м и больше.\n\nБухта при таком способе удерживается одной рукой, а другая делает петли по обе стороны от руки. Конец каждой петли обязательно должен входить в удерживающую руку с той же стороны, с которой начинался этот оборот петли. Сматывать бухту желательно в сторону свободного незакрепленного конца.\n\nЕсли веревка слишком длинная, чтобы удерживать ее одной рукой в сложенном состоянии (от 50м), обычно ее укладывают на шею сзади головы так, что петли восьмерки спускаются по левому и правому плечу.\n\nКогда практически вся веревка будет сложена восьмеркой и останется свободный конец длиной примерно метра два-три, наступает время фиксировать конец специальным маркировочным узлом, который предотвращает произвольное разматывание веревки.\n\nНа рисунке представлена приблизительная схема маркировочного узла. Видов маркиров очень много и каждый завязывает в целом так, как ему показал кто-то чуть более опытный.\n\nВ чем основная суть узла?\n\nВ идеале, нужно сформировать одну или две минипетли (максимум вполовину от размера остальных петель бухты). затем оставшийся свободный конец наматывается вокруг бухты от одной петли к другой либо к единственной петле до тех пор, пока веревка почти не закончится. Оставшийся микроконец просовывается в петлю и она затягивается с другой стороны этой обмотки (на рисунке это крайняя левая картинка).\n\nтаким образом, затянутая минипетля фиксирует свободный конец веревки, который в свою очередь обмоткой держит все петли вместе.\n#ОПнашивки"},{"t":"Нашивка «Повар»","cat":"Нашивки","b":"Без повара не обойдется ни один поход. От его труда зависит и здоровье ребят, и их силы, и их настроение. И не всегда можно позвонить маме, чтобы узнать, как варить кашу без комочков, - все секреты надо знать заранее!\n\n## Повар должен:\n\n## До похода:\n1. Составить раскладку на поход.\n2. Подсчитать вес продуктов.\n3. Собрать мешочки и другую тару для продуктов, упаковать продукты.\n\n## В походе:\n1. Самостоятельно сварить два раза на полевой кухне обед из 2-х блюд (один мясной) и два раза приготовить иную еду.\n2. Соблюдать во время приготовления пищи все правила гигиены.\n\n## После похода:\n1. Составить список оставшихся продуктов и сдать продукты на хранение.\n2. Собрать все мешочки от продуктов и сдать на хранение завхозу.\n\n## Полезная информация:\n\nСоставление раскладки\nРаскладку составляют, исходя из количества граммов продукта на человека:\n\nХлеб - 80\nБулка - 80\nПаштет - 25\nКрупы - 60\nМанка - 60\nГеркулес - 50\nСухое молоко - 15\nСухофрукты - 30\nКофе - 2\nПеченье - 50\nСушки - 50\nКетчуп - 20\nМакароны - 100\nСухой суп - 30\nВаренье - 30\nСахар - 20\nКакао - 12\nТушеное мясо (консервы) - 100\nМасло растительное - 25\nСыр - 30\nРыбные консервы - 70\nСгущенное молоко - 40\nКонфеты - 15\nЧай - 2\nСоль - 15\nРис - 70\nКартофель (для супа) - 75\nКартофель (для второго блюда) - 350\nМорковь - 2 шт. на 10 чел\nЛук - 2 шт. на 10 чел\nСвекла - 2 шт. на 10 чел.\nКапуста - 1,5 кг на 10 чел.\n\nЛист бумаги расчерчивается на четыре столбика.\n\nПервый столбик: меню. Пишется то, что вы будете готовить, например: манная каша, бутерброд с вареньем, чай с сахаром.\n\nВторой столбик: раскладка на 1 человека. Перечисляются ингредиенты, которые понадобятся для приготовления. Например: манная крупа, булка, варенье, чай, сахар, соль, сгущенка.\n\nТретий столбик: вес продуктов на 1 человека. Напротив каждого продукта пишем необходимое количество в расчете на одного человека (см. выше).\n\nЧетвертый столбик: вес на отряд. Пишется кол-во граммов на весь отряд.\n\nВ конце таблицы подводится итог, что и сколько надо с собой взять. Но не стоит принимать безоговорочно получившиеся цифры. Помните, что соль и сахар обычно добавляются по вкусу. Чай рассчитываем следующим образом: берем 4 пакетика в чайник и 5 пакетиков, если вы завариваете в котле.\n\nПравила гигиены и хранения продуктов\n\n· Продукты в походе хранятся в продуктовой палатке в полиэтиленовых мешках. Вынимаются только завхозом или поваром.\n· Сахар удобно нести в бутылках, а не в мешках.\n· Если у вас с собой такие продукты как сыр или сосиски, то они ОБЯЗАТЕЛЬНО готовятся в первый день, если вы про них забыли - есть их категорически запрещается.\n· По дороге мы НЕ собираем никакие грибы, ягоды, тем более не готовим грибной суп.\n· Категорически запрещается пить некипяченую воду.\n· Любые овощи, прежде чем их кидать в котел, моют.\n· Не стоит размешивать одним половником суп и гречку, лучше сполоснуть, впрочем, как и нож, которым вы только что рубили тушенку, а теперь намазываете джем.\n· Повар должен проследить, чтобы все перед едой вымыли руки и чтобы кухонные приборы были чистыми.\n· Все пищевые отходы выкидываются в мусорную яму.\n· На столе после готовки не должно оставаться продуктов.\n· После еды кухонные приборы должны быть помыты и поставлены сушиться на специальные сушилки.\n· Посуда моется только в специально отведенном месте.\n· Любая посуда после мытья обязательно ополаскивается горячей водой.\n· Тщательно смывайте песок или средство, которым моете посуду.\n\nСоветы с половником в руках\n\n· Сахар, если его не положили до того, как каша начала загустевать, надо сначала развести в кипятке в отдельной кружке. Это касается рафинада, а не сахарного песка.\n· Если к моменту, когда каша начала загустевать, в костре образовалось достаточно углей, лучше снять ее с огня и поставить доходить на угли. Так каша не пригорит.\n· Если каша получилась недосоленная, надо развести нужное количество соли в кипятке, влить этот раствор в кашу и тщательно перемешать. Засыпать соль в загустевшую кашу нельзя - соль не разойдется. Если, напротив, каша получилась пересоленная, дайте попробовать ее остальным. Если все находят, что соли слишком много, залейте кашу кипятком, перемешайте и слейте воду. А если вдруг суп оказался пересолен, положите туда несколько ломтиков сырой картофелины и немного проварите его, затем картошку выбросите.\n· Никогда не сластите чай прямо в чайнике: в отряде могут быть люди, которые пьют несладкий чай. В походе не стоит заваривать чай прямо в ведре - используйте маленький котелок вместо заварного чайника. Заваренный чай не кипятите - исчезнут вкус и аромат.\n· С рыбными консервами готовят только рис.\n· Перед тем как положить мясо, спросите, есть ли в отряде вегетарианцы и, если есть, положите им отдельную порцию без мяса.\n· Пустые консервные банки обжигаются, плющатся топором и берутся с собой до ближайшего населенного пункта, где и выбрасываются.\n\n## Варим суп:\n\nВода ставится заранее. Котел для супа всегда больше котла для второго. Все овощи моются и режутся до того, как их забрасывают в котел!\nКогда вода закипит, бросаем сначала в нее морковку/свеклу/капусту, потому что они долго варятся, а резать их стоит мельче. Через 10 минут закидываем картошку (обычно 8-10 штук на отряд хватает). Лук разрезают пополам и кидают одновременно с картошкой. Когда овощи почти сварились (время будет зависеть от огня, на котором вы готовите), мы засыпаем сухой суп (4-5 пакетиков), специи (аккуратнее с перцем) и тушенку (1-2 банки на котел). Тушенку перед тем, как кидать в суп, надо открыть, снять ложкой и выкинуть слой жира, затем нарубить мясо прямо в банке ножом, чтобы в супе не плавал один большой кусок. Когда солите суп, учитывайте, что суп в пакетиках содержит соль! Суп надо периодически мешать.\n\n## Варим манную кашу на сухом молоке:\n\nПока вода кипит, сухое молоко разводится отдельно в тарелочках и тщательно размешивается от комочков. После того, как вода закипела, снимаем котел с костра, выливаем в воду разведенное сухое молоко. Тонкой струйкой засыпаем манную кашу, второй человек в это же время тщательно ее размешивает (иначе будут комочки). Манка готовится еще минут 10, хотя внешне она выглядит уже готовой мгновенно. Ставим на костер, чтобы каша приготовилась окончательно, при этом мешая ее, чтобы не было комочков и не пригорела. Снимаем с огня и добавляем сахар.\n\nЕсли есть сгущенное молоко, манную кашу варят так же, как и на сухом, только не надо разводить молоко на тарелке, и вряд ли нужна добавка сахара - попробуй на вкус, повар!\n\n## Варим рис:\n\nРис до приготовления промываем в холодной воде. Для рассыпчатого риса придется по часам следить за временем варки. В соленый кипяток засыпают рис и затем варят его 18-20 минут, не больше. Все это время вода должна кипеть, но не бурно, иначе она может выкипеть раньше, чем рис сварится. За 2-3 минуты до конца варки в кашу добавляют лавровый лист и несколько горошинок перца, затем снимают с огня и сливают всю воду.\n\nЧтобы приготовить вязкую рисовую кашу, рис засыпают в соленый кипяток, доводят до кипения и варят минут пятнадцать, затем сливают лишнюю воду, добавляют молока и сахара по вкусу. После этого нужно поставить кашу вариться еще минут 8-10 на медленном огне или на углях. Если нужно положить в кашу чернослива, надо его предварительно замочить в кипятке, чтобы он разбух.\n\n## Варим гречу:\n\nДля рассыпчатой гречки крупу надо предварительно чуть-чуть обжарить на сковородке, противне или на дне свободной кастрюли. После этого зернышки крупы становятся тверже, они не трескаются и не рассыпаются при варке. Затем крупу засыпают в соленый кипяток и варят до готовности. Обычно на это уходит минут 30-40. Готовность каши определяется на глаз и на вкус. Для рассыпчатой гречневой каши воды надо взять 2-3 кружки на кружку крупы.\n\nВязкая гречневая каша варится точно так же, но при этом не требуется предварительного обжаривания крупы, а воды берется больше: 7-8 кружек на кружку крупы.\n\n## Варим пшено:\n\nПеред варкой пшено надо тщательно промыть в холодной, а лучше - в теплой воде, перетирая крупу в ладонях (иначе каша будет горькой). Пшено промывают 3-5 раз, каждый раз сливая воду. Если условия бивака не позволяют промыть пшено, лучше сварить какую-нибудь другую кашу. После того как пшено тщательно промыто, его предварительно заливают кипятком (чтобы вода немного покрывала его), быстро доводят до кипения и сливают воду. Остаток горечи уйдет со слитой водой. После этого заливают крупу как следует кипятком, солят, если надо - добавляют молоко и сахар и варят минут 30-40.\n\n## Варим перловку:\n\nПерловую крупу перед употреблением промывают в холодной воде, затем засыпают в несоленый кипяток и после закипания варят минут сорок на медленном огне, следя за тем, чтобы вода не выкипела. Солят кашу, когда она уже готова, после чего ее надо немного подержать на огне и снимать.\n\n## Варим вермишель, макароны, лапшу:\n\nВермишель варят строго по часам. Ее засыпают в соленый кипяток, доводят до кипения и варят ровно 8 минут, после чего сливают. Если вермишель переварить, получится невкусная каша. Макаронам надо вариться после закипания минут 18-20, лапше - минут 15-18. На картонных пачках, в которых они продаются, указан способ приготовления.\n\n## Варим компот:\n\nБерутся сухофрукты и тщательно, не один раз, промываются, затем засыпаются в почти кипящую воду вместе с сахаром и варятся там, пока не размякнут до мягкого состояния.\n\nВот вы начинаете готовить, и сразу впадаете в растерянность - сколько нужно брать продуктов на варку? В пол-литровую кружку входит (в граммах): манки - 370, гречки -400, пшена - 410, овсянки - 350, гороху - 420, лапши (ломаной) и вермишели - 210. В столовую ложку, наполненную в обрез с краями, помещается (в граммах): масла (топленого или сливочного) - 15, сахарного песку - 12, сгущенного молока - 15, сухого молока - 8, соли - 15. Но учтите, что эти цифры приблизительны (вес крупы зависит от влажности, а количество масла или сахара в ложке - от того, ли вы берете ложку вровень с краями или с небольшой горкой). А сколько брать воды? На каждую кружку крупы потребуется следующее количество кружек воды: манка: 7-8, гречка: 7-8, пшено 6, овсянка 8, геркулес 3, рис 7, перловка 5, горох, бобы, фасоль: 3-4. Для супа надо брать крупы или макаронных изделий из расчета 30-40 г на литр воды, манки - меньше, граммов 20-25.\n\nПРИЯТНОГО АППЕТИ…"},{"t":"Нашивка «Журналист»","cat":"Нашивки","b":"## Требования к нашивке:\n## Требования к теоретической части:\n1. Журналистская этика.\n2. Факт и информационный повод.\n3. Жанр и жанровая теория.\n4. Особенности заметки, репортажа, интервью, зарисовки, путевых заметок, отчета.\n\n## Требования к практической части:\n1. Соблюдать журналистскую этику.\n2. Самостоятельно сформулировать вопросы для интервью и заголовки в своих материалах.\n3. Взять интервью у незнакомого или малознакомого человека.\n4. Грамотно, интересно и логично написать заметку, интервью и репортаж; сдать их редактору общелагерной газеты для опубликования. (Сдать - это отдать материал редактору, выслушать замечания, исправить, вернуть исправленный текст и услышать, что твой материал принят для опубликования.\n5. Сдать не менее пяти речевых игр.\n\n## Теоретическая часть:\n\nФакт - непосредственно произошедшее событие, явление.\nФакт: достоверный, имеет источник, проверяемый.\n\nФактоид - изначально несуществующий «факт», который, будучи опубликованным в медиа, получает живую реакцию и оценку.\nМнение - это точка зрения человека, группы людей и общества по тому или иному вопросу или проблеме\n\nВажно! Перед ссылкой на какой-то факт - проверь его (проведи фактчекинг). Достоверный факт подтверждается как минимум 3 разными источниками, минимум два из которых не анонимны.\n\nНайти первоисточник.\nСпросить противоположную сторону.\nЕсть точность, детали.\nМожет подтвердить более 2-х экспертов/свидетелей.\nИнформационный повод (инфоповод) - событие, которое может заинтересовать публику: читателей, зрителей или слушателей, оно позволят создать новость и является её основой. ИП должен содержать НОВОЕ и ЗНАЧИМОЕ.\n\n## Черты, определяющие инфоповод:\n1. Массовость\n2. Заявка на рекорд\n3. Вовлеченность известной личности/ньюсмейкера\n4. Привязка к празднику/значимому событию\n5. Что-то из ряда вон\n\nЖанр - форма подачи журналистских мыслей, «упаковка» текста.\n\n«Устойчивая форма журналистского произведения, объединённая содержательными и формальными признаками»\n\nВ современной журналистике жанры сплетаются, образуя конвергентную, «смешанную» журналистику. «Чистые» материалы встречаются редко, но знание отличительных черт помогает определить основной жанр.\n\nПублицистика - проблемный материал на актуальную, злободневную для общества тему, ориентированный на множество читателей, с ярко выраженной авторской позицией, чередованием эмоциональных и логических доводов, с предложением выхода из создавшейся ситуации.\n\nЗаметка\nЗаметка\nМетод перевернутой пирамиды (ЛИДа) (используется для скорости чтения, удобства понимания и редактирования):\nЗаголовок - название материала, которое должно привлечь читателя\nЛид - 2-3 простых предложения, которые объясняют суть события и отвечают на вопросы: Что? Кто? Когда? Где?\nТело (Body) - основная часть, которая более подробно описывает происшествие: Как? Кто видел? Что сказал?\nБэк (бэкграунд) - завершение новости, которое связывает её со всем остальным информационным миром.\n\nИнтервью (англ. слово). Два значения: метод работы и беседа.\nНастрой журналиста: заинтересованность, ценность собеседника.\n\nВопросы должны быть заранее, в большом количестве, разных типов (закрытые - «да», «нет», открытые - нет однозначного ответа), а темы выбраны заранее. Основные вопросы - всегда заготовка, а второстепенные, уточняющие, наводящие, альтернативные, провокационные и так далее могут появляться по ходу интервью, но задавать их нужно осторожно. Это не допрос и не обвинение! Собеседник - твой гость.\n\nВиды интервью\nВиды интервью\nИногда вопросы нужно отправить собеседнику заранее, готовый вариант интервью перед публикацией предлагать гостю для прочтения и согласования нужно всегда.\n\nЖурналист может менять свои вопросы и высказывания при правке текста, но никогда не должен менять их смысл. Исправлять высказывания собеседника можно только для того, чтобы убрать речевые ошибки.\n\nРепортаж. От латинского слова «Reportare» - передавать. Жанр появился в середине XIX в. в Англии. «Взгляд очевидца».\n\nА) Автор - всегда свидетель. Поэтому «с места события» - бессмыслица.\nБ) Пишется в настоящем времени, «эффект присутствия», о том, что перед глазами.\nВ) Постоянно отвечать на вопрос «Как?»\nГ) Важны обстановка, детали, картинки, разговоры. Сопереживание, эмоциональность.\n\nНужно с первой фразы заинтересовать читателя. Представь, что разговариваешь по телефону и тебе нужно максимально подробно описать происходящее, чтобы собеседник почувствовал, что стоит рядом с тобой и видит то же самое.\n\nВиды репортажа\nВиды репортажа\nОтчет. Один из старейших жанров. Кто и что сказал на конференции, кто и что сделал на мероприятии.\n\nВиды отчета\nВиды отчета\nПутевые заметки. Трэвел-журналистика. Важна познавательность, реальные факты, диалоги, картинки. Всегда есть авторское мнение, эмоциональность, мысли могут быть на любую тему, но имеют связь с окружением (тем, про что рассказываешь). Неофициальный, живой язык.\n\nЗарисовка - художественное описание природы, обстановки, человека, мыслей. Необходимо усилить наблюдательность за окружающим миром, постоянно искать интересное в обычных вещах и заворачивать впечатления в слова, т.е. «набить» руку. В зарисовке всегда показаны две стороны - сам автор и то, с чем он встретился: другой человек или люди, животные и так далее.\n\nЖурналистская этика\n\nЖурналист с уважением относится к личной жизни людей, к их праву на соблюдение тайн, но при этом журналист выступает на стороне общества, а не отдельных личностей. Для получения информации журналист обязан пользоваться честными способами и надежными источниками. В тексте, написанном журналистом, должно быть хорошо понятно, где приведен факт, а где высказано мнение. Право журналиста - высказывать свою точку зрения и критиковать, если надо, руководство. Обязанность журналиста - писать правду, защищать справедливость и помнить, что свобода слова должна быть ограничена законом. Если журналиста заставляют писать неправду, он обязан отказаться от такого задания.\n\n## Полезные ссылки:\n\nГде можно проверить тексты?\n1. https://text.ru/\n2. https://glvrd.ru/\n\n## Что почитать про тексты:\n1. «Пиши. Сокращай» М.Ильяхов, Л.Сарычева\n2. «Слово живое и мертвое» Нора Галь\n3. Краткий курс бойца с канцеляритом https://www.timuroki.ink/thewritingdead\n\n## А тут про этику:\n- Догма Ведомостей\n- Кодекс профессиональной этики российского журналиста http://www.ruj.ru/_about/code_of_professional_ethics_of_the_russian_journalist.php\n\n## Речевые игры:\n\nВо всех играх со словами используются существительные именительного падежа единственного числа (множественное число допустимо только тогда, когда слово в ед. ч. не употребляется, например, «очки»). Продолжительность игры устанавливается заранее. Значение слов должно быть известно играющему. Ласкательно-уменьшительные слова, имена собственные в речевых играх запрещены.\n\n«Наборщик».\nВозьми длинное слово и составь из имеющихся букв (это важно! Именно из имеющихся букв!) как можно больше слов.\nНапример, из слова «электропоезд» легко составляются «поезд», «лектор», «крот», «клоп», «лето», «рок», «ток» и т.д.\n\n«Лестница».\nВыбирается любая буква, кроме твердого - мягкого знаков, ы, й. Задача - вспомнить как можно больше существительных на эту букву. Каждое новое слово должно быть длиннее предыдущего на одну букву. Сложнее всего придумать слово на две буквы. В крайнем случае вы можете договориться группой и поставить на это место междометие. Пропуски между словами (например, вы придумали слово из пяти букв и из семи, а из шести не смогли) ведут к тому, что вашим лучшим результатом будет слово из пяти букв. Выигрывает тот, кто составил самую длинную лестницу без пропусков ступенек-слов.\n\n«Сумасшедший алфавит»\nНа листочках пишутся колонки: имя м, имя ж, животное, растение и город (усложни или сделай легче по желанию). Водящий проговаривает про себя алфавит на любой скорости, дети хором говорят стоп. Какая буква выпала, на ту и пишут слова в колонки. Время, подсчет очков регулируй по ситуации.\n\n«Тик-так-бум»\nУ вас есть бомба (это любой предмет). Передавайте её по кругу, называя слова на заданную тему, пока бомба не взорвется)"},{"t":"Нашивка «Лагерник»","cat":"Нашивки","b":"Комендант - это хозяин лагеря. Он выбирает площадку для лагеря (по согласованию с руководителем)\n- определяет места для палаток, костра;\n- предпринимает меры по сохранности туристского инвентаря;\n- отвечает за чистоту в лагере и его экологическое состояние.\n\n## Комендант лагеря должен:\n\nУметь устраиваться на биваке, быстро располагаться в палатке или шалаше.\nСоблюдать гигиену, правила безопасности туристской стоянки. Комендант отвечает за аккуратный вид стоянки.\nУметь строить лагерные патенты.\nЗнать, какой инвентарь в лагере нужен, и уметь с ним обращаться.\n## Полезная информация:\n\nПостановка лагеря\n\nТуристский бивуак (бивак) - это место, где туристы питаются, спят и готовятся к дальнейшему пути;\n- это костер, укрытие от непогоды;\n- это отдых участников похода.\nВ зависимости от продолжительности биваков они подразделяются на малый привал, обеденный привал, ночлег, дневку. Организация привала или ночлега заключается в том, чтобы правильно выбрать для него место, хорошо подготовить площадку, поставить палатку, развести костер и обеспечить безопасность лагеря от стихийных сил природы. Место для бивака подыскивается не позднее, чем за 2 часа до наступления темноты, и выбирается с учетом наличия: летом - воды, зимой - топлива для костра.\n\n## В лагере должно быть:\n\nОкопанный костер, сиденья под тентом.\nКухня (возможен отдельный костер, где никто не ходит, кроме дежурных).\nМесто для туалетов (учитывая ветер и рельеф).\nМесто для инструментов (как правило, пилы кладутся под бревно, топоры втыкаются в пень).\nМесто для аптечки.\nМесто для продуктов (продуктовая палатка, патент).\nПоленница, защищенная от дождя.\nСушка для одежды: тренога из жердей с натянутыми веревками для развески одежды.\nСушилка для кружек, мисок.\nПомойная яма для органических отходов.\nОтдельно стоящий мусорный пакет для неорганических отходов.\nУдобные подходы к воде.\nПри постановке лагеря\n\nСразу распределить задачи для участников похода: костровой выбирает место для костра, натягивает тросик (ставит перекладину), собирает хворост.\nВодоносы (2 человека) сразу достают котлы и идут за водой, после этого оборудуют умывальники. Повар забирает у завхоза продукты и начинает готовить. 2 человека натягивают тент, потом идут за дровами. 2 человека ставят палатки. Остальные - за дровами. Если скоро стемнеет, то все сразу идут за дровами!\nПосле этого все достают пенки, застилают места в палатке, переодеваются в сухое. Проводится осмотр на наличие клещей. Медик оказывает помощь (случаются мозоли, насморк и прочие досадные неприятности). Реммастер проверяет и ремонтирует снаряжение.\nРаспределяется время ночного дежурства на стоянке. Запас дров необходимо укрыть от сырости, инструменты убираются под тент.\nЕсли предполагается дневка, то можно соорудить вокруг очага на безопасном расстоянии сиденья из бревен или напиленных чурбаков.\n## Правила постановки палатки:\n\nПалатка ставится спиной к ветру, выходом к костру, на расстоянии не менее 5 метров от костра (во избежание возгорания и прожигания искрами), не в низине, чтобы не текла вода.\n\nСтойки не должны прорывать дно или верх палатки. Колышки должны держаться крепко. Возможно крепление за деревья, камни и т.п. Верхний тент не должен касаться палатки, чтобы не копился конденсат. Палатка окапывается, делается водоотток в сторону спуска.\n\n## Правила и техники безопасности при пилке и колке:\n\nТопор и пила транспортируются в только чехле.\n\n## Правила пилки:\n\nКогда один тянет на себя, второй отпускает, иначе первому пильщику придется еще и вытягивать другого. Толкать пилу не нужно. Она от этого гнется и застревает.\nПилу держим ровно, чтобы она не застревала и двигалась плавно, как смычок скрипки.\nЧтобы пилу не зажало, под место распила кладется бревно. Если дерево очень толстое, можно в место распила вставить топор или клин.\n## Правила колки:\n\nПри колке дров необходимо, чтобы полено стояло ровно и на твердой колоде (пне), топор крепко держался на топорище, спереди и сзади по плоскости удара никого не было. Ноги дровосека должны быть широко расставлены.\nДерево рубится наискосок.\nТопор на землю не бросать и в стоящее дерево не втыкать.\nТехнические места лагеря\n\nВыше по течению реки располагается место для забора воды, ниже - место для купания.\n\nЗа пределами стоянки со стороны кухни выкапывается помойная яма, глубиной около 1 м, куда сбрасываются остатки пищи и сливается вода при мытье посуды. Периодически помойку засыпают песком и золой.\nВ лагере должна быть чистота, вещи не разбросаны. Посуда хранится только чистой.\n\nПри мытье посуды соблюдаются следующие правила: воду для мытья посуды берут там же, где и для приготовления пищи. В водоеме посуду не моем. Ни в коем случае пищевые отходы нельзя смывать в воду или оставлять на берегу.\n\nТуалеты\n\n· Место для туалетов выбирают в 200-250 метрах от лагеря в густых зарослях, с учетом господствующего направления ветра, чтобы запахи уносились прочь.\n\n· Нельзя располагать туалеты вблизи источников воды и выше (по рельефу местности) расположения стоянки. Мужские и женские туалеты оборудуются отдельно.\n\n· Для устройства туалета выкапывается длинная канава, на которую кладется решетка из досок или слег (жердей). Вокруг туалета ставятся стенки из непрозрачного полиэтилена, который можно закрепить на растущих вблизи деревьях или каркасе из жердей. Уровень стенок должен соответствовать росту туристов. Желательно оборудовать простейший навес, чтобы туалетом можно было пользоваться во время дождя.\n\nОставление стоянки\n\nСтоянки не возникают просто так. Обычно их организуют рядом с тропами, в местах, где рядом есть вода и дрова. Тем обидней, когда на стоянке, откуда открываются красивые виды, оставлен мусор и беспорядок. Утром, прежде чем уйти, окиньте хозяйским взглядом ставшую такой уютной и приветливой стоянку. Чисто ли после вас? Оставлен ли запас дров и сухая растопка в недоступном для дождя месте? Сделайте все так, как будто вы придете сюда завтра сами сильно уставшие, промокшие и замерзшие."},{"t":"Нашивка «Гитарист»","cat":"Нашивки","b":"## Требования к нашивке:\n## Требования к теоретической части:\n1)Знать устройство акустической гитары, её разновидности и различия.\n2)Знать 2 лагерных гимна наизусть.\n3)Знать стандартный гитарный строй Ми.\n4)Знать что должно входить в стандартный набор гитариста-любителя.\n5)Знать правила хранения и транспортировки гитары.\n\n## Требования к практической части:\n1)Знать и уметь ставить основные аккорды.\n2)Знать и уметь играть основные гитарные бои и переборы.\n3)Уметь играть медиатором.\n4)Уметь играть стоя.\n5)Уметь настраивать гитару по тюнеру за 3 минуты.\n6)Сдать 2 лагерных гимна под гитару + 2 любые песни боем + 2 любые перебором. Необходимо при этом проговаривать слова песни.\n7)Добавить песню с аккордами в песенник Оранжевой Планеты.\n8)Выступить с гитарой на лагерном мероприятии.\n\n## Теоретическая часть:\nАвторская песня, или бардовская музыка - песенный жанр, возникший в середине XX века в разных странах.\nЕго отличительными особенностями являются совмещение в одном лице автора музыки, текста и исполнителя, гитарное сопровождение, приоритет значимости текста перед музыкой. Поначалу основу жанра составляли студенческие и туристские песни, отличавшиеся от «официальных» (распространявшихся по государственным каналам) доминирующей личностной интонацией; а также живым и неформальным подходом к теме.\nОтдельные произведения жанра появились ещё в 1930-х годах.\n\nШирокую популярность приобрела авторская песня в середине 1950-х годов, с появлением магнитофона. Чаще всего (хотя и не всегда) исполнители песен жанра «авторская песня» являются одновременно авторами и стихов, и музыки. Иногда термины «авторская песня» и «бардовская песня» употребляют как синонимы. Но, например, Владимир Высоцкий категорически не любил, чтобы его называли «бардом» или «менестрелем». Хроники показывают, что в 1950-х и начале 1960-х годов наиболее употребителен по отношению к жанру был термин «самодеятельная песня» - его, в частности, применяли и сами авторы.\n\n## Конструкция гитары:\nГитара представляет собой корпус с длинной шейкой, называемой «грифом». Лицевая, рабочая сторона грифа - плоская либо слегка выпуклая. Вдоль неё\nпараллельно натянуты струны, закреплённые одним концом на подставке корпуса, другим - на колковой коробке на окончании грифа. На подставке корпуса струны привязываются или крепятся неподвижно при помощи барашков, на головке грифа с помощью колкового механизма, позволяющего регулировать натяжение струн. Струна лежит на двух порожках, нижнем и верхнем, расстояние между ними, определяющее максимальную длину рабочей части струны, является мензурой гитары. Верхний порожек находится в верхней части грифа, около головки. Нижний устанавливается на подставке на корпусе гитары.\n\nСтандартный гитарный строй\nСтандартный гитарный строй\n## Основная классификация акустических гитар:\n\n1) Классическая гитара.\n## Классическая гитара имеет ряд особенностей:\nА) Используются струны из синтетики: нейлона, реже - карбона.\nБ) Гриф гитары более широкий, что позволяет легче прижать нужную ноту, но с другой стороны, требует больших усилий при игре.\nВ) У классических гитар между головкой грифа и корпусом гитары расположено только 12 ладов, а не 14, как у остальных.\n\n2) Фолк-гитара - акустическая гитара, напоминающая классическую, но приспособленная к использованию металлических струн.\n\n3) Дредноут (вестерн) - гитара с металлическими струнами и увеличенным корпусом характерной «прямоугольной» формы. Обладает повышенной по сравнению с классическим корпусом громкостью и преобладанием низкочастотных компонентов в тембре.\n\n4) Джамбо - инструмент с металлическими струнами, большим корпусом, плоской верхней декой и округлыми линиями обвода.\n\n## Основные приемы игры на гитаре:\n1)Бой - например, вниз большим пальцем, вверх указательным, вниз указательным с заглушкой, вверх указательным.\n\n2)Перебор - извлечение звука с помощью последовательного чередования (перебора) струн. Исполняется путём последовательного защипывания разных струн несколькими пальцами.\n\n## Основные аксессуары для гитары:\n1)Медиатор - небольшая пластинка (из пластмассы, кости, металла) толщиной 0,1-1 (иногда до 3) мм, используется для звукоизвлечения.\n\n2)Гитарный ремень - ремень из прочного материала (кожа или синтетика), позволяющий гитаристу удобно исполнять композиции стоя.\n\n3)Тюнер - электронное устройство, упрощающее настройку гитары путём визуальной индикации точности настройки каждой струны.\n\n4)Шестигранный ключ - т. н. «анкерный», для регулировки прогиба грифа (и, соответственно, расстояния между струнами и порожками ладов) у многих современных гитар путём ослабления-натяжения анкерного стержня. Такой же ключ, но меньшего размера используется для непосредственной и точной регулировки зазора между струной и грифом на некоторых моделях электрогитар.\n\n5)Вертушка - приспособление, облегчающее намотку струн; представляет собой насадку-удлинитель ручки колкового механизма.\n\n6)Чехол для удобной и безопасной транспортировки инструмента, а также его хранения.\n\n## Полезные советы по хранению гитары:\n1) Относительная влажность воздуха должна составлять 40-60%, температура 10-25 С\n\n2) Держать гитару в комнате не в углу, а вдоль стены. В углах воздух более влажный.\n\n3) Не вешать гитару под потолок. Со школы все мы помним, что сверху в комнате воздух более теплый и сухой.\n\n4) Хранить гитару на расстоянии не менее 1-1,5 м от батарей и обогревателей во избежании пересушивания дерева.\n\n5)Не держать гитару под воздействием прямых солнечных лучей, даже зимой, потому что даже будучи отраженными от блестящих поверхностей, они могут вызывать излишнее напряжение древесины, что может привести к растрескиванию лака.\n\n6)При длительном хранении ослаблять натяжение струн во избежании прогиба грифа.\n\nТранспортировать гитару рекомендуется осторожно, избегая ударов, намокания и нагревания. Зимой гитару нужно переносить в утепленном чехле, чтобы избежать сильного охлаждения корпуса. Любой перепад температуры сказывается на дереве.\n\nСтоит обратить внимание на хранение гитары в полевых условиях. Необходимо поддерживать оптимальную температуру и избегать намокания. Располагать гитару близко к костру крайне не рекомендуется. После использования убирать в чехол. Ночью хранить в палатке.\n\n## Настройка гитары:\n\nНастраивать гитару можно на слух или с помощью специального цифрового тюнера/ различных приложений на смартфон.\nНастраивать гитару можно на слух или с помощью специального цифрового тюнера/ различных приложений на смартфон.\nАппликатуры базовых аккордов\nАппликатуры базовых аккордов\nДанный аккорд также является базовым, но берется при помощи приема баррэ.\n\nБаррэ - приём игры на гитаре, когда указательный палец играющей на грифе руки, зажимает одновременно все или несколько струн на грифе.\n\nДля обучающихся игре на гитаре баррэ является достаточно трудным приёмом. Однако, несмотря на свою трудность, баррэ - обязательное требование к гитаристу любого уровня. Приём баррэ закрепляется на ранних периодах обучения игре на гитаре, так как не зная данного приёма, невозможно сыграть большую часть аккордов. И хотя существуют приёмы игры на гитаре, позволяющие обходиться без баррэ. Так, аккорды, которые стандартно исполняются только с баррэ, имеют некоторые интерпретации без баррэ.\n\nВ частности, аккорд F можно взять без баррэ, зажав указательным пальцем только шестую струну на первом ладу - нота Фа - основная нота аккорда. Звучание будет иметь другую окраску.\nОднако использование различных интерпретаций аккордов не даёт повода игнорировать приём баррэ и не осваивать его в процессе обучения.\n\nНаглядный пример аккорда F с баррэ\nНаглядный пример аккорда F с баррэ\nСхемы основных гитарных боев\nСхемы основных гитарных боев\n## Основные гитарные переборы:\nПеребор «Шестёрка». Проще перебора и не придумаешь :)\nИграется он следующим образом: (бас) 3 2 1 2 3\n\nПеребор «Восьмёрка». Это уже слегка продвинутый перебор, но освоить его должен каждый. Он имеет следующую структуру: (бас) 3 2 3 1 3 2 3\n\nПеребор «Четвёрка». Перебор имеет необычную структуру: (бас) 3 (2 1) 3\n\nЦифры в скобках означают, что сыграть эти струны необходимо синхронно. Заодно будет повод поупражняться в щипках.\n\nПеребор «Вальсовый». (бас) (3 2 1) (3 2 1) (бас) (3 2 1) (3 2 1).\n\nДва гимна Оранжевой планеты, необходимые для сдачи на нашивку (в карусели):"},{"t":"Нашивка «Барабанщик»","cat":"Нашивки","b":"Барабанщик не просто играет на построении или идет впереди отряда на марше. Музыка воодушевляет людей, придает большую торжественность при подъеме флага или вручении награды, но этого мало. Исторически сложилось так, что барабанщики и горнисты всегда поднимали войска в атаку. Мы ни с кем не воюем, но барабанщики по-прежнему должны подниматься первыми навстречу трудностям (взяться за важное поручение, сказать вслух про несправедливость, кому-то помочь и т.д.). Иначе это не барабанщики, а всего лишь люди, умеющие играть на барабане.\n\n## Теория:\n\nПонимать значения терминов «символы» и «ритуалы».\nЗнать государственную символику.\nЗнать правила проведения построения.\nЗнать историю возникновения барабана.\nЗнать устройство барабана.\nЗнать правила обращения с барабаном.\n## Практика:\n\nУметь показывать знаки барабанщиков, переходы барабана.\nСоблюдать правила игры на барабане, знать команды барабанщиков.\nУметь играть не менее семи маршей.\nУметь играть на ходу.\nПосле того, как барабанщик сдал теорию и практику, ведущий барабанщик разрешает ему игру на построении. Нашивка барабанщика вручается всем сдавшим теорию, практику и игравшим на построении хоть один раз. Посвящение в барабанщики на рассвете дает право быть ведущим барабанщиком.\n\n## Полезная информация:\n\nСимволы - слова, предметы или действия, обозначающие какие-то важные понятия для мира, страны, общества, коллектива и т.д. Символы подчеркивают общие ценности, объединяют людей на основе общих целей и заповедей. Символами, например, являются следопытский галстук, законы и заповеди следопытов, Праздник первого костра и др.\n\nРитуалы - традиционные действия, носящие символический характер. Ритуалы в лагере - это подъем флага, произнесение лагерного девиза, церемония посвящения в следопыты и др.\n\nУ каждого государства есть свои символы и ритуалы. Государственный герб Российской Федерации выглядит так: золотой двуглавый орел на красном щите; над орлом - три короны Петра I (над головами - две малые и над ними - одна большего размера); в лапах орла - скипетр и держава; на груди орла на красном щите - всадник, поражающий копьем змея.\n\nГосударственный гимн Российской Федерации создан на основе советского гимна (музыка Александра Александрова /1939 год/, слова Сергея Михалкова /2000 год/).\n\nУ барабанщиков России тоже есть свой гимн (музыка Григория Рейхтмана, слова Владислава Крапивина /1970 год/).\n\nИстория барабана. Первые упоминания об этих музыкальных инструментах встречаются в древнем Египте, Месопотамии, Шумере (начиная с 5 века до нашей эры). Существует множество легенд об изобретении барабанов (например, к появлению первых ударных привел случайный удар по выдолбленной тыкве или высушенной коже крокодила). Древние племена использовали барабаны при обрядовых танцах и для быстрой передачи сигналов опасности. В современном мире даже существует целая наука - драммология (наука об языке барабанных сигналов). В Европе барабаны активнее всего применялись в немецкой армии. Средневековые барабаны были огромными (их так и называли «большими» или «турецкими»), но постепенно сформировался и тип малого (маршевого) барабана. В России барабаны впервые появляются в полках, сформированных по примеру нидерландских войск (начало XVII века), более распространены они стали в эпоху Ивана Грозного («бубны»). Большую популярность барабаны имели в армии Петра I, который сам хорошо барабанил. У российских скаутов были синие маршевые барабаны, пионерские отряды ввели такие же инструменты, но с красным ободом. Одним из первых пионерских журналов был «Барабан» (1923-1926 годы).\n\nУстройство барабана. Полый фанерный или пластиковый корпус, внутри которого находится пружина, сбоку - отверстие для выхода воздуха. Обручи сверху и снизу закрепляют натянутую мембрану (из кожи или пластика); обручи скрепляются зажимами. К зажимам присоединяется ремень с гнездами для палочек и пряжкой-регулятором длины ремня.\n\nПравила обращения с барабаном. Барабан хранится в сухом теплом проветриваемом помещении, в вертикальном положении, с заправленным под зажим ремнем. Горизонтальное положение барабана приводит к провисанию мембраны, ухудшению звука и в конечном итоге к порче музыкального инструмента. Провислость мембраны регулируется натяжением (ослаблением) зажимов; кожа (пластик) должна быть натянута. Игра под дождем или в сырость губительна для барабана. На маршевом барабане играют специальными палочками, а не руками (иначе точка удара будет слишком большой, и кожа легко прорвется). Барабанщик не должен допускать слишком сильных и резких ударов по коже, иначе можно прорвать ее. Барабанщик хранит барабан от желающих просто так ударить по нему, от попадания на инструмент воды, прямого солнечного света и искр костра. Если барабан взят в поход, хранится он в палатке, в вертикальном положении, укутанным чем-то теплым от ночных перепадов температуры.\n\nПравила игры на барабане. Барабанщики начинают и заканчивают игру в соответствии со знаками ведущего барабанщика. Главное достоинство сводного отряда (патруля) барабанщиков - слаженная и четкая игра. На барабане играют с той стороны мембраны, где натянута пружина. Палочка, ударяя по коже, вызывает колебание пружины, а с ним - резкий колеблющийся звук. На маршевых барабанах можно играть по нотам, а можно - по текстовкам маршей. Каждое слово в марше разбивается на слоги. Один слог - один удар. Все марши начинаются и заканчиваются играть с правой руки (исключение делается для левшей). Слоги «бей, ба» играются двойным ударом правой руки. При игре на два и несколько голосов особое внимание должно уделяться сыгранности группы. На барабане можно менять силу звука: чем ближе к середине, тем громче звучание, и наоборот. При ходьбе с барабаном первый удар (правой рукой) и первый шаг (правой ногой) должны совпасть.\n\nПереходы барабана. Существуют походное и боевое положения барабанов. Чтобы перевести барабан в другое положение, барабанщик должен знать правила переходов. Голосовые сигналы в виде счета подает ведущий барабанщик.\n\nПоходное положение. Барабанщик стоит, расставив ноги. Барабан висит у него на правом боку, ремень перекинут через левое плечо. Правая рука барабанщика согнута и лежит на верхней части корпуса барабана, левая с зажатыми палочками (палочки соединены валетом, параллельно ногам) вытянута и прижата к левому боку.\n\nПереход из походного в боевое положение: «Раз»: правая рука барабанщика берется за нижний обод. «Два»: правая рука берется за обод барабана и переводит его вперед, в боевое положение. Левая рука по-прежнему вытянута и прижата к левому боку. «Три»: левая рука с палочками переносится на корпус барабана. При этом палочки берутся обеими руками так, чтобы при начале игры палочки не пришлось перекручивать.\n\n«Боевое положение». Барабанщик стоит, расставив ноги. Барабан висит перед ним, ремень перекинут через левое плечо. Руки с палочками (сложенными параллельно) лежат на мембране.\n\nПереход из боевого в походное положение: «Раз»: правая рука берется за край обруча, дальний от барабанщика. Левая рука с параллельно сжатыми палочками опускается и вытягивается вдоль левого бока. «Два» правая рука переводит барабан в походное положение и остается держать низ обруча. Левая рука остается неподвижной. «Три»: правая рука сгибается и кладется на верхнюю часть обруча.\n\nЗнаки барабанщиков (подает ведущий барабанщик)\nПоднятая над головой вверх правая палочка: «Внимание!»\nПоднятая над головой вверх правая палочка, полукруг вверху и резкий бросок палочки вниз: «Снять игру!»\nСкрещенные над головой две палочки: «Немедленная тишина!»\n\n## Команды барабанщиков (подает ведущий барабанщик):\n«К бою!». Команда подается при боевом положении сводного отряда. Барабанщики разнимают палочки, не поднимая их с мембраны, так, чтобы в каждой руке оказалась палочка.\n«Начали!» Команда для одновременного начала игры.\n\nПравила проведения построения.\nНа построении барабанщики выстраиваются в одну линию или (если их много) в два ряда перед вожатской трибуной. На правом фланге стоит ведущий барабанщик. Барабанщики в течение всего построения должны внимательно слушать все команды ведущего барабанщика и четко выполнять их. Сводный отряд барабанщиков выполняет и общелагерные команды (равняйсь, смирно, вольно, сдать рапорты и пр.). В орлятский круг с барабанами не встают, но слова девиза повторяют. На построении барабанщики играют перед началом (марши для сбора), во время построения (дробь под подъем или спуск флага, марши под награждение), в конце построения (марши для роспуска отрядов). Если барабанщика вызвали из строя (например, получить награду), он самостоятельно переводит барабан из боевого положения в походное и делает шаг из строя. Остальные барабанщики строй не смыкают, т.к., вернувшись, барабанщик встанет на свое место.\n\nМарши. Текстовок гораздо больше, приведем лишь самые важные для лагеря.\n\nЗнаменный\nКем был, кем был\nСтарый барабанщик?\nЧем был, чем был\nСтарый барабан?\nСтарый пионерский\nСтарый барабанщик,\nСтарый барабанщик\nДолго спал.\nОрлятский-I\nНа линейку,\nНа линейку,\nНа линейку,\nБарабанщик, барабанщик,\nНа линейку,\nНа линейку,\nНа линейку,\nСтарый барабан.\nПоходный-I\nБей, барабанщик,\nБей, барабанщик,\nБей, барабанщик,\nРаз, два, три.\nМарш комсоргов\nБей, бей, бей,\nБей, барабанщик, бей.\nБей, барабанщик,\nСтарый барабанщик,\nБей, барабанщик, бей.\nОтбивка комсоргов (играется вторым голосом с маршем комсоргов)\nГромче, громче,\nБей, барабанщик,\nБей, барабанщик,\nБей, барабанщик,\nБей, барабанщик,\nСтарый барабанщик,\nБей, барабанщик,\nРаз, два, раз, два (играется палочкой о палочку).\nСуворовский (совместим с Морским)\nБей, барабанщик,\nСтарый барабанщик,\nБей, барабанщик,\nРаз, два, раз, два.\nБей, барабанщик,\nСтарый барабанщик,\nБей, барабанщик,\nРаз, два, три.\nМорской (совместим с Суворовским)\nРаз, два,\nБей, барабан.\nГромче, громче,\nБей, барабан.\nГромче, барабанщик,\nГромче, барабанщик,\nГромче, громче,\nБей, барабан.\nРассветный (играется прежде всего на посвящении в барабанщики)\nБей, барабанщик,\nСтарый барабанщик,\nБей, барабан,\nБарабанщик, бей.\nБей, барабанщик,\nСтарый барабанщик,\nБей, барабан,\nБарабанщик, бей.\nБарабанщик, барабанщик, бей (последний слог - две палочки о барабан),\nРаз, два, три (палочка о палочку),\nБарабанщик, барабанщик, бей (последний слог - две палочки о барабан),\nРаз, два, три (палочка о палочку),\nБей, барабан,\nБей, барабан,\nБей, барабанщик,\nСтарый барабанщик,\nБей, барабан,\nБарабанщик, бей.\nГвардейский\nПра-ле, пра-пра-ле (пра - правая рука, ле - левая рука),\nПра-бей, барабан (пра-бей-ба - тройной удар правой рукой),\nСтарый-старый барабанщик.\nПра-ле, пра-пра-ле,\nПра-бей, барабан,\nСтарый-старый барабан.\nСодружество\nСо-дру-жест-во,\nБей, барабан, барабань, барабанщик.\nСо-дру-жест-во,\nБей, барабан, барабанщик, бей.\nБарабанщик, барабанщик, ты во-жа-тый.\nБарабанщик, барабанщик, ты во-жак.\nБей, барабан,\nБей, барабан,\nБей, барабанщик,\nСтарый барабанщик,\nБей, барабан,\nБарабанщик, бей.\nЗвездная атака.\nПервый голос (начинает первым).\nРаз, два, раз-два-три.\nВторой голос (вступает после полного такта первого голоса)\nБей, бара-бара-бара,\nБей, бара-бара-бара,\nБей, барабан, барабан, бара-бара-бара,\nБей, бара-бара-бара,\nБей, бара-бара-бара,\nБей, барабан, барабан,\nРаз, два (палочка о палочку).\nАфрика (для вручения наград на построении)\nВ Аф-ри-ке слоники живут (в Аф-ри-ке играются вместе двумя палочками о барабан),\nОни до неба достают\nИ поднимают хо-бо-ты (хоботы играются вместе двумя палочками о барабан).\nЗвездный\nБей, барабанщик,\nБей, барабанщик,\nБей, барабанщик,\nРаз, два, три.\nБей, барабанщик,\nБей, барабанщик,\nСтарый барабанщик,\nРаз, два, три.\nБей, барабанщик,\nСтарый барабанщик,\nСтарый барабанщик,\nРаз, два, три.\nСтарый барабанщик,\nСтарый барабанщик,\nСтарый барабанщик,\nРаз, два, три.\nОбщий сбор\nБей, барабанщик, барабань,\nБей, барабанщик, барабань,\nБей, барабанщик,\nБей, барабанщик,\nБей, бей, бей (вместе двумя палочками о барабан)"},{"t":"Нашивка «Фотограф»","cat":"Нашивки","b":"Фотография - это искусство. Человек, способный уловить и точно запечатлеть момент, который потом захочется рассматривать снова и снова - это фотограф.\nОсновной творческий процесс здесь заключается в поиске и выборе композиции, освещения и момента (или моментов) фотоснимка. Такой выбор определяется умением и навыком фотографа, а также его личными предпочтениями и вкусом, что характерно для любого вида искусства.\n\n## Фотограф должен:\n\nТеория\n\nЗнать устройство фотоаппарата, настройки фотоаппарата, принципы фотографии, законы композиции.\n## Практика:\n\nВыполнить собственные работы по жанрам (портрет, натюрморт, пейзаж, флора и фауна, макросъёмка, репортаж).\nПровести фотосъемку похода или другого большого мероприятия, запечатлев все основные события. Составить фотоотчет, выбрав наиболее содержательные и удачные фотографии.\nОпубликовать свои фотографии в газете лагеря.\n## Полезная информация:\n\nТермин «Фотография» означает рисование светом. Фотоаппарат фиксирует свет, попадающий через объектив, на матрицу или пленку, и на основе этого света формируется изображение.\n\nУстройство фотоаппарата\n\nC создания первого устройства фотоаппарата основная схема его работы почти не изменилась. Свет проходит через отверстие, масштабируется и попадает на светочувствительный элемент внутри устройства фотоаппарата, будь это пленочной камерой или зеркальной цифровой фотокамерой.\n\nНа рисунке - устройство зеркального цифрового фотоаппарата. Кратко принцип его работы можно описать так:\nсвет проходит через объектив (цифра 1).\nЗатем свет достигает диафрагмы, которая регулирует его количество (2).\nПосле этого свет доходит до зеркала в устройстве зеркального цифрового фотоаппарата, отражается и проходит через призму (4), которая перенаправляет его в видоискатель (5).\n\nВ момент, когда происходит фотографирование, зеркало (6) поднимается, открывается затвор фотоаппарата (7). В этот момент свет попадает прямо на матрицу фотоаппарата, и происходит фотографирование. Затем закрывается затвор, обратно опускается зеркало, и фотокамера готова к следующему снимку. Необходимо понимать, что весь этот сложный процесс внутри происходит за доли секунды.\n\nКраткий словарь фотографа\n\nУстройство фотоаппарата\n\nКорпус фотоаппарата (тело) состоит из пластика или сплава магния, не пропускает свет.\n\nОбъектив(1) состоит из системы линз. С помощью него изображение объектов съемки проецируется на матрицу.\n\nДиафрагма(2) - это перегородка, которая находится внутри объектива, а также имеет вид лепестков. Они образуют отверстие, диаметр которого можно регулировать.\n\nПризма (пентапризма) (4) - элемент, который переворачивает изображение.\n\nВидоискатель (5) - своего рода «глазок», через который фотограф видит будущий снимок.\n\nМатрица (сенсор) (8) чувствует свет, заменяет в устройстве зеркального фотоаппарата пленку.\n\nКарта памяти бережно хранит наши фотографии.\n\nЗатвор(6) - это механические шторки, которые находятся между сенсором и зеркалом фотокамеры. В момент съемки они временно открываются таким образом, чтобы свет попал на матрицу.\n\nНастройки фотоаппарата\n\nВыдержка - это время, на которое открывается затвор и приподнимается зеркало. Чем меньше выдержка, тем меньше света попадет на матрицу. Чем больше время выдержки, тем больше света.\n\nСветочувствительн
