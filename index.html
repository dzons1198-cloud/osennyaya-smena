ёвки, шапочки, музыка","b":"К верёвке с шагом 1 метр пришиты шапочки. Игроки надевают их и танцуют под музыку. Проигрывает команда, у которой первой слетела шапочка, руками держать нельзя.","p":["Сплочение","Движение и разминка"],"id":"скованныеоднойцепью","i":572},{"t":"Сколько?","a":[1,2],"ty":"В кругу, на месте и в тишине","goal":"Наблюдательность","n":"любое","time":"5 мин","props":"нет","b":"Называем по очереди предметы в комнате на заданную букву, повторяться нельзя. Выигрывает тот, кто продержится дольше.","p":["Заполнить паузу"],"id":"сколько","i":573},{"t":"Скороходы","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Быстрота, внимание","n":"8-25","time":"5 мин","props":"свисток","b":"Бег наперегонки на 20 шагов. На полпути два свистка - разворот и бег обратно. Хорошо внезапно вставлять в соревнования.","p":["Движение и разминка","Внимание и мышление"],"id":"скороходы","i":574},{"t":"Скульптор","a":[1,2,3],"ty":"Творческие и интеллектуальные","goal":"Фантазия, владение телом","n":"6-12","time":"10-15 мин","props":"нет","b":"Один изображает скульптуру и называет её ведущему. Остальные по одному заходят, называют, что видят, и достраивают скульптуру своим телом. Тем, кто ждёт, скучно, поэтому группа должна быть небольшой.","p":["Творчество"],"id":"скульптор","i":575},{"t":"Скульптура «Наш отряд в лагере»","a":[1,2,3],"ty":"Знакомство и сплочение","goal":"Выявить лидера, посмеяться","n":"до 20","time":"10-20 мин","props":"стулья","b":"За 5 минут отряд строит живую скульптурную композицию на тему «Наша семейка в лагере». Видно, кто взял на себя роль прораба.","p":["Сплочение"],"id":"скульптуранашотрядвлагере","i":576},{"t":"Скучно так сидеть","a":[1],"ty":"В кругу, на месте и в тишине","goal":"Размяться","n":"8-25","time":"5-10 мин","props":"стулья, стишок","b":"Два ряда стульев у противоположных стен, стульев на один меньше. Дети хором читают «Скучно, скучно так сидеть, друг на друга всё глядеть. Не пора ли пробежаться и местами поменяться?» и бегут к противоположной стене занять свободный стул. Остался без стула - выбывает, убираем ещё стулья.","p":["Движение и разминка"],"id":"скучнотаксидеть","i":577},{"t":"Следопыт (два племени)","a":[2,3],"ty":"Следопытство и ориентирование","goal":"Чтение следов","n":"два племени","time":"90 мин","props":"нет","b":"Первое племя уходит по маршруту, оставляя следы (кострище, стоянка, следы на земле). Через 40 минут идёт второе и по следам рассказывает, что делало первое племя.","p":["Следопытство"],"id":"следопыт","i":578},{"t":"Слепец и поводырь","a":[2,3],"ty":"Знакомство и сплочение","goal":"Доверие, ответственность","n":"пары","time":"10-15 мин","props":"повязки, препятствия","b":"Поводырь ведёт «слепого» через комнату с препятствиями только голосом. Важно: не ставить в пару людей, которым никто не доверяет. Лучше дать выбрать, с кем идти.","p":["Доверие","Сплочение"],"id":"слепециповодырь","i":579},{"t":"Слепой мастер","a":[2,3],"ty":"В кругу, на месте и в тишине","goal":"Тактильная память","n":"любое","time":"10 мин","props":"набор предметов","b":"С завязанными глазами выполнить простую операцию: накрыть на стол, собрать походный набор, развести костёр из заготовленного набора (с аптечкой и без огня).","p":["Заполнить паузу","Внимание и мышление"],"id":"слепоймастер","i":580},{"t":"Слепой паровозик","a":[2,3],"ty":"Знакомство и сплочение","goal":"Доверие, внимание к телу","n":"от 6","time":"10 мин","props":"просторное помещение","b":"Сцепляются по двое-трое. Первый закрывает глаза и подчиняется движениям последнего (тот направляет руками), средний нейтрален. Играем молча, лучше, когда двигается 5 и больше паровозиков. На материале игры можно поговорить о доверии.","p":["Доверие","Сплочение","Внимание и мышление"],"id":"слепойпаровозик","i":581},{"t":"Слепой скульптор","a":[2,3],"ty":"Знакомство и сплочение","goal":"Доверие, внимание","n":"тройки","time":"10 мин","props":"повязка","b":"В тройке одному завязывают глаза, второй «лепит» из третьего позу. «Слепой» лепит такую же из второго. Касаться бережно.","p":["Сплочение","Внимание и мышление"],"id":"слепойскульптор","i":582},{"t":"Слон из подручных материалов","a":[1,2],"ty":"Знакомство и сплочение","goal":"Общая работа в тишине","n":"отряд","time":"15 мин","props":"ветки, шишки, ручки, камешки","b":"Всем отрядом молча выложить на земле или полу слона из подручных предметов. Можно задать время.","p":["Сплочение","Успокоение"],"id":"слонизподручныхматериалов","i":583},{"t":"Снежный ком","a":[1,2,3],"ty":"Знакомство и сплочение","goal":"Выучить имена","n":"8-30","time":"10 мин","props":"нет","b":"Сидим в кругу. Первый называет своё имя, следующий - имя первого и своё, третий - два предыдущих и своё и так далее. Сбились - начинаем с того, на ком остановились. Варианты: к имени добавлять прилагательное на ту же букву («Слава - смешной»); или движение («Маша - кивок»).","p":["Знакомство"],"id":"снежныйком","i":584},{"t":"Со спины лошадки","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Ловкость, прыгучесть","n":"8-15","time":"10 мин","props":"шапки","b":"Один игрок ложится ничком, на спину кладёт шапку. Остальные по очереди кладут сверху свою шапку и прыгают через лежащего. Если шапка упала при прыжке, прыгавший меняется с лежащим.","p":["Движение и разминка"],"id":"соспинылошадки","i":585},{"t":"Совушка","a":[1],"ty":"Подвижные и эстафеты","goal":"Внимание, самоконтроль","n":"8-25","time":"10 мин","props":"нет","b":"Совушка «спит» в центре. Команда «День наступает - всё оживает!» - малыши бегают. «Ночь наступает - всё замирает!» - все замирают, совушка охотится и уводит шевелящихся и смеющихся к себе в круг.","p":["Движение и разминка","Внимание и мышление"],"id":"совушка","i":586},{"t":"Солнышко","a":[3],"ty":"Знакомство и сплочение","goal":"Отношения в группе","n":"8-15","time":"15 мин","props":"нет","b":"Один в центре с закрытыми глазами - солнце, остальные - планеты, встают на комфортном для них расстоянии. Солнце открывает глаза, смотрит на картину и может поставить людей так, как удобно ему. Это мягкий вариант социометрии. Проводить только в благополучной группе.","p":["Доверие","Сплочение"],"id":"солнышко","i":587},{"t":"Сорви шапку","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Ловкость","n":"2 или команды","time":"10 мин","props":"шапки, мел","b":"В круге каждый с одной привязанной к туловищу рукой и шапкой на голове. Нужно сорвать шапку соперника и сохранить свою. За шапку очко команде.","p":["Движение и разминка"],"id":"сорвишапку","i":588},{"t":"Сороконожка (танец)","a":[1,2],"ty":"Музыка, праздники и большие игры","goal":"Размяться","n":"колонна","time":"5 мин","props":"музыка","b":"Колонна, руки на поясе у впередистоящего. Два приставных прыжка в сторону, два маха ногой, шаги вперёд с махом, три шага, хлопок и поворот на 180 градусов.","p":["Движение и разминка"],"id":"сороконожка","i":589},{"t":"Сороконожки","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Командная слаженность","n":"2-3 команды по 10-20","time":"10 мин","props":"толстая верёвка","b":"Команда выстроена вдоль каната, каждый держится за него и за щиколотку одной ноги. Скачут 10-12 м, поворачивают и возвращаются. Побеждает та, у кого никто не отцепился. Для безопасности пол/трава ровные, детей не больше 10.","p":["Движение и разминка"],"id":"сороконожки","i":590},{"t":"Сосед справа","a":[1,2],"ty":"В кругу, на месте и в тишине","goal":"Внимание","n":"8-25","time":"10 мин","props":"фанты","b":"Водящий в центре быстро задаёт вопрос или просит что-то сделать, но отвечает не тот, к кому обратились, а его сосед справа. Не знаешь ответа - скажи «не знаю». Ошибся - даёшь фант или занимаешь место водящего.","p":["Внимание и мышление"],"id":"соседсправа","i":591},{"t":"Спасаем вещи","a":[2,3],"ty":"В кругу, на месте и в тишине","goal":"Юмор, знакомство","n":"6-25","time":"10-15 мин","props":"листочки, две коробки","b":"У каждого два листочка: «какую вещь я спасу при пожаре» и «почему». Листочки собирают в разные коробки, достают по одному из каждой и читают: «Телевизор - потому что по нему приятно ходить». Просим отнестись с юмором, иначе все «спасут» документы.","p":["Успокоение","Знакомство"],"id":"спасаемвещи","i":592},{"t":"Спина к спине","a":[1,2,3],"ty":"Знакомство и сплочение","goal":"Командность","n":"пары, группы по 5-7","time":"5-10 мин","props":"нет","b":"В паре встать спиной к спине, взяться под локти, присесть и подняться без помощи рук. Усложнение - в группе 5-7 человек в кольце.","p":["Сплочение"],"id":"спинакспине","i":593},{"t":"Спортландия (пиратская спортивная программа)","a":[1,2,3],"ty":"Музыка, праздники и большие игры","goal":"Спортивное закрытие смены или спартакиады","n":"весь лагерь, две команды по 8-12","time":"60-75 мин","props":"доски, обручи, мячи, канат, \"пиастры\", карта, разрезанная на 10 частей","b":"Сюжет: пираты Сильвера и моряки капитана Смоллета нашли карту сокровищ и решили не воевать, а соревноваться. Отряды делятся на болельщиков за каждую команду, в команды входят по одному ребёнку от отряда. Жюри «адмиралтейство» награждает победителя каждого конкурса 2 «пиастрами». Каждый этап начинается общей командой «Поднять паруса! Полный вперёд!»\nЭтапы: 1) Найти спрятанные части карты в зале и выложить её (болельщики помогают). 2) «Переправа» - каждый добирается до ведущего по двум дощечкам над «болотом»; оступился - минус пиастр. 3) «Стрельба» - попасть мячом в обруч, который держат помощники в зале, болельщики возвращают мяч. 4) «Перетягивание» - команды спиной друг к другу в петле каната тянутся за мячом. 5) Прыжки через канат всей командой, три попытки, каждый прыжок - пиастр. 6) «Скала» - мяч передают наверх по рядам, игрок с мячом бежит вниз к капитану, пока не «спустят» всю команду. В конце награждают победителей и участников. Можно использовать как закрытие спартакиады.","p":["Событие"],"id":"спортландия","i":594},{"t":"Стаи рыбок","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Размяться","n":"2-3 команды","time":"10-15 мин","props":"бумажные рыбки или шарики, нитки","b":"Каждый привязывает на пояс сзади бумажную «рыбку» на нитке 1 м (хвост касается пола). Нужно наступить на хвост рыбки соперника, не касаясь руками. Потерявший рыбку выбывает. Побеждает команда с наибольшим числом рыбок. С воздушными шариками ещё веселее.","p":["Движение и разминка"],"id":"стаирыбок","i":595},{"t":"Статуя (мяч в круге)","a":[1,2],"ty":"В кругу, на месте и в тишине","goal":"Ловкость","n":"6-15","time":"10 мин","props":"большой мяч","b":"Перебрасываем мяч. Кто не поймал, продолжает игру на одной ноге, при втором промахе на одном колене, при третьем на двух коленях, при четвёртом выбывает. Если поймал, наказание снимается.","p":["Движение и разминка"],"id":"статуя","i":596},{"t":"Стена","a":[3],"ty":"Знакомство и сплочение","goal":"Доверие","n":"пары","time":"10 мин","props":"нет","b":"Человек с закрытыми глазами быстро идёт к стене, партнёр в последний момент говорит «Стоп». Обязательно обеспечить безопасность: идти не бегом, расстояние до стены заранее, партнёр рядом.","p":["Доверие","Сплочение"],"id":"стена","i":597},{"t":"Стой спокойно","a":[1],"ty":"В кругу, на месте и в тишине","goal":"Внимание","n":"8-25","time":"5 мин","props":"нет","b":"Водящий в круге останавливается перед игроком и говорит «Руки!». Этот стоит спокойно, а сосед справа поднимает левую руку, сосед слева - правую. Кто ошибся, сменяет водящего.","p":["Внимание и мышление","Успокоение"],"id":"стойспокойно","i":598},{"t":"Столбы (Ладушки)","a":[2,3],"ty":"Подвижные и эстафеты","goal":"Меткость, реакция","n":"15-20","time":"15 мин","props":"волейбольный мяч","b":"Круг, мяч отбивают ладонями. Упал мяч - все разбегаются, уронивший становится водящим, поднимает мяч и кричит «Стой!». Все замирают. Водящий бросает в ближайшего. Мимо - «столб»: стоит на месте, пока не бросят удачно.","p":["Движение и разминка","Внимание и мышление"],"id":"столбы","i":599},{"t":"Стороны света по приметам","a":[1,2,3],"ty":"Следопытство и ориентирование","goal":"Ориентирование","n":"пары","time":"40 мин","props":"компас, часы","b":"Пары определяют стороны горизонта разными способами: по деревьям, по солнцу, по часам, по компасу, по пням. Очко за верность и скорость. Усложнение: добраться до места сбора по описанию и сигналу горна.\nПриметы: в 7 часов солнце на востоке, в 13 - на юге, в 19 - на западе. Листва у отдельно стоящих деревьев гуще с южной стороны, мох чаще на северной стороне ствола и валунов, кольца на пне с севера тоньше и плотнее, муравейники чаще с южной стороны дерева, подсолнух и череда поворачиваются за солнцем. Помните: приметы дают лишь приблизительный ответ, проверяйте по компасу.","p":["Следопытство"],"id":"сторонысветапоприметам","i":600},{"t":"Странствующие рыцари","a":[2,3],"ty":"Музыка, праздники и большие игры","goal":"Добрые дела","n":"группы по 1-6","time":"90 мин","props":"нет","b":"В лагере, посёлке или городе «рыцари» делают как можно больше добрых дел. В условленное время собираются и рассказывают. Дела должны быть согласованы со взрослыми (помочь, прибрать, поздравить).","p":["Событие"],"id":"странствующиерыцари","i":601},{"t":"Стрелка","a":[1],"ty":"Творческие и интеллектуальные","goal":"Память, мышление","n":"6-15","time":"10 мин","props":"цветные кружки на одежде, фишки","b":"Дети в кругу, у каждого цветной кружок. В центре «стрелка» с вытянутой рукой, все говорят: «Стрелка, стрелка, покружись, всем кружочкам покажись, и какой тебе милей, укажи нам поскорей! Стоп!» Стрелка называет цвет, на который указывает, ведущий спрашивает: «Что бывает оранжевым?» Правильный ответ - фишка.","p":["Внимание и мышление"],"id":"стрелка","i":602},{"t":"Стул сгорел","a":[1,2],"ty":"В кругу, на месте и в тишине","goal":"Размяться","n":"6-30","time":"5-10 мин","props":"стулья, музыка","b":"Стулья сиденьями наружу, на один меньше, чем игроков. Все бегают вокруг, не касаясь стульев, и по сигналу садятся. Без места остался - выбывает, один стул убираем. При большой группе убирайте сразу несколько стульев.","p":["Движение и разминка"],"id":"стулсгорел","i":603},{"t":"Стул справа","a":[1,2,3],"ty":"В кругу, на месте и в тишине","goal":"Запомнить имена, размяться","n":"8-25","time":"10 мин","props":"стулья","b":"Стулья по кругу, один пустой, водящий в центре. Тот, у кого пустой стул справа, должен хлопнуть по нему правой рукой и назвать имя любого игрока раньше, чем туда сядет водящий. Не успел - становится водящим. Назвавший пересаживается, и теперь «защищает» новый сосед. Нужно действовать очень быстро.","p":["Знакомство"],"id":"стулсправа","i":604},{"t":"Стульчик из рук","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Командная работа","n":"команды по 3","time":"10 мин","props":"нет","b":"Двое скрещивают руки «стульчиком», третий садится и его несут до финиша и обратно. Затем меняются так, чтобы каждый посидел на «стульчике».","p":["Движение и разминка"],"id":"стульчикизрук","i":605},{"t":"Сумма на пальцах","a":[2,3],"ty":"Знакомство и сплочение","goal":"Командность","n":"8-25","time":"5 мин","props":"нет","b":"На «раз-два-три» все показывают пальцами числа так, чтобы сумма равнялась заданной. Повторять, пока не получится.","p":["Сплочение"],"id":"сумманапальцах","i":606},{"t":"Счёт (номера на спине)","a":[1,2],"ty":"Знакомство и сплочение","goal":"Выявить лидера","n":"до 20","time":"10 мин","props":"бумажки с номерами","b":"Каждому на спину прикрепляют номер. Построиться по порядку молча: чётные в одну сторону, нечётные в другую. Смотрим, кто руководит.","p":["Сплочение"],"id":"счет","i":607},{"t":"Сшибалочки","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Сила, равновесие","n":"пары","time":"5 мин","props":"нет","b":"Двое стоят в полуметре друг от друга и, упираясь ладонями, пытаются заставить соперника сделать шаг.","p":["Движение и разминка"],"id":"сшибалочки","i":608},{"t":"Съедобное - несъедобное (лесенка)","a":[1],"ty":"Подвижные и эстафеты","goal":"Внимание","n":"6-20","time":"10 мин","props":"мяч, мел","b":"Игроки стоят за линией. Водящий бросает мяч и называет предмет. Если «съедобное» - ловят, «несъедобное» - отбивают. Правильно - шаг вперёд. Кто первым пересечёт последнюю черту, тот водит.","p":["Движение и разминка","Внимание и мышление"],"id":"съедобноенесъедобное","i":609},{"t":"Табу (коробка)","a":[3],"ty":"В кругу, на месте и в тишине","goal":"Осознать реакцию на запрет","n":"до 25","time":"15 мин","props":"коробка","b":"В центре стоит коробка: «там лежит то, чего нельзя». Каждый сам решает, как себя вести: подойти, заглянуть, остаться. Потом обсуждаем, что подтолкнуло к поступку. Повод поговорить о запретах и выборе.","p":["Итоги и разговор","Внимание и мышление"],"id":"табу","i":610},{"t":"Тайна Чёрного Рыцаря","a":[1,2],"ty":"Музыка, праздники и большие игры","goal":"Станционная игра по лесу","n":"весь отряд или 3-5 отрядов","time":"60-90 мин","props":"контрольные пункты (КП), фонарики, конфеты, разрезанная на части фраза","b":"Легенда: Ричард Львиное Сердце вернулся из Крестового похода, ранен, а брат Иоанн захватил трон. Он скрывается в чёрных латах как Чёрный Рыцарь. Верный оруженосец спрятал Грааль, исцеляющую чашу, и «заколдовал» клад: заклинание рассеяно по КП в виде кусочков короткого стихотворения. Ребята находят КП, собирают текст, идут к Чёрному Рыцарю и произносят заклинание, и он исцеляется. Пока Иоанн ходит по территории и отнимает «жизни» у игроков. Свергнуть его можно, окружив кольцом не менее 10 человек. В награду рыцарь открывает, где растёт «конфетное дерево королевских пиров». Текст-заклинание подберите сами: четыре строки о том, что рыцарь добудет чашу.","p":["Событие"],"id":"тайначерногорыцаря","i":611},{"t":"Тайники в лесу","a":[1,2],"ty":"Следопытство и ориентирование","goal":"Память, ориентирование","n":"пары","time":"40 мин","props":"предметы (флажок, кегля, мяч)","b":"Первые номера в паре с судьёй прячут предмет за 200-300 м от поляны, он виден не дальше чем за 2-3 м. Запоминают путь по ориентирам, но не записывают. Вторым номерам рассказывают путь словами, они ищут. Затем меняются.","p":["Следопытство","Внимание и мышление"],"id":"тайникивлесу","i":612},{"t":"Там-там-тарарам","a":[1],"ty":"Музыка, праздники и большие игры","goal":"Ритм, координация","n":"любое","time":"5 мин","props":"нет","b":"Все сидят или стоят в кругу, руки на коленях. С проговариванием «Там-там-тара-тара, там-там-тарарам» отбиваем ритм по своим коленям, потом по коленям соседей, потом скрестив руки.","p":["Движение и разминка"],"id":"тамтамтарарам","i":613},{"t":"Танец сидя","a":[1],"ty":"Музыка, праздники и большие игры","goal":"Успокоить, размяться","n":"любое","time":"5 мин","props":"нет","b":"Сидя полукругом: два хлопка по коленям, два скользящих хлопка в ладоши («ножницы»), потрясти кистями вправо-влево, поклон вправо-влево, два притопа. Можно придумывать свои движения.","p":["Движение и разминка"],"id":"танецсидя","i":614},{"t":"Танец утят","a":[1],"ty":"Музыка, праздники и большие игры","goal":"Размяться","n":"любое","time":"3-5 мин","props":"музыка","b":"Руки у груди: «клювик» пальцами, взмахи «крыльями», покачивание бёдрами в приседе, четыре хлопка, пробежка в круге в одну и в другую сторону.","p":["Движение и разминка"],"id":"танецутят","i":615},{"t":"Тарелочки","a":[2,3],"ty":"Знакомство и сплочение","goal":"Командность","n":"6-12","time":"10 мин","props":"тарелки, коврики","b":"Группе нужно перебраться через «болото» по нескольким тарелкам, на каждой всегда должна быть хотя бы одна нога. Тарелку, на которой никого нет, забирают. Вариант: по кругу, на каждой тарелке один человек.","p":["Сплочение"],"id":"тарелочки","i":616},{"t":"Творог","a":[1,2,3],"ty":"Знакомство и сплочение","goal":"Смех, знакомство","n":"до 20","time":"5-10 мин","props":"нет","b":"Медленно ходим по комнате спиной вперёд. Когда спины встречаются, оба широко расставляют ноги, наклоняются, пожимают друг другу руки и кричат «Творог!». Потом идём дальше.","p":["Знакомство"],"id":"творог","i":617},{"t":"Театр (репетиция)","a":[1,2],"ty":"Творческие и интеллектуальные","goal":"Внимание, разрядка","n":"6-20","time":"8-10 мин","props":"нет","b":"Раздаём роли: занавес, король, королева, фрейлина, собачка фрейлины. Ведущий - придирчивый режиссёр: «Занавес пошёл! Нет, не так, ещё раз!». Каждая роль выполняет своё действие много раз, можно сменить жанр.","p":["Творчество","Внимание и мышление"],"id":"театр","i":618},{"t":"Театральные шарады","a":[2,3],"ty":"Творческие и интеллектуальные","goal":"Выразительность, командность","n":"2 команды","time":"15-20 мин","props":"нет","b":"Первая команда загадывает слово или фразу и шепчет её выбранному игроку из второй команды. Он молча показывает, его команда угадывает за отведённое время. Затем команды меняются. Можно договориться о знаках или разрешить задавать вопросы, на которые показывают «да» и «нет».","p":["Внимание и мышление"],"id":"театральныешарады","i":619},{"t":"Телеграмма","a":[1,2],"ty":"В кругу, на месте и в тишине","goal":"Внимание","n":"любое","time":"10 мин","props":"нет","b":"Все в кругу держатся за руки. Ведущий говорит «Я, Иван Петров, передаю телеграмму Маше Ивановой» и незаметно пожимает руку соседа. Пожатие идёт по кругу до адресата, тот говорит «Спасибо, телеграмму получил». Заметили пожатие - заметивший становится ведущим.","p":["Внимание и мышление"],"id":"телеграмма","i":620},{"t":"Телетайп","a":[1,2,3],"ty":"В кругу, на месте и в тишине","goal":"Успокоиться","n":"6-20","time":"5 мин","props":"нет","b":"В кругу держимся за руки, один отправляет «телеграмму» адресату и передаёт её по кругу незаметным пожатием руки. Ведущий в центре ищет, у кого пожатие. Хороша для завершения занятия.","p":["Движение и разминка"],"id":"телетайп","i":621},{"t":"Телефон","a":[2,3],"ty":"Творческие и интеллектуальные","goal":"Невербальная передача чувств","n":"6-16","time":"15 мин","props":"мяч","b":"Абонент называет, с кем «говорит», подбрасывает мяч, поймавший становится «телефонной станцией». Абонент на ухо рассказывает ей новость на тему от ведущего, станция жестами пересказывает собеседнику. Если тот с трёх попыток угадывает смысл, все трое остаются в игре, иначе выбывают.","p":["Творчество"],"id":"телефон","i":622},{"t":"Телефонисты со скороговоркой","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Внимание, дикция","n":"две команды по 10-12","time":"10 мин","props":"скороговорки","b":"Первый шёпотом передаёт скороговорку соседу, и так до конца. Последний произносит её громко и внятно. Побеждает команда, быстрее и точнее передавшая.","p":["Движение и разминка","Внимание и мышление"],"id":"телефонистысоскороговоркой","i":623},{"t":"Тихая почта","a":[1,2,3],"ty":"Творческие и интеллектуальные","goal":"Внимание, смех","n":"5-10 в цепочке","time":"10 мин","props":"2 листа, 2 маркера","b":"Игроки сидят друг за другом. Последний рисует картинку на листе, затем пальцем рисует её на спине соседа. Тот передаёт на спине дальше. Первый рисует на бумаге то, что понял. Сравниваем с оригиналом.","p":["Творчество","Внимание и мышление"],"id":"тихаяпочта","i":624},{"t":"Тише едешь...","a":[1],"ty":"Подвижные и эстафеты","goal":"Самоконтроль","n":"6-25","time":"10 мин","props":"нет","b":"Водящий отвернулся и говорит «Тише едешь - дальше будешь, раз, два, три... стоп!» (фраза может обрываться неожиданно, но последнее слово «стоп»). Затем оборачивается: кто движется, возвращается на старт. Первый добежавший водит.","p":["Движение и разминка"],"id":"тишеедешь","i":625},{"t":"Тохси","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Меткость","n":"4-10","time":"10-15 мин","props":"камешки или альчики, крупная бита","b":"Рисуем два вложенных круга, в центре в ряд кладём по камешку от каждого игрока. Стоя на линии большого круга, игроки по очереди метают биту и стараются выбить камешки за круг. Выбил - получаешь камешек. Промахнулся - пропускаешь следующий ход.","p":["Движение и разминка"],"id":"тохси","i":626},{"t":"Третий лишний","a":[1,2,3],"ty":"Подвижные и эстафеты","goal":"Разрядка","n":"14-30","time":"10 мин","props":"нет","b":"Пары стоят в кругу, одна за другой. Вокруг бегают беглец и догоняющий. Беглец встаёт перед любой парой - и тот, кто стоит сзади, становится беглецом. Если догоняющий осалил беглеца, они меняются.","p":["Движение и разминка"],"id":"третийлишний","i":627},{"t":"Три жизни","a":[2,3],"ty":"Подвижные и эстафеты","goal":"Меткость, реакция","n":"6-20","time":"15 мин","props":"мягкий мяч","b":"У каждого три «жизни». Тот, кто подобрал мяч, бросает им в другого. Пока мяч в воздухе, двигаться можно, как только кто-то поймал - все замирают. Три попадания - выбыл. Мяч мягкий, в голову не бросать.","p":["Движение и разминка","Внимание и мышление"],"id":"трижизни","i":628},{"t":"Три камня","a":[2],"ty":"Подвижные и эстафеты","goal":"Размяться, развить ловкость","n":"8-20","time":"15 мин","props":"3 плоских камня, мяч","b":"Три камня друг на друге, в 3-5 м линия броска. Игроки сбивают мячом башню и разбегаются прятаться. Водящий складывает камни и идёт искать. Увидев игрока, называет его имя и бросает мяч, затем бежит к камням: успел раньше - игрок выбывает. Пока водящий ищет, любой прячущийся может прибежать и снова сбить камни, и тогда все пойманные получают свободу.","p":["Движение и разминка"],"id":"трикамня","i":629},{"t":"Три розовых пингвина","a":[1],"ty":"Музыка, праздники и большие игры","goal":"Размяться, повеселиться","n":"любое","time":"5 мин","props":"музыка","b":"Идём по кругу и поём «Три розовых пингвина залезли на чердак...». Ведущий добавляет движения: «А у пингвина вот такие крылышки» (прижать руки), «животики» (выпятить), «лапы» (пятки вместе, носки врозь), «шея» (прижать подбородок). Можно придумывать свои.","p":["Движение и разминка"],"id":"трирозовыхпингвина","i":630},{"t":"Три шага","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Внимание","n":"8-20","time":"10 мин","props":"повязка","b":"Вариант жмурок: водящий за всю игру имеет право только на три шага.","p":["Движение и разминка","Внимание и мышление"],"id":"тришага","i":631},{"t":"Трудолюбивые муравьи","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Командная помощь","n":"команды по 5-8","time":"10 мин","props":"гимнастическая палка","b":"Первый бежит с палкой до отметки и обратно, зовёт второго, дальше вдвоём, потом втроём. В конце вся команда несёт палку вместе.","p":["Движение и разминка"],"id":"трудолюбивыемуравьи","i":632},{"t":"Тука (нанизывание)","a":[2,3],"ty":"Знакомство и сплочение","goal":"Командная работа, смех","n":"8-20","time":"10 мин","props":"верёвка 15 м, шишка","b":"К концу длинной верёвки привязана шишка. Команда по очереди продевает шишку через всю свою одежду сверху вниз (как нанизывают рыбу). Побеждает команда, у которой последний игрок первым вытащил шишку из штанины.","p":["Сплочение"],"id":"тука","i":633},{"t":"Туннель","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Скорость, командная работа","n":"2 команды","time":"10 мин","props":"нет","b":"Колонны парами, руки подняты. Последняя пара бежит вперёд под руками и встаёт впереди, поднимая руки - сигнал для следующей. Побеждает команда, закончившая пробежку первой.","p":["Движение и разминка"],"id":"туннель","i":634},{"t":"Туристская эстафета","a":[2,3],"ty":"Следопытство и ориентирование","goal":"Навыки похода","n":"2 команды по 10","time":"30 мин","props":"рюкзаки, предметы (кружка, ложка, компас, аптечка...), палатка, матрасы, планшет с азимутом, верёвка","b":"Этапы: собрать рюкзак (положить по предмету), поставить палатку и надуть матрасы, найти направление по азимуту и отмерить расстояние шагами, пройти по низкой верёвочной «переправе» (не выше 30-40 см над землёй), перенести товарища «стульчиком». Побеждает команда, закончившая раньше и лучше всех.","p":["Следопытство"],"id":"туристскаяэстафета","i":635},{"t":"Турнидос","a":[2],"ty":"Музыка, праздники и большие игры","goal":"Размяться","n":"пары","time":"10 мин","props":"музыка","b":"Партнёры в шести шагах друг от друга: три шага навстречу и мах ногой, три шага назад и хлопки, берёмся за правые руки, расходимся, поворот вокруг себя, хлопки.","p":["Движение и разминка"],"id":"турнидос","i":636},{"t":"Тшшш (мысленный рассказ)","a":[2,3],"ty":"В кругу, на месте и в тишине","goal":"Концентрация","n":"6-20","time":"5-10 мин","props":"нет","b":"В кругу каждый выбирает предмет и мысленно описывает его. Вожатый внезапно вызывает кого-то, и тот продолжает вслух с того места, где был. Одного человека можно спросить дважды, чтобы все продолжали думать.","p":["Успокоение"],"id":"тшшш","i":637},{"t":"У дядюшки Трифона","a":[1],"ty":"В кругу, на месте и в тишине","goal":"Внимание, повторение движений","n":"8-25","time":"5-10 мин","props":"нет","b":"Хоровод вокруг ведущего с зачином «У дядюшки Трифона было семеро детей... разом делали, как я!». Все повторяют движения ведущего. Кто лучше всех - новый ведущий. При повторении идут в другую сторону.","p":["Внимание и мышление","Движение и разминка"],"id":"удядюшкитрифона","i":638},{"t":"У луны круглое лицо","a":[2,3],"ty":"В кругу, на месте и в тишине","goal":"Логика","n":"6-15","time":"10 мин","props":"палка","b":"Ведущий рисует на земле лицо: «У луны круглое лицо, два глаза, нос и рот» - и передаёт палку. Секрет не в рисунке, а в передаче: рисовал правой рукой - передавай левой. Если не угадали за 5 минут, раскройте секрет.","p":["Заполнить паузу","Внимание и мышление"],"id":"улуныкруглоелицо","i":639},{"t":"Угадай песню","a":[2,3],"ty":"В кругу, на месте и в тишине","goal":"Смекалка, юмор","n":"от 8","time":"10 мин","props":"нет","b":"Группа загадывает известную песню. Трём добровольцам дают по слову из начала песни. Водящий возвращается и задаёт им каверзные вопросы, а они обязаны отвечать, вставляя свои слова. Нужно отгадать песню.","p":["Успокоение"],"id":"угадайпесню","i":640},{"t":"Угадай победу","a":[1,2,3],"ty":"Подвижные и эстафеты","goal":"Самооценка, равные шансы","n":"6-30","time":"10 мин","props":"секундомер","b":"Каждый называет время, за которое пройдёт или пробежит дистанцию. Побеждает тот, кто ближе к своему прогнозу, а не самый быстрый.","p":["Движение и разминка"],"id":"угадайпобеду","i":641},{"t":"Угадай, кого нет","a":[1],"ty":"В кругу, на месте и в тишине","goal":"Внимание","n":"8-25","time":"5 мин","props":"нет","b":"Все закрывают глаза, ведущий касается одного, и тот тихо выходит (остальным можно шуметь). По сигналу открывают глаза и называют, кого нет. Угадавший первым - новый ведущий.","p":["Заполнить паузу","Внимание и мышление"],"id":"угадайкогонет","i":642},{"t":"Угадай-ка (пять названий)","a":[1,2],"ty":"Творческие и интеллектуальные","goal":"Словарь, скорость","n":"6-20","time":"5-10 мин","props":"нет","b":"Сидя, игрок показывает на другого и называет категорию: пять рек, пять рыб, пять животных, пять цветов. Нужно быстро назвать. Не смог - показывает на следующего.","p":["Внимание и мышление"],"id":"угадайка","i":643},{"t":"Удочка","a":[1,2],"ty":"В кругу, на месте и в тишине","goal":"Прыгучесть, внимание","n":"8-20","time":"5-10 мин","props":"верёвка с мешочком песка","b":"Ведущий в центре крутит по кругу верёвку с мешочком песка у самой земли, все подпрыгивают, чтобы не задеть. Задел - выбывает или меняется с ведущим.","p":["Внимание и мышление"],"id":"удочка","i":644},{"t":"Ужас (рисуем не той рукой)","a":[1,2],"ty":"Творческие и интеллектуальные","goal":"Смех, пятиминутка","n":"любое","time":"5-10 мин","props":"бумага, карандаши","b":"Нарисовать или раскрасить что-либо «неправильной» рукой (левше - правой).","p":["Творчество"],"id":"ужас","i":645},{"t":"Ужасно прекрасный рисунок","a":[2,3],"ty":"Творческие и интеллектуальные","goal":"Разрядка, снятие напряжения","n":"7-12","time":"15 мин","props":"листы, фломастеры","b":"Каждый рисует «прекрасный рисунок», передаёт соседу справа, и тот за 30 секунд превращает его в «ужасный». Дальше следующий снова делает «прекрасный». Когда рисунок вернётся хозяину, обсуждаем результат. Хорошая игра, чтобы посмеяться над перфекционизмом.","p":["Творчество","Успокоение"],"id":"ужаснопрекрасныйрисунок","i":646},{"t":"Узел","a":[1,2,3],"ty":"Знакомство и сплочение","goal":"Командность","n":"8-20","time":"10 мин","props":"длинная верёвка","b":"Все держатся за верёвку, нужно завязать на ней узел, не отпуская. Потом развязать. Выпустил руки - сначала.","p":["Сплочение"],"id":"узел","i":647},{"t":"Узнай по голосу","a":[1],"ty":"Знакомство и сплочение","goal":"Знакомство","n":"8-20","time":"10 мин","props":"нет","b":"Водящий стоит в центре с закрытыми глазами, остальные ходят по кругу и поют. По знаку один говорит: «Ты загадку отгадай, кто позвал тебя, узнай». Водящий называет голос по имени. Угадал - тот водит.","p":["Знакомство"],"id":"узнайпоголосу","i":648},{"t":"Узнай, кто","a":[1],"ty":"В кругу, на месте и в тишине","goal":"Внимание, знакомство с отрядом","n":"6-20","time":"5-10 мин","props":"нет","b":"Водящего выбирают по считалке. Кто-то из ребят тихо подкрадывается и закрывает ему глаза ладонями. Водящий на ощупь, по одежде и рукам должен узнать, кто это, и назвать по имени. Узнал - меняются местами.","p":["Заполнить паузу","Внимание и мышление","Знакомство"],"id":"узнайкто","i":649},{"t":"Укради знамя","a":[2,3],"ty":"Следопытство и ориентирование","goal":"Командность","n":"две команды","time":"40 мин","props":"два знамени","b":"Знамёна спрятаны на равном расстоянии от границы. Нужно вынести знамя противника на свою территорию. Осаленный на чужой территории стоит, пока его не выручит свой.","p":["Следопытство"],"id":"украдизнамя","i":650},{"t":"Утка и гусь","a":[1,2],"ty":"В кругу, на месте и в тишине","goal":"Внимание, смех","n":"8-25","time":"5 мин","props":"нет","b":"Круг, руки на плечах. Ведущий шёпотом называет каждого «гусь» или «утка» (уток больше). По команде «гусь» поджимают одну ногу гуси, по команде «утка» обе ноги утки. Падать не надо: следите за безопасностью.","p":["Заполнить паузу","Внимание и мышление"],"id":"уткаигусь","i":651},{"t":"Фабрика Деда Мороза","a":[1],"ty":"Творческие и интеллектуальные","goal":"Труд, творчество","n":"10-30","time":"60 мин","props":"бумага, клей, ножницы","b":"Отряд получает письмо Деда Мороза: сделать для ёлки 20 звёздочек, 5 гирлянд и 10 ёлочек. На «фабрике» есть мастера (старшие помощники), контролёры, хозяйственники и выставка образцов. Каждый делает игрушку сам или в группе. Хорошо, если дети захотят сделать подарок близкому. Подойдёт и для летней смены как «Фабрика подарков».","p":["Творчество"],"id":"фабрикадедамороза","i":652},{"t":"Фантазёры","a":[1],"ty":"Творческие и интеллектуальные","goal":"Воображение","n":"8-20","time":"10 мин","props":"бумажный колпак, музыка, медали","b":"Под музыку дети изображают клоунов. На «Стоп!» ведущий надевает кому-то колпак и спрашивает: «Чего на свете не бывает?» Ответ: «Лающей кошки», «Синего апельсина». За быстрый ответ - медаль.","p":["Внимание и мышление","Творчество"],"id":"фантазеры","i":653},{"t":"Фанты","a":[1,2,3],"ty":"В кругу, на месте и в тишине","goal":"Весёлое завершение игр","n":"5-25","time":"15 мин","props":"личные мелкие вещи","b":"Со всех собирают по предмету. Ведущих двое: один достаёт предмет и спрашивает «Что выполнить этому фанту?», второй, не видя предмета, придумывает задание (спеть, станцевать, прокукарекать, рассказать стих). Задания только добрые и безопасные, без унижения и без выхода за пределы площадки.","p":["Движение и разминка"],"id":"фанты","i":654},{"t":"Фигура из стульев","a":[2,3],"ty":"Знакомство и сплочение","goal":"Командность","n":"8-25","time":"10 мин","props":"стулья","b":"Молча выложить из стульев фигуру, например букву. Можно на время.","p":["Сплочение"],"id":"фигураизстульев","i":655},{"t":"Фигурки","a":[1,2],"ty":"Творческие и интеллектуальные","goal":"Фантазия, скорость","n":"любое","time":"10 мин","props":"пластилин","b":"Ведущий называет букву, игроки как можно быстрее лепят предмет на эту букву.","p":["Творчество"],"id":"фигурки","i":656},{"t":"Филин и пташки","a":[1],"ty":"Подвижные и эстафеты","goal":"Подражание, внимание","n":"8-20","time":"10 мин","props":"нет","b":"Каждый выбирает птицу и подражает её голосу. Филин в гнезде. На сигнал «Филин!» все прячутся в свои дома. Если филин поймал птицу, она должна назвать, кто она (по голосу). Если угадали - новый филин.","p":["Движение и разминка","Внимание и мышление"],"id":"филинипташки","i":657},{"t":"Флажки на двух полянах","a":[2,3],"ty":"Следопытство и ориентирование","goal":"Скрытность, командность","n":"2 команды по 15","time":"60 мин","props":"20 флажков двух цветов, горн","b":"Две поляны в 200-300 м, на каждой по десять флажков своего цвета. В каждой команде 5 «часовых» (охраняют по два флажка) и 10 «разведчиков». Разведчики стараются незаметно пробраться на чужую поляну, забрать флажки и вернуться. Осаленный касанием - пленный, за каждого пленного команда возвращает один флажок. Игра идёт до 4 добытых флажков или час.","p":["Следопытство"],"id":"флажкинадвухполянах","i":658},{"t":"Флажковая азбука","a":[2,3],"ty":"Следопытство и ориентирование","goal":"Сигнализация","n":"пары","time":"30 мин","props":"флажки, азбука Морзе, бумага","b":"Пары заранее учат азбуку Морзе. Ведущий читает фразу по буквам, помощник передаёт флажками на расстоянии 80-100 м. Пары записывают точки и тире и переводят в текст. Усложнение: фраза из 6-8 слов, принимает каждый.","p":["Следопытство"],"id":"флажковаяазбука","i":659},{"t":"Фотоаппарат","a":[2,3],"ty":"Знакомство и сплочение","goal":"Доверие, забота","n":"пары","time":"15 мин","props":"нет","b":"Фотограф ведёт «фотоаппарат» с закрытыми глазами к интересному месту, лёгким нажатием на плечо «делает снимок» (глаза открываются на секунду). Потом фотоаппарат угадывает, где был. В обсуждении: как вёл, предупреждал ли об опасности, комфортно ли было.","p":["Доверие","Сплочение"],"id":"фотоаппарат","i":660},{"t":"Французский вальс","a":[2,3],"ty":"Музыка, праздники и большие игры","goal":"Парный танец","n":"пары","time":"10 мин","props":"музыка","b":"Пары в кругу, маятник ногой, хлопки, шаги к партнёру и от него, хлопки за талией и за шеей, затем несколько тактов вальса.","p":["Движение и разминка"],"id":"французскийвальс","i":661},{"t":"Фруктовая корзина","a":[1,2],"ty":"В кругу, на месте и в тишине","goal":"Размяться","n":"6-15","time":"5-10 мин","props":"стулья","b":"Все сидят в круге, у каждого своё название фрукта. Водящий в центре «покупает» несколько фруктов, и названные меняются местами, а водящий пытается успеть сесть. Оставшийся без места - новый водящий.","p":["Движение и разминка"],"id":"фруктоваякорзина","i":662},{"t":"Футбол с пуговицами","a":[1,2],"ty":"В кругу, на месте и в тишине","goal":"Ловкость, пятиминутка","n":"2-8","time":"10-15 мин","props":"пуговицы","b":"Две команды, ворота - две пуговицы на полу. Играем тремя пуговицами, бить можно только средней, лежащей между двумя другими. Удары поочередно.","p":["Успокоение","Движение и разминка"],"id":"футболспуговицами","i":663},{"t":"Футбол цепочкой","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Командность","n":"2 команды","time":"15 мин","props":"мяч, ворота","b":"Команды стоят цепочками под руки и ведут мяч к воротам, не разрывая цепи.","p":["Движение и разминка"],"id":"футболцепочкой","i":664},{"t":"Футбольный боулинг","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Меткость","n":"любое","time":"10 мин","props":"10 кеглей или бутылок, мяч","b":"С 8-12 м мячом сбивают десять кеглей. Счёт как в боулинге.","p":["Движение и разминка"],"id":"футбольныйбоулинг","i":665},{"t":"Ха-ха-ха","a":[1,2,3],"ty":"В кругу, на месте и в тишине","goal":"Смех, сдержанность","n":"8-25","time":"5 мин","props":"нет","b":"Первый говорит «ха», второй «ха-ха», третий «ха-ха-ха» и так по кругу, без улыбки. Засмеялся - выбыл.","p":["Движение и разминка"],"id":"хахаха","i":666},{"t":"Хвост дракона","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Ловкость","n":"6-12","time":"10 мин","props":"нет","b":"Колонна, держимся за пояс. Первый (голова) ловит последнего (хвост), хвост уворачивается. Рядом никого лишнего.","p":["Движение и разминка"],"id":"хвостдракона","i":667},{"t":"Хвосты","a":[1,2],"ty":"Музыка, праздники и большие игры","goal":"Ловкость","n":"6-20","time":"10 мин","props":"платки или ленты","b":"У каждого за поясом «хвост» (платок). Нужно сорвать хвост у соперника и сохранить свой.","p":["Событие","Движение и разминка"],"id":"хвосты","i":668},{"t":"Хлопай - топай","a":[1],"ty":"В кругу, на месте и в тишине","goal":"Выпустить пар","n":"1-5","time":"3 мин","props":"нет","b":"Тем, кто злится, предлагают потопать ногами и сильно похлопать в ладоши в специально отведённом месте.","p":["Успокоение"],"id":"хлопайтопай","i":669},{"t":"Хлопки (по ведущему)","a":[1,2,3],"ty":"В кругу, на месте и в тишине","goal":"Внимание","n":"любое","time":"3 мин","props":"нет","b":"Все хлопают, когда хлопает ведущий. Он иногда делает вид, что хлопает, или резко останавливается. Хорошо для разогрева у костра и на песенном вечере.","p":["Заполнить паузу","Внимание и мышление"],"id":"хлопки","i":670},{"t":"Хлопок-имя","a":[1,2,3],"ty":"Знакомство и сплочение","goal":"Выучить имена","n":"8-25","time":"5-10 мин","props":"нет","b":"Задаём ритм: хлопок, шлепок по коленям. На хлопок называем своё имя, на следующий - имя другого. Названный продолжает.","p":["Знакомство"],"id":"хлопокимя","i":671},{"t":"Ходули","a":[2,3],"ty":"Музыка, праздники и большие игры","goal":"Равновесие","n":"4-10","time":"10 мин","props":"ходули невысокие","b":"Соревнования: кто дальше пройдёт, кто кого перепляшет. Низкие ходули, мягкая трава, рядом страхующий.","p":["Событие"],"id":"ходули","i":672},{"t":"Хождение с горохом","a":[1,2,3],"ty":"Подвижные и эстафеты","goal":"Ловкость, дыхание","n":"команды","time":"10 мин","props":"горох, соломинки","b":"Горошину держат на конце соломинки, втянув воздух, и передают по цепочке следующему без рук. Упала - возвращают в начало. Следим, чтобы никто не втягивал горошину в рот.","p":["Движение и разминка"],"id":"хождениесгорохом","i":673},{"t":"Художественная эстафета","a":[1,2,3],"ty":"Подвижные и эстафеты","goal":"Командная работа","n":"две команды","time":"10 мин","props":"2 ватмана, 2 маркера","b":"Две команды рисуют животное или предмет. Каждый имеет право нарисовать только одну линию. Вариант без ограничения по времени: кто быстрее нарисует.","p":["Движение и разминка"],"id":"художественнаяэстафета","i":674},{"t":"Художники (абстрактные слова)","a":[2,3],"ty":"Творческие и интеллектуальные","goal":"Командное творчество","n":"две команды","time":"15 мин","props":"большой лист, маркеры","b":"Участник рисует слово, которое дал ведущий (радость, победа, удивление), без цифр и букв. Его команда угадывает. Выигрывает та, чей рисунок поняли быстрее.","p":["Творчество"],"id":"художники","i":675},{"t":"Царь горы","a":[1,2],"ty":"Музыка, праздники и большие игры","goal":"Ловкость","n":"6-20","time":"10 мин","props":"невысокая горка или бревно","b":"Забраться на горку и удержаться, не толкая других и не хватаясь за одежду и голову. Только на мягкой траве.","p":["Событие","Движение и разминка"],"id":"царьгоры","i":676},{"t":"Цвета","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Реакция","n":"8-20","time":"5-10 мин","props":"нет","b":"В кругу ведущий командует «Коснись жёлтого, раз, два, три!» Нужно успеть дотронуться до чего-то жёлтого у других. Кто не успел - выбывает. Цвет каждый раз новый.","p":["Движение и разминка","Внимание и мышление"],"id":"цвета","i":677},{"t":"Ценности","a":[3],"ty":"В кругу, на месте и в тишине","goal":"Осознать свои ценности","n":"любое","time":"30 мин","props":"по 6 листочков, спокойная музыка","b":"Каждый пишет на 6 листочках, что ему ценно, и ранжирует. Ведущий спокойным голосом «забирает» ценности по очереди (листочки мнут и откладывают), а потом «чудо» позволяет вернуть любые шесть. Обсуждаем. Нужна очень безопасная обстановка, вожатому самому лучше сначала пройти упражнение.","p":["Итоги и разговор"],"id":"ценности","i":678},{"t":"Ципп-цапп","a":[1,2],"ty":"В кругу, на месте и в тишине","goal":"Запомнить имена, внимание","n":"10-20","time":"10 мин","props":"стулья","b":"Водящий без стула подходит к сидящему и говорит «Ципп» или «Цапп», быстро считая до 10. После «Ципп» названный должен назвать имя того, кто слева, после «Цапп» - справа. Не успел - водит. На «Ципп-цапп» все меняются местами.","p":["Внимание и мышление","Знакомство"],"id":"циппцапп","i":679},{"t":"Цып-цап","a":[1,2],"ty":"В кругу, на месте и в тишине","goal":"Запомнить имена","n":"8-25","time":"5 мин","props":"нет","b":"Ведущий показывает на игрока и говорит «цып» (назвать имя соседа слева) или «цап» (справа).","p":["Заполнить паузу","Знакомство"],"id":"цыпцап","i":680},{"t":"Часы","a":[2,3],"ty":"Знакомство и сплочение","goal":"Знакомство, общение","n":"24-30","time":"до 60 мин","props":"листы с циферблатом, 14 тем для разговора","b":"Каждый получает циферблат и назначает встречи на разные часы разным людям (дважды с одним нельзя). Затем ведущий называет час и тему (в час - музыка, в два - сборы в лагерь), и пары встреч беседуют по 3 минуты.","p":["Знакомство"],"id":"часы","i":681},{"t":"Человек к человеку","a":[1,2,3],"ty":"Знакомство и сплочение","goal":"Знакомство, смех","n":"10-40","time":"10-15 мин","props":"нет","b":"Часть 1: все хаотично двигаются, ведущий выкрикивает «голова к спине», «ухо к уху», «рука к руке». Нужно быстро найти пару. Опоздавший - ведущий. Часть 2: в парах, команды накапливаются («правая рука к левой», «спина к спине») и остаются, пока не прозвучит «Человек к человеку!». Тогда каждый ищет новую пару, и кто остался без пары - ведущий.","p":["Знакомство"],"id":"человеккчеловеку","i":682},{"t":"Человеческий клубок","a":[1,2,3],"ty":"Знакомство и сплочение","goal":"Командность","n":"8-16","time":"10 мин","props":"нет","b":"Круг, руки в центр, каждый берёт за руки двух не соседних игроков. Нужно распутаться, не разжимая рук.","p":["Сплочение"],"id":"человеческийклубок","i":683},{"t":"Человеческий лабиринт","a":[2,3],"ty":"Знакомство и сплочение","goal":"Командность, наблюдательность","n":"10-20","time":"10 мин","props":"нет","b":"Двое отворачиваются, остальные запутываются в узел. Двое возвращаются и распутывают группу, которая всё время слегка двигается.","p":["Сплочение"],"id":"человеческийлабиринт","i":684},{"t":"Чепуха","a":[1,2,3],"ty":"Творческие и интеллектуальные","goal":"Юмор, сплочение","n":"5-8","time":"10 мин","props":"нет","b":"Вариант 1: каждый загадывает предмет (башенный кран, самолёт, бык). Водящий задаёт каждому вопрос про действие («Чем умывался? На чём летал? Что съел утром?»), отвечать можно только загаданным словом. Вариант 2: пока водящий отошёл, соседи шепчут друг другу по слову, и ответ на вопрос - то слово, что досталось. Водящим становится тот, чей ответ вышел самым подходящим. Хорошо для дороги и ожидания.","p":["Внимание и мышление","Сплочение"],"id":"чепуха","i":685},{"t":"Черепаха-путешественница","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Равновесие","n":"команды","time":"10 мин","props":"тазы","b":"На спине стоящего на четвереньках лежит таз дном вверх. Пройти туда и обратно, не потеряв «панцирь». Потом таз переходит к следующему.","p":["Движение и разминка"],"id":"черепахапутешественница","i":686},{"t":"Честность в движениях","a":[3],"ty":"В кругу, на месте и в тишине","goal":"Рефлексия","n":"10-25","time":"15 мин","props":"нет","b":"Ведущий в центре показывает быстрые движения, группа повторяет. Кто ошибся, переходит на другую сторону круга. Ведущий пытается запутать, потом правила меняются на «зеркало». Затем обсудите честность: в игре никто не следит, ошибся ты или нет.","p":["Движение и разминка"],"id":"честностьвдвижениях","i":687},{"t":"Четыре стихии","a":[1,2],"ty":"В кругу, на месте и в тишине","goal":"Знания, внимание","n":"8-25","time":"10 мин","props":"мяч","b":"Ведущий бросает мяч и говорит «земля», «вода», «воздух» или «огонь». На «землю» нужно назвать животное, на «воду» - рыбу, на «воздух» - птицу, на «огонь» - покрутиться, помахать руками. Ошибся - выбыл.","p":["Внимание и мышление"],"id":"четырестихии","i":688},{"t":"Что дальше (цвет машины)","a":[1,2],"ty":"В кругу, на месте и в тишине","goal":"Ожидание в дороге","n":"любое","time":"5-15 мин","props":"нет","b":"Дети по очереди угадывают цвет следующей проезжающей машины или автобуса. За верный ответ - очко.","p":["Заполнить паузу"],"id":"чтодальше","i":689},{"t":"Чувство локтя","a":[1,2,3],"ty":"Знакомство и сплочение","goal":"Командность","n":"6-12","time":"5 мин","props":"нет","b":"Круг спинами к центру, все под локти. Нужно присесть и подняться вместе, на время. Лучше с разным ростом.","p":["Сплочение"],"id":"чувстволоктя","i":690},{"t":"Чут-гут","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Меткость, ловкость","n":"5-6","time":"10 мин","props":"палки 60-70 см","b":"Игроки бросают палки как можно дальше. Чья палка упала ближе всех, тот бежит собирать все палки, непрерывно повторяя «Чут-гут». Кто три раза подряд оказался самым неловким, выбывает.","p":["Движение и разминка"],"id":"чутгут","i":691},{"t":"Чья шеренга победит","a":[2],"ty":"Подвижные и эстафеты","goal":"Силовое соревнование","n":"10-24","time":"10 мин","props":"мел","b":"Две команды, пары игроков стоят лицом к лицу перед линией и держатся за пояс друг друга. По сигналу перетягивают соперника на свою сторону. Проигравший переходит в команду победителя.","p":["Движение и разминка"],"id":"чьяшеренгапобедит","i":692},{"t":"Чёрный паша","a":[1],"ty":"Подвижные и эстафеты","goal":"Ролевая игра, ловкость","n":"12-25","time":"10 мин","props":"нет","b":"Выбираем пастуха, собаку и вруна, остальные - овцы. Врун зовёт пастуха и просит вернуть «чёрную овцу». Подойдя к стаду, он хватает одну овцу и убегает, и только тогда за ним может бежать собака. Если врун добежал до дома - овца ушла, если нет - овца возвращается в стадо.","p":["Движение и разминка"],"id":"черныйпаша","i":693},{"t":"Шаг-мерка","a":[1,2],"ty":"Следопытство и ориентирование","goal":"Глазомер, измерения","n":"пары","time":"25 мин","props":"рулетка или верёвка 100 м, флажки, бумага","b":"Каждый определяет длину своего шага: идёт 100 метров, считает шаги и делит. Потом пары пошагово измеряют расстояние до флажков, расставленных по радиусам от центрального флага. Побеждает самый точный в паре и среди всех.","p":["Следопытство"],"id":"шагмерка","i":694},{"t":"Шаги (Стоп-шаги)","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Игровая фантазия, меткость","n":"6-20","time":"10-15 мин","props":"мяч, мел","b":"Водящий подбрасывает мяч вверх и убегает. Кто поймал, кричит «Стоп!» и назначает водящему шаги: «гиганты» (большие прыжки), «лилипуты» (полступни), «ниточка» (носок к пятке), «утята» (вприсядку), «зайчик» (прыжок). Если удалось дотронуться до водящего - он водит. Вариант: игроки делят круг на «страны» и отрезают территорию у проигравшего.","p":["Движение и разминка","Творчество"],"id":"шаги","i":695},{"t":"Шапки","a":[1,2],"ty":"Музыка, праздники и большие игры","goal":"Ловкость","n":"пары","time":"5 мин","props":"шапки","b":"У двоих на головах шапки. Кто первым сорвал шапку с противника - победил.","p":["Событие","Движение и разминка"],"id":"шапки","i":696},{"t":"Шар в корзине","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Меткость, ловкость","n":"любое","time":"10 мин","props":"корзина, 4 шара","b":"Загнать 4 шара ногами в корзину на время (или за меньшее число ударов). Вариант: командная эстафета.","p":["Движение и разминка"],"id":"шарвкорзине","i":697},{"t":"Шаровая молния (10 состязаний с шарами)","a":[1,2,3],"ty":"Подвижные и эстафеты","goal":"Весёлое командное состязание","n":"команды","time":"30-60 мин","props":"воздушные шарики, нитки, дротики, одеяло, ракетки","b":"Набор конкурсов с шарами: «Шароноги» (шарик привязан к ноге, лопаем чужие, свои бережём), «Шарогрибы» (давим 25 шаров, собираем «пипочки»), «Шародартс» (дротиком в шарик с очками внутри), «Шарокапканы» (эстафета с привязанными шарами), «Шародувы» (надуть самый большой), «Шаргурёнок» (прыжки с шариком между колен), «Шароводы» (нести шарик на ракетке), «Шаробросы» (бросаем шарик с водой, отходя на шаг), «Шаромёты» (перебрасывать шар с водой на одеяле через сетку до 10 голов). Проводить на улице, за лопнувшие шары начислять штрафные очки.","p":["Движение и разминка"],"id":"шароваямолния","i":698},{"t":"Шароводы (удержи шар)","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Сплочение","n":"команды по 6-10","time":"10 мин","props":"воздушный шар","b":"Команда держится за руки и удерживает шар в воздухе, только дуя на него. Вариант: можно подталкивать, но после первого падения нельзя руками, после второго ногами и т.д.","p":["Движение и разминка","Сплочение"],"id":"шароводы","i":699},{"t":"Шишки, жёлуди, орехи","a":[1,2],"ty":"В кругу, на месте и в тишине","goal":"Внимание, разрядка","n":"13-25","time":"10 мин","props":"нет","b":"Тройки в колоннах по трое: первый - «шишка», второй - «жёлудь», третий - «орех». Ведущий в центре называет предмет, и все названные бегут занять место в другой тройке (на новое положение). Кому не хватило места, становится ведущим.","p":["Внимание и мышление"],"id":"шишкижелудиорехи","i":700},{"t":"Шляпа","a":[1,2,3],"ty":"Музыка, праздники и большие игры","goal":"Смех","n":"любое","time":"5-10 мин","props":"шляпа, музыка","b":"Все танцуют. Ведущий надевает шляпу на первого попавшегося. Нужно как можно быстрее передать шляпу другому. Тот, у кого шляпа в момент остановки музыки, становится ведущим.","p":["Движение и разминка"],"id":"шляпа","i":701},{"t":"Шпионы в ночи","a":[2,3],"ty":"Знакомство и сплочение","goal":"Знакомство с голосами и именами","n":"10-30","time":"10-15 мин","props":"повязки, часы","b":"Два «агента» с закрытыми глазами ходят среди группы и ловят «информантов»: дотронувшись, называют имя. Затруднились - просят произнести слово. Правильно назвал - человек уходит к нему в агентство. За 7-10 минут побеждает тот, кто собрал больше людей.","p":["Доверие","Сплочение","Знакомство"],"id":"шпионывночи","i":702},{"t":"Штурм высоты","a":[2,3],"ty":"Следопытство и ориентирование","goal":"Ориентирование, командность","n":"2-3 команды","time":"90 мин","props":"компасы, флаги, бумажные пилотки, конверты","b":"Маршрут 1,5-2 км по азимутам, цель - водрузить флаг на высоту. Побеждает первая. Вариант: первая команда занимает круговую оборону, остальные штурмуют. Сорванная пилотка = выбыл. Удержали 15 минут - побеждают обороняющиеся.","p":["Следопытство"],"id":"штурмвысоты","i":703},{"t":"Шутейный фотоаппарат","a":[1,2,3],"ty":"Музыка, праздники и большие игры","goal":"Праздник, смех","n":"ярмарка","time":"на фестиваль","props":"картонная коробка, нарисованные портреты","b":"Из коробки сделан «фотоаппарат», на нарисованных шуточных портретах (на одного, двоих, троих) отверстия для лиц. Плата - частушка или песенка.","p":["Событие"],"id":"шутейныйфотоаппарат","i":704},{"t":"Шёпот-шепоток","a":[1],"ty":"В кругу, на месте и в тишине","goal":"Слух, сплочение","n":"6-15","time":"10 мин","props":"нет","b":"Водящий отходит. Дети договариваются о слове и все вместе шепчут его. Водящий угадывает. Если нет - слово шепчет один ребёнок.","p":["Сплочение"],"id":"шепотшепоток","i":705},{"t":"Щепка на реке","a":[1,2],"ty":"Знакомство и сплочение","goal":"Доверие, бережность","n":"10-30","time":"10 мин","props":"нет","b":"Два ряда лицом друг к другу, расстояние чуть больше вытянутой руки - это тёплая и ласковая «река». «Щепки» (дети по очереди) с закрытыми глазами проходят между рядами, а вода бережно передаёт их дальше. Никого не отпихивать. После прохода «щепка» встаёт в конец строя.","p":["Сплочение"],"id":"щепканареке","i":706},{"t":"Щука","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Размяться","n":"10-30","time":"10 мин","props":"нет","b":"Салки, где осаленный цепляется к водящему, и вместе они салят дальше. Последний осаленный становится водящим. Вариант: осаленный замирает с раскинутыми руками, и его «расколдовывают» касанием.","p":["Движение и разминка"],"id":"щука","i":707},{"t":"Экологический лабиринт","a":[2,3],"ty":"Следопытство и ориентирование","goal":"Знания, ответственность за природу","n":"команды","time":"60 мин","props":"карты, вопросы с вариантами ответов, задания-штрафы","b":"На КП судья задаёт вопрос по экологии с 2-4 вариантами ответа. По ответу рисует на карте следующий КП: верный - «истинный», неверный - «штрафной». На штрафном КП вместо вопроса задание: собрать мусор, повесить скворечник, посадить дерево, собрать сучья. После него судья рисует «истинный» КП и называет верный ответ. Не больше четырёх КП. Тему можно менять: география, математика, история.","p":["Следопытство"],"id":"экологическийлабиринт","i":708},{"t":"Экскурсия по лагерю","a":[1,2],"ty":"Музыка, праздники и большие игры","goal":"Узнать территорию","n":"8-40","time":"60 мин","props":"нет","b":"В начале смены превращаем знакомство с территорией в театрализованную прогулку со встречами и тайнами: взрослые переодеваются лешими, призраками и т.д. Детей делим на группы по числу вожатых, легенду придумываем заранее.","p":["Событие"],"id":"экскурсияполагерю","i":709},{"t":"Эстафета «Кто первый?»","a":[1],"ty":"Подвижные и эстафеты","goal":"Быстрота","n":"2-4 команды","time":"10 мин","props":"стул на команду","b":"Колонны у старта, в 10-15 м стул. Первые бегут, обегают стул справа и возвращаются. Кто первым пересёк линию - приносит очко. Побеждает команда с большим числом очков.","p":["Движение и разминка"],"id":"эстафетактопервый","i":710},{"t":"Эстафета водоносов","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Аккуратность, скорость","n":"команды по 5","time":"10-15 мин","props":"ведёрки одного объёма, вода, флажки","b":"Первый бежит с ведёрком до флажка и обратно, передаёт следующему. Выигрывает команда, затратившая меньше времени и сохранившая больше воды.","p":["Движение и разминка"],"id":"эстафетаводоносов","i":711},{"t":"Эстафета с зубочистками","a":[2,3],"ty":"Подвижные и эстафеты","goal":"Ловкость","n":"команды","time":"10 мин","props":"зубочистки (лучше пластиковые), кольцо","b":"У каждого зубочистка в зубах, кольцо передают от одного к другому только зубочистками. Упало на пол - тот, кто держал последним, поднимает и продолжает. Лучше использовать безопасные палочки, а не острые.","p":["Движение и разминка"],"id":"эстафетасзубочистками","i":712},{"t":"Эстафета связистов","a":[2,3],"ty":"Следопытство и ориентирование","goal":"Сигнализация","n":"2-3 группы по 8","time":"40 мин","props":"флажки, азбука Морзе","b":"Пары стоят на 4 этапах, каждая видит только соседние. Текст передают флажками от старта до конца, одна половина пары принимает, другая передаёт. Руководитель фиксирует время и верность.","p":["Следопытство"],"id":"эстафетасвязистов","i":713},{"t":"Эстафета со слепым","a":[1,2,3],"ty":"Подвижные и эстафеты","goal":"Слушать команду, смех","n":"команды","time":"10-15 мин","props":"кегли, повязки","b":"Перед каждой командой ряд кеглей. Первый с закрытыми глазами обходит их, команда подсказывает голосом. Одновременно кричат все команды, поэтому нужно выделить голос своей.","p":["Движение и разминка"],"id":"эстафетасослепым","i":714},{"t":"Эстафета со спичкой","a":[2,3],"ty":"Подвижные и эстафеты","goal":"Ловкость","n":"команды","time":"10 мин","props":"зубочистки, стулья","b":"Игрок на стуле держит зубочистку в зубах, подбегает следующий, берёт её зубами, без рук, и садится на место первого. Брать зубочистки из упаковки, у каждого свою.","p":["Движение и разминка"],"id":"эстафетасоспичкой","i":715},{"t":"Это кастрюля","a":[1,2,3],"ty":"В кругу, на месте и в тишине","goal":"Воображение","n":"6-20","time":"5-10 мин","props":"кастрюля","b":"Ведущий держит кастрюлю: «Это шляпа», надевает. Следующий придумывает другое использование и показывает. Пока не кончатся идеи.","p":["Заполнить паузу","Творчество"],"id":"этокастрюля","i":716},{"t":"Эхо","a":[1,2,3],"ty":"В кругу, на месте и в тишине","goal":"Разрядка, обратная связь","n":"5-25","time":"5 мин","props":"нет","b":"Один говорит фразу (можно с жестом), остальные повторяют как эхо.","p":["Движение и разминка"],"id":"эхо","i":717},{"t":"Я вижу в тебе","a":[3],"ty":"Знакомство и сплочение","goal":"Сплочение, обратная связь","n":"12-30","time":"30 мин","props":"нет","b":"Два круга лицом друг к другу, по команде «Перешли» внешний сдвигается на одного. Этапы: «Три пальца» (1 - постояли и посмотрели друг на друга, 2 - пожали руки, 3 - обнялись; выполняется действие по меньшему числу), затем по 20-30 секунд: «Я хочу предложить тебе...» (любые шуточные предложения), «Я вижу в тебе...», «Мне нравится в тебе...». Строго соблюдайте время. Фразу «Мне не нравится в тебе» не используйте, оставляйте только добрые и тёплые. Объятия по желанию.","p":["Знакомство","Сплочение"],"id":"явижувтебе","i":718},{"t":"Я есть!","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Размяться, командная скорость","n":"12-30","time":"10-15 мин","props":"мел","b":"Две команды в шеренгах по разные стороны площадки 50-60 м на 10 м. Убегающая команда хлопает в ладоши и бежит к своей черте, водящая ловит. Осаленный кричит «Я есть!» - и теперь вся его команда разворачивается и ловит соперников. Побеждает команда, которой удалось в полном составе добежать до черты неосаленной. Боковые линии не пересекать.","p":["Движение и разминка"],"id":"яесть","i":719},{"t":"Я знаю 5 имён","a":[1],"ty":"Подвижные и эстафеты","goal":"Память, ловкость","n":"3-12","time":"10 мин","props":"мяч","b":"Бьём мячом о землю: «Я знаю пять имён девочек: Маша - раз, Таня - два...». Ошибся - мяч переходит. Темы любые (цветы, птицы, города).","p":["Движение и разминка","Внимание и мышление","Знакомство"],"id":"язнаю5имен","i":720},{"t":"Я никогда не...","a":[3],"ty":"Знакомство и сплочение","goal":"Узнать друг друга","n":"8-25","time":"10-15 мин","props":"нет","b":"Игроки по очереди говорят «Я никогда не...» (например, «не прыгал с парашютом»). Те, кто это делал, загибают палец. Цель - назвать то, что подходит как можно большему числу людей. Заранее договариваемся говорить правду. Выигрывает тот, у кого остался последний прямой палец.","p":["Знакомство"],"id":"яникогдане","i":721}],"docs":[{"t":"Жаворонки, 6-10 лет: возрастные особенности и на что смотреть","cat":"Возрастные особенности","b":"Страница для вожатого младшего отряда. Часть выводов опирается на материалы лагеря («100 лайфхаков», сборники игр для малышей), часть - на общие сведения возрастной психологии. Если у вас есть свои материалы про 6-10 лет, добавьте, и страницу можно будет расширить.\n## Кто эти дети\n- 6-7 лет: вчерашние дошкольники. Быстро устают, мыслят образами и игрой, нуждаются во взрослом рядом.\n- 8-10 лет: младшие школьники. Любят правила, соревнования, ритуалы, ролевые игры, отряд и «свою» команду, ждут оценки и похвалы.\n- Для многих это первая смена. Расставание с родителями для младшего школьника очень трудно, он быстро начинает скучать по дому, друзьям и питомцам.\n## Особенности развития\n- Внимание короткое: игра или задание около 10-15 минут, потом смена деятельности. Долго сидеть тяжело, перед любым сидячим делом нужно «выбегать» детей.\n- Мышление конкретное. Говорите простыми словами и короткими фразами, объясняйте правила на показе, а не только словами. Иронию и сарказм не понимают.\n- Движение важно: в день нужно много подвижных игр, но с передышками.\n- Эмоции быстро меняются: от смеха к слезам за минуту. Часть детей обидчивы, часть конфликтна, часть агрессивна. Долгая обида и злость вредны для здоровья, из этого состояния ребёнка нужно выводить.\n- Дети легко принимают ритуалы, традиции, талисманы, прибаутки и стихотворные поучения. Всё это создаёт ощущение безопасности.\n- Хорошо работают сказка, образ, роль, сюжет смены. Дети верят в сказочных героев и «подкроватных монстров».\n- Нужен успех и поощрение. После неудачи быстро теряют интерес.\n## На что обращать внимание ежедневно\n- Здоровье и самочувствие: питьевой режим, головные уборы на солнце, температура, сыпь, жалобы на живот. Если сомневаетесь, зовите медика.\n- Гигиена: мытьё рук перед едой, душ, смена белья, носков, одежды по погоде. Ведите учёт белья, подписывайте вещи, у каждого ребёнка свой пакет для грязных вещей.\n- Сон: перед отбоем спокойная свеча, игрушка-«засыпушка», ритуал. Дети боятся темноты, ночью могут проснуться и плакать. Дежурьте и не оставляйте ребёнка одного.\n- Питание: часть детей не ест из-за стеснения или привычек. Не заставляйте, но следите, что поели. Яблоко, порезанное дольками, съедят охотнее.\n- Безопасность: вожатый всегда знает, где его дети. Дети должны знать, где найти вас. Считайте детей при любом перемещении.\n- Вещи: подпишите чемоданы и вещи, сфотографируйте чемоданы в день заезда.\n## Первые дни и скучающие по дому\n- Новички боятся, что их не примут. Старички бегут обнимать знакомых вожатых, а ребёнок с чемоданом стоит один. Заранее продумайте, как включить новичков.\n- Дети скучают и плачут чаще всего вечером и ночью, на 3-й день и после родительского дня. Не говорите «не плачь» и не стыдите. Скажите, что тоска по дому нормальна, займите делом, дайте обнять игрушку, помогите написать письмо или отправить фото родителям.\n- Договоритесь о связи с родителями: звонки в определённое время. Частые звонки усиливают тоску, поэтому правила звонков должны быть понятны заранее.\n- Не обещайте того, что не сможете выполнить («завтра увидишь маму»).\n## Где возникают конфликты и трудности\n- Дележка предметов, мест, очередь, «он первый начал». Решайте через правило очереди и жеребьёвку, а не через поиск виноватого.\n- Обиды из-за игры и проигрыша. Не сравнивайте детей и команды публично. Делайте командные игры, где выигрывают все или меняются составы.\n- Жалобы друг на друга. Выслушайте, спросите «что ты можешь сделать сам», не разбирайте при всех.\n- Драки и толкания в играх. Объясните границы тела и правила заранее, в подвижных играх вводите «тормозилки».\n- Неготовность к самостоятельности: не умеют застёгнуть, найти вещи, завязать шнурки. Помогайте, но не делайте всё за детей, не заставляйте чувствовать себя «маленькими».\n- Детская ложь и фантазии. Не ловите на слове, выясняйте факты спокойно.\n- Слёзы, истерика, агрессия: сначала успокойте тело и дыхание, потом разговор. Уголок уединения, игры «рычалки, пыхтелки, жужжалки», подушки для битья, рисование, игры с водой и песком помогают снять напряжение.\n- Ночное недержание, страхи, нежелание мыться: никогда не обсуждайте при других, тихо решайте вдвоём и сообщите медику или начальнику дружины.\n- Особые дети (гиперактивные, тревожные, с речевыми трудностями, дети без друзей): узнайте о них у руководителя до смены.\n## Как общаться\n- Присядьте, чтобы быть на уровне глаз ребёнка.\n- Говорите в положительной форме: не «не бегай», а «иди шагом».\n- Давайте одно простое указание за раз и не повторяйте по десять раз. Если повторяете, договоритесь о сигнале (хлопок, колокольчик, «стоп-кадр»).\n- Не ругайте, а дайте ребёнку почувствовать последствия и ответственность.\n- Извиниться перед ребёнком нормально.\n- Не кричите: крик повышает шумовой порог, дети шумят громче.\n- Стоп-сарказм: это пассивная агрессия.\n- Хвалите публично и конкретно, ошибки разбирайте один на один.\n- Почемучкам: «А как ты думаешь, почему так?».\n## Что работает в программе\n- Короткие подвижные игры, пятиминутки, хороводы, игры в кругу.\n- Сказка, сюжет смены, роль вожатого-персонажа.\n- Ритуалы: песенка на подъём, приветствие, «приятного аппетита» хором, свеча перед сном.\n- Простые поручения на день (дежурные по столам, по комнате) и пара важных. Давайте столько, сколько сможете проконтролировать.\n- Рисование, поделки, мастерские, где виден результат за один раз.\n- Талисманы-мирилки, браслеты-договоры из ниточки, эмблемы отряда.\n- Добрые дела: покормить птиц, сделать подарок.\n## Чего избегать\n- Длинных объяснений и сложных правил.\n- Игр на выбывание, где ребёнок надолго остаётся без дела.\n- Сравнения детей, обидных прозвищ, угроз и стыда.\n- Игр, где нужно бежать на большое расстояние без контроля.\n- Любой ситуации, когда ребёнок остаётся с одним взрослым наедине вне поля зрения других: общие правила безопасности и порядка в лагере.\n## Подсказка по режиму\nТихий час нужен всем. Утомлённые дети ссорятся и плачут. Если отряд раздражён, это чаще усталость, голод или перевозбуждение, а не «плохое поведение»."},{"t":"Скворцы, 10-13 лет: возрастные особенности и на что смотреть","cat":"Возрастные особенности","b":"Страница для вожатого отряда младших подростков. Опирается на презентацию «Возрастные особенности дружины Скворцы», методичку по работе с подростками в лагере и заметки из сборников игр.\n## Кто эти дети\n- «Ещё не взрослый, уже не ребёнок». Хотят самостоятельности, но внешность и опыт ещё детские, поэтому часто возникают внутренние конфликты и ранимость.\n- Девочки обычно «взрослее» мальчиков: разные темпы и интересы, из-за этого мальчики и девочки часто конфликтуют или демонстративно друг друга не замечают.\n- Любая оценка (даже положительная), замечание о внешности, поведении воспринимается как посягательство на личность. Нужен особый такт.\n## Физиология\n- Начало полового созревания, быстрый рост, диспропорции тела, неловкость движений.\n- Хрупкость, быстрая утомляемость, перепады: активны и астеничны одновременно.\n- Изменение запаха тела: нужно усиленно следить за гигиеной. Напоминайте о зубах, душе, смене одежды и белья спокойно и без насмешки, лучше общим правилом для всех или тихо один на один.\n- Интерес к собственному телу и физиологии. Не высмеивайте и не стыдите, при вопросах отвечайте спокойно или передайте медику.\n## Психология\n- Эмоционально нестабильны, быстро вспыхивают и обижаются, плохо справляются с эмоциями.\n- Формируется самооценка и самопознание: «Что я могу, кто я для других». Сильна чувствительность к мнению группы.\n- Не понимают иронию и сарказм, принимают их всерьёз и обижаются. Специфическое чувство юмора: шутки на грани, «туалетный» юмор, постоянные подколы.\n- Начинается абстрактно-логическое мышление, но жизненного опыта мало, поэтому суждения прямолинейные и категоричные.\n- Потребность в кумирах и идеалах: копируют блогеров, старших, героев фильмов и игр. Следите, кого выбирают.\n## Социальные потребности\n- Принадлежность к группе, значимость в ней, коллективная деятельность. Рождаются «кружки», стая вокруг лидера, возможна травля аутсайдеров.\n- Потребность в самопознании.\n- Интерес к противоположному полу, внимание к внешности, первые влюблённости (часто к героям фильмов, книг и старшим).\n- Хотят дело «не такое, как раньше»: не детские игры, а самостоятельные задания, проекты, роли организаторов.\n## На что обращать внимание ежедневно\n- Техника безопасности: проговариваем регулярно, контролируем выполнение, питьевой режим и физическое состояние.\n- Гигиена: напоминаем про зубы, душ, смену белья, одежды.\n- Физическая активность в достаточном количестве, иначе накапливается энергия, которая выходит в ссорах.\n- Эмоции: распознать, прожить, выработать решение. Учим проявлять и контролировать.\n- Сон: подростки отказываются ложиться, шумят, засыпают поздно, но утром не встают. Договоритесь о правилах отбоя вместе с отрядом.\n- Телефоны и связь: правила сдачи и использования понятны заранее.\n- Одиночки и конфликтные пары: знайте, кто с кем дружит, ругается, кого не выбирают.\n## Где возникают конфликты и трудности\n- Подколы и обзывательства. Реагируйте сразу, говорите о поступке, а не о человеке: «Так говорить нельзя, это обижает».\n- Борьба за лидерство, особенно в отряде, где нет явного лидера. Помогите лидеру проявиться в полезном деле.\n- Мальчики и девочки: насмешки, влюблённости, сплетни, записки. Не высмеивайте, не выносите на публику, спокойно обозначьте границы.\n- Аутсайдеры и травля: часто тихая, через игнорирование. Создавайте ситуации успеха, меняйте составы групп, играйте в игры на сплочение.\n- «Ты мне не указ»: протест против давления и приказов. Лучше предложить выбор («делаем сейчас или через 10 минут»), объяснить смысл правила.\n- Обида на критику. Критикуйте поступок наедине, хвалите публично и громко.\n- Нарушение правил «на спор». Ставьте задачи, где можно проявить смелость безопасно (поход, ночная игра, роли).\n- Спор об очевидном, «это нечестно». Разбирайте правила игры заранее, судья должен быть понятен.\n- Двойные стандарты: дети замечают, что вожатые делают то, что запрещают детям (телефон, сленг, крик). Соблюдайте правила сами.\n- Усталость и кризисные дни смены (см. страницу «Как развивается отряд»): особенно 3-й, 7-й, 9-й дни.\n## Как общаться\n- Вы доминантный и заботливый ВЗРОСЛЫЙ, а не друг-ровесник. Не копируйте сленг, это выглядит смешно, но будьте «в теме»: шутки, тренды, мемы, игры, музыка.\n- Об успехах говорите публично и громко, ошибки разбирайте индивидуально, говорите о поступке, а не о человеке.\n- Не нарушайте телесные и личные границы ребёнка, но контролируйте, чем он занят.\n- Контролируйте речь и шутки: дети всегда общаются на уровень ниже вашего.\n- Формируйте группы, комфортные и для детей, и для вожатого.\n- Меньше нотаций и больше дел. Предлагайте совет, а не приказ.\n## Что работает в программе\n- Командные состязания, квесты, станции, настольные игры, стратегические игры.\n- Роли и ответственность: командир дня, редакторы, организаторы игр.\n- Сюжет смены с реальным заданием, мастерские, спорт, творческие номера.\n- Игры на знакомство и сплочение в первые дни, тренинги на эмоции и границы.\n- Разговор на свече: о дружбе, доверии, ответственности, «мой лучший друг».\n- Поход, следопытские игры, ночные игры (при условии безопасности).\n## Чего избегать\n- Публичных оценок внешности, шуток о теле, сравнения «ты как маленький».\n- Сарказма и иронии, которых дети не поймут.\n- Игр, унижающих проигравшего.\n- Принуждения без объяснения причин.\n## Подсказка\nПостоянные подначки и вспышки чаще всего значат «мне плохо или я боюсь, что меня не примут». Сначала успокойте, потом разбирайтесь."},{"t":"Совы, 13+ лет: возрастные особенности и на что смотреть","cat":"Возрастные особенности","b":"Страница для вожатого отряда подростков. Опирается на методичку по работе с подростками в лагере, сборники и заметки лагеря. Для старших 15-17 лет материалов меньше, пополните страницу своими.\n## Кто эти подростки\n- 12-15 лет принято считать подростковым возрастом, это период с большими физическими, психологическими и социальными изменениями. Его называют кризисным, но у одних подростков кризис ярко выражен, у других проходит почти незаметно.\n- Подросток чувствителен и застенчив, преувеличивает недостатки внешности, обижается на замечания. На доброе слово может ответить показной грубостью, но долго его помнит.\n- Движения могут быть угловатыми, настроение прыгает: то хочется быть взрослым, то нужна защита.\n- Формируется собственная точка зрения, место в коллективе, неформальные группы, первые влюблённости.\n- Поездка в лагерь иногда воспринимается как наказание. Но именно отсутствие давления родителей, класса и дворовой компании часто помогает подростку вести себя иначе.\n## Основные тенденции\n- Стремление быть взрослым, самостоятельным, равным. Он хочет дело «не как раньше», по содержанию и организации.\n- Максимализм и резкие позиции: идеал сегодня, «разочарован» завтра. Один хороший поступок может сделать человека героем, один плохой может перечеркнуть всё.\n- Развитие абстрактного мышления и желание спорить и всё проверять самому. Не принимают на веру, оспаривают очевидное.\n- Жажда признания «самости», уникальности при сильной зависимости от мнения сверстников.\n- Поиск идентичности, противоречивые состояния и мотивы. Возможны перепады от доброты до жестокости.\n- Старшие подростки охотнее противостоят давлению группы, когда оно противоречит убеждениям. Это ценная самостоятельность.\n- Ищут новый круг общения, расширяют контакты, любят дискуссии, риск и поход.\n## На что обращать внимание ежедневно\n- Сон и режим: подростки засиживаются, потом не высыпаются. Согласуйте отбой с отрядом.\n- Питание и самочувствие: пропуск еды, диеты, жалобы на головную боль, тревогу. Приглядывайтесь к тем, кто резко изменил поведение, замкнулся, плачет, говорит о нежелании жить. Об этом сразу сообщайте руководителю и психологу, не оставляйте в одиночестве.\n- Границы и безопасность: курение, вейпы, алкоголь, запрещённые вещества, самовольные уходы. Нужны чёткие правила лагеря и ваше личное поведение, согласованное с ними.\n- Отношения: влюблённости, пары, ревность, давление, неравные отношения. Не высмеивайте, не выносите на публику, но следите за безопасностью и правилами лагеря, особенно ночью.\n- Интернет и телефоны: сообщения, фото, соцсети, буллинг онлайн. Договоритесь о правилах, говорите об осторожности.\n- Эмоциональное состояние: тревога, подавленность, уход в себя. Оставляйте время для разговора один на один.\n- Внешний вид и тело: чувствительность к шуткам и фото. Не фотографируйте без согласия.\n## Где возникают конфликты и трудности\n- С вожатым: протест против приказов и нотаций, проверка авторитета, «ты мне не указ». Авторитет нужно завоевать, и у подростков очень чуткий «детектор лжи» на двойные стандарты.\n- Со сверстниками: борьба за статус, группы по интересам и «против всех», травля, сплетни, высмеивание.\n- Между мальчиками и девочками: влюблённости, ревность, обиды, сплетни.\n- Строгая критика товарища: подростки бывают жестоки в оценке других. Вмешайтесь, помогите соотнести прямоту с чуткостью.\n- Крах авторитетов: вчера кумир, сегодня разочарование. Не берите это на личный счёт.\n- Споры из принципа: спорят не ради истины, а чтобы утвердить свою позицию. Выслушайте и не давите.\n- Правила и их нарушение: отрицают «детские» правила. Помогает совместная выработка правил и логические последствия.\n- Усталость, кризисные дни смены, «передел власти», «старики-всезнайки».\n- Вынужденные коммуникации: дети не любят общаться с незнакомыми, стесняются выступать.\n## Как общаться\n- Уважайте самостоятельность: больше доверия, поручайте сложные дела, не делайте всё сами, не бойтесь их ошибок.\n- Прямое давление и приказ вызывают протест. Охотно принимается совет, ненавязчивое предложение и просьба помочь.\n- Убеждайте, а не приказывайте. Если взгляды подростка неверны, найдите доказательства, но без унижения.\n- Похвала должна быть честной, редкой и без «детской» интонации. Нотации воспринимаются агрессивно.\n- Двойные стандарты недопустимы: не курите при детях, не ругайтесь, не нарушайте режим, если сами запрещаете.\n- Не думайте, что сленг сближает. Говорите нормально, но интересуйтесь их миром.\n- Не делайте вид, что всё знаете. Можно сказать «не знаю, давай разберёмся».\n- Сохраняйте границы: вы взрослый и отвечаете за них. Не вступайте в личные переписки и секреты вне рамок правил лагеря.\n## Что работает в программе\n- Дела с реальным результатом и ответственностью: организуют мероприятие для младших, ведут газету, делают квест, готовят номер, судят игру.\n- Дискуссии, дебаты, разговор на свече о ценностях, смысле, дружбе, взрослении.\n- Тренинги (например, «Планета чувств» в справочнике), игры на доверие и эмоции.\n- Поход, спорт, ночные и стратегические игры, сюжет с настоящими выборами.\n- Творчество: театр, музыка, фото, видео, дизайн.\n- Самоуправление: советы, роли, право голоса в правилах отряда.\n- Возможность выйти за рамки отряда: общелагерные дела, проекты для младших.\n## Чего избегать\n- Принуждения и «детских» игр с обязательным участием.\n- Публичного обсуждения внешности, отношений, личной жизни.\n- Сарказма в сторону подростка, сравнения, угроз.\n- Лжи и обещаний, которые не выполните.\n- Неявных ролей «любимчиков» и «козлов отпущения».\n## Подсказка\nЗа бунтом, грубостью и «мне всё равно» часто стоит желание быть увиденным и принятым. Дайте дело, доверие и ответственность, а не нотации."},{"t":"Как развивается отряд: стадии, кризисные дни, стили руководства","cat":"Возрастные особенности","b":"Временный детский коллектив (ВДК) - группа детей, собранная на смену. Он живёт недолго, дети часто не знакомы, независимы от прежнего круга (родителей, друзей), прожить может все стадии от образования до распада. Знание стадий помогает вожатому сплотить отряд.\n## Стадии развития отряда (по А.Н. Лутошкину)\n- «Песчаная россыпь». Дети не знакомы, боятся сделать шаг навстречу, нет лидера и устойчивых групп. Задача: знакомство, безопасность, понятные правила.\n- «Мягкая глина». Коллектив можно «лепить». Вожатый ставит требования к дисциплине и находит совместное дело.\n- «Мерцающий маяк». Совместная деятельность становится инициативой самого отряда, по
