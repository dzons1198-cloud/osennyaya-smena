е сидели царь, царевич, король, королевич, сапожник, портной». Остальные прыгают. Кто задел - водит.","p":["Движение и разминка"],"id":"назолотомкрыльцесидели","i":373},{"t":"На обломках корабля","a":[1,2,3],"ty":"Подвижные и эстафеты","goal":"Размяться","n":"от 4","time":"10-15 мин","props":"подушки, покрывала, возвышения","b":"Пол - «море», безопасные места - «обломки» (стулья, подушки). «Пират» ловит остальных. Осаленный, у которого хоть одна нога в «море», становится пиратом. Больше 10 секунд на одном месте стоять нельзя, два игрока не занимают одно место.","p":["Движение и разминка"],"id":"наобломкахкорабля","i":374},{"t":"На ощупь","a":[1,2,3],"ty":"В кругу, на месте и в тишине","goal":"Тактильное внимание","n":"любое","time":"5-10 мин","props":"мешок, 8-10 мелких предметов","b":"В тканевом мешке лежат предметы (ножницы, пробка, катушка, пуговица, ложка). Через ткань нужно угадать, что в мешке. Для безопасности без острых краёв.","p":["Успокоение","Внимание и мышление"],"id":"наощупь","i":375},{"t":"Наблюдатели","a":[1,2],"ty":"Следопытство и ориентирование","goal":"Зрительная память","n":"6-20","time":"15 мин","props":"флажки, палки","b":"Минуту рассматривают ландшафт (дорога, колодец, дом, мостик), поворачиваются спиной, отвечают на вопросы. Очко за правильный ответ. Усложнение: другая группа пробегает или проползает в пределах видимости с предметами, наблюдатели сообщают, что видели.","p":["Следопытство","Внимание и мышление"],"id":"наблюдатели","i":376},{"t":"Надень колпак","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Ловкость","n":"2","time":"5 мин","props":"бумажные колпаки на палках","b":"У каждого длинная палка с колпаком. Нужно «околпачить» соперника: надеть колпак ему на голову, не получив своего.","p":["Движение и разминка"],"id":"наденьколпак","i":377},{"t":"Надписи на спине","a":[2,3],"ty":"Знакомство и сплочение","goal":"Тёплая обратная связь","n":"от 8","time":"10-15 мин","props":"листы, скотч, ручки","b":"Каждому прикрепляют лист на спину, все ходят и пишут друг другу на спинах то, что нравится в человеке. Потом читают и обсуждают. Хорошо для конца смены, но можно и для знакомства.","p":["Сплочение"],"id":"надписинаспине","i":378},{"t":"Найди кольцо","a":[1,2],"ty":"В кругу, на месте и в тишине","goal":"Внимание","n":"10-20","time":"10 мин","props":"верёвка, большое кольцо, повязка","b":"Все держатся за общую верёвку с кольцом, водящему в центре завязывают глаза. Игроки передвигают кольцо по верёвке, водящий должен найти у кого оно. У кого нашли, тот водит.","p":["Внимание и мышление"],"id":"найдикольцо","i":379},{"t":"Найди место (стулья в разные стороны)","a":[1,2,3],"ty":"В кругу, на месте и в тишине","goal":"Ориентирование","n":"патрули","time":"40 мин","props":"записка, камень","b":"В 500-800 м от лагеря под большим камнем лежит записка «Вы нашли это место. Принесите записку мне». Патрулям дают ориентиры (линия электропередач, родник, колодец, сломанное дерево, знак) и азимуты на некоторые. Побеждает патруль, первым нашедший место. Первый ориентир сделайте самым сложным.","p":["Движение и разминка"],"id":"найдиместо","i":380},{"t":"Найди отличие","a":[1,2],"ty":"Творческие и интеллектуальные","goal":"Внимательность","n":"2 или группа","time":"5-10 мин","props":"бумага, доска","b":"Один рисует простую картинку и отворачивается, второй дорисовывает пару деталей. Первый должен заметить изменения. С группой - у доски по очереди.","p":["Внимание и мышление"],"id":"найдиотличие","i":381},{"t":"Найди партнёра по коду","a":[1,2,3],"ty":"Знакомство и сплочение","goal":"Знакомство, доверие","n":"10-30","time":"10-20 мин","props":"повязки","b":"Пары придумывают код из двух слов («луна - мяч»). Один из пары становится на другую сторону площадки и с завязанными глазами, вытянув руки, ищет партнёра, называя свою половину кода. Нашли - снимают повязки и знакомятся. Варианты: шёпотом или звуками.","p":["Знакомство","Сплочение"],"id":"найдипартнерапокоду","i":382},{"t":"Найди предмет (охота на предметы)","a":[2,3],"ty":"Знакомство и сплочение","goal":"Знакомство, общение","n":"от 8","time":"на весь вечер","props":"мелкие предметы, список","b":"Каждый тайно прячет в карманах небольшой предмет, ведущий вывешивает список всех предметов. Игроки ищут предметы друг у друга (по согласию, без обысков: можно просто задавать вопросы). Побеждает тот, кто нашёл больше. Помогает общаться.","p":["Знакомство"],"id":"найдипредмет","i":383},{"t":"Найди свою салфетку","a":[1],"ty":"Творческие и интеллектуальные","goal":"Внимание","n":"до 10","time":"10 мин","props":"салфетки с вырезами, схемы","b":"Дети по схеме со сложенной салфеткой находят свою. Усложнение - схема сложена вчетверо.","p":["Внимание и мышление"],"id":"найдисвоюсалфетку","i":384},{"t":"Найди смысл","a":[2,3],"ty":"В кругу, на месте и в тишине","goal":"Слух, память","n":"6-20","time":"10 мин","props":"три четверостишия","b":"Три чтеца читают подряд по строчке из разных стихотворений (сначала первые, потом вторые и т. д.). Слушатели должны восстановить все три стихотворения.","p":["Заполнить паузу","Внимание и мышление"],"id":"найдисмысл","i":385},{"t":"Нарисуй слона","a":[1,2],"ty":"Творческие и интеллектуальные","goal":"Смех","n":"команды","time":"10 мин","props":"листы, фломастеры, повязки","b":"Команды с закрытыми глазами рисуют слона по частям: один тело, другой голову, третий ноги. Чей слон быстрее и похожее, получает очко.","p":["Творчество"],"id":"нарисуйслона","i":386},{"t":"Нарисуй солнышко","a":[1],"ty":"Подвижные и эстафеты","goal":"Скорость, командная работа","n":"команды","time":"10 мин","props":"гимнастические палки или палочки, обручи","b":"Впереди каждой команды лежит обруч. Игроки по очереди бегут с палкой и раскладывают её лучом вокруг обруча. Выигрывает команда, которая быстрее «нарисует солнышко».","p":["Движение и разминка"],"id":"нарисуйсолнышко","i":387},{"t":"Нарядим ёлочку","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Ловкость, меткость","n":"команды","time":"10 мин","props":"игрушки из ваты с проволочными крючками, удочка с крючком, ветка-ёлочка","b":"Нужно удочкой повесить на ёлку все игрушки, а потом снять их. Выигрывает тот, кто справился быстрее (например, за 2 минуты). Зимний вариант.","p":["Движение и разминка"],"id":"нарядимелочку","i":388},{"t":"Наступашки","a":[1,2,3],"ty":"Музыка, праздники и большие игры","goal":"Реакция","n":"8-25","time":"5-10 мин","props":"музыка","b":"Водящий в центре танцует, все повторяют. Он пытается незаметно наступить кому-то на ногу, а игроки увёртываются. Кому наступили, тот водит.","p":["Движение и разминка","Внимание и мышление"],"id":"наступашки","i":389},{"t":"Находчивые гости (прищепки)","a":[1,2,3],"ty":"Подвижные и эстафеты","goal":"Смех","n":"пары","time":"10 мин","props":"бельевые прищепки, повязки","b":"Парам завязывают глаза и прицепляют прищепки к одежде. По сигналу надо снять все прищепки с партнёра. Быстрейшая пара выигрывает.","p":["Движение и разминка"],"id":"находчивыегости","i":390},{"t":"Не дыши мне в затылок","a":[2,3],"ty":"Творческие и интеллектуальные","goal":"Выразительность, внимание","n":"8-25","time":"15 мин","props":"нет","b":"Водящий стоит спиной к группе, помощник лицом. Один игрок встаёт за спиной водящего, помощник жестами и мимикой показывает, кто это, а водящий называет имя. Через три ошибки меняются. Можно ограничить время показа.","p":["Внимание и мышление"],"id":"недышимневзатылок","i":391},{"t":"Не попадись на удочку","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Прыгучесть","n":"8-20","time":"10 мин","props":"верёвка с мягким грузиком","b":"Водящий раскручивает верёвку над землёй, остальные перепрыгивают. Постепенно верёвка поднимается. Задел - становишься водящим. Грузик мягкий (мешочек с тканью или мягким), без острых предметов.","p":["Движение и разминка"],"id":"непопадисьнаудочку","i":392},{"t":"Не спешите","a":[1,2],"ty":"В кругу, на месте и в тишине","goal":"Внимание, память","n":"6-25","time":"5-10 мин","props":"нет","b":"Ведущий показывает движения (руки вверх, в стороны, на пояс, приседание), игроки повторяют с отставанием на одно движение: на первом стоят, на втором повторяют первое и т. д. Ошибся - шаг вперёд. Не больше 10 движений.","p":["Заполнить паузу","Внимание и мышление"],"id":"неспешите","i":393},{"t":"Не сходя с ребра","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Равновесие","n":"команды","time":"10 мин","props":"доска на ребре, 5 карандашей, 5 ластиков","b":"Идя по ребру доски и не сходя с него, переложить предметы слева направо и наоборот. Не получилось - начать сначала, одна повторная попытка.","p":["Движение и разминка"],"id":"несходясребра","i":394},{"t":"Не хлопай на четверг","a":[1,2],"ty":"В кругу, на месте и в тишине","goal":"Внимание","n":"6-30","time":"5 мин","props":"нет","b":"Ведущий называет дни недели в разнобой и хлопает, все повторяют. На слово «четверг» хлопать нельзя. Кто хлопнул, выбывает.","p":["Заполнить паузу","Внимание и мышление"],"id":"нехлопайначетверг","i":395},{"t":"Не хуже кенгуру","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Ловкость","n":"команды","time":"10 мин","props":"теннисный мяч или спичечный коробок","b":"Пропрыгать дистанцию, зажав мяч коленями. Уронил - поднимай и продолжай. Лучшее время побеждает.","p":["Движение и разминка"],"id":"нехужекенгуру","i":396},{"t":"Невербальное знакомство","a":[2,3],"ty":"Знакомство и сплочение","goal":"Преодолеть барьеры в общении","n":"чем больше, тем лучше","time":"5-10 мин","props":"нет","b":"Молча и хаотично знакомимся: руками с закрытыми глазами, глазами, спинами и т.д. Проводить, когда группа уже разогрета.","p":["Знакомство"],"id":"невербальноезнакомство","i":397},{"t":"Невидимая верёвка (лабиринт)","a":[1,2,3],"ty":"В кругу, на месте и в тишине","goal":"Смех, доверие","n":"любое","time":"10-15 мин","props":"длинная верёвка, повязка","b":"Игроку показывают натянутую верёвку-лабиринт, завязывают глаза. Верёвку тайно убирают, а зрители подсказывают, где перешагивать и пригнуться. Зрителей заранее просят не выдавать секрет, а потом показать игроку, как всё было.","p":["Успокоение","Сплочение"],"id":"невидимаяверевка","i":398},{"t":"Невод","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Командность","n":"12-30","time":"10 мин","props":"нет","b":"Два рыбака, взявшись за руки, ловят рыбок. Пойманные встают в цепь и становятся «неводом». Последние двое непойманных - победители и новые рыбаки.","p":["Движение и разминка"],"id":"невод","i":399},{"t":"Нелепица","a":[2,3],"ty":"Творческие и интеллектуальные","goal":"Юмор","n":"5-15","time":"15 мин","props":"листы, ручки","b":"Каждый пишет сверху ответ на «кто?», загибает и передаёт соседу, дальше «с кем?», «когда?», «где?», «что делали?», «чем закончилось?». В конце листы разворачивают и читают вслух получившиеся смешные истории.","p":["Творчество"],"id":"нелепица","i":400},{"t":"Немой зоопарк","a":[1,2],"ty":"В кругу, на месте и в тишине","goal":"Внимание, память","n":"любое","time":"10 мин","props":"нет","b":"Каждый придумывает животное и жест. Приветы передаются по цепочке: показываешь своё животное, затем животное того, кому передаёшь привет.","p":["Внимание и мышление"],"id":"немойзоопарк","i":401},{"t":"Необычная эстафета","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Фантазия","n":"две команды","time":"10 мин","props":"нет","b":"Команды выполняют задания: бежать треугольником, пунктиром, квадратиками, столбиком, всмятку. Не по фигуре, а именно как эта фигура. Побеждает самая оригинальная и первая.","p":["Движение и разминка","Творчество"],"id":"необычнаяэстафета","i":402},{"t":"Необычный волейбол","a":[2,3],"ty":"Подвижные и эстафеты","goal":"Командная игра, смех","n":"8-16","time":"20 мин","props":"волейбольная площадка, полотнище или шарик","b":"Правила волейбола, но сетка заменена сплошным полотном (не видно соперников). Вариант: играем воздушным шариком в безветренную погоду.","p":["Движение и разминка"],"id":"необычныйволейбол","i":403},{"t":"Нет-нет-нет!","a":[1,2],"ty":"Творческие и интеллектуальные","goal":"Юмор","n":"5-8","time":"10 мин","props":"нет","b":"Как «Чепуха», но игроки получают от соседа сочетание из трёх «да» и «нет» (например, «нет-да-да»). Водящий задаёт каждому три вопроса, ответы идут строго по этому порядку. Побеждает тот, чьи ответы оказались ближе к правде.","p":["Внимание и мышление"],"id":"нетнетнет","i":404},{"t":"Неуловимый стул","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Ориентировка","n":"любое","time":"10 мин","props":"стул, повязка, мел","b":"На полу две черты в 8 шагах. Игроку завязывают глаза, он идёт от одной черты к другой, разворачивается и садится на стул. Пока он идёт, стул можно тихонько передвинуть - и сесть становится сложнее. Рядом должен стоять страхующий вожатый.","p":["Движение и разминка"],"id":"неуловимыйстул","i":405},{"t":"Но зато я","a":[2,3],"ty":"В кругу, на месте и в тишине","goal":"Юмор, позитивное мышление","n":"4-20","time":"10 мин","props":"мяч или платок-узелок","b":"Круг, перебрасывают мяч. Бросающий говорит о себе фразу, начинающуюся с «Я не...», а поймавший отвечает «Но зато я...» и продолжает позитивно. Не успел или не поймал - выполняет шуточное задание (скороговорка, стих, прыжки). Фразы только добродушные, без обидного.","p":["Внимание и мышление"],"id":"нозатоя","i":406},{"t":"Ноги - это да!","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Ловкость","n":"2","time":"5 мин","props":"блюдца, грецкие орехи","b":"Босиком на стульчике нужно пальцами правой ноги переложить пять орехов в блюдце, а левой - в другое. Побеждает быстрейший.","p":["Движение и разминка"],"id":"ногиэтода","i":407},{"t":"Ночная игра «Огоньки и волшебное дерево»","a":[1,2],"ty":"Музыка, праздники и большие игры","goal":"Мудрость, командность, ночная прогулка","n":"3-6 отрядов","time":"60-90 мин","props":"фонарики или свечи в банках, верёвка, цветные жетоны (зелёный, жёлтый, красный), ленточки, конфеты, маркер","b":"По территории расставлены «огоньки» (фонарики, костры). Отряды идут от огонька к огоньку, держась за общую верёвку. У одних огоньков просто мудрые надписи, у других сидят «старцы». Старец рассказывает короткую легенду и спрашивает: «О чём эта сказка?» За глубину ответа даёт жетон: зелёный, жёлтый или красный. После трёх старцев отряд получает загадку о месте, где растёт волшебное дерево. Если все жетоны красные, четверо представителей входят в зону дерева (огорожена маркером). Если нет, отряд ищет другие отряды, чтобы объединиться и набрать нужное число красных. Чем больше отрядов объединилось, тем меньше человек входит: два отряда - 3 человека, три - 2, четыре - 1. По лесу ходит «охотник» и пугает тех, кто расцепился. У дерева завязывают ленточку, снимают конфету, загадывают желание. Охотник и старцы - взрослые или старшие, страшилок не нужно. Перед игрой проверить территорию и пересчитать детей.","p":["Событие"],"id":"ночнаяиграогонькииволшебноедерево","i":408},{"t":"Ночная слежка","a":[2,3],"ty":"Следопытство и ориентирование","goal":"Наблюдательность, скрытность","n":"патрули по 5-8","time":"60-90 мин","props":"описания «подозрительной личности», блокноты, фонарики","b":"Вожатые придумывают около 20 «подозрительных» действий: записать номер машины, посветить фонариком на номер дома, спросить дорогу, спрятать монетку в дупло, сверить часы. Каждый патруль получает описание «личности» и место, где её видели, должен найти и незаметно проследить, записывая действия. Очки: 1 за каждое замеченное действие, +1 за ценные уточнения, -1 за явное наблюдение, которое выдало патруль. Время возврата оговаривается заранее. Играть только на безопасной территории, патруль в сопровождении взрослого, с фонариком.","p":["Следопытство"],"id":"ночнаяслежка","i":409},{"t":"Нюхач","a":[1,2,3],"ty":"В кругу, на месте и в тишине","goal":"Обоняние","n":"любое","time":"5-10 мин","props":"цветы, травы, повязка","b":"С завязанными глазами определить по запаху цветок или травы. Не давать аллергикам.","p":["Успокоение"],"id":"нюхач","i":410},{"t":"О-эй-эй-эй!","a":[1,2],"ty":"В кругу, на месте и в тишине","goal":"Внимание, реакция","n":"10-25","time":"5-10 мин","props":"нет","b":"Круг рассчитывается по номерам. Ведущий называет два номера, они хлопают по коленям, говорят «О-эй-эй-эй!» и меняются местами, ведущий старается занять чьё-то место. Оставшийся без места - ведущий.","p":["Внимание и мышление"],"id":"оэйэйэй","i":411},{"t":"Обгонялки","a":[1],"ty":"Творческие и интеллектуальные","goal":"Мышление","n":"8-20","time":"10 мин","props":"флажки, фишки","b":"Ведущий описывает загадку. Кто угадал, поднимает флажок. Угадал с первого раза - красная фишка, со второго - жёлтая, с третьего - зелёная.","p":["Внимание и мышление"],"id":"обгонялки","i":412},{"t":"Обе стороны","a":[2,3],"ty":"Подвижные и эстафеты","goal":"Сила, командность","n":"14-40","time":"10 мин","props":"пешки или мел","b":"Шеренга рассчитывается на первых и вторых, первые поворачиваются кругом, все берутся под руки. Получилась цепь, где половина смотрит в одну сторону, половина в другую. Две боковые линии на расстоянии 5-6 шагов. По сигналу обе группы тянут цепь к своей линии. Побеждает та, кто заставит хотя бы одного соперника переступить свою линию.","p":["Движение и разминка"],"id":"обестороны","i":413},{"t":"Общее письмо","a":[1,2,3],"ty":"В кругу, на месте и в тишине","goal":"Смех","n":"от 5","time":"10 мин","props":"листочки","b":"Каждый пишет ответ на вопрос (кто, кем работал, когда, где, что делал, зачем, чем кончилось) и загибает лист. Потом читают общий текст: «Миша, уборщик, три дня назад пошёл в кино, потому что потерялся».","p":["Успокоение"],"id":"общееписьмо","i":414},{"t":"Объелись мёда","a":[1,2,3],"ty":"Знакомство и сплочение","goal":"Командность, смех","n":"пары, затем весь отряд","time":"10 мин","props":"нет","b":"Пара сидит на полу, держась за руки: «слиплись от мёда». Нужно встать, не расцепляя рук. Потом вчетвером, впятером, всем отрядом по кругу.","p":["Сплочение"],"id":"объелисьмеда","i":415},{"t":"Объём лёгких","a":[1,2,3],"ty":"Подвижные и эстафеты","goal":"Смех","n":"команды","time":"5 мин","props":"воздушные шары","b":"Надуть воздушные шары за отведённое время без помощи рук (держат только губами и зубами). Для детей с астмой - не участвуют.","p":["Движение и разминка"],"id":"объемлегких","i":416},{"t":"Один в круге","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Ловкость","n":"8-20","time":"10 мин","props":"лёгкий мяч","b":"Игроки перебрасывают мяч. Ошибившийся выходит в центр, остальные бросают так, чтобы он не поймал, а мяч попал в него. Если центральный поймал мяч, он бросает в любого, в кого попал - заменяет его.","p":["Движение и разминка"],"id":"одинвкруге","i":417},{"t":"Определи на ощупь","a":[2,3],"ty":"Знакомство и сплочение","goal":"Телесный контакт, смех","n":"до 20","time":"5 мин","props":"нет","b":"Группа в кругу. Нужно пройти и определить, у кого самые тёплые руки (носы, уши).","p":["Доверие","Сплочение"],"id":"определинаощупь","i":418},{"t":"Опусти яйцо","a":[2,3],"ty":"Подвижные и эстафеты","goal":"Координация","n":"пары","time":"10 мин","props":"сырые яйца (или мячики)","b":"Пары стоят спинами, между спинами зажато яйцо. Нужно присесть и опустить его на пол, не разбив. Победитель - пара с целым яйцом. Для малышей лучше мячик.","p":["Движение и разминка"],"id":"опустияйцо","i":419},{"t":"Опустить яйцо","a":[2,3],"ty":"Подвижные и эстафеты","goal":"Ловкость","n":"пары","time":"10 мин","props":"сырые яйца или резиновые мячики","b":"Пара стоит спиной к спине, между спинами зажато яйцо. Нужно аккуратно присесть и опустить его на пол. Выигрывает пара, у которой яйцо целое. Лучше мячики.","p":["Движение и разминка"],"id":"опуститьяйцо","i":420},{"t":"Орда и отрешённые","a":[2,3],"ty":"В кругу, на месте и в тишине","goal":"Смех, выдержка","n":"12-30","time":"5-10 мин","props":"нет","b":"Внутренний круг - «отрешённые», сохраняют серьёзность. Внешний круг - «орда» ходит и пытается их рассмешить (без прикосновений). Рассмеялся - переходит в орду.","p":["Движение и разминка"],"id":"ордаиотрешенные","i":421},{"t":"Орехи","a":[2,3],"ty":"Знакомство и сплочение","goal":"Внимательность к людям","n":"8-25","time":"15 мин","props":"грецкие орехи","b":"Каждый получает орех, внимательно рассматривает. Орехи перемешивают, и каждый ищет свой, потом рассказывает, как узнал. Вывод: сначала все кажутся одинаковыми, а за жёсткой оболочкой может скрываться нежное.","p":["Сплочение"],"id":"орехи","i":422},{"t":"Освобождение заложника","a":[2,3],"ty":"Подвижные и эстафеты","goal":"Командная тактика","n":"12-30","time":"15 мин","props":"повязки","b":"Охрана с завязанными глазами стоит по кругу на расстоянии вытянутой руки, внутри заложник. Шпионы должны незаметно проникнуть в круг и вывести его. Если охрана коснулась шпиона, тот становится ещё одним заложником. Потом меняются.","p":["Движение и разминка"],"id":"освобождениезаложника","i":423},{"t":"Остановка рук","a":[2,3],"ty":"В кругу, на месте и в тишине","goal":"Чуткость","n":"пары","time":"5 мин","props":"нет","b":"У одного закрыты глаза, второй медленно приближает руку. Первый говорит «Стоп», когда чувствует, что рука в 1 см.","p":["Успокоение"],"id":"остановкарук","i":424},{"t":"Остров","a":[1,2,3],"ty":"Знакомство и сплочение","goal":"Сплочение","n":"8-25","time":"10-15 мин","props":"кусок ткани или газета","b":"Вариант 1: группа на «необитаемом острове» привлекает внимание корабля. Вариант 2: вся группа должна поместиться на куске ткани или газете, и «вода поднимается» - остров уменьшается.","p":["Сплочение"],"id":"остров","i":425},{"t":"Острый глаз","a":[1,2],"ty":"В кругу, на месте и в тишине","goal":"Глазомер","n":"любое","time":"10 мин","props":"банка, бумага, ножницы","b":"Из бумаги нужно вырезать крышку, глядя на банку издали и не трогая её. Побеждает тот, чья крышка лучше совпала.","p":["Успокоение"],"id":"острыйглаз","i":426},{"t":"Осьминожка","a":[2,3],"ty":"Знакомство и сплочение","goal":"Командность","n":"6-12","time":"10 мин","props":"кольцо с длинными верёвками, теннисный мячик","b":"К кольцу привязаны верёвки, на кольце лежит мячик. Нужно пронести его, не уронив, вокруг колонны. Вариант - воздушный шарик.","p":["Сплочение"],"id":"осьминожка","i":427},{"t":"Отдай честь!","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Координация, смех","n":"команды","time":"5-10 мин","props":"нет","b":"Эстафета: правой рукой взять себя за нос, левую продеть в «петлю», вытянуть вперёд с большим пальцем и сказать «Во!». Хлопнуть и быстро поменять руки. Только правильно выполнивший передаёт эстафету.","p":["Движение и разминка"],"id":"отдайчесть","i":428},{"t":"Откуси яблоко","a":[1,2,3],"ty":"Подвижные и эстафеты","goal":"Ловкость, смех","n":"3-10","time":"10 мин","props":"яблоки на ниточках","b":"Подвешенное яблоко нужно откусить, держа руки за спиной. Вариант: кто быстрее съест подвешенное яблоко.","p":["Движение и разминка"],"id":"откусияблоко","i":429},{"t":"Отыщи (клубок)","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Азарт","n":"3-10","time":"5-10 мин","props":"клубки ниток","b":"Концы клубков у кого-то в другом конце зала. Мотаем нить и ищем того, у кого конец.","p":["Движение и разминка"],"id":"отыщи","i":430},{"t":"Охота на лис по голосам","a":[2,3],"ty":"Следопытство и ориентирование","goal":"Слух, ориентирование","n":"5 «лис» и 8-10 охотников","time":"60 мин","props":"компасы, планшеты, горн","b":"Пять «лис» (кто умеет подражать птицам и зверям) прячутся в лесу на расстоянии 70-80 м друг от друга и раз в минуту подают звук. Охотники с интервалом 5 минут идут по одному, находят «лис», определяют азимуты и расстояния и наносят на листок. Лисы с места не сходят. По горну все собираются, сверяют записи.","p":["Следопытство"],"id":"охотаналиспоголосам","i":431},{"t":"Охота на лося","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Меткость","n":"8-20","time":"10 мин","props":"самодельные «рога», верёвочные кольца","b":"Две команды, у каждой «лосиные рога» (палка, колышки). С черты в 1,5 м игроки по очереди набрасывают кольцо-аркан на рога. Побеждает команда, закинувшая больше раз (до 10 очков). Перед игрой потренируйтесь, как набрасывать.","p":["Движение и разминка"],"id":"охотаналося","i":432},{"t":"Охота на оленя","a":[2,3],"ty":"Следопытство и ориентирование","goal":"Выслеживание","n":"8-20","time":"40 мин","props":"бумажки, шишки","b":"«Олень» убегает в лес, разбрасывая оговоренные предметы (бумажки, камешки), и путает след. Через 10 минут за ним бегут «собаки», которые должны найти оленя и попасть шишкой или снежком. У каждой собаки три «выстрела», промах - выбывает. Площадку ограничить.","p":["Следопытство"],"id":"охотанаоленя","i":433},{"t":"Охотники","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Ловкость","n":"12-30","time":"10 мин","props":"3 мяча (мягких)","b":"Три охотника с маленькими мячами. Игроки разбегаются, по команде «Стой!» замирают, охотники целятся в кого-нибудь. Попавший становится охотником. Можно уворачиваться, но не сходить с места. Мячи только мягкие, целиться ниже пояса.","p":["Движение и разминка"],"id":"охотники","i":434},{"t":"Оценка группы","a":[2,3],"ty":"Знакомство и сплочение","goal":"Сплочение, наблюдательность","n":"две команды","time":"10-20 мин","props":"ручки, бумага","b":"Две команды оценивают соперников: общий вес, общую длину обуви, количество питомцев, общий возраст, общий рост. Потом сверяют по факту.","p":["Сплочение"],"id":"оценкагруппы","i":435},{"t":"Очередь (молча по номерам)","a":[2,3],"ty":"Знакомство и сплочение","goal":"Общение без слов","n":"8-25","time":"10-15 мин","props":"нет","b":"Один знающий правила ведущий строит всех с закрытыми глазами и по руке «отстукивает» каждому номер. Затем нужно молча (говорить нельзя) выстроиться по порядку номеров. Можно дать двум людям один номер или пропустить какой-то. Проводить с уже знакомой группой.","p":["Сплочение"],"id":"очередь","i":436},{"t":"Параллельный марш (разведка в походе)","a":[3],"ty":"Следопытство и ориентирование","goal":"Скрытность, наблюдательность","n":"2 отряда","time":"целый день","props":"схемы маршрутов с азимутами","b":"Два отряда идут по параллельным маршрутам 8-10 км, иногда сближаясь до 300 м. Основная колонна несёт снаряжение и ведёт игры на привалах, а разведчики собирают сведения о соперниках: сколько человек, как одеты, какие команды, чем заняты на привалах. Если разведчика одновременно коснулись двое, он в плену. На финише сравнивают сведения. Только с опытными руководителями, с надёжной связью и точкой сбора.","p":["Следопытство"],"id":"параллельныймарш","i":437},{"t":"Парные картинки","a":[1,2],"ty":"Следопытство и ориентирование","goal":"Знание условных знаков","n":"2-6","time":"10 мин","props":"20 пар кусочков топографических карт 3×3 см","b":"Найти как можно больше пар одинаковых фрагментов карты.","p":["Следопытство"],"id":"парныекартинки","i":438},{"t":"Паровозик","a":[1,2],"ty":"Знакомство и сплочение","goal":"Доверие","n":"6-15","time":"10 мин","props":"нет","b":"Колонна, руки на плечах впереди стоящего. У всех закрыты глаза, кроме первого (машиниста), он ведёт состав через «препятствия». Вариант: глаза открыты только у последнего, он командует голосом.","p":["Доверие","Сплочение"],"id":"паровозик","i":439},{"t":"Паровозик с одним зрячим","a":[1,2],"ty":"Знакомство и сплочение","goal":"Доверие, командные сигналы","n":"команды по 5-8","time":"10 мин","props":"предмет","b":"Команда колонной: каждый закрывает глаза впередистоящему. Видит только последний. Предмет прячут после того, как закрыли глаза. Сигналы идут по цепочке спереди назад, первый пытается взять предмет.","p":["Сплочение"],"id":"паровозиксоднимзрячим","i":440},{"t":"Паук","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Согласованность","n":"четвёрки","time":"10 мин","props":"верёвка или мел","b":"Четыре человека спиной друг к другу, руки сцеплены в локтях - «паук» на 8 лапах. Нужно пройти по извилистой «паутинке» туда и обратно, не расцепляясь.","p":["Движение и разминка"],"id":"паук","i":441},{"t":"Переверни коврик","a":[2,3],"ty":"Знакомство и сплочение","goal":"Командность","n":"6-15","time":"10 мин","props":"коврик или покрывало","b":"Все стоят на коврике и должны перевернуть его, не наступая на пол.","p":["Сплочение"],"id":"переверниковрик","i":442},{"t":"Передай другому","a":[1,2,3],"ty":"Подвижные и эстафеты","goal":"Ловкость","n":"2 команды","time":"15 мин","props":"мелкие предметы (шарик, яблоко, апельсин, мягкая игрушка, зубочистка)","b":"Предметы передают по кругу без рук: шарик локтями, яблоко зубами, апельсин между подбородком и плечом, мягкую игрушку коленями, зубочистку зубами. Упустил или схватил рукой - выбывает.","p":["Движение и разминка"],"id":"передайдругому","i":443},{"t":"Передай мяч в кругах","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Скорость","n":"2 команды","time":"10 мин","props":"6 мячей","b":"Две команды в двух кругах, один внутри другого, лицом наружу, по три мяча. Нужно быстро передавать мячи в разные стороны. Уронил - выбыл.","p":["Движение и разминка"],"id":"передаймячвкругах","i":444},{"t":"Передай по цепочке (камешки)","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Командность","n":"2 команды","time":"10 мин","props":"камешки","b":"Две команды в цепочках под руки. По сигналу камешки передают от первого до последнего, руки не разрывать. Роняют - поднимают, не разрывая цепь.","p":["Движение и разминка"],"id":"передайпоцепочке","i":445},{"t":"Передача сообщения по цепочке","a":[1,2],"ty":"В кругу, на месте и в тишине","goal":"Память, слух","n":"8-20","time":"5 мин","props":"нет","b":"Сообщение из 10-15 слов или 5-10 цифр передают по цепочке шёпотом. Последний повторяет вслух, сравнивают с исходным.","p":["Заполнить паузу","Внимание и мышление"],"id":"передачасообщенияпоцепочке","i":446},{"t":"Передача чувств прикосновением","a":[3],"ty":"Знакомство и сплочение","goal":"Эмпатия","n":"8-20","time":"10-15 мин","props":"нет","b":"Один в центре с закрытыми глазами. Остальные по очереди прикосновением передают чувство (страх, радость, любопытство, нежность). Центральный угадывает. Только если в группе много доверия.","p":["Доверие","Сплочение"],"id":"передачачувствприкосновением","i":447},{"t":"Перелей воду","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Ловкость","n":"8-16","time":"10 мин","props":"бумажные стаканчики, вода","b":"Стаканчики во рту, у одного стаканчик с водой. Нужно перелить воду следующему без рук. Хорошо в жару.","p":["Движение и разминка"],"id":"перелейводу","i":448},{"t":"Перелёт (птицы)","a":[1,2],"ty":"В кругу, на месте и в тишине","goal":"Слух, внимание","n":"10-20","time":"10-15 мин","props":"повязка","b":"Каждый - «птица» (повторяться нельзя). Водящий в центре с завязанными глазами вызывает двух птиц, они меняются местами тихо, можно хитрить. Благополучно перелетели - хлопают в ладоши. Если водящий поймал, они меняются местами.","p":["Внимание и мышление"],"id":"перелет","i":449},{"t":"Перематывание клубочков","a":[1],"ty":"В кругу, на месте и в тишине","goal":"Успокоение, мелкая моторика","n":"1-3","time":"5-10 мин","props":"два клубочка, соединённые нитью","b":"Ребёнок перематывает нить с одного клубочка на другой. Нить можно менять по цвету, длине и толщине.","p":["Успокоение"],"id":"перематываниеклубочков","i":450},{"t":"Перемигивания","a":[2,3],"ty":"В кругу, на месте и в тишине","goal":"Разрядка, сплочение","n":"11-25 (нечётное)","time":"10 мин","props":"стулья","b":"Стулья в круг, половина группы сидит, половина стоит за спинами сидящих («охранники»). Один стул пустой, и тот, кто стоит за ним, должен подмигиванием или жестом переманить на него кого-то из сидящих. Охранник ловит «своего», положив ему руки на плечи (за одежду и волосы хватать нельзя). Темп быстрый. Хорошо работает в смешанных группах.","p":["Сплочение"],"id":"перемигивания","i":451},{"t":"Перенеси мяч","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Изобретательность","n":"команды по 3-5","time":"15 мин","props":"мячи","b":"Мяч нужно перенести на другой пункт, не неся в руках и не пиная. Придумывайте: зажать коленями, ногами, спиной к спине. Можно играть на снегу и в грязи.","p":["Движение и разминка"],"id":"перенесимяч","i":452},{"t":"Перепись населения","a":[1,2],"ty":"Знакомство и сплочение","goal":"Запомнить имена","n":"2-4 команды","time":"10 мин","props":"бумага, маркер","b":"Эстафета: добежавший записывает на листе имя любого члена своей команды (кроме себя и уже записанных), бежит обратно и передаёт маркер. Игра закрепляет имена.","p":["Знакомство"],"id":"переписьнаселения","i":453},{"t":"Перепутанные газеты","a":[1,2],"ty":"В кругу, на месте и в тишине","goal":"Внимание","n":"6-20","time":"5 мин","props":"газеты","b":"Игроки сидят в два ряда лицом к лицу. Ведущий перепутал листы в газетах. По сигналу нужно собрать газеты в порядке.","p":["Заполнить паузу","Внимание и мышление"],"id":"перепутанныегазеты","i":454},{"t":"Перетягивание каната","a":[1,2,3],"ty":"Подвижные и эстафеты","goal":"Сила, командность","n":"2 команды","time":"10 мин","props":"канат","b":"Классика: две команды тянут канат. Играть на ровной траве, без узлов вокруг рук, руки в перчатках для защиты. Лучше три раунда.","p":["Движение и разминка"],"id":"перетягиваниеканата","i":455},{"t":"Перетягивание с переходом","a":[1,2,3],"ty":"Подвижные и эстафеты","goal":"Сила, командный дух","n":"две команды","time":"10 мин","props":"линия","b":"Две команды тянутся с разных сторон линии. Тот, кого перетянули через линию, переходит в команду соперника.","p":["Движение и разминка"],"id":"перетягиваниеспереходом","i":456},{"t":"Перешагивание через ноги","a":[1,2],"ty":"В кругу, на месте и в тишине","goal":"Развить координацию, посмеяться","n":"8-15","time":"5-10 мин","props":"стулья, повязка на глаза","b":"Водящий запоминает, кто где сидит, ему завязывают глаза. Сидящие вытягивают ноги вперёд на 10-20 см над полом. Водящий проходит по кругу, перешагивая ноги и не задевая их, руками ноги нащупывать нельзя. Можно подшутить: тихо убрать ноги, пока он шагает «через препятствие».","p":["Заполнить паузу"],"id":"перешагиваниечерезноги","i":457},{"t":"Пингвин","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Равновесие","n":"команды","time":"10 мин","props":"теннисные мячи","b":"Зажать мяч коленями или лодыжками и пройти вразвалочку до отметки и обратно, не прыгая и не бегая.","p":["Движение и разминка"],"id":"пингвин","i":458},{"t":"Пионербол без сетки (удар и пробежка)","a":[2,3],"ty":"Подвижные и эстафеты","goal":"Командность","n":"2 команды","time":"20 мин","props":"мяч, мел","b":"Одна команда в поле, другая бьёт. Игрок бьёт мяч рукой или кулаком, бежит до дальней линии и обратно «домой», а соперники пытаются попасть в него мячом (один шаг с мячом, не дольше трёх секунд). Выигрывает команда, у которой больше пробежавших.","p":["Движение и разминка"],"id":"пионерболбезсетки","i":459},{"t":"Пип-поп","a":[1,2],"ty":"В кругу, на месте и в тишине","goal":"Внимание","n":"6-30","time":"5 мин","props":"нет","b":"Ведущий говорит «Пип» - в ответ «Поп», и наоборот. Постепенно комбинации усложняются: «пип-пип-поп» - «поп-поп-пип». Помогает ритм.","p":["Заполнить паузу","Внимание и мышление"],"id":"пиппоп","i":460},{"t":"Пирамида вслепую","a":[1,2],"ty":"В кругу, на месте и в тишине","goal":"Координация","n":"любое","time":"5 мин","props":"10-12 кубиков, повязка","b":"С завязанными глазами одной рукой построить столбик из кубиков.","p":["Заполнить паузу"],"id":"пирамидавслепую","i":461},{"t":"Пленник индейцев","a":[2,3],"ty":"Музыка, праздники и большие игры","goal":"Тишина, скрытность","n":"12-30","time":"20 мин","props":"повязки","b":"Посреди поляны «пленный» окружён стражей с завязанными глазами (по сути «ночь»). Остальные поодиночке стараются подкрасться и увести пленного. Тот, кого страж коснулся, замирает до конца игры. Выигрывают, если пленного вывели. Следите за ровной площадкой.","p":["Событие","Успокоение"],"id":"пленникиндейцев","i":462},{"t":"Плетень","a":[1],"ty":"Подвижные и эстафеты","goal":"Командная работа","n":"команды по 4-5","time":"5-10 мин","props":"нет","b":"Команды стоят шеренгами, скрещивают руки и берутся за руки соседей (получается «плетень»). Идут навстречу с речёвкой «Раз, два, три, четыре, выполнять должны приказ...», расходятся и по сигналу вновь быстро собирают плетень.","p":["Движение и разминка"],"id":"плетень","i":463},{"t":"По порядку становись (дни рождения)","a":[1,2,3],"ty":"Знакомство и сплочение","goal":"Невербальное общение","n":"10-40","time":"5 мин","props":"нет","b":"Молча построиться по дате рождения, с учётом дня и месяца.","p":["Сплочение"],"id":"попорядкустановись","i":464},{"t":"Победи троих","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Реакция","n":"4","time":"5 мин","props":"две верёвки, приз","b":"Две верёвки связаны крестом, четверо берут концы. На расстоянии 2 м от каждого лежит приз. По команде все тянут верёвку, пытаясь первым схватить свой приз.","p":["Движение и разминка","Внимание и мышление"],"id":"победитроих","i":465},{"t":"Повесь поздравление","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Командное творчество","n":"команды","time":"15 мин","props":"бельевая верёвка, бумага, ножницы, скрепки или прищепки","b":"Двое держат верёвку, остальные вырезают из бумаги буквы поздравления и развешивают их. Побеждает самая быстрая или самая красивая команда. Надписи можно использовать для оформления.","p":["Движение и разминка","Творчество"],"id":"повесьпоздравление","i":466},{"t":"Погоня (два круга)","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Реакция","n":"12-30","time":"10 мин","props":"нет","b":"Две команды идут в двух кругах приставным шагом, каждый запоминает соперника впереди. По второму сигналу внешний круг разбегается, внутренний догоняет только «своего». Ведущий считает до 30 и «Стой!», считаем осаленных. Меняются.","p":["Движение и разминка","Внимание и мышление"],"id":"погоня","i":467},{"t":"Подарите мне на Рождество","a":[2,3],"ty":"В кругу, на месте и в тишине","goal":"Логика","n":"6-20","time":"5-10 мин","props":"нет","b":"Ведущий: «Подарите мне на Рождество...» (две вещи). Каждый просит свои, ведущий говорит, сбудется или нет. Секрет: сбывается, когда названия вещей начинаются с инициалов игрока. Как быстро поймут секрет?","p":["Заполнить паузу","Внимание и мышление"],"id":"подаритемненарождество","i":468},{"t":"Подарки","a":[2,3],"ty":"Знакомство и сплочение","goal":"Сблизиться, поднять настроение","n":"до 10","time":"10-15 мин","props":"нет","b":"В кругу водящий «дарит» каждому воображаемый подарок: «Я хочу подарить тебе ... Берёшь?». Одариваемый может отказаться, поэтому подарок стоит подбирать лично для человека. Затем водящим становится следующий.","p":["Знакомство"],"id":"подарки","i":469},{"t":"Поджигатель","a":[1,2],"ty":"Знакомство и сплочение","goal":"Сплочение","n":"6-12","time":"10 мин","props":"нет","b":"Все цепочкой закручиваются в плотный клубок вокруг одного игрока. «Поджигатель» предлагает «огонёк», сначала все отказываются, потом соглашаются. Когда он касается крайнего, цепочка раскручивается и пытается поймать поджигателя. Учтите: тесный контакт может быть неприятен некоторым детям.","p":["Сплочение"],"id":"поджигатель","i":470},{"t":"Подмети пол","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Командность","n":"2 команды по 7","time":"10 мин","props":"стулья, 6 прутиков, верёвка, совок, обрывки бумаги","b":"Команды в колоннах, у каждой стул с прутиками и верёвкой. Нужно «сделать веник»: начиная с последнего номера, каждый приносит прутик первому, тот связывает веник верёвкой и отдаёт последнему, который собирает бумажки на совок.","p":["Движение и разминка"],"id":"подметипол","i":471},{"t":"Подними кружку","a":[2,3],"ty":"В кругу, на месте и в тишине","goal":"Ловкость","n":"любое","time":"5 мин","props":"пластиковая кружка","b":"Поднять кружку зубами, стоя на одной ноге и не касаясь земли руками. Рядом страхующий.","p":["Заполнить паузу","Движение и разминка"],"id":"поднимикружку","i":472},{"t":"Поезда","a":[1],"ty":"Подвижные и эстафеты","goal":"Реакция","n":"от 7","time":"10 мин","props":"свисток, мел","b":"У каждого своё «депо» (кружок). Паровоз без депо идёт по площадке, и к кому он подошёл, тот становится вагоном. По свистку все бегут в свои депо. Без депо остался - новый паровоз.","p":["Движение и разминка","Внимание и мышление"],"id":"поезда","i":473},{"t":"Пожалуйста (повтори движение)","a":[1,2,3],"ty":"В кругу, на месте и в тишине","goal":"Внимание","n":"любое","time":"5 мин","props":"нет","b":"Ведущий показывает движения. Повторять нужно только если он сказал «пожалуйста». Ошибся - выбыл.","p":["Заполнить паузу","Внимание и мышление","Движение и разминка"],"id":"пожалуйста","i":474},{"t":"Пожарная команда","a":[1,2],"ty":"Музыка, праздники и большие игры","goal":"Внимание, скорость","n":"от 10","time":"10 мин","props":"стулья, музыка, бубен","b":"Стулья по кругу спинками внутрь, игроки ходят под музыку. Остановка - кладёшь на ближайший стул предмет одежды (три раза). Затем сигнал «Пожар!»: нужно найти свои вещи и надеть. Побеждает быстрейший.","p":["Движение и разминка","Внимание и мышление"],"id":"пожарнаякоманда","i":475},{"t":"Поздоровайся с максимумом","a":[1,2,3],"ty":"Знакомство и сплочение","goal":"Общение","n":"10-40","time":"5 мин","props":"нет","b":"За 1-3 минуты нужно поздороваться за руку с как можно большим числом людей, глядя в глаза и называя имя. Потом выясняют, кто поздоровался с десятью и двадцатью.","p":["Знакомство"],"id":"поздоровайсясмаксимумом","i":476},{"t":"Поздороваться носами","a":[1,2],"ty":"Знакомство и сплочение","goal":"Знакомство, смех","n":"любое","time":"3 мин","props":"нет","b":"За минуту поздороваться как можно с большим числом людей: рукой, носом, коленкой.","p":["Знакомство"],"id":"поздороватьсяносами","i":477},{"t":"Поиск клада","a":[1,2],"ty":"Музыка, праздники и большие игры","goal":"Командная работа, физическая активность","n":"8-40","time":"60 мин","props":"записки-шифровки, приз","b":"Вожатый пишет записки с описанием мест лагеря (в стихах, иносказательно, шифром) и прячет их. Каждая команда идёт по своему маршруту, проходя все этапы, но записка «Клад» одна. Побеждает та, что первой найдёт финальную записку. Оптимально 3-4 команды.","p":["Событие"],"id":"поискклада","i":478},{"t":"Поиск общего","a":[2,3],"ty":"Знакомство и сплочение","goal":"Знакомство, разбиение на команды","n":"от 8","time":"10-15 мин","props":"нет","b":"Пары за 3 минуты ищут как можно больше общих признаков (интересы, привычки, мечты, внешность). Затем пары объединяются в четвёрки, потом восьмёрки. Можно остановиться на любом этапе и так разбить на группы.","p":["Знакомство"],"id":"поискобщего","i":479},{"t":"Поиск сокровищ (маршрутная игра)","a":[1,2,3],"ty":"Следопытство и ориентирование","goal":"Загадки, ориентирование","n":"патрули","time":"90 мин","props":"записки-ключи, шифровки, угощение","b":"Маршрут длинный и вдали от лагеря, чтобы взрослые шли вместе с патрулём. Старт и финиш рядом, на финише чай и угощение. Чтобы патрули не «садились на хвост» друг другу, первое задание делают самым сложным и разным (шифровка, которую нужно расшифровать). Следите, чтобы метки не срывали, у части ключей стоят наблюдатели, готовые заменить ключ.","p":["Следопытство"],"id":"поисксокровищ","i":480},{"t":"Поиск сокровищ: советы по заданиям-ключам","a":[1,2,3],"ty":"Следопытство и ориентирование","goal":"Подготовка маршрутной игры","n":"патрули","time":"подготовка","props":"записки, шифры","b":"Первое и последнее задания делайте самыми трудными: первое не даёт патрулям идти за лидером, последнее делает финал драматичным (например, зашифрованный телефон того, у кого сокровища). Ни один патруль не должен сойти с дистанции, поэтому вожатый может давать намёки. Примеры ключей в лагере: идти по азимуту 160° от лагеря к скале у упавшего дерева; идти вдоль линии электропередач до столба № 76; идти по азимуту 240° до поляны со старым кострищем; идти на восток до канавы, вдоль неё до дороги, по дороге влево до шоссе, у знака отсчитать шаги на юг и найти записку под камнем. Первое задание можно писать задом наперёд (читать снизу вверх и справа налево). Сокровищем могут быть жетоны, которые меняют на конфеты.","p":["Следопытство"],"id":"поисксокровищсоветыпозаданиямключам","i":481},{"t":"Поймай сачком","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Меткость, ловкость","n":"пары","time":"10 мин","props":"сачок, мяч","b":"Метатель делает 10 бросков с 15-20 м, ловец ловит сачком. Подсчитывают удачные ловли.","p":["Движение и разминка"],"id":"поймайсачком","i":482},{"t":"Покажи историю (библейская)","a":[1,2,3],"ty":"Творческие и интеллектуальные","goal":"Знание сюжетов, пантомима","n":"две команды","time":"15 мин","props":"список историй","b":"Команда показывает загаданную историю из Библии, другая угадывает. Подходит для воскресной школы и храмовых смен.","p":["Творчество"],"id":"покажиисторию","i":483},{"t":"Покажи предмет","a":[2,3],"ty":"Творческие и интеллектуальные","goal":"Пантомима","n":"две команды","time":"15 мин","props":"нет","b":"Команды загадывают друг другу абстрактные предметы («невесомость», «вертолёт»). Игрок должен показать именно предмет, не действие с ним, без слов.","p":["Творчество"],"id":"покажипредмет","i":484},{"t":"Покрывало","a":[1,2,3],"ty":"Знакомство и сплочение","goal":"Закрепить имена","n":"две команды по 6-15","time":"10-15 мин","props":"большое покрывало","b":"Две команды по обе стороны покрывала, которое держат вожатые. От каждой команды к покрывалу подсаживается по одному игроку, и покрывало падает. Кто первым назовёт имя соперника - получает очко. Играть, когда дети уже немного запомнили имена.","p":["Знакомство"],"id":"покрывало","i":485},{"t":"Полено","a":[1,2],"ty":"Музыка, праздники и большие игры","goal":"Внимание, ловкость","n":"8-20","time":"10 мин","props":"полено или кегля","b":"В центре хоровода полено. На слова «Раз, два, три - полено повали!» каждый, не расцепляя рук, пытается заставить соседей задеть полено. Задел - выходит.","p":["Событие","Внимание и мышление","Движение и разминка"],"id":"полено","i":486},{"t":"Положи руку","a":[2,3],"ty":"Знакомство и сплочение","goal":"Выявить симпатии и лидера","n":"до 20","time":"10-20 мин","props":"нет","b":"Все одновременно кладут правую ладонь на плечо того, кто им симпатичнее всего (душа отряда), а левую - на плечо того, кого видят командиром. Вожатый считает руки. Лучше в конце организационного периода.","p":["Сплочение"],"id":"положируку","i":487},{"t":"Полслова за вами","a":[1,2],"ty":"В кругу, на месте и в тишине","goal":"Словарь, реакция","n":"8-20","time":"10 мин","props":"мяч","b":"Ведущий в центре бросает мяч и называет часть существительного («ма-», «кар-»). Поймавший заканчивает слово. Кто замешкался - поднимает руку и стоит, пока ведущий не бросит ему мяч ещё раз.","p":["Внимание и мышление"],"id":"полсловазавами","i":488},{"t":"Полька","a":[1,2],"ty":"Музыка, праздники и большие игры","goal":"Размяться","n":"пары в кругу","time":"5-10 мин","props":"музыка","b":"Пары: два маха ногой с подскоком (пятка-носок), три приставных прыжка («шоссе»), затем то же в другую сторону, удары по коленям и в ладоши друг другу, круг под руку.","p":["Движение и разминка"],"id":"полька","i":489},{"t":"Поменяйся местом в движении","a":[1,2,3],"ty":"Знакомство и сплочение","goal":"Разогрев, знакомство","n":"до 20","time":"10-20 мин","props":"музыка","b":"По сигналу игроки меняются местами с кем-то, выполняя условие ведущего: прыгая на одной ноге, закрыв глаза с вытянутыми руками, коснуться носом, обняться, и обязательно познакомиться.","p":["Знакомство","Движение и разминка"],"id":"поменяйсяместомвдвижении","i":490},{"t":"Помнишь там? (мемори)","a":[1,2],"ty":"В кругу, на месте и в тишине","goal":"Память","n":"4-10","time":"от 20 мин","props":"40 карточек (20 пар картинок)","b":"Карточки лежат картинкой вверх минуту, потом переворачиваем. За ход открываем две: совпали - забираем и ходим ещё. Побеждает тот, у кого больше пар.","p":["Успокоение","Внимание и мышление"],"id":"помнишьтам","i":491},{"t":"Помоги устоять","a":[1,2,3],"ty":"Знакомство и сплочение","goal":"Доверие, равновесие","n":"пары","time":"5-10 мин","props":"нескользкая обувь","b":"Двое лицом к лицу упираются ладонями, делают 2-3 шага назад (получается треугольник). Задача - вернуться в вертикаль, отталкиваясь от ладоней партнёра, ноги не двигаются. Для малышей - на коленях. Или спина к спине под локти: присесть и встать.","p":["Сплочение"],"id":"помогиустоять","i":492},{"t":"Помой слона","a":[1,2,3],"ty":"Творческие и интеллектуальные","goal":"Смех, пантомима","n":"от 6","time":"10 мин","props":"музыка","b":"Несколько человек выходят из комнаты. Первому показывают занятие (например, «мыть слона»), он показывает его второму без слов, второй - третьему, а третий должен угадать. С музыкой веселее.","p":["Творчество"],"id":"помойслона","i":493},{"t":"Порви газету","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Ловкость","n":"пары","time":"5 мин","props":"газеты","b":"Одной рукой, вытянутой вперёд, порвать газету на как можно более мелкие кусочки. Второй рукой помогать нельзя. Можно играть парами.","p":["Движение и разминка"],"id":"порвигазету","i":494},{"t":"Поросята и котята","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Разрядка","n":"6-30","time":"5-10 мин","props":"безопасное помещение","b":"Считаем «первый-второй-третий» и делимся на поросят, котят и утят. Все закрывают глаза и по звукам ищут своих. Ведущий в игре не участвует и следит за безопасностью.","p":["Движение и разминка"],"id":"поросятаикотята","i":495},{"t":"Посикота (Беги на свое место)","a":[1,2],"ty":"В кругу, на месте и в тишине","goal":"Размяться","n":"10-30","time":"5-10 мин","props":"платок","b":"Круг идёт и поёт две строчки песни. Ведущий платком разрывает круг, двое рядом бегут снаружи в разные стороны, при встрече кланяются, говорят «Посикота» и бегут за платком. Кто первым взял, становится ведущим.","p":["Заполнить паузу"],"id":"посикота","i":496},{"t":"Послушай, поверь и себя проверь","a":[1,2],"ty":"В кругу, на месте и в тишине","goal":"Внимание","n":"любое","time":"3 мин","props":"нет","b":"Ведущий даёт движения: руки на колени, хлопок, правой рукой взять за нос, левой за правое ухо, хлопок, поменять руки.","p":["Заполнить паузу","Внимание и мышление"],"id":"послушайповерьисебяпроверь","i":497},{"t":"Построиться по...","a":[1,2,3],"ty":"Знакомство и сплочение","goal":"Знакомство, разминка","n":"8-40","time":"5-10 мин","props":"нет","b":"Без слов выстроиться по признаку: дата рождения, рост, цвет волос, размер ладони, «веселость». Общаются жестами. Помогает познакомиться и понять, что любые оценки условны.","p":["Сплочение","Знакомство","Движение и разминка"],"id":"построитьсяпо","i":498},{"t":"Посчитать до N","a":[2,3],"ty":"Знакомство и сплочение","goal":"Внимание, командность","n":"8-25","time":"10 мин","props":"нет","b":"Группа считает по порядку до N, каждое число произносит один человек, договариваться нельзя. Два сказали одновременно или долго тишина - с начала. Дополнительное правило: каждый говорит хотя бы одно число.","p":["Сплочение","Внимание и мышление"],"id":"посчитатьдоn","i":499},{"t":"Посчитаться","a":[2,3],"ty":"Знакомство и сплочение","goal":"Настроиться друг на друга","n":"8-25","time":"5-10 мин","props":"нет","b":"Группа считает по порядку до числа, равного количеству участников, каждый называет одно число. Договариваться нельзя. Если число назвали сразу двое или один человек дважды, начинаем сначала.","p":["Сплочение"],"id":"посчитаться","i":500},{"t":"Потяг (цепи)","a":[2,3],"ty":"Подвижные и эстафеты","goal":"Командный дух","n":"от 10","time":"10 мин","props":"линия","b":"Две группы-цепи с локтями согнутыми, впереди сильные «заводные». Они тянут друг друга, стараясь порвать цепь или перетянуть через линию. Начинать по сигналу.","p":["Движение и разминка"],"id":"потяг","i":501},{"t":"Похитители","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Реакция","n":"2 команды по 5-12","time":"10 мин","props":"кегля или булава","b":"Команды в 10 метрах, посередине предмет. Ведущий называет номер, названные выбегают, хватают предмет и возвращаются, не дав себя запятнать. Удачное похищение - 2 очка, пойман - соперник получает 1.","p":["Движение и разминка","Внимание и мышление"],"id":"похитители","i":502},{"t":"Похитители огня","a":[2,3],"ty":"Подвижные и эстафеты","goal":"Тактика, скорость, командная игра","n":"20-30","time":"20 мин","props":"мел, отличительные знаки","b":"Поле 30-40 на 15-20 м, в углах четыре круга-крепости, посередине линии «огня». Две команды, у каждой капитан. Игрок подходит к шеренге соперников, касается руки любого игрока (берёт огонь) и бежит к своей границе. Тот, кого коснулись, догоняет. Пойманный идёт в плен в крепость. Пленников освобождает свой игрок, который беспрепятственно дойдёт до крепости и коснётся их. Побеждает команда, захватившая всех соперников.","p":["Движение и разминка"],"id":"похитителиогня","i":503},{"t":"Почта","a":[1,2,3],"ty":"В кругу, на месте и в тишине","goal":"Письменная речь, забота о других","n":"8-30","time":"40-60 мин","props":"столы, ящики, бумага, конверты, открытки","b":"Сначала поговорите о письмах: кто получал, как приятно. Дети пишут письма и открытки родным и друзьям. Затем оборудуют «почту»: ящики, продавцы марок и открыток, почтальоны. Письма опускают в ящики, почтальоны разносят адресатам в разные «города». Хорошо перед праздниками.","p":["Заполнить паузу"],"id":"почта","i":504},{"t":"Правда или действие","a":[3],"ty":"Знакомство и сплочение","goal":"Узнать друг друга","n":"6-15","time":"10-15 мин","props":"нет","b":"Каждому по очереди задают вопрос «Правда или действие?». Правда - честный ответ на любой вопрос. Действие - показать танец, номер или спеть. Вожатому важно следить, чтобы вопросы оставались уважительными.","p":["Знакомство"],"id":"правдаилидействие","i":505},{"t":"Прела-горела","a":[1],"ty":"Подвижные и эстафеты","goal":"Размяться, развить внимание","n":"8-30","time":"5-10 мин","props":"небольшие предметы или игрушки","b":"Дети закрывают глаза, ведущий прячет предметы по площадке с речёвкой «Прела-горела, за море летела...». По окончании речёвки все разбегаются искать. Побеждает тот, кто нашёл больше. Не подсматривать!","p":["Движение и разминка","Внимание и мышление"],"id":"прелагорела","i":506},{"t":"Преодолей препятствие","a":[3],"ty":"Знакомство и сплочение","goal":"Находчивость, эмпатия","n":"7-10","time":"20 мин","props":"нет","b":"Участники в линейку - «препятствия». «Преодолевающий» должен придумать, как пройти каждого: убедить, обойти, рассмешить. Нельзя причинять вред физически или морально. Каждый побывает и препятствием, и преодолевающим. Игра эмоциональная, нужно подробное обсуждение.","p":["Сплочение"],"id":"преодолейпрепятствие","i":507},{"t":"Привет!","a":[1,2,3],"ty":"Знакомство и сплочение","goal":"Тёплая атмосфера","n":"10-30","time":"5-10 мин","props":"мяч","b":"Кидаем мяч друг другу со словами: «Привет! Ты сегодня хорошо выглядишь», «Доброе утро! Рада тебя видеть».","p":["Сплочение"],"id":"привет","i":508},{"t":"Проверка ловкости","a":[2,3],"ty":"В кругу, на месте и в тишине","goal":"Ловкость","n":"любое","time":"5 мин","props":"стул, коробок","b":"Коробок стоит на ребре за правой задней ножкой стула. Сидя на стуле, нужно взять его зубами и не коснуться пола. Падение - проигрыш.","p":["Заполнить паузу","Движение и разминка"],"id":"проверкаловкости","i":509},{"t":"Проводник (паровозик)","a":[1,2,3],"ty":"Знакомство и сплочение","goal":"Выявить лидера, доверие","n":"10-20","time":"10-20 мин","props":"нет","b":"Колонна, руки на плечах, у всех кроме последнего закрыты глаза, говорить нельзя. Последний - «машинист». Сигналы: хлопок по левому/правому плечу - поворот, по двум плечам - вперёд, двойной хлопок - назад, дробь - стоп. Затем последний встаёт во главу.","p":["Доверие","Сплочение"],"id":"проводник","i":510},{"t":"Продавец счастья","a":[1,2,3],"ty":"Музыка, праздники и большие игры","goal":"Праздник, доброе слово","n":"ярмарка","time":"на фестиваль","props":"расписная коробка, записки","b":"Скоморох ходит по ярмарке и кричит «Продаётся счастье!», достаёт из коробки записки с добрыми шуточными предсказаниями.","p":["Событие"],"id":"продавецсчастья","i":511},{"t":"Пройди, не задень","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Доверие, смех","n":"команды","time":"10 мин","props":"8-10 кеглей, повязка","b":"В ряд на расстоянии шага ставят кегли. Игроку завязывают глаза, команда подсказывает, он проходит туда и обратно, стараясь не сбить кегли. Весело тихо убрать кегли в процессе.","p":["Движение и разминка","Сплочение"],"id":"пройдинезадень","i":512},{"t":"Прокатись на мяче","a":[2,3],"ty":"Подвижные и эстафеты","goal":"Равновесие","n":"тройки","time":"15 мин","props":"большие мячи","b":"Один встаёт на мяч, двое придерживают под локти. Тройка едет к финишу, меняясь на ходу. Только на мягкой траве, с подстраховкой.","p":["Движение и разминка"],"id":"прокатисьнамяче","i":513},{"t":"Прошептанные приказы","a":[1,2],"ty":"В кругу, на месте и в тишине","goal":"Слух","n":"8-20","time":"5 мин","props":"нет","b":"Игроки в шеренге, ведущий шёпотом даёт команды, все выполняют одновременно. Кто не услышал или ошибся - шаг вперёд.","p":["Заполнить паузу"],"id":"прошептанныеприказы","i":514},{"t":"Птицелов","a":[1],"ty":"Подвижные и эстафеты","goal":"Размяться","n":"8-20","time":"10 мин","props":"мел","b":"Круг диаметром 1 м - клетка с воробьём. Птицелов её охраняет, остальные птицы стараются коснуться воробья руками и освободить. Осаленная птица садится в клетку. Если долго никого не удаётся поймать, меняют водящего.","p":["Движение и разминка"],"id":"птицелов","i":515},{"t":"Птицы, блохи, пауки","a":[2,3],"ty":"Подвижные и эстафеты","goal":"Размяться, реакция","n":"от 10","time":"10-15 мин","props":"просторное помещение","b":"Две команды тайно выбирают, кто они: птицы, блохи или пауки. Становятся в шеренги лицом друг к другу и по команде показывают жест. Пауки убегают от птиц, блохи от пауков, птицы от блох (как «камень-ножницы-бумага»). Не успевшего добежать до стены ловят и забирают в команду. Достаточно 6-7 раундов.","p":["Движение и разминка","Внимание и мышление"],"id":"птицыблохипауки","i":516},{"t":"Путаница","a":[1,2,3],"ty":"Знакомство и сплочение","goal":"Командное решение","n":"8-20","time":"10 мин","props":"нет","b":"Стоим в кругу, берёмся за руки разных людей (не соседей), потом распутываемся, не разжимая рук. Можно запретить говорить. Хорошая метафора человеческих отношений.","p":["Сплочение"],"id":"путаница","i":517},{"t":"Пушистые рисунки","a":[1],"ty":"В кругу, на месте и в тишине","goal":"Успокоение","n":"1-3","time":"5-10 мин","props":"кусок искусственного меха на картоне","b":"Рисовать пальцем на меху разные предметы. Успокаивает.","p":["Успокоение"],"id":"пушистыерисунки","i":518},{"t":"Пчёлка","a":[1,2],"ty":"Знакомство и сплочение","goal":"Наблюдение за группой","n":"до 20","time":"10 мин","props":"мел","b":"Рисуем круг, дети по его контуру закрывают глаза, жужжат и ходят в любом направлении. По команде «Стоп!» наблюдаем: кто ближе к центру, кто на линии, кто вне круга. Это ненаучный тест, просто повод понаблюдать.","p":["Сплочение"],"id":"пчелка","i":519},{"t":"Пятнашки (5 вариантов)","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Размяться","n":"8-30","time":"10-15 мин","props":"мел","b":"Классические салки. Варианты: «ноги от земли» - спасёшься, если встанешь на предмет; «зайки» - в безопасности, если прыгаешь на одной или двух ногах; «с домом» - в кружке нельзя салить; «с именем» - не салят того, кто вовремя назвался (например, лисой); «круговые» - убегающий зовёт на помощь названного игрока, который бежит по кругу, а освободившееся место можно занять.","p":["Движение и разминка"],"id":"пятнашки","i":520},{"t":"Пятнашки на верёвочке","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Ловкость","n":"6","time":"15 мин","props":"столб, верёвка 3-4 м, камешки или шишки","b":"К столбу привязана верёвка, вокруг круг, внутри 20-30 камешков. Сторож держится за верёвку одной рукой, а другой салит добытчиков, которые таскают камешки. Через 3 минуты смена сторожа. Считаем, сколько камешков он сберёг.","p":["Движение и разминка"],"id":"пятнашкинаверевочке","i":521},{"t":"Пятрасу нужна одежда","a":[1,2],"ty":"В кругу, на месте и в тишине","goal":"Внимание и реакция","n":"10-20","time":"10 мин","props":"мел","b":"У каждого свой мелом очерченный кружок, в центре Пятрас (водящий). Остальные берут названия предметов одежды (шапка, шарф, носки). Пятрас говорит «Пятрасу нужен шарф» - все «шарфы» бегут к нему вокруг круга. Команда «Пятрасу нужна вся одежда» - все вскакивают и бегут занимать любое место, оставшийся без места становится Пятрасом.","p":["Внимание и мышление"],"id":"пятрасунужнаодежда","i":522},{"t":"Пять важных вещей","a":[2,3],"ty":"Знакомство и сплочение","goal":"Узнать друг друга","n":"пары","time":"15 мин","props":"нет","b":"Пары на пять минут расходятся и жестами показывают друг другу пять самых важных для себя вещей. Потом представляют партнёра кругу. Варианты: пять любимых блюд, пять мечтаний.","p":["Знакомство"],"id":"пятьважныхвещей","i":523},{"t":"Пять желаний","a":[3],"ty":"Творческие и интеллектуальные","goal":"Самопознание, рефлексия","n":"1-20","time":"30-40 мин","props":"бумага А4, гуашь, кисть","b":"На пяти листах написать по одному желанию от первого лица и в настоящем времени («Я путешествую по разным странам»). Обратную сторону каждого листа смочить водой и нарисовать абстракцию цветом, который подходит желанию. Готовые рисунки повесить на видном месте или сфотографировать и возвращаться к ним, пока желания не исполнятся или не изменятся.","p":["Творчество"],"id":"пятьжеланий","i":524},{"t":"Раз-два-три","a":[1],"ty":"Музыка, праздники и большие игры","goal":"Размяться","n":"любое","time":"5 мин","props":"нет","b":"Круг, повторяем за ведущим слова с движениями: «Мы пойдём сначала вправо, раз-два-три... разойдёмся, присядем, привстанем, станцуем». Темп постепенно ускоряем.","p":["Движение и разминка"],"id":"раздватри","i":525},{"t":"Разведка в горах (гончие и зайцы)","a":[2,3],"ty":"Следопытство и ориентирование","goal":"Наблюдательность","n":"3 «зайца» и стая","time":"60 мин","props":"бинокли","b":"Рано утром три «зайца» прячутся среди холмов. После завтрака «гончие» ищут их, можно с биноклями. Нужно запомнить, где, кого и когда видели и что делал «заяц». Если хоть один заяц не найден к сроку - гончие проиграли.","p":["Следопытство"],"id":"разведкавгорах","i":526},{"t":"Разведчики и часовой","a":[2,3],"ty":"Подвижные и эстафеты","goal":"Скрытность, внимание","n":"8-25","time":"15-20 мин","props":"5-7 флажков","b":"Часовой ходит по периметру вокруг флагов на расстоянии 15-25 шагов. Разведчики подкрадываются и крадут флаги. Если часовой назвал разведчика по имени, тот выбывает, а флаг возвращается. Игра идёт, пока не останется один флаг или один разведчик. Вариант: пленные могут быть освобождены касанием.","p":["Движение и разминка","Внимание и мышление"],"id":"разведчикиичасовой","i":527},{"t":"Разговор с руками","a":[1],"ty":"В кругу, на месте и в тишине","goal":"Самоконтроль, работа с агрессией","n":"1 ребёнок","time":"10-15 мин","props":"бумага, карандаши","b":"Если ребёнок подрался или обидел кого-то, обведите его ладошки на листе, оживите (глазки, рот, раскрасьте пальцы) и побеседуйте с ними: как зовут, что любят, что не любят. Подчеркните, что руки хорошие, но иногда не слушаются. Заключите «договор» на несколько часов или дней, что руки будут делать только добрые дела, потом похвалите.","p":["Успокоение"],"id":"разговорсруками","i":528},{"t":"Раздели арбуз","a":[1,2],"ty":"Знакомство и сплочение","goal":"Делиться с другими","n":"отряд","time":"15 мин","props":"арбуз","b":"Арбуз всем отрядом передают по цепочке: катят, перекидывают, как придумают. Когда дошёл до конца, его режут на равные части и угощаются.","p":["Сплочение"],"id":"разделиарбуз","i":529},{"t":"Разрушители","a":[1,2],"ty":"В кругу, на месте и в тишине","goal":"Выпустить пар","n":"3-10","time":"10 мин","props":"лёгкие коробки, мячи","b":"Вместе строят башню или крепость из коробок, потом разрушают, бросая мячи. Повторяют, пока хочется.","p":["Успокоение"],"id":"разрушители","i":530},{"t":"Рак","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Ловкость","n":"команды","time":"10 мин","props":"нет","b":"Встать на четвереньки лицом к команде и пройти до отметки и обратно задом наперёд.","p":["Движение и разминка"],"id":"рак","i":531},{"t":"Расскажи про соседа","a":[3],"ty":"Знакомство и сплочение","goal":"Внимание к другому","n":"10-30","time":"20-60 мин","props":"нет","b":"В кругу смотрим на соседа справа и пытаемся догадаться, какой он в жизни (каким был в пять лет, каким станет в тридцать). Потом каждый рассказывает.","p":["Знакомство","Внимание и мышление"],"id":"расскажипрососеда","i":532},{"t":"Рваная бумага","a":[1],"ty":"В кругу, на месте и в тишине","goal":"Выпустить пар","n":"3-15","time":"10 мин","props":"старые газеты","b":"Дети рвут бумагу на мелкие кусочки, подбрасывают, посыпают друг друга. Заранее договаривайтесь, что потом вместе всё соберёте и помоете руки.","p":["Успокоение"],"id":"рванаябумага","i":533},{"t":"Рисуем вслепую","a":[2,3],"ty":"Знакомство и сплочение","goal":"Доверие, чуткость","n":"парами","time":"15 мин","props":"повязки, бумага, фломастеры","b":"Одному из пары завязывают глаза, второй словами направляет его руку, чтобы нарисовать заданный рисунок. Потом меняются. Вариант: «поводырь» рисует рукой слепого, а тот угадывает, что получилось. Нужно бережно относиться к «слепому».","p":["Доверие","Сплочение"],"id":"рисуемвслепую","i":534},{"t":"Рисунок с поводырём","a":[2,3],"ty":"Знакомство и сплочение","goal":"Доверие","n":"чётное число","time":"15 мин","props":"повязки, заготовленные рисунки","b":"Пара: «слепой» дорисовывает элементы рисунка на стене по словесным подсказкам «поводыря». Во время игры следим, как чувствует себя тот, у кого завязаны глаза.","p":["Доверие","Сплочение"],"id":"рисуноксповодырем","i":535},{"t":"Ритм","a":[2,3],"ty":"В кругу, на месте и в тишине","goal":"Сплочение, успокоение","n":"любое","time":"5-10 мин","props":"нет","b":"Участники по очереди добавляют свой ритм хлопками так, чтобы он вписывался в уже звучащий. Хорошо для ощущения общности. Иногда вызывает неожиданно сильные чувства.","p":["Сплочение"],"id":"ритм","i":536},{"t":"Ритуал шамана","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Внимание, ловкость","n":"5-10","time":"10 мин","props":"коврик, тотем, наряд шамана","b":"Две команды сидят по обе стороны от шамана, держась за руки, глаза закрыты, кроме первых. По тайному знаку шамана (почесал ухо, подмигнул) первые передают пожатие по цепочке. Последний бежит к тотему. Побеждает команда, схватившая тотем.","p":["Движение и разминка","Внимание и мышление"],"id":"ритуалшамана","i":537},{"t":"Рифма-приветствие","a":[2,3],"ty":"Творческие и интеллектуальные","goal":"Творчество в командах","n":"команды","time":"15 мин","props":"список слов","b":"Каждая команда получает одинаковый список слов и составляет приветствие всем остальным, обязательно включив слова. Можно задавать ключевые слова темы дня.","p":["Творчество"],"id":"рифмаприветствие","i":538},{"t":"Рукопожатия","a":[1,2,3],"ty":"Знакомство и сплочение","goal":"Разогреться и запомнить имена","n":"10-40","time":"3-5 мин","props":"нет","b":"За 1-3 минуты каждый старается поздороваться за руку с как можно большим числом людей: доброжелательно, глядя в глаза и называя своё имя. Можно считать, сколько человек поприветствовал каждый, и спросить в конце, кто набрал больше 10 и больше 20.","p":["Знакомство"],"id":"рукопожатия","i":539},{"t":"Ручеёк","a":[1,2,3],"ty":"В кругу, на месте и в тишине","goal":"Сплочение, смена партнёра","n":"нечётное число","time":"5-10 мин","props":"музыка","b":"Пары стоят в «коридоре» с поднятыми руками. Одиночка проходит по коридору, берёт за руку любого и встаёт с ним в начало. Оставшийся без пары делает то же самое. К концу у каждого сменится партнёр.","p":["Сплочение"],"id":"ручеек","i":540},{"t":"Рыбачок и рыбки","a":[1],"ty":"Подвижные и эстафеты","goal":"Размяться","n":"8-25","time":"10 мин","props":"мел","b":"Рыбачок сидит на корточках в большом круге, рыбки вокруг говорят «Рыбачок, рыбачок, поймай нас на крючок». На последнем слове рыбачок вскакивает и ловит. Пойманный становится рыбачком.","p":["Движение и разминка"],"id":"рыбачокирыбки","i":541},{"t":"Рыболовы","a":[2],"ty":"Подвижные и эстафеты","goal":"Ловкость","n":"3 игрока в раунде","time":"15 мин","props":"3 удочки с кольцом, пустые бутылки","b":"Нужно удочкой с проволочным кольцом надеть кольцо на горлышко бутылки и «подсечь» её. Побеждает тот, кто повалил больше за меньшее время.","p":["Движение и разминка"],"id":"рыболовы","i":542},{"t":"Садовник","a":[1,2],"ty":"В кругу, на месте и в тишине","goal":"Скорость мышления, память","n":"8-20","time":"10 мин","props":"нет","b":"Все выбирают название цветов. Садовник говорит: «Я садовником родился, не на шутку рассердился, все цветы мне надоели, кроме... (ромашки)». Ромашка отвечает «Ой! - Что с тобой? - Влюблена. - В кого? - В василька», и далее по цепочке. Задержался с ответом - фант (маленькое задание). Хорошо продолжить фантами.","p":["Внимание и мышление"],"id":"садовник","i":543},{"t":"Салки «Дай руку»","a":[1],"ty":"Подвижные и эстафеты","goal":"Взаимовыручка","n":"8-25","time":"10 мин","props":"нет","b":"Салка ловит, убегающий кричит «Дай руку!» и берётся за руку с кем-то - такую пару осалить нельзя. Если собралась тройка, салят крайнего. Выбежал за границу - пойман. Вариант «Салки-пересалки»: между салкой и убегающим можно перебежать, и салка догоняет перебежавшего.","p":["Движение и разминка","Сплочение"],"id":"салкидайруку","i":544},{"t":"Салки на доверие","a":[3],"ty":"Подвижные и эстафеты","goal":"Доверие","n":"10-20","time":"10 мин","props":"нет","b":"Несколько человек лежат на спине, остальные играют в салки, перепрыгивая через них. Площадка ровная и мягкая, правила чёткие.","p":["Движение и разминка","Сплочение"],"id":"салкинадоверие","i":545},{"t":"Салки по трое","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Взаимовыручка","n":"от 4 (кратно 4)","time":"10 мин","props":"нет","b":"Тройка держится за руки треугольником. Четвёртый пытается осалить одного из тройки, двое защищают. Протягивать руку через центр треугольника нельзя.","p":["Движение и разминка","Сплочение"],"id":"салкипотрое","i":546},{"t":"Салки у деревьев","a":[1,2],"ty":"Следопытство и ориентирование","goal":"Ловкость, быстрота","n":"8-20","time":"10 мин","props":"нет","b":"На поляне с деревьями водящий ловит. Игрок, коснувшийся дерева, в безопасности. Если водящий хочет продолжать погоню, он громко считает до пяти, отступая от дерева, а игрок в это время убегает. Вариант: нельзя осалить того, кто не касается земли ногами (стоит на пне, висит на ветке). Можно играть в «салки-пересекалки», когда кто-то перебегает дорогу водящему.","p":["Следопытство","Движение и разминка"],"id":"салкиудеревьев","i":547},{"t":"Салки-обнималки","a":[1,2,3],"ty":"Подвижные и эстафеты","goal":"Разрядиться, поддержать друг друга","n":"6-30","time":"5-10 мин","props":"нет","b":"Обычные салки, но осалить того, кто стоит в паре (крепко обнявшись), нельзя. Тройку салить можно, и пару, стоящую в обнимку дольше 3 секунд, тоже. Помогает побегать, посмеяться и получить опыт взаимовыручки.","p":["Движение и разминка"],"id":"салкиобнималки","i":548},{"t":"Сам не отвечу","a":[2,3],"ty":"В кругу, на месте и в тишине","goal":"Внимание","n":"8-20","time":"10 мин","props":"нет","b":"Ведущий в центре задаёт вопросы не по порядку. Спрошенный молчит, а отвечает его сосед справа. Кто ответил за себя или опоздал ответить за соседа, выбывает.","p":["Внимание и мышление"],"id":"самнеотвечу","i":549},{"t":"Самый ловкий","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Ловкость","n":"2 или 2 команды","time":"10 мин","props":"мел, мягкие палки, мячик или кубик","b":"Два круга рядом, в каждом предмет. Игроки мягкой палкой выбивают предмет соперника из круга, защищая свой. Побеждает выбивший предмет противника. Палки лёгкие, бить по палке, не по людям.","p":["Движение и разминка"],"id":"самыйловкий","i":550},{"t":"Сани","a":[1,2],"ty":"Музыка, праздники и большие игры","goal":"Эстафета","n":"тройки","time":"10 мин","props":"нет","b":"Двое на четвереньках - «лошади», третий сидит на них. Довезти до финиша. Только на мягкой траве, пассажир лёгкий.","p":["Событие"],"id":"сани","i":551},{"t":"Сантики-фантики","a":[1,2],"ty":"В кругу, на месте и в тишине","goal":"Наблюдательность","n":"10-25","time":"5-10 мин","props":"нет","b":"Ведущий закрывает глаза, выбираем «заводилу», который показывает движение. Все говорят «Сантики-фантики, лимпопо» и повторяют. Ведущий должен определить, кто заводила, пока тот незаметно меняет движения.","p":["Заполнить паузу"],"id":"сантикифантики","i":552},{"t":"Светка-конфетка","a":[1,2],"ty":"В кругу, на месте и в тишине","goal":"Наблюдательность","n":"4-12","time":"10 мин","props":"блюдце, конфеты","b":"Один выходит, остальные выбирают конфету и дают ей имя («Светка-конфетка»). Водящий возвращается и по одной ест конфеты. Когда прикоснётся к выбранной, все кричат «Это Светка-конфетка!» и он перестаёт есть. Никто из детей с аллергией на продукты не участвует с этим угощением.","p":["Заполнить паузу"],"id":"светкаконфетка","i":553},{"t":"Светофор (хлопай-топай)","a":[1],"ty":"В кругу, на месте и в тишине","goal":"Внимание","n":"любое","time":"5 мин","props":"нет","b":"Зелёный цвет - топаем, жёлтый - хлопаем, красный - тишина.","p":["Заполнить паузу","Внимание и мышление"],"id":"светофор","i":554},{"t":"Светофорчики (по цвету одежды)","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Внимание","n":"8-25","time":"10 мин","props":"нет","b":"Игроки на расстоянии 5 шагов от водящего, тот отворачивается и называет цвет. Игроки должны найти этот цвет в одежде и держаться за него, тогда перейти можно спокойно, а у кого такого цвета нет - убегает. Пойманный водит.","p":["Движение и разминка","Внимание и мышление"],"id":"светофорчики","i":555},{"t":"Свято место","a":[1,2],"ty":"В кругу, на месте и в тишине","goal":"Внимание","n":"8-16","time":"10 мин","props":"стулья","b":"Стулья по кругу, один свободен. Все пересаживаются влево, так что свободное место «движется». Водящий пытается сесть. Когда получилось, водящим становится сосед справа.","p":["Внимание и мышление"],"id":"святоместо","i":556},{"t":"Сделай фигуру","a":[1],"ty":"Подвижные и эстафеты","goal":"Фантазия","n":"8-25","time":"5-10 мин","props":"нет","b":"Дети бегают, по сигналу «раз, два, три» замирают в фигуре. «Судья» выбирает красивую и точную, этот ребёнок становится судьёй.","p":["Движение и разминка","Творчество"],"id":"сделайфигуру","i":557},{"t":"Сделай шаг вперёд","a":[2,3],"ty":"Знакомство и сплочение","goal":"Выявить лидеров","n":"от 20","time":"7-10 мин","props":"нет","b":"Все в широком кругу. Нужно, чтобы шаг вперёд сделали ровно 15 человек, потом 10, 5, 3, 1. Быстро видно, кто лидер-организатор.","p":["Сплочение"],"id":"сделайшагвперед","i":558},{"t":"Себе-соседу","a":[1,2],"ty":"В кругу, на месте и в тишине","goal":"Внимание","n":"10-25","time":"5-10 мин","props":"монетка","b":"Левая рука раскрытой ладонью вверх, правая щепоткой. На слово «себе» кладём воображаемое в свою левую, на «соседу» - в левую ладонь соседа справа. По кругу тайно движется монетка. Ведущий в центре угадывает, у кого она.","p":["Заполнить паузу","Внимание и мышление"],"id":"себесоседу","i":559},{"t":"Себихуза","a":[2,3],"ty":"Подвижные и эстафеты","goal":"Командность","n":"2 команды","time":"10 мин","props":"верёвка или линия","b":"Две команды по разные стороны линии стараются перетянуть соперников на свою. Кто заступил за линию, переходит в команду противника. Только без толчков и захватов за одежду.","p":["Движение и разминка"],"id":"себихуза","i":560},{"t":"Секретики","a":[1],"ty":"В кругу, на месте и в тишине","goal":"Переключение","n":"1-5","time":"5 мин","props":"мешочки с крупами","b":"Небольшие мешочки с разной крупой (манка, рис, горох, гречка). Дети мнут и отгадывают, что внутри.","p":["Успокоение"],"id":"секретики","i":561},{"t":"Семеро козлят и волк","a":[3],"ty":"Творческие и интеллектуальные","goal":"Умение сказать «нет», распознать обман","n":"12-25","time":"15-20 мин","props":"бумажки с ролями","b":"Бумажки с ролями «волк», «коза», «козлёнок» (по трети). Козлята сидят в «доме», волки и козы по очереди убеждают их открыть дверь. Впустили волка - он забирает 1-2 козлят, не впустили козу - козлята «голодают». Подростки часто решают «нравится-не нравится», а не по аргументам, это хороший повод поговорить.","p":["Творчество"],"id":"семерокозлятиволк","i":562},{"t":"Семья Адамс","a":[2,3],"ty":"Творческие и интеллектуальные","goal":"Весёлая импровизация","n":"любое","time":"15 мин","props":"нет","b":"Двое ведущих выводят по одному гостя и говорят со жестами: «Мы семья Адамс, вы наш гость, развлекайте нас, пока мы вам не зааплодируем». Всё, что делает гость, они повторяют. Когда зааплодируют, гость становится ведущим, и вводят следующего. Чем больше народу, тем веселее.","p":["Творчество"],"id":"семьяадамс","i":563},{"t":"Сесть друг другу на колени","a":[2,3],"ty":"Знакомство и сплочение","goal":"Доверие, сплочение","n":"10-30","time":"5-10 мин","props":"нет","b":"Стоим в тесном кругу боком друг к другу, по команде одновременно садимся каждый на колени стоящему сзади. Идём 10 шагов, чтобы круг не развалился. Нужна страховка вожатого.","p":["Сплочение"],"id":"сестьдругдругунаколени","i":564},{"t":"Сигнал","a":[1],"ty":"В кругу, на месте и в тишине","goal":"Внимание","n":"8-25","time":"5 мин","props":"свисток или хлопки","b":"Игроки стоят по кругу. На один сигнал поднимают правую руку и сразу опускают, на два - руку поднимать нельзя. Ошибся - шаг вперёд, но игра продолжается. Выигрывает тот, у кого меньше ошибок.","p":["Заполнить паузу","Внимание и мышление"],"id":"сигнал","i":565},{"t":"Силуэт","a":[1,2,3],"ty":"Знакомство и сплочение","goal":"Знакомство, творчество","n":"пары","time":"20-30 мин","props":"листы ватмана, маркеры","b":"Один ложится на лист, рассказывает о себе, второй обводит контур, дорисовывает лицо и записывает коротко сведения. Затем меняются. Работы вывешиваем. Вариант: угадать, кто на силуэте.","p":["Знакомство","Творчество"],"id":"силуэт","i":566},{"t":"Сиртаки","a":[2,3],"ty":"Музыка, праздники и большие игры","goal":"Размяться, сплочение","n":"любое","time":"5-10 мин","props":"музыка","b":"В круге руки на плечах у соседей: приставные шаги вправо-влево, шаг и приставка на пятку, на носок, затем выпад назад. Темп всё быстрее.","p":["Движение и разминка","Сплочение"],"id":"сиртаки","i":567},{"t":"Сказка на ролях","a":[1,2],"ty":"Творческие и интеллектуальные","goal":"Импровизация","n":"5-25","time":"15 мин","props":"простая сказка, бумажки с ролями","b":"Берём простую сказку («Репка», «Теремок»), выписываем всех героев, включая деревья и пеньки. Участники тянут роли, ведущий читает, а герои «оживают» и играют.","p":["Творчество"],"id":"сказканаролях","i":568},{"t":"Сказочная история","a":[1,2,3],"ty":"В кругу, на месте и в тишине","goal":"Фантазия, пятиминутка","n":"5-25","time":"5-15 мин","props":"нет","b":"Все по кругу сочиняют общую сказку, каждый добавляет по предложению. Можно задать тему (новогодняя, походная) или конец.","p":["Успокоение","Творчество"],"id":"сказочнаяистория","i":569},{"t":"Скала","a":[2,3],"ty":"Знакомство и сплочение","goal":"Договариваться, выявлять лидера","n":"10-20","time":"10-20 мин","props":"скамейка или стулья","b":"Все стоят вплотную на скамейке в ряд, рассчитываются по номерам. По одному нужно переместиться на другой край (1 - в конец, затем 2...), не спрыгивая на пол. Упал - начинаем сначала. Говорит только выбранный координатор. Вариант: построиться по росту, длине волос и т.д. не сходя со скамейки.","p":["Сплочение"],"id":"скала","i":570},{"t":"Скальпы (ленточки)","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Ловкость","n":"две команды","time":"15 мин","props":"ленты или платки за поясом","b":"У каждого повязка или платок на поясе. Нужно сорвать как можно больше у соперников. Соперник вправе защищаться. Без захватов, толчков и бега по склонам.","p":["Движение и разминка"],"id":"скальпы","i":571},{"t":"Скованные одной цепью","a":[1,2],"ty":"Знакомство и сплочение","goal":"Ловкость, смех","n":"команды","time":"10 мин","props":"вер
