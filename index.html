ервы 70.\n- Картофель для супа 75, для второго блюда 350.\n- На 10 человек: морковь 2 шт., лук 2 шт., свёкла 2 шт., капуста 1,5 кг.\n## Как составить раскладку\nЛист делим на четыре столбика: меню (что готовим), набор продуктов на одного, вес на одного, вес на весь отряд. Внизу подводим итог: что и сколько брать. Цифрам не верьте слепо: соль и сахар зависят от вкуса. На чайник берут 4 пакетика, на котёл 5.\n## Гигиена и хранение\n- Продукты лежат в продуктовой палатке в плотных мешках. Достают только завхоз или повар.\n- Сахар удобно нести в бутылках.\n- Сыр и сосиски готовим в первый день. Забыли - не едим.\n- По дороге не собираем грибы и ягоды. Воду пьём только кипячёную.\n- Овощи моем до того, как кидать в котёл.\n- Суп и гречку не мешаем одним половником, нож после тушёнки споласкиваем перед джемом.\n- Перед едой все моют руки. Посуду моем в отведённом месте и ополаскиваем горячей водой, песок и моющее смываем тщательно.\n- Отходы идут в мусорную яму, на столе после готовки продуктов не остаётся.\n- Пустые банки обжигаем, плющим и несём до ближайшего населённого пункта.\n## Советы с половником\n- Сахар в густеющую кашу не сыпем. Рафинад сначала растворяем в кипятке.\n- Когда образовались угли, кашу лучше снять и доводить на углях, она не пригорит.\n- Недосоленную кашу исправляем так: соль растворить в кипятке, влить и перемешать. Пересоленную разбавляем кипятком и сливаем воду. В пересоленный суп кладём ломтики сырой картошки, проварить и выбросить.\n- Чай не сластим в чайнике, не завариваем в ведре (лучше в небольшом котелке) и не кипятим заваренный.\n- С рыбными консервами варят только рис.\n- Перед мясом спросите про вегетарианцев и сделайте им отдельную порцию.\n## Как варить\n- Суп. Воду ставим заранее, котёл для супа больше, чем для второго. Овощи моем и режем заранее. В кипяток сначала морковь, свёклу, капусту (режем мельче), через 10 минут картошку и лук пополам. Когда овощи почти готовы, добавляем сухой суп (4-5 пакетиков), специи (осторожно с перцем) и тушёнку (1-2 банки на котёл). С тушёнки снимаем жир, мясо рубим в банке. Помним, что в пакетном супе уже есть соль. Суп периодически мешаем.\n- Манная каша на сухом молоке. Молоко разводим отдельно без комков, котёл снимаем с огня, заливаем молоко, тонкой струйкой сыплем манку и тщательно мешаем (вдвоём). Ставим на огонь ещё на 10 минут, помешивая. Сахар в конце. На сгущёнке так же, только молоко не разводим.\n- Рис. Промыть, засыпать в солёный кипяток, 18-20 минут на слабом кипении, за 2-3 минуты лавровый лист и перец, слить воду. Вязкую кашу варят около 15 минут, сливают воду, добавляют молоко и сахар, доводят 8-10 минут.\n- Гречка. Рассыпчатая: слегка обжарить крупу, залить 2-3 кружки воды на кружку, варить 30-40 минут. Вязкая: без обжаривания и 7-8 кружек воды на кружку.\n- Пшено. Промыть 3-5 раз, перетирая в ладонях (иначе горчит), залить кипятком, довести до кипения, воду слить, затем варить 30-40 минут.\n- Перловка. Промыть, засыпать в несолёный кипяток, варить около 40 минут на слабом огне, солить в конце.\n- Вермишель 8 минут, макароны 18-20, лапша 15-18.\n- Компот. Сухофрукты несколько раз промыть, закинуть в почти кипящую воду с сахаром и варить до мягкости.\n## Меры на глаз\nВ пол-литровую кружку входит: манки 370 г, гречки 400, пшена 410, овсянки 350, гороха 420, ломаной лапши и вермишели 210. В столовой ложке с горкой: масла 15 г, сахара 12, сгущёнки 15, сухого молока 8, соли 15. Воды на кружку крупы (кружек): манка 7-8, гречка 7-8, пшено 6, овсянка 8, геркулес 3, рис 7, перловка 5, горох, бобы и фасоль 3-4. Для супа берут 30-40 г крупы или макарон на литр воды, манки 20-25 г."},{"t":"Нашивка «Журналист»","cat":"Нашивки","b":"Журналист пишет для общелагерной газеты: заметки, интервью, репортажи. Главное - честность и умение отделять факт от мнения.\n## Что сдавать\n- Теория: журналистская этика, факт и информационный повод, жанры, особенности заметки, репортажа, интервью, зарисовки, путевых заметок и отчёта.\n- Практика: соблюдать этику, самостоятельно придумать вопросы и заголовки, взять интервью у незнакомого или малознакомого человека.\n- Написать заметку, интервью и репортаж и пройти правку у редактора газеты: отдать, выслушать замечания, исправить, вернуть и услышать, что материал принят.\n- Провести не менее пяти речевых игр.\n## Факт и мнение\nФакт - то, что действительно произошло: он достоверен, имеет источник, его можно проверить. Фактоид - «факт», которого не было, но который, будучи опубликован, вызывает живую реакцию. Мнение - точка зрения человека или группы.\nПеред ссылкой на факт его проверяют: нужно найти первоисточник, спросить противоположную сторону, получить подтверждение минимум из трёх источников (хотя бы два не анонимные), проверить точность и детали.\n## Информационный повод\nСобытие, которое может заинтересовать читателей и стать основой новости. В нём должно быть новое и значимое. Признаки повода: массовость, заявка на рекорд, участие известной личности, привязка к празднику или значимой дате, что-то из ряда вон.\n## Жанры\nЖанр - устойчивая форма материала. Сегодня жанры смешиваются, но знать их признаки полезно.\n- Публицистика: проблемный материал на актуальную тему с яркой позицией автора и предложением выхода.\n- Заметка пишется методом перевёрнутой пирамиды: заголовок (привлекает), лид (2-3 простых предложения: что, кто, когда, где), тело (как, кто видел, что сказал), бэк (связь с остальным миром).\n- Интервью: и метод, и беседа. Настрой: интерес к собеседнику, он твой гость, это не допрос. Вопросы готовим заранее и разных типов: закрытые (да или нет) и открытые. Основные заготовлены, уточняющие приходят по ходу. Готовый текст всегда согласуем с гостем. Менять смысл слов нельзя, исправлять можно только речевые ошибки.\n- Репортаж («взгляд очевидца»): автор всегда свидетель, пишет в настоящем времени, отвечает на вопрос «как», передаёт обстановку, детали, диалоги, эмоции. Первая фраза должна зацепить. Представьте, что описываете происходящее по телефону.\n- Отчёт: кто и что сказал на мероприятии, что сделал.\n- Путевые заметки: познавательность, факты, диалоги, мнение автора, живой язык.\n- Зарисовка: художественное описание природы, обстановки, человека. Всегда две стороны: автор и то, с чем он встретился.\n## Журналистская этика\nУважай личную жизнь и право на тайну, но на стороне общества. Пользуйся честными способами и надёжными источниками. В тексте видно, где факт, где мнение. Право - высказывать мнение и критиковать, обязанность - писать правду. Если заставляют писать неправду, откажись.\n## Где проверить тексты и что почитать\n- Сервисы проверки текста: text.ru, glvrd.ru.\n- Книги: М. Ильяхов, Л. Сарычева «Пиши. Сокращай», Нора Галь «Слово живое и мёртвое».\n## Речевые игры\nБерём существительные в именительном падеже единственного числа (множественное только для слов вроде «очки»). Имена собственные и уменьшительные слова нельзя. Время устанавливаем заранее.\n- «Наборщик». Из букв длинного слова (например «электропоезд») составить как можно больше слов: поезд, лектор, крот, клоп, лето, ток.\n- «Лестница». Выбираем букву (кроме ъ, ь, ы, й). Называем существительные, каждое на одну букву длиннее предыдущего. Пропуск ступеньки обрывает лестницу. На две буквы можно договориться о междометии. Побеждает самая длинная лестница.\n- «Сумасшедший алфавит». На листах колонки: имя мальчика, имя девочки, животное, растение, город. Водящий мысленно читает алфавит, ребята кричат «стоп», все заполняют колонки на выпавшую букву.\n- «Тик-так-бум». Передаём «бомбу» (любой предмет) по кругу, называя слова на заданную тему, пока она не взорвётся."},{"t":"Нашивка «Лагерник»","cat":"Нашивки","b":"Лагерник (комендант) - хозяин лагеря. Он выбирает площадку вместе с руководителем, определяет места для палаток и костра, следит за сохранностью инвентаря, чистотой и экологией.\n## Что нужно уметь\n- Быстро устраиваться на биваке, в палатке или шалаше.\n- Соблюдать гигиену и правила безопасности стоянки, отвечать за аккуратный вид.\n- Строить лагерные навесы (патенты), знать нужный инвентарь и уметь с ним обращаться.\n## Виды биваков\nМалый привал, обеденный привал, ночлег, дневка. Место ищут не позднее чем за 2 часа до темноты. Летом ориентируются на воду, зимой на топливо.\n## Что должно быть в лагере\n- Окопанный костёр и сиденья под тентом.\n- Кухня (можно отдельный костёр, куда ходят только дежурные).\n- Туалеты (с учётом ветра и рельефа).\n- Место для инструментов: пилы под бревном, топоры воткнуты в пень.\n- Место для аптечки и продуктовая палатка.\n- Поленница под защитой от дождя.\n- Сушка для одежды (тренога из жердей с верёвками) и сушилка для посуды.\n- Помойная яма для органики и отдельный мешок для неорганического мусора.\n- Удобный подход к воде.\n## Порядок постановки лагеря\n- Сразу распределяем задачи. Костровой выбирает место, ставит перекладину и собирает хворост.\n- Два водоноса достают котлы, идут за водой, затем оборудуют умывальник. Повар берёт продукты у завхоза.\n- Двое натягивают тент и идут за дровами, двое ставят палатки, остальные за дровами. Если скоро стемнеет, за дровами идут все.\n- Потом стелем пенки, переодеваемся в сухое, осматриваем друг друга на клещей. Медик помогает с мозолями и насморком, реммастер проверяет снаряжение.\n- Распределяем ночное дежурство. Дрова укрываем от сырости, инструмент убираем под тент.\n- На дневке можно сделать вокруг костра сиденья из брёвен.\n## Постановка палатки\nСпиной к ветру, входом к костру, не ближе 5 метров от огня (искры прожигают ткань), не в низине. Стойки не должны прорывать ткань, колышки держатся крепко, при необходимости крепим к деревьям или камням. Тент не касается палатки, чтобы не копился конденсат. Палатку окапывают с водоотводом в сторону спуска.\n## Пила и топор\n- Топор и пилу переносят только в чехле.\n- Пила. Когда один тянет, второй отпускает. Не толкать пилу, она гнётся и застревает. Держать ровно, двигать плавно, как смычок. Под место распила подкладываем бревно, в толстом дереве вставляем клин или топор.\n- Колка. Полено стоит ровно на твёрдой колоде, топор крепко сидит на топорище, спереди и сзади по линии удара никого нет, ноги широко. Рубим наискосок. Топор не бросаем на землю и не втыкаем в стоящее дерево.\n## Технические места\n- Водозабор выше по течению, купание ниже.\n- Помойная яма за пределами стоянки со стороны кухни, глубиной около метра. Периодически засыпаем песком и золой.\n- Посуду храним только чистой. Моем не в водоёме, воду берём там же, где для еды. Пищевые отходы в воду и на берег не выбрасываем.\n## Туалеты\nЗа 200-250 метров от лагеря в зарослях, с учётом ветра. Не рядом с водой и не выше стоянки по рельефу. Мужской и женский отдельно. Копаем канаву, кладём решётку из досок или жердей, стенки из непрозрачной плёнки по росту, лучше навес от дождя.\n## Уходя со стоянки\nОглянитесь хозяйским взглядом. Чисто ли? Оставлен ли запас дров и сухая растопка в сухом месте? Сделайте так, будто завтра придёте сюда сами, усталые, мокрые и замёрзшие."},{"t":"Нашивка «Гитарист»","cat":"Нашивки","b":"Гитарист умеет не только играть, но и обращаться с инструментом: настраивать, хранить, возить в поход.\n## Что сдавать\n- Теория: устройство акустической гитары и её виды, два лагерных гимна наизусть, стандартный строй (Ми), набор гитариста-любителя, правила хранения и перевозки.\n- Практика: основные аккорды, основные бои и переборы, игра медиатором, игра стоя, настройка по тюнеру за 3 минуты.\n- Сдать два лагерных гимна под гитару, две любые песни боем и две перебором, проговаривая слова.\n- Добавить песню с аккордами в лагерный песенник и выступить на лагерном мероприятии.\n## Авторская песня\nЖанр, возникший в середине XX века. Автор часто сочетает в одном лице поэта, композитора и исполнителя, на первом месте текст, сопровождение гитарное. Основу жанра сначала составляли студенческие и туристские песни с живой, личной интонацией. Широкую популярность жанр получил с появлением магнитофона.\n## Устройство гитары\nКорпус с длинным грифом. Струны одним концом закреплены на подставке корпуса, другим на колковой коробке (колки регулируют натяжение). Струна лежит на двух порожках, расстояние между ними - мензура.\nСтандартный строй (снизу вверх от 6-й к 1-й струне): ми, ля, ре, соль, си, ми.\n## Виды акустических гитар\n- Классическая: нейлоновые струны, широкий гриф, 12 ладов до корпуса.\n- Фолк: похожа на классическую, но под металлические струны.\n- Дредноут (вестерн): металл, увеличенный «прямоугольный» корпус, громче, больше низких.\n- Джамбо: металл, большой корпус, плоская дека, округлые линии.\n## Приёмы игры\n- Бой: например, вниз большим пальцем, вверх указательным, вниз указательным с заглушкой, вверх указательным.\n- Перебор - поочерёдное защипывание струн пальцами.\n- «Шестёрка»: бас, 3, 2, 1, 2, 3.\n- «Четвёрка»: бас, 3, (2 и 1 вместе), 3.\n- «Вальсовый»: бас, (3 2 1), (3 2 1), бас, (3 2 1), (3 2 1).\n- «Восьмёрка» - чуть сложнее, осваивают после «шестёрки».\n## Аккорды и баррэ\nБазовые аккорды учим по схемам аппликатур. Баррэ - когда указательный палец прижимает несколько или все струны на одном ладу. Это трудно, но основа для многих аккордов. Аккорд F можно упростить (прижать только шестую струну на первом ладу), но баррэ всё равно стоит осваивать.\n## Аксессуары\nМедиатор (пластинка 0,1-1 мм), ремень (чтобы играть стоя), тюнер (электронный или приложение), шестигранный ключ для анкера, вертушка для намотки струн, чехол.\n## Хранение и перевозка\n- Влажность воздуха 40-60%, температура 10-25 градусов.\n- Хранить вдоль стены, не в углу и не под потолком; не ближе 1-1,5 м к батареям.\n- Не держать на прямом солнце. При долгом хранении струны ослабляют.\n- Перевозить без ударов, намокания и нагревания. Зимой нести в утеплённом чехле, перепады температуры вредны дереву.\n- В походе: беречь от сырости, не держать близко к костру, после игры убирать в чехол, ночью хранить в палатке."},{"t":"Нашивка «Барабанщик»","cat":"Нашивки","b":"Барабанщик играет на построении и ведёт отряд на марше, но главное - исторически барабанщики первыми шли навстречу трудностям. В лагере это значит: первым взяться за важное поручение, сказать вслух о несправедливости, помочь. Иначе это просто человек, умеющий бить в барабан.\n## Что сдавать\n- Теория: понятия «символы» и «ритуалы», государственная символика, правила построения, история и устройство барабана, правила обращения с ним.\n- Практика: знаки и команды барабанщиков, переходы барабана, не менее семи маршей, игра на ходу.\n- Допуск: после теории и практики ведущий барабанщик разрешает играть на построении. Нашивку вручают тем, кто сдал и хотя бы раз сыграл на построении. Посвящение на рассвете даёт право быть ведущим барабанщиком.\n## Символы и ритуалы\nСимволы - слова, предметы и действия, обозначающие важные понятия для общества и коллектива и объединяющие людей общими ценностями. Ритуалы - традиционные символические действия: подъём флага, девиз, посвящение. Государственные символы: герб (золотой двуглавый орёл на красном щите, три короны, скипетр и держава, на груди всадник, поражающий змея) и гимн (музыка А. Александрова, слова С. Михалкова в редакции 2000 года).\n## История барабана\nПервые упоминания - Древний Египет, Месопотамия, Шумер. Барабаны служили в обрядах и для передачи сигналов тревоги. Есть даже наука об языке барабанных сигналов. В России барабаны распространились в полках XVII века, при Петре I их особенно ценили. Малый маршевой барабан у скаутов был синий, у пионеров с красным ободом.\n## Устройство\nПолый корпус, внутри пружина, сбоку отверстие для воздуха. Сверху и снизу обручи с натянутой мембраной (кожа или пластик), зажимы, ремень с гнёздами для палочек и пряжкой.\n## Обращение с барабаном\n- Хранить сухо, тепло, проветриваемо и вертикально, ремень заправлен под зажим. Лёжа мембрана провисает.\n- Мембрану подтягивают зажимами, она должна быть натянута.\n- Не играть под дождём и в сырости. Играть палочками, не руками. Не бить слишком сильно, можно прорвать.\n- Не давать бить «просто так», беречь от воды, солнца и искр костра. В походе хранить в палатке вертикально и укутанным.\n## Правила игры\n- Начинают и заканчивают по знаку ведущего. Главное - слаженность патруля.\n- Играют со стороны мембраны, где пружина.\n- Марш играют по нотам или по текстовке: слово делится на слоги, один слог - один удар. Все марши начинаются с правой руки (у левшей иначе). Слоги «бей, ба» - двойной удар правой.\n- Сила звука зависит от места удара: ближе к центру громче.\n- При ходьбе первый удар правой совпадает с первым шагом правой ногой.\n## Положения и переходы\n- Походное: ноги расставлены, барабан на правом боку, ремень через левое плечо, правая рука на корпусе, левая с палочками (параллельно) прижата к боку.\n- Боевое: барабан перед барабанщиком, руки с палочками на мембране.\n- Переходы выполняются по счёту «раз, два, три» ведущего: правая рука берёт обод и переводит барабан, левая переносит палочки на корпус (в боевое) или опускается вдоль бока (в походное).\n## Знаки и команды ведущего\n- Палочка поднята вверх: «Внимание!».\n- Поднятая палочка, полукруг и резкий бросок вниз: «Снять игру!».\n- Скрещенные над головой палочки: «Немедленная тишина!».\n- «К бою!» - разнять палочки, не поднимая с мембраны. «Начали!» - одновременное начало.\n## Построение\nБарабанщики стоят в одну линию или два ряда перед вожатской трибуной, ведущий на правом фланге. Все время слушают команды ведущего и выполняют общелагерные команды.\n## Марши\nВыучить не менее семи. Основные в лагере: Знаменный, Орлятский, Походный, Суворовский (совместим с Морским), Морской, Рассветный (для посвящения), Гвардейский, Содружество, Звёздная атака (два голоса), Африка (для вручения наград), Звёздный, Общий сбор. Ритмические текстовки передаются на тренировке от ведущего барабанщика."},{"t":"Нашивка «Фотограф»","cat":"Нашивки","b":"Фотография - «рисование светом». Фотограф ловит момент, который потом хочется рассматривать снова и снова. Главное творчество - выбор композиции, света и момента.\n## Что сдавать\n- Теория: устройство и настройки фотоаппарата, принципы фотографии, законы композиции.\n- Практика: собственные работы по жанрам (портрет, натюрморт, пейзаж, флора и фауна, макросъёмка, репортаж).\n- Снять поход или большое мероприятие, показав все основные события, составить фотоотчёт из лучших кадров.\n- Опубликовать фотографии в лагерной газете.\n## Как работает зеркальная камера\nСвет проходит через объектив, диафрагма регулирует его количество, зеркало отражает его через призму в видоискатель. В момент съёмки зеркало поднимается, открывается затвор, свет падает на матрицу. Затем затвор закрывается, зеркало опускается. Всё это занимает доли секунды.\n## Краткий словарь\n- Корпус не пропускает свет.\n- Объектив - система линз, проецирует изображение на матрицу.\n- Диафрагма - лепестки с отверстием регулируемого диаметра.\n- Пентапризма переворачивает изображение, видоискатель - «глазок» камеры.\n- Матрица (сенсор) чувствует свет, карта памяти хранит снимки.\n- Затвор - шторки, открывающиеся на время съёмки.\n## Настройки\n- Выдержка - время, на которое открыт затвор. Дольше - больше света.\n- ISO - чувствительность матрицы. Выше ISO - можно снимать при слабом свете, но снимок «зернистый».\n- Экспозиция - сочетание выдержки и диафрагмы (экспопара). Нужно подобрать так, чтобы света хватило.\n- Фокус - точка, на которую наведена резкость.\n## Дополнительное оборудование\nЭкспонометр, вспышки и отражатели для слабого света, штатив (против «смаза» при долгих выдержках и для панорам), светофильтры.\n## Композиция\nСначала определите смысловой центр - главное в кадре. Затем используйте правило третей: кадр делят двумя горизонтальными и двумя вертикальными линиями на 9 частей, важное кладут вдоль линий или в точках пересечения. Такая асимметрия выглядит естественнее.\n## Типичные ошибки\n- Обрезаны люди или достопримечательности.\n- Искажены пропорции (съёмка сверху даёт большую голову и короткие ноги).\n- Завален горизонт.\n- Посторонний предмет в кадре.\n- Всё по центру.\n- Кадр пустой или перегружен «фотомусором».\n## Что почитать\nФриман «Дао цифровой фотографии. Идеальная композиция», Лапин «Фотография как...», Дыко и Головня «Фотокомпозиция», Островская «100 советов начинающему фотографу»."},{"t":"Нашивка «Скалолаз»","cat":"Нашивки","b":"К сдаче допускаются те, у кого уже есть нашивка «Узловой». Все занятия проходят только под руководством инструктора.\n## Что сдавать\n- Знать технику безопасности на скалах: работа с верёвками, страховка, подъём и спуск.\n- Знать и уметь использовать снаряжение: верёвки, спусковые и страховочные устройства, карабины, обвязки.\n- Показать инструктору технику лазания по скальной стенке.\n## Техника безопасности\n- Страхует только подготовленный участник с опытом.\n- Двигаемся по правилу трёх точек опоры.\n- Снаряжение проверено и выдерживает нагрузку больше возможной.\n- Нельзя использовать верёвки старые, с надрывами оплётки, с намертво затянутыми узлами, с подплавленной оплёткой, перебитые, долго лежавшие на солнце или пережившие больше рывков, чем рассчитано.\n- Нельзя карабины с заедающей муфтой, карабины и спусковые устройства с протёртостью более 1 мм, обвязки с расползшимися швами, надрывами и сильно протёртыми петлями.\n## Категорически запрещено\n- Работать на скале в одиночку.\n- Отвлекать страхующего.\n- Разворачиваться спиной к скале.\n- Держаться за верёвку в месте её контакта со скалой.\n- Использовать при страховке саморазвязывающиеся узлы.\n- Хвататься за страховочную верёвку и нагружать её.\n- Без навыка спускаться прыжками, упираться в скалу коленями, локтями, головой, садиться на маршруте.\n## Верёвки\nСпециальные скалолазные верёвки делают из полиамида (капрон, нейлон): прочные, эластичные, износостойкие, устойчивы к химии, кроме кислот. Полиэстер менее эластичен и хуже держит узлы, кевлар самый прочный, но недолговечный и плохо держит узлы. Бывают крученые и плетёные (сердцевина с оплёткой, лучше защищена от повреждений и ультрафиолета).\nПо назначению:\n- Динамические: амортизируют рывок при срыве, для страховки на маршруте (нижняя страховка). Минусы: мягкие, намокают и обмерзают, сильнее трутся о скалу, не годятся под постоянную нагрузку (перила, переправы), сильно вытягиваются при спуске.\n- Статические: мало удлиняются, нужны для верхней страховки, перил, переправ, спасательных работ. С ними категорически нельзя допускать, чтобы скалолаз оказался выше точки крепления верёвки или перегиба через карабин.\n- Вспомогательные (репшнуры).\n## Узлы и их эффективность\nЭффективность узла - доля прочности верёвки, остающаяся в узле. Узел обычно ослабляет верёвку на 30-60%. Мокрая верёвка снижает прочность узла примерно на четверть, чем тоньше и скользче верёвка, тем хуже узел.\n- Встречная восьмёрка (47%) и встречный проводник (41%): соединение двух верёвок одной толщины.\n- Девятка (70%), двойная восьмёрка (55%): самостраховка, петля для карабина.\n- Двойной булинь (53%): закрепление обвязки на теле.\n- Австрийский проводник (51-53%): крепление усов самостраховки, исключение перетёртого участка.\n- «Заячьи уши» на основе двойной восьмёрки: страховка двумя карабинами.\n- Грейпвайн: соединение верёвок и самостраховка вместе с прусиком (данные об эффективности различаются, проверяйте).\n## Карабины\nМеталлическое кольцо с защёлкой-муфтой.\n- Стальные - самые надёжные, но тяжёлые.\n- Дюралюминиевые - универсальные, в разы легче.\n- Титановые - устаревшие, дорогие, риск микротрещин.\n- Пластиковые нельзя использовать для соединения верёвки, годятся только для развески снаряжения.\nФормы: овальные (хорошо распределяют нагрузку), трапециевидные (самые популярные), грушевидные (верёвка скользит безопасно), рапиды (звенья без защёлки с муфтой, держат нагрузку в любом направлении).\nМуфты: ручная (может самопроизвольно раскрутиться), автоматическая двухтактная (быстрая, но может раскрыться при трении или замёрзнуть), автоматическая трёхтактная (надёжнее, но боится грязи).\nВыбраковка карабина: коррозия, зазор или выход заклёпки защёлки, истончение корпуса или засечки глубже 1 мм, муфта закрывается не до конца, деформация.\n## Жумар\nЗажим для подъёма по верёвке: скользит вверх и не едет вниз. Нельзя допускать, чтобы он оказался ниже уровня пояса.\n## Спусковое устройство «восьмёрка»\nДля спуска по одинарной или двойной верёвке. Работает на трении, скорость регулируют усилием торможения свободного конца или углом между ним и восьмёркой. Карабин с восьмёркой крепят на анкере, дереве или обвязке страхующего.\n## Виды страховки\n- Верхняя: точки страховки выше лазающего, верёвка идёт сверху. При срыве повисаешь чуть ниже достигнутой точки, рывок минимален.\n- Нижняя: для опытных, верёвка идёт вниз от лазающего, он «прощёлкивает» верёвку в точки по ходу. Высота падения может быть несколько метров, нужна только динамическая верёвка и мастерство страхующего.\n- Гимнастическая: руками, для безопасного приземления на малой высоте.\n- Спортивный мат (crash-pad): для боулдеринга и как дополнение.\n- Автоматическая: устройство на скалодроме, втягивает верёвку при подъёме и плавно спускает при срыве."},{"t":"Нашивка «Реммастер»","cat":"Нашивки","b":"Реммастер - умелые руки отряда. К нему бегут, когда порвался рюкзак или заела молния. Кроме общего походного ремнабора у него всегда под рукой личный: нитки, иголки, пуговицы, заплатки, изолента, ножницы, быстросохнущий клей.\n## Что делать\n- До похода: составить список ремнабора с учётом возможных поломок, укомплектовать и упаковать, пройти инструктаж по ремонту.\n- В походе: выдавать и собирать инструменты, следить, чтобы ничего не терялось, чинить групповое снаряжение и помогать с личным.\n- После похода: сохранить ремнабор.\n## Что в ремнаборе\n- Треугольный напильник и брусок для правки топоров.\n- Иглы разной толщины, нитки капроновые и хлопковые разных цветов, два напёрстка.\n- Шнурки, стропы разной ширины, липучка, пряжки, самосбросы и прочая фурнитура, стопоры для шнурков.\n- Ткани для заплат: капрон, брезент, хлопок.\n- Проволока разной толщины, пассатижи, маленькие ножницы.\n- Супер-клей, скотч, изолента, шкурка разных номеров.\n- Бегунки для молний и сами молнии, резинки.\n- Чехол для ремнабора.\nДля водного и горного похода набор собирают с учётом специфики.\n## Виды швов\nШов состоит из повторяющихся стежков. Обметочный не даёт краю ткани распушиться, крытый зашивает отверстия после наполнения чехлов, крестовый для плотных и крепких тканей, стебельчатый самый прочный.\n## Пришиваем пуговицу\nПродеваем нитку с узелком, прошиваем ткань, надеваем пуговицу, пришиваем, не затягивая стежки (держим зазор около 3 мм). Достаточно шести стежков на каждую пару отверстий. В последнем стежке нить не прокалываем в ткань, а обматываем несколько раз под пуговицей, образуя «ножку», и закрепляем нить. Для прочности можно подложить подкладку с изнанки.\n## Прямой разрыв\nПодогнуть края на изнанку, смётать швом «вперёд иголку», обрезать торчащие нитки, шить мелкими стежками «через край» вдоль разрыва и чуть дальше его концов, закрепить нить, выдернуть смёточную, прогладить с изнанки.\n## Сложный разрыв\nПоложить на ровную поверхность, при необходимости слегка стянуть края, намётать, сшивать начиная с коротких линий, самую длинную оставить на конец. Каждую линию начинаем на крепком месте, стежки к концу укорачиваем. Затем смёточную нить убираем и проглаживаем.\n## Заплаты\nПодрежьте края разрыва, чтобы отверстие было небольшим, но края крепкие, удалите подорванные места. Заплату накладывают с изнанки, рисунок подбирают по ткани. Края обшивают.\n## Советы\n- Оторвалась оттяжка тента: в уголок вложить маленькую шишку и закрепить вокруг неё новую оттяжку.\n- Прожгли тент: заплатка из брезента.\n- Сломалась пластиковая дуга палатки: временно скрепить обломки с металлическим прутом или палкой, потом заменить.\n- Расходится молния: слегка подожмите «собачку» плоскогубцами.\n- Главное - следить, чтобы со снаряжением обращались аккуратно, тогда чинить придётся меньше."},{"t":"Нашивка «Костровой»","cat":"Нашивки","b":"Костровой отвечает за огонь: от розжига и безопасности до тушения и уборки костровища.\n## Что делать\n- До похода: подготовить спички и сухое горючее, упаковать от влаги, особенно запас растопки для зимы и дождя.\n- В походе: подготовить место для костра по правилам безопасности, знать не менее пяти типов костров, уметь разжигать зимой, летом и в дождь, готовить и поддерживать костёр для повара, грамотно тушить, тушить пожар песком и знать, когда это нужно, убрать костровище при уходе.\n## Костры по назначению\nДля приготовления пищи, для обогрева, для сушки вещей, сигнальные (дымовые).\n## Розжиг\n- Растопка: мелкие еловые веточки, береста (не с живой берёзы), сухой мох, лишайник, стружка, лучина. Кладём под шалашик или колодец из хвороста, поджигаем, сверху аккуратно добавляем дрова потолще.\n- Без спичек: лупа в солнечную погоду (линза, стекло от очков), кремень и трут, раскатывание ватного жгута между сухими дощечками. Трудно и без практики редко получается.\n## Какие дрова\n- Сырые и гнилые дают много дыма и мало тепла, мелкий хворост прогорает за пару минут, осина и пихта сильно «стреляют».\n- Для готовки лучше берёза и ольха: горят ровно, почти без дыма.\n- Для большого жаркого костра (например, вынужденный ночлег зимой) лучше сухостой сосны, кедра, ели.\n- Вблизи посёлков берут то, что не нужно жителям: мелкий валежник, старые пни, хвойный опад.\n## Валка сухостоя (только с взрослым)\nОпределить наклон дерева и путь падения, убедиться, что оно не зависнет. Подруб на треть диаметра с нужной стороны, второй с противоположной примерно на ладонь выше. Если не падает - клин или вага, людей не должно быть ни на месте падения, ни позади дерева (ствол может отскочить комлем). Толстые деревья пилят двуручной пилой. Сухое ли дерево, смотрят по вершине, а не по коре. Зимой лиственные сбрасывают листву, лучше валить сосну.\n## Костры по форме\n- «Шалаш»: дрова шалашом, внизу растопка. Большое ровное пламя, для варки в одной посуде, сушки и света. Мало углей, много дров.\n- «Нодья»: два параллельных бревна 30-40 см толщиной и 1,5-3 м длиной, между ними огонь, потом сдвигают, закрепляют распорками и кладут третье. Надёжный и жаркий костёр на всю ночь, для обогрева и сушки. Можно готовить на двух нижних бревнах.\n- «Колодец»: сруб из коротких поленьев, внутри мелочь. Очень высокое пламя, много углей, быстро сгорает.\n- «Звезда»: несколько брёвен лучами, горят в центре, по мере сгорания пододвигают. Долго горит, вокруг можно ночевать.\n- «Полинезийский» (ямка): яма, стенки обложены поленьями или камнями, огонь на дне. Горит долго из-за нехватки воздуха, много углей и золы, мало дров, не заметен.\n- «Охотничий»: три бревна на подкладке, горит 6-8 часов, нужно лишь сдвигать горящие концы.\n- «Таёжный»: долгий, жаркий, много углей, для нескольких котлов и сушки. Три вида: «крест-накрест» (на угли три полена, сверху ещё два-три крест-накрест), «на полено» (на толстое бревно с подветренной стороны кладут поленья), «помост» (угли разровнять, сверху ровные поленья с небольшими щелями).\n- Костёр с отражателем: тепло ночью, удобно для односкатного шалаша.\n- Дымовой: на обычный костёр кладут хвойные смолистые ветви или зелёную траву, для сигнала и защиты от гнуса.\n- «Деревянный примус» («таёжная свеча»): сухое бревно пилят на цилиндр 20-40 см (не смолистое: будет «стрелять»), раскалывают, вырубают канал 5-7 см, скрепляют проволокой или гвоздями, набивают бумагой или берестой, зажигают. Плоская поверхность сразу годится под котелок, не требует постоянного присмотра и может служить повторно.\n## Костёр зимой\n- Неглубокий снег: яма (копают 2-3 человека), перекладина на треногах из лыжных палок.\n- Глубокий снег и сырые брёвна: помост из сырых брёвен с двумя поперечными валежинами.\n- Быстрее всего на металлической сетке между деревьями (ячейки 3-4 мм). Такая же сетка защищает спящих от искр.\n## Костёр в дождь\n- Сухие дрова ищем под раскидистыми ветками ели и сосны и внутри сухостоя. Растопка всегда с собой в защите от воды: бумага, сухой спирт, свечки-таблетки, огарок свечи с шалашиком из лучины.\n- Ветки кладём так, чтобы тонкие были под укрытием толстых. На толстых ветках можно настрогать стружку, не отделяя от ветки («Буратино»).\n- Поленья корой к дождю, вплотную, как крыша: подходят «шалаш», «нодья», «таёжный». «Колодец» и «звезда» в дождь не годятся.\n- Лучше натянуть тент, вокруг костра сушить сырые дрова.\n## Безопасность у костра\n- Лучше использовать старое кострище. Не ближе 4 м до деревьев, место очистить от мусора.\n- Нельзя разводить на торфяниках, камнях, корнях деревьев, в хвойном молодняке, на старых гарях, в буреломах, на лесосеках с порубочными остатками, в сухой траве и под кронами.\n- Снять дёрн полосой шириной не менее полуметра, хранить и поливать, при уходе вернуть на место. Кострище окопать или обложить камнями.\n- Костровой трос на высоте выше человеческого роста, к деревьям крепить верёвками, не самим тросом (портит кору). Под тросом не лазить. Рогатины поливать.\n- У костра при готовке только дежурный патруль. Одежда рабочая, не синтетика (расплавится), волосы убраны, никаких шорт, шлёпанцев, босых ног и резиновых сапог.\n- Костровые рукавицы под рукой, мокрыми не пользоваться (ожог паром).\n- Дужки котлов надёжны, крышки ускоряют закипание. Если вода выплёскивается - не снимать котёл, а вычерпать немного и убавить огонь.\n- Готовая еда стоит в недоступном месте. Обувь и снаряжение у огня без присмотра не сушить.\n- Поленница под защитой от дождя и вне досягаемости искр. Дрова на утро готовим с вечера.\n- Тушим песком или водой. Горящий костёр без присмотра не оставляем, особенно в сухую погоду."},{"t":"Нашивка «Мастер театра»","cat":"Нашивки","b":"Заводилы у костра, на спектакле и на общей игре - те, кто идёт за этой нашивкой. Артистические навыки пригодятся не только в лагере.\n## Что сдавать\n- Краткая история театра, устройство античного и современного театра, жанры театра и эстрады.\n- Представление о сценарии и частях спектакля.\n- Выразительное чтение стихов и отрывков прозы.\n- Основы актёрского мастерства, грим, подбор и изготовление костюма.\n- Поставить с отрядом не менее двух «точек» (номеров) и провести костёр.\n## Из чего состоит театр\nТеатр соединяет музыку, живопись, архитектуру, кино, фотографию. Виды: драматический, кукольный, музыкальный, балет, опера, пантомима, театр теней, поэзии, танца, уличный и другие. Кроме актёров и режиссёра, работают драматург, помощник режиссёра, художник, костюмер, гример, реквизитор, бутафор, осветитель, звукооператор.\nЖанры театра: комедия, драма, трагедия, трагикомедия, мелодрама, водевиль, буффонада, феерия, мюзикл, опера и другие. Эстрадные жанры: разговорные (интермедия, монолог, пародия, скетч, сценка, фельетон, конферанс) и музыкально-разговорные (куплет, частушка, литературный монтаж, сатирический дуэт).\nВ основе действия всегда конфликт.\n## Как создаётся спектакль\n- Выбор литературной основы и распределение ролей.\n- График работы.\n- Репетиции, одновременно изготовление костюмов, реквизита, декораций и организация показов.\n- Генеральная репетиция, показ, анализ.\nСпектакль делится на акты (действия), акты на картины (сцены), между ними антракты. Может быть пролог. Краткое содержание музыкального спектакля - либретто. После третьего звонка в зал не входят. Проходить между рядами нужно лицом к сидящим, а в конце не спешить в гардероб, а похлопать артистам.\n## Краткая история театра\n- Античный театр вырос из обрядов. Из песен в честь бога Диониса родилась трагедия («козлиная песнь»), из весёлых празднеств комедия. Трагики: Эсхил, Софокл, Еврипид; комедиограф Аристофан. Театры были открытые, зрители сидели на каменных скамьях, актёры играли на орхестре, за ней была скена (отсюда «сцена»). Играли мужчины, в масках и на котурнах, главным лицом был хор.\n- Средневековье: народный театр на карнавалах, церковный театр, странствующие ваганты, потом мистерии на городских праздниках.\n- Возрождение: итальянская комедия дель арте (первый профессиональный театр масок), возникновение оперы и балета, расцвет английского театра с Шекспиром (театр «Глобус»).\n- Новое время: французский классицизм (Расин, Мольер, Корнель), сказки Гоцци. На рубеже XIX-XX веков появляется режиссёрский театр, а Брехт создаёт эпический театр.\n- Россия: фольклорные формы (Петрушка, балаган), скоморохи с XI века, школьный и придворный театр, первый публичный театр (1756, Фёдор Волков). Императорские театры, драматургия Гоголя, Грибоедова, Островского, Чехова. В 1898 Станиславский и Немирович-Данченко основали МХТ, Мейерхольд развил условный театр. Современный театр ищет новые формы и часто ставит режиссёра выше актёра.\n## Перед выходом на сцену\n- Войди в образ: послушай тематические песни, придумай «заводящие» жесты (расправить плечи, потереть ладони, ударить кулаком в ладонь).\n- Волнуются все. Помогает глубокий вдох, задержка на две секунды и резкий выдох (осторожно, может закружиться голова); или представь, что в зале один человек; или присядь пару раз и помаши руками.\n## Работа с залом\n- Выступай на авансцене лицом к залу, не скрещивай руки и ноги, говори громко и чётко (выше голов), паузы чуть длиннее, чем в обычной речи.\n- Если зал шумит от смеха, замри и дождись тишины.\n- Перед выступлением нужна генеральная репетиция в костюмах и с реквизитом. Мебель носят, а не таскают. За занавесом не разговаривают. Заранее продумай входы и выходы. Табличек не использовать. В полном зале звук тише.\n## Как провести костёр\n- Придумать тему и согласовать с вожатым, начальником дружины и принимающим нашивку, согласовать дату и место, сообщить отрядам.\n- Составить порядок выступлений и продумать промежутки между ними, выбрать игры с залом, песни (договориться с гитаристами).\n- Придумать вызывалки и благодарилки для каждого отряда.\n- Предупредить инструктора и кострового, чтобы костёр был готов к сроку.\n- Продумать свой образ, вступительное слово и правила костра, обсудить тему со зрителями.\n- Помочь рассадить отряды и провести костёр по плану.\n## Игры с залом и ведущий\nИгры должны иметь чёткий ритм, повторяющиеся движения и слова, ускоряющийся темп. Простота и вовлечение всех, а не только первого ряда - залог успеха. Ведущему готовиться нужно тщательно.\n- Следи за внешним видом, имей запас игр больше, чем нужно.\n- Выбирай слова, шути в меру (шутка может обидеть).\n- Начинай с приветствия, при первом выступлении представься.\n- Объясняй простыми словами и не размахивай руками.\n- Заранее попробуй микрофон: он нужен, чтобы не кричать.\n- Если зал шумит, успокаивай в образе (царь грозит казнью), на своё имя не отзывайся.\n- Продумай, как ребятам выходить на сцену, не забывай благодарить и хвалить, в конце попрощайся и представь следующего ведущего."},{"t":"Нашивка «Завхоз»","cat":"Нашивки","b":"Завхоз - заведующий хозяйственной частью. Он обеспечивает отряд предметами походного обихода, следит за сохранностью снаряжения и вместе с реммастером за его починкой, отвечает за продуктовую палатку (доступ есть и у повара).\n## Обязанности\n- До похода: составить список группового снаряжения с учётом маршрута, получить и проверить его, организовать ремонт, назначить ответственных за каждую вещь, вместе с поваром подготовить продукты.\n- В походе: следить за сохранностью и состоянием снаряжения, при необходимости перераспределять его, организовать ремонт с реммастером, обеспечить сохранность продуктов.\n- После похода: просушить и отремонтировать снаряжение, собрать его или раздать на хранение участникам.\n## Общественное снаряжение\n- Палатки по числу людей плюс одноместная продуктовая, тенты для палаток и костровой тент.\n- Плотная плёнка 2 на 3 м (для туалета).\n- Топор (1-2 на отряд), пила, лопата.\n- Костровой набор (тросик, крючки) и рукавицы.\n- Котлы (3 на отряд или 2 котла и чайник), 2 поварёшки.\n- Ремнабор, аптечка.\n- Спички и свечки в непромокаемой упаковке.\n- Скатерть или клеёнка (на земле еду не готовим).\n- Расходка (верёвка для навеса, тента и т.п.).\n- Волчатник (красно-белая лента для ограждения стоянки).\n- Ножи, консервные ножи, разделочные доски.\n- Канистры для воды, средство для мытья посуды, две или больше губки, мусорные мешки.\nПилы и топоры хранятся в чехлах всегда, когда не используются: это техника безопасности и срок службы инструмента.\n## Личное снаряжение\nБольшой рюкзак с полиэтиленовым вкладышем, спальник с вкладышем, коврик («пенка»), сидушка, КЛМПН (кружка, ложка, миска, нож), штормовка и штаны, пакеты для упаковки вещей.\n## Список вещей\n- Непромокаемая длинная куртка с капюшоном, тёплый свитер с горлом, длинные штаны (лучше хлопок), головной убор.\n- Крепкие разношенные ботинки и лёгкая обувь (кроссовки), шлёпанцы.\n- Шорты, футболки, нижнее бельё на каждый день, носки хлопковые (пара на день) и шерстяные.\n- Одежда для сна, купальник.\n- Гигиена: мыло, паста, щётка, полотенца, шампунь, туалетная бумага, платки.\n- Личный ремнабор, личная аптечка, фонарик, компас.\n- Блокнот с ручкой, деньги и документы, часы, фотоаппарат, батарейки, гитара.\n## Упаковка и хранение продуктов\nПравильная упаковка защищает от порчи и отравления и упрощает учёт. Продукты перебираем и раскладываем по мешочкам по 1-2 кг, подписываем. Внешний мешок из ткани, внутри полиэтиленовый чуть больше (чтобы не рвался).\n- Хлеб берут на первые 3-5 дней. Магазинные сухари просушить, самодельные упаковать пачками на один раз.\n- Консервы только в жестяных банках, осмотреть на вздутие (бомбаж): такие опасны, особенно мясные и рыбные.\n- Полукопчёную колбасу можно смазать жиром от плесени. Варёную колбасу не берём.\n- Сливочное масло съедаем в первый день. Растительное везём в небольшой пластиковой бутылке.\n- Сухое молоко пересыпаем из банок в полиэтиленовые мешочки.\n- Рис и пшено моем и сушим, гречку обжариваем и просеиваем. Из макарон лучше брать рожки (вермишель крошится).\n- Сахар в виде песка в водонепроницаемой упаковке.\n- Чай, кофе, какао в просушенных металлических коробках, без бумажной упаковки.\n- Соль быстро отсыревает даже в мешках. Добавка 8% крахмала помогает. Соду в водонепроницаемом мешочке, молотый перец в металлической коробочке, заклеить лентой."},{"t":"Нашивка «Летописец»","cat":"Нашивки","b":"Летописец - историк отряда. Он честно и подробно рассказывает о каждом дне смены. Назначает его отряд, но нашивку получает не каждый.\n## Что нужно для нашивки\n- Зачтённая отрядная летопись за всю смену (за 21 день в летней смене или за точное число дней, включая приезд и отъезд).\n- Опубликованный (или принятый редактором) материал в лагерную газету.\n## Во время смены\n- Вести летопись каждый день и ежедневно сдавать на проверку в Совет дружины.\n- Не перечислять режим (подъём, зарядка, линейка). Писать о событиях, деталях, впечатлениях, спорах - всём, чем день отличается от предыдущего. Писать разборчиво, грамотно и аккуратно, с иллюстрациями.\n- Выбрать главную новость отряда, написать заметку и сдать редактору газеты. Новость должна быть свежей: если событие было вчера, писать нужно не позже сегодня. Нужны интересные подробности, мнения участников, ваши размышления, необычный заголовок и подпись.\n## Перед походом\nЗапастись тетрадью, твёрдой подставкой, ручками, карандашами, фломастерами.\n## В походе\nЗаписывать необычное, а не только «пришли» и «ушли»: трудности пути, темы костров, вкус каши, звериные следы. Продумать материал о походе для газеты.\n## После похода\nСдать остатки канцелярии завхозу и не позднее следующего дня после возвращения сдать редактору материал о походе.\n## Как писать интересно\n- Не пишите «встали, сходили в лес, поиграли». Пишите, как отряд отреагировал на победу, какие были сложности при знакомстве, чему научились в кружке, за что наградили соседа. Передавайте настроение, мысли и чувства отряда, своими словами.\n- Иллюстрации (рисунки, карикатуры, схемы, вырезки, фото) дополняют текст. Сбор черники можно показать графиком по вёдрам.\n- Читайте записи дня на вечерней свечке и слушайте советы ребят и вожатого. На Совете дружины летопись оценивают каждый день, принимайте критику. В конце смены летопись сдают начальнику дружины, страницы можно сфотографировать на память.\n## Как попасть в газету\n- Пишите про самое интересное, быстро (новость трёхдневной давности устарела).\n- Размышляйте: почему это произошло, хорошо ли это, что думают ребята и взрослые.\n- Откажитесь от штампов вроде «усталые, но довольные».\n- Берите один факт и описывайте ярко. Не пишите «докладом» и «заумными» словами.\n- Придумайте заголовок, который привлечёт внимание."},{"t":"Возрастные особенности детей","cat":"Для вожатого","b":"## 9-11 лет\nДети уравновешенные, жизнерадостные, стремятся к активной деятельности, легко идут на контакт со сверстниками и взрослыми. Восприимчивы к ритуалам, любят совместные дела. Нужны успех и поощрение: при неудачах быстро теряют интерес. Лучше всего работают ролевые игры и соревнования.\n## 12-15 лет\nПодросток всё внимание обращает на себя. Он чувствителен и застенчив, преувеличивает малейшие недостатки внешности, обижается на замечания, а на доброе слово может ответить показной грубостью, но долго помнит, что его похвалили. Движения угловатые, настроение скачет: то хочется быть взрослым, то нужна защита. Формируется собственная точка зрения, важно место в коллективе и мнение окружающих, появляются неформальные группы. Первые влюблённости часто направлены на героев книг и кино, это нормально."},{"t":"Тренинг «Планета чувств» для подростков 13+","cat":"Тренинги и работа с эмоциями","b":"Серия из упражнений для Сов. Идёт спокойно, в тёмной или полутёмной комнате, без давления: никого не заставляем рассказывать и не комментируем рисунки вслух.\nШаг 1 (15 мин). «Материки чувств». На ватмане четыре «материка»: ощущения (тепло, холод), драйвы (голод, желание спать, двигаться), эмоции (радость, страх, гнев), чувства (любовь, ревность: сложные и переплетённые с мыслями). Ребята называют слова, вожатый клеит стикеры. Разбираем тонкости: гнев - эмоция, агрессия - действие; радость - активная, удовольствие - спокойное; грусть тихая, тоска и горе с болью; вина - нарушение своих правил, стыд - страх, что подумают другие. Проводить быстро, иначе скучно.\nШаг 2 (30 мин). «Радуга чувств». Каждой эмоции из списка дают свой цвет. На листе рисуют две необычные радуги: чувства последних дней и чувства «обычно». Фоновая музыка нейтральная, без слов. Не озвучивайте выводы по рисунку. Если видите много тёмных тонов, поговорите наедине после занятия.\nШаг 3. Деление на группы по преобладающей эмоции.\nОбида: «Дерево чувств» (30 мин). Из пластилина: ствол - я, ветви - события, плоды - эмоции (у каждой свой цвет и форма), корни - причины и мои мысли. Потом такое же дерево для хорошего события. Пластилин лучше бумаги: можно мять и переделывать.\nБоль: «Мелодия моего тела» (60 мин). Сидя с закрытыми глазами «слушают» по очереди части тела (темя, глаза, плечи, руки, грудь, живот, ноги), примерно по 20 секунд. Голос спокойный и обычный. Молчащие места не интерпретируем. Затем под нейтральную музыку «танец эмоций» 15-20 минут, свет приглушается, можно закрыть глаза. Музыку убирают постепенно.\nГнев: «Выколачиваю гнев» (около 15 мин). Скалкой или палкой бьют по кипе газет, матрасу, старой груше. Между участниками большое расстояние, после упражнения перерыв и спокойное дело. Нельзя бить людей и твёрдые предметы.\nСнятие напряжения: «Золотистый поток» (20 мин). Сидя, глаза закрыты, ведущий мягко описывает золотистый свет, стекающий по лицу, плечам, рукам, груди, спине, ногам и уносящий всё мутное. Каждой зоне по 10 секунд. Полезно, когда сильно разозлился: сначала успокойся, потом решай.\nПозитив: «Место личной силы» (20 мин). Визуализация: облако-кресло везёт над зелёным островом, ты выходишь на мягкую траву и ощущаешь силу земли, потом возвращаешься.\n«Голос поколений» (60 мин, для опытных ведущих). В демонстрации с добровольцем шаг за шагом играется роль матери, отца, дедушки, бабушки и произносятся их типичные фразы. Потом человек говорит «Я - это я» и обсуждает, какие установки получил. В паре то же. Фразы, которые не нравятся, можно переписать. Может вызвать слёзы, это нормально. Проводить только если есть доверие в отряде и рядом психолог или опытный старший.\nБезопасность: упражнения про семью, боль и гнев вызывают сильные чувства. Новичку лучше проводить их вместе с педагогом-психологом. Если ребёнок расплакался или замкнулся, остаться рядом, не требовать объяснений, после занятия поговорить один на один и сообщить психологу."},{"t":"Мини-тренинг для Жаворонков 6-8 лет: «Мы такие разные, но вместе»","cat":"Тренинги и работа с эмоциями","b":"Цель: помочь детям замечать настроение другого, не чувствовать себя одинокими, пережить общие эмоции. Три занятия по 30-40 минут, каждое строится одинаково: приветствие, сказка, игра, общий финал.\nФинальный ритуал «Молодцы!»: дети ставят кулачки столбиком друг на друга и громко говорят «Молодцы!», убирают кулачки.\nЗанятие 1 «Кактус». Приветствие: вожатый присаживается перед каждым ребёнком, соединяет свои ладони с его ладошками и говорит «Здравствуй, (имя)». Сказка (рассказывайте своими словами): на клумбе вырос колючий кактус, цветы его сторонились, он обижался. Когда пришёл хулиган топтать цветы, кактус защитил их ценой своих иголок, цветы поблагодарили его, и на месте иголок выросли цветы. Затем лёгкая медитация: дети встают, закрывают глаза, представляют клумбу, цветы тянутся к солнцу и нежно касаются друг друга. Основная мысль: непохожий не значит плохой.\nЗанятие 2 «Енот». Приветствие «Назови себя»: каждый называет имя так, как хочет, чтобы его называли сегодня. Сказка про Крошку Енота и Того, кто сидит в пруду (можно показать на песке маленькими фигурками): енот идёт за раками, встречает зверей, которые пугают его, у пруда видит в воде «Того, кто сидит» - тот строит такие же рожи, поднимает камень и палку. Мама говорит просто улыбнуться, и отражение улыбается в ответ. Вывод: с миром надо говорить так, как хочешь, чтобы с тобой говорили. Игра «Зеркало»: пары, у каждого тазик с песком (кинетическим), первый лепит «мордочку» страха, злости, радости, не говоря какой, второй угадывает, потом меняются.\nЗанятие 3 «Волшебники». Приветствие: дети - волшебники и отгадывают желания соседа слева. Сказка про злого колдуна Кряга: он ищет ученика и выбирает мальчика-драчуна, но мальчик отказывается драться и находит слова: «Мне неприятно, когда ты обзываешься», «Дай, пожалуйста, игрушку, я верну» или «давай поменяемся». Колдун остаётся без ученика. Игра «Злой колдун»: колдун хочет «украсть» ребёнка из отряда, чтобы его спасти, дети называют всё хорошее, что в нём есть. Следите, чтобы каждый получил тёплые слова.\nСовет: после каждого занятия спросите, что запомнилось и что хочется повторить. Не заставляйте отвечать."},{"t":"Легенды и притчи для «огонька» и ночных игр","cat":"Притчи и истории","b":"Эти сюжеты можно рассказывать своими словами у костра и на «огоньках». После истории задайте один вопрос: «О чём эта сказка?» или «Что бы сделал ты?»\nОгонь (предание о двух братьях). Бедный младший брат просит у богатого старшего земли «со шкуру быка», нарезает шкуру на тонкие ремни и получает большой участок. Потом хитростью забирает огонь, объезжая землю и ударяя огнём о камни, деревья и землю: так огонь оказался в них. Мысль: ум и находчивость сильнее богатства.\nХозяйка огня (сибирское предание). Мать рассердилась на искру, которая обожгла ребёнка, и залила огонь водой, а потом огонь погас во всём стойбище. Хозяйка огня сказала, что зажечь его теперь может только живое сердце, и мать пожертвовала собой. Мысль: огонь нужно беречь и не срывать на нём гнев, злость разрушает то, что нас греет. Для младших рассказывать без трагического конца: например, «хозяйка огня простила, когда мать попросила прощения».\nОгонь драконов. Когда-то люди умели летать. Драконы выменяли у них крылья на огонь «на одну ночь» и улетели с крыльями насовсем. Мысль: за что-то получить, не потеряв важного, - трудно; не отдавай главное за удобство.\nМудрые высказывания для табличек на огоньках: «Об уме человека легче судить по его вопросам, чем по ответам»; «Ищи правильный путь, а не прямой»; «Заботясь о счастье других, мы находим своё собственное»; «Улыбка - это свет в окне твоего лица»; «Не бойся теней: они значат, что рядом свет»; «Настоящее богатство - то добро, которое ты делаешь»."},{"t":"Первая беседа с отрядом: правила смены","cat":"Первые дни и орг. период","b":"Эта беседа проводится в первый день. Говорите своими словами, коротко, спокойно, с примерами. Подстройте под правила своего лагеря.\nВ автобусе: едем без остановок, в туалет сходить заранее. В салон берём только ручную кладь, большой багаж в грузовой отсек. В проходе вещи не стоят. Куртки и кепки снять. Все пристёгнуты до конца поездки, по салону не ходим. Кого укачивает, садится вперёд, сообщает вожатому по цепочке. Не едим в автобусе, мусор убираем в карман. На выходе проверить полки и карманы кресел.\nГлавные правила: 1) Живём по одному режиму, подъём в 8:00, отбой в 22:00 (младшие) или 22:30 (старшие), игры и дела обязательны для всех. 2) Лагерь - территория спорта и чистого воздуха: алкоголь, курение и любые вещества запрещены, и вожатые тоже живут по этому правилу. 3) Уважаем друг друга: не обижаем, не оскорбляем, не ругаемся. 4) Берегём своё и чужое имущество, чужое без спроса не берём. Выходить за территорию без вожатого нельзя. Нарушители правил отправляются домой.\nОбращение: в лагере «ты» к ребятам, вожатым, инструкторам, начальникам и директору, но «вы» врачу, медсёстрам, уборщицам, охране, работникам столовой и хоздвора.\nПрирода и здоровье: берегите ветки и кусты, не ловим кошек, не едим ягоды и фрукты с территории, одеваемся по погоде (головной убор в жару, длинные рукава от комаров).\nРаспорядок дня: 8:00 подъём, зарядка, гигиена; 9:00 завтрак; 9:30 линейка и добрые дела; 10:30-13:30 отрядные дела, мастерские, тренинги; 13:30 обед; 14:00-16:00 тихий час; 16:00 полдник; 16:15 самоуправление и поручения; 17:00-19:00 подготовка к вечернему делу; 19:00 ужин; 19:30-21:00 вечернее мероприятие; 21:00 построение, второй ужин, свеча, гигиена; 22:00 или 22:30 отбой.\nВ корпусе: в первый день разложить вещи по шкафам и тумбочкам, чемоданы унести в чемоданную (проверьте, не осталось ли в них важного). Следим за порядком, по очереди дежурим. Воду из бутылей пить можно и нужно, чайники и кипятильники из дома не нужны. Душ раз в два дня, личная гигиена утром и вечером. Одежду стираем сами в постирочной в назначенный день, мокрое сушим, не складываем в шкаф.\nЭлектробезопасность: уходя, выключаем свет и приборы из розеток; не тянем вилку за провод; не трогаем приборы мокрыми руками; не подходим к оборванным проводам и деревьям, на которых они висят; странную розетку не трогаем, а говорим вожатому.\nПитание: сладости и снеки сдаём вожатому в «Сладкий шкаф» (подписанные пакеты), их выдают на тихий час и после приёмов пищи. Скоропортящееся съесть в первый вечер.\nЗдоровье: если плохо - сразу сказать вожатому и идти в медпункт. Таблетки из дома не принимаем без врача.\nВыход за территорию: одеваться по погоде, головной убор, длинные рукава. С вожатым аптечка и вода. Ценности оставить в лагере. Идём парами колонной, впереди вожатый-ведущий, сзади замыкающий, никто не обгоняет и не отстаёт. Идём по левой стороне, у обочины. Если машина, замыкающий кричит «Машина!», все прижимаются. Дорогу переходим вместе по команде. Колонну не растягиваем. Отойти можно только предупредив. В магазины не заходим, еду не покупаем.\nСамое главное правило: что болит, потерялось, тревожит или не нравится - скажите мне. Вопросы - мне. Вместе решим любые трудности."},{"t":"Личное снаряжение для похода с ночёвками (3 дня)","cat":"Походное снаряжение","b":"Рюкзак с полиэтиленовым вкладышем; спальный мешок; коврик; пакеты для упаковки вещей; кружка, ложка, миска, нож (КЛМН); куртка-ветровка или плащ; длинные штаны; свитер с горлом; рубашка с длинным рукавом; головной убор (кепка, панама, бандана); комплект белья; купальник или плавки; разношенные походные ботинки (не новые); лёгкая быстросохнущая обувь; шорты; 2 футболки; шерстяные носки 1 пара и обычные 2 пары; гигиенические принадлежности (щётка, паста, шампунь, расчёска, полотенце, мыло, туалетная бумага); личная аптечка; тетрадь и ручка; фонарик и компас; средство от комаров; нитка с иголкой."},{"t":"Отрядное (общее) снаряжение","cat":"Прочее","b":"палатки по числу участников и хозяйственная палатка, тенты или накидки на палатки, топор, пила, костровой набор (тросик, крючья), три котла, тент для кухни, ремнабор, штормовки по числу участников, спички и свечи в непромокаемой упаковке, поварёшка, скатерть (клеёнка), столовые ножи в ножнах, аптечка, брезентовые рукавицы, расходная верёвка, губки и средство для мытья посуды.\nКарточка учёта снаряжения (таблица по отряду): № / ФИО / кружка / ложка / миска / спальник / пенка / сидушка (хаба) / штормовка / штаны / общественное. Отмечайте при выдаче и при возврате."},{"t":"Таблица оценки патрулей в походе","cat":"Походное снаряжение","b":"Каждый день патрули получают оценки по пунктам: режимные моменты; обращение со снаряжением; охрана природы и чистота стоянки; организация и участие в мероприятиях; приготовление пищи; постановка бивака; ведение кострового хозяйства; работа дежурного по стоянке; патрульные поручения. Итоговая оценка за день. В таблице пишут, какое поручение сегодня у каждого патруля."},{"t":"Мои границы (анкета для вожатого)","cat":"Для вожатого","b":"Лист для самоанализа на первой неделе. Разделы: «Мои границы» (меня можно... меня нельзя..., мне нравится... не нравится...); «Мой портрет» (что я умею хорошо, что во мне любят другие, что я люблю делать, чего не люблю); «Чего я боюсь на новом месте» (ничего не пойму; дети будут смеяться; будет ругать начальство; свой вариант); «Как мне быть комфортно» (улыбаться, звать старшего или другого вожатого на помощь, узнать, где ближайший магазин, свой вариант); «В стрессе делай полезное и приятное» (полезное: выспаться, ОФП, зарядка; приятное: заполни сам); «Каким вожатым я хочу быть»; «Что я хочу сделать в ближайшее время»."}],"songs":[{"t":"Будь готов! (Гимн сибирских скаутов)","cat":"Песни","b":"","num":1},{"t":"Семья","cat":"Песни","b":"", function blocks(b){
 const out=[];let ul=null;
 for(const raw of b.split('\n')){const l=raw.trimEnd();
  if(!l.trim()){ul=null;continue}
  if(l.startsWith('## ')){ul=null;out.push(`<h3>${esc(l.slice(3))}</h3>`)}
  else if(l.startsWith('- ')){if(!ul){ul=[];out.push(ul)}ul.push(l.slice(2))}
  else{ul=null;out.push(`<p>${esc(l)}</p>`)}}
 return out.map(x=>Array.isArray(x)?'<ul>'+x.map(i=>`<li>${esc(i)}</li>`).join('')+'</ul>':x).join('')}
function gameCard(g){
 const dots=g.a.map(a=>`<span class="dot" style="background:${BANDS[a-1].c}" title="${BANDS[a-1].name}"></span>`).join('');

 const on=fav.has(g.id);
 return `<details class="card"><summary><div class="ttl"><b>${esc(g.t)}</b><div class="meta"><span class="ages">${dots}</span><span>${meta}</span></div></div><button class="star" data-fav="${g.id}" aria-pressed="${on}" aria-label="В избранное">${on?'★':'☆'}</button></summary>

 <div class="filters">
  ${isTrack?'':`<div class="row"><span class="lbl">Тип</span>${chips(types,'type',st.type)}</div>`}

 </div>
 <div class="tools"><span class="count">Найдено: ${res.length}</span><div class="row"><button class="btn" data-reset="1">Сбросить</button><button class="btn pri" data-rand="1">Случайная игра</button></div></div><div id="list">`;
 if(!res.length)h+='<p class="empty">Ничего не найдено. Снимите часть фильтров или измените поиск.</p>';

 return h+'</div>'}

 const q=st.q.trim().toLowerCase();
 const s=DATA.songs.filter(x=>!q||x.t.toLowerCase().includes(q));
 return `<h2 class="sec">Песни</h2><p class="lead">Названия из лагерной картотеки. Номер совпадает с номером в песеннике.</p><p class="note">Песенник с текстами и аккордами: <a href="pesennik.pdf" target="_blank" rel="noopener">открыть «Картотеку песен» (PDF)</a>.</p>`+
 (s.length?`<ul class="songs">${s.map(x=>`<li><span class="no">${x.num}</span><span>${esc(x.t)}</span></li>`).join('')}</ul>`:'<p class="empty">Такой песни нет в картотеке.</p>')}
function globalSearch(){
 const q=st.q.trim().toLowerCase();
 const gs=DATA.games.filter(g=>match(g,q)).slice(0,30);
 const ds=DATA.docs.filter(d=>(d.t+' '+d.b).toLowerCase().includes(q)).slice(0,20);
 const ss=DATA.songs.filter(s=>s.t.toLowerCase().includes(q)).slice(0,20);
 return `<h2 class="sec">Поиск: ${esc(st.q)}</h2><div class="tools"><span class="count">Игры: ${gs.length}, документы: ${ds.length}, песни: ${ss.length}</span></div>
 ${gs.length?`<section class="group"><h3>Игры</h3>${gs.map(gameCard).join('')}</section>`:''}
 ${ds.length?`<section class="group"><h3>Справка и нашивки</h3><div class="grid">${ds.map(d=>`<button class="tile" data-doc="${DATA.docs.indexOf(d)}"><b>${esc(d.t)}</b><span>${esc(d.cat)}</span></button>`).join('')}</div></section>`:''}
 ${ss.length?`<section class="group"><h3>Песни</h3><ul class="songs">${ss.map(x=>`<li><span class="no">${x.num}</span><span>${esc(x.t)}</span></li>`).join('')}</ul></section>`:''}
 ${!gs.length&&!ds.length&&!ss.length?'<p class="empty">Ничего не найдено.</p>':''}`}
function render(){
 renderTabs();const a=$('app');let h;
 if(st.doc!==null)h=docView(DATA.docs[st.doc]);
 else if(st.q.trim().length>1&&st.tab!=='games'&&st.tab!=='track'&&st.tab!=='ref'&&st.tab!=='badges'&&st.tab!=='songs')h=globalSearch();
 else if(st.tab==='start')h=startView();
 else if(st.tab==='games')h=gamesView(GAMES,'Игры по возрастам','Выберите возраст отряда. Внутри игры сгруппированы по типу, а фильтр «Зачем» подскажет, для чего игра нужна.');
 else if(st.tab==='track')h=gamesView(TRACK,'Следопытство и ориентирование','Игры на выслеживание, ориентирование и лесные навыки. Проводите только на безопасной территории и с границами.',true);
 else if(st.tab==='ref')h=refView();
 else if(st.tab==='badges')h=badgesView();
 else h=songsView();
 a.innerHTML=h}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-tab],[data-band],[data-type],[data-purp],[data-noprops],[data-favonly],[data-reset],[data-rand],[data-fav],[data-doc],[data-back],[data-go],[data-band-go],[data-quick]');
 if(!t)return;
 if(t.dataset.fav){e.preventDefault();e.stopPropagation();const id=t.dataset.fav;fav.has(id)?fav.delete(id):fav.add(id);saveFav();t.setAttribute('aria-pressed',fav.has(id));t.textContent=fav.has(id)?'★':'☆';return}
 if(t.dataset.tab){setTab(t.dataset.tab);return}
 if(t.dataset.go){setTab(t.dataset.go);return}
 if(t.dataset.bandGo){st.band=+t.dataset.bandGo;setTab('games');return}
 if(t.dataset.quick){st.purp=t.dataset.quick;st.type='';st.band=0;setTab('games');return}
 if(t.dataset.band){const b=+t.dataset.band;st.band=st.band===b?0:b}
 else if(t.dataset.type!==undefined&&t.hasAttribute('data-type')){st.type=st.type===t.dataset.type?'':t.dataset.type}
 else if(t.dataset.purp!==undefined&&t.hasAttribute('data-purp')){st.purp=st.purp===t.dataset.purp?'':t.dataset.purp}
 else if(t.dataset.noprops){st.noprops=!st.noprops}
 else if(t.dataset.favonly){st.favOnly=!st.favOnly}
 else if(t.dataset.reset){Object.assign(st,{band:0,type:'',purp:'',noprops:false,favOnly:false});$('q').value='';st.q=''}
 else if(t.dataset.rand){render();const c=[...document.querySelectorAll('#list details.card')];if(c.length){c.forEach(x=>x.open=false);const p=c[Math.floor(Math.random()*c.length)];p.open=true;p.scrollIntoView({block:'center'})}return}
 else if(t.dataset.doc!==undefined&&t.hasAttribute('data-doc')){st.doc=+t.dataset.doc;render();window.scrollTo(0,0);return}
 else if(t.dataset.back){st.doc=null}
 render()});
let timer;$('q').addEventListener('input',e=>{clearTimeout(timer);timer=setTimeout(()=>{st.q=e.target.value;st.doc=null;render()},150)});
window.addEventListener('hashchange',()=>{route();render()});
route();render();
</script>

</body></html>
