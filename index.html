лдуна Кряга: он ищет ученика и выбирает мальчика-драчуна, но мальчик отказывается драться и находит слова: «Мне неприятно, когда ты обзываешься», «Дай, пожалуйста, игрушку, я верну» или «давай поменяемся». Колдун остаётся без ученика. Игра «Злой колдун»: колдун хочет «украсть» ребёнка из отряда, чтобы его спасти, дети называют всё хорошее, что в нём есть. Следите, чтобы каждый получил тёплые слова.\nСовет: после каждого занятия спросите, что запомнилось и что хочется повторить. Не заставляйте отвечать."},{"t":"Легенды и притчи для «огонька» и ночных игр","cat":"Разное","b":"cat: Разное\nЭти сюжеты можно рассказывать своими словами у костра и на «огоньках». После истории задайте один вопрос: «О чём эта сказка?» или «Что бы сделал ты?»\nОгонь (предание о двух братьях). Бедный младший брат просит у богатого старшего земли «со шкуру быка», нарезает шкуру на тонкие ремни и получает большой участок. Потом хитростью забирает огонь, объезжая землю и ударяя огнём о камни, деревья и землю: так огонь оказался в них. Мысль: ум и находчивость сильнее богатства.\nХозяйка огня (сибирское предание). Мать рассердилась на искру, которая обожгла ребёнка, и залила огонь водой, а потом огонь погас во всём стойбище. Хозяйка огня сказала, что зажечь его теперь может только живое сердце, и мать пожертвовала собой. Мысль: огонь нужно беречь и не срывать на нём гнев, злость разрушает то, что нас греет. Для младших рассказывать без трагического конца: например, «хозяйка огня простила, когда мать попросила прощения».\nОгонь драконов. Когда-то люди умели летать. Драконы выменяли у них крылья на огонь «на одну ночь» и улетели с крыльями насовсем. Мысль: за что-то получить, не потеряв важного, - трудно; не отдавай главное за удобство.\nМудрые высказывания для табличек на огоньках: «Об уме человека легче судить по его вопросам, чем по ответам»; «Ищи правильный путь, а не прямой»; «Заботясь о счастье других, мы находим своё собственное»; «Улыбка - это свет в окне твоего лица»; «Не бойся теней: они значат, что рядом свет»; «Настоящее богатство - то добро, которое ты делаешь»."},{"t":"Личное снаряжение для похода с ночёвками (3 дня)","cat":"Разное","b":"Рюкзак с полиэтиленовым вкладышем; спальный мешок; коврик; пакеты для упаковки вещей; кружка, ложка, миска, нож (КЛМН); куртка-ветровка или плащ; длинные штаны; свитер с горлом; рубашка с длинным рукавом; головной убор (кепка, панама, бандана); комплект белья; купальник или плавки; разношенные походные ботинки (не новые); лёгкая быстросохнущая обувь; шорты; 2 футболки; шерстяные носки 1 пара и обычные 2 пары; гигиенические принадлежности (щётка, паста, шампунь, расчёска, полотенце, мыло, туалетная бумага); личная аптечка; тетрадь и ручка; фонарик и компас; средство от комаров; нитка с иголкой."},{"t":"Отрядное (общее) снаряжение","cat":"Разное","b":"палатки по числу участников и хозяйственная палатка, тенты или накидки на палатки, топор, пила, костровой набор (тросик, крючья), три котла, тент для кухни, ремнабор, штормовки по числу участников, спички и свечи в непромокаемой упаковке, поварёшка, скатерть (клеёнка), столовые ножи в ножнах, аптечка, брезентовые рукавицы, расходная верёвка, губки и средство для мытья посуды.\nКарточка учёта снаряжения (таблица по отряду): № / ФИО / кружка / ложка / миска / спальник / пенка / сидушка (хаба) / штормовка / штаны / общественное. Отмечайте при выдаче и при возврате."},{"t":"Таблица оценки патрулей в походе","cat":"Разное","b":"Каждый день патрули получают оценки по пунктам: режимные моменты; обращение со снаряжением; охрана природы и чистота стоянки; организация и участие в мероприятиях; приготовление пищи; постановка бивака; ведение кострового хозяйства; работа дежурного по стоянке; патрульные поручения. Итоговая оценка за день. В таблице пишут, какое поручение сегодня у каждого патруля."},{"t":"Мои границы (анкета для вожатого)","cat":"Разное","b":"Лист для самоанализа на первой неделе. Разделы: «Мои границы» (меня можно... меня нельзя..., мне нравится... не нравится...); «Мой портрет» (что я умею хорошо, что во мне любят другие, что я люблю делать, чего не люблю); «Чего я боюсь на новом месте» (ничего не пойму; дети будут смеяться; будет ругать начальство; свой вариант); «Как мне быть комфортно» (улыбаться, звать старшего или другого вожатого на помощь, узнать, где ближайший магазин, свой вариант); «В стрессе делай полезное и приятное» (полезное: выспаться, ОФП, зарядка; приятное: заполни сам); «Каким вожатым я хочу быть»; «Что я хочу сделать в ближайшее время»."},{"t":"Построение: порядок, команды, рапорт","cat":"Каждый день","b":"## План\nГлавная историческая задача построения - перекличка: все ли на месте, никто ли не потерян, всё ли в порядке. Информация только вторая.\n- Утреннее: сдача рапортов, подъём флага, лагерный девиз, информация, комментарии, законы и заповеди, салют.\n- Вечернее: сдача рапортов, информация, отрядные поручения, комментарии, спуск флага, лагерный девиз, салют.\n## Команды\n- «Становись» - начало построения. Кто пришёл после, опоздал.\n- «Равняйсь» - руки по швам, ноги прямые, голова повёрнута вправо (у направляющего, того, кто стоит правее всех, голова прямо).\n- «Смирно» - руки по швам, голова прямо.\n- «Вольно» - можно согнуть одну ногу, руки остаются по швам.\n- «Шаг из строя» - человек делает шаг вперёд, чтобы что-то сказать или чтобы его видели.\n- «Шаг за строй» - для нарушителей дисциплины.\n- «Выйти из строя» и «встать в строй» - выйти и вернуться.\n- «К мачте шагом марш» - выйти к мачте.\n- «Отставить» - прекратить действие.\n## Правила\n- К ведущему обращаются со словом «разрешите», ответ «разрешаю» или «не разрешаю».\n- Во время построения стоят спокойно, руки опущены (не в карманах и не за спиной), не разговаривают и не вертятся.\n- Через строй напролом не ходят. К мачте идут по дорожкам, уходят за спинами других.\n- Опоздавший говорит «Разрешите встать в строй». Ведущий спрашивает причину. Уважительная: «Встать в строй». Неуважительная: «Не разрешаю, стоять за строем» до разрешения ведущего. У вожатых причина всегда веская, её не спрашивают.\n- Кто хочет что-то сказать, поднимает руку.\n## Этапы\n- Рапорты. Дежком командует: «Дружина, становись, равняйсь, смирно. Командирам отрядов приготовиться и сдать рапорты. Вольно». Командир делает шаг из строя, отряд хором называет название и девиз. Командир докладывает: «Отряд ... прибыл на построение в полном составе. Рапорт сдавал (имя)». Если кого-то нет: «...не в полном составе, отсутствует ... человек по причине ...». Принято: «Рапорт принят, встать в строй, вольно». Неверный рапорт: «Отставить, сдать рапорт заново».\n- Подъём флага. Вызывают отличившихся из отрядов (имена сообщают ведущему заранее). «На подъём государственного флага Российской Федерации вызываются... Шаг из строя. К мачте шагом марш». Ведущий: «Доложить о готовности флага к подъёму». Ответ: «Флаг к подъёму готов». Затем: «Дружина, равняйсь, смирно, равнение на флаг. Флагу салют (салют отдают только следопыты). Флаг поднять». Поднимавшим: «Встать в строй, вольно».\n- Информация. Утром расписание дня и оценки санитаров комнат, вечером итоги дня и победители. Затем: «Есть вопросы, пожелания, предложения?». Дискуссий на построении не устраивают. Здесь поздравляют именинников и тех, кто сдал испытания.\n- Законы и заповеди следопытов. Читает заранее предупреждённый ребёнок. Если нет галстука, произносят девиз.\n- Конец. «Дружина, равняйсь, смирно, вольно, разойдись». На слове «разойдись» разворот на 360 градусов с криком «Ура», затем все уходят.\n- Лагерный девиз. По команде «На общелагерный девиз становись» встают в большой незамкнутый круг: правая рука на плече соседа справа, левая на талии соседа слева. Повторяют за ведущим: утром «сегодня я стану лучше, чем был(а) вчера», вечером «завтра я стану лучше, чем был(а) сегодня». После этого «вольно».\n- Отрядные поручения на вечернем построении. Команда: «Командирам отрядов приготовиться и доложить о выполнении поручений на сегодня». Командиры по очереди делают шаг из строя и рассказывают, что делали. Ведущий может уточнять детали."},{"t":"Чек-лист первого дня для вожатого","cat":"Первые дни","b":"Список взят из рабочего чек-листа лагеря. Сокращение «НД» в заголовке оригинала расшифровано мной как «начальник дружины». Если это иначе, подправьте.\n- Проверить рассадку за столами.\n- Проконтролировать приёмы пищи: за 10 минут до начала подвести отряд к столовой.\n- Проверить построение у каждого отряда.\n- Собрать список аллергий и передать в общий чат.\n- Собрать список детей, которые в лагере впервые, и передать в общий чат.\n- Провести (или помочь провести) вечернее мероприятие и «кругосветку».\n- Сфотографировать все поломки и отправить ответственному.\n- Собрать даты выходных и передать в общий чат.\n- Подготовить реквизит на следующий день."},{"t":"Обязанности вожатого и что он делает в течение дня","cat":"Каждый день","b":"Пример должностной инструкции вожатого детского лагеря (редакция 2015 года), переписана по смыслу. Ваши правила лагеря могут отличаться, ориентируйтесь на них.\n## Кто такой вожатый\n- Педагогический работник лагеря, подчиняется начальнику дружины, входит в педсовет.\n- Должен знать права ребёнка, основы педагогики и психологии, возрастную физиологию и гигиену, правила охраны жизни и здоровья детей, санитарные нормы, основы доврачебной помощи, технику безопасности и противопожарные правила.\n- Строит работу по программе смены и календарному плану, организует досуг, самодеятельность, спорт, труд и учёбу отряда на основе инициативы детей, руководит кружком или клубом.\n- Постоянно находится при отряде, каждый день присутствует на планёрке, отвечает за жизнь и здоровье детей.\n## Подъём и зарядка\n- К 7:55 вожатый на месте проживания отряда, в форме, с планом работы на день.\n- На сигнал «Подъём» заходит в каждую комнату, следит за подъёмом, спрашивает о самочувствии, напоминает про одежду по погоде.\n- Перед выходом на зарядку пересчитывает детей, проверяет одежду, обувь, головные уборы. Только после этого командует «на выход».\n- На лестницах и склонах идёт впереди отряда и выбирает темп по возрасту. Замыкает колонну командир или самый ответственный ребёнок.\n- На зарядке показывает упражнения сам или проводит игру. Освобождённые по здоровью дети находятся рядом в поле зрения.\n## Уборка и утренний туалет\n- Вожатый заходит в каждую комнату и проверяет заправку постелей, порядок в тумбочках, состояние мебели, стен, окон, замков, света.\n- Недостатки сразу исправляют, поломки записывает в дневник и передаёт начальнику дружины.\n- Периодически заходит в умывальные комнаты и проверяет, как дети чистят зубы и умываются, состояние пола и коврики.\n- Привлекает санитаров, патрульных и командира отряда.\n- Перед выходом в столовую рассказывает план дня, пересчитывает детей, проверяет одежду и нужные вещи, закрывает комнаты, выключает свет.\n## Тихий час\n- Все дети на своих кроватях, читают, рисуют, тихо беседуют с разрешения дежурного вожатого.\n- Один из вожатых постоянно с детьми. Даже если дети уснули, дежурному категорически запрещено уходить.\n- Рядом с «трудными» детьми вожатый находится постоянно.\n## Полдник и дела до ужина\nПеред выходом вожатый рассказывает, что будет дальше, проверяет одежду и вещи. Каждый ребёнок должен знать, чем занят до ужина.\n## Бассейн и купание\n- Купаются только допущенные медиками, остальным предлагают другое дело, и с ними остаётся вожатый.\n- Напомните правила в душе и на мокром полу, следите за «трудными» детьми.\n- После купания проверьте, высушены ли волосы (особенно у девочек), одеты ли дети, не забыты ли купальники и полотенца.\n## Кружки, тренинги, спорт\n- Вожатый сопровождает детей на занятие, присутствует и активно участвует.\n- Категорически нельзя отправлять детей на кружок или секцию без сопровождения взрослого, возвращаются они тоже со взрослым.\n- Знайте, кто из детей освобождён от физических занятий, и предложите им другое дело.\n- Проверяйте форму и обувь, следите за техникой безопасности, не допускайте грубости участников и болельщиков.\n## Экскурсии и выезды\nПодготовка:\n- Инструктаж детей: цель, правила в автобусе, форма одежды, что делать, если отстали.\n- Одноразовые стаканчики, питьевая вода, гигиенические пакеты.\n- Накануне подать список выезжающих. Решить, где и с кем остаются те, кто не едет.\nВ день выезда:\n- Проверить одежду, порядок в комнатах, свести детей в туалет, записать выезд за пределы лагеря у дежурного охранника.\n- Рассадить детей, проверить воду, аптечку (если нет медика), пристёгнутые ремни.\n- В пути вожатые у передней и задней двери. Дети не отстёгиваются, не ходят по салону, не трогают замки выходов, не открывают окна.\n- Идти по безопасным маршрутам, безопасно переходить дороги, не допускать самовольного перемещения.\n- Питание сухим пайком. Продукты из магазинов, киосков и у частных торговцев нельзя, кроме разрешённых медиками (например, мороженое, сладости, негазированная вода).\n- По окончании: пересчитать детей, проверить вещи, при возвращении осмотреть автобус, доложить начальнику дружины, сдать аптечку, пакеты, стаканчики и остатки денег.\n## Вечернее мероприятие\n- Перед ужином напомните план вечера. Пересчитайте детей, проверьте одежду.\n- Приведите вовремя, рассадите, включите в дело, следите за присутствием. Никакого самостоятельного ухода.\n- Если ребёнку нужно уйти, сопровождайте лично, передав остальных другому вожатому.\n- Тем, кто не может участвовать, предложите альтернативное дело под присмотром.\n## Подготовка ко сну\n- Проверить гигиену: зубы, интимная гигиена, душ. В душе следите, чтобы не шалили, не расходовали воду и не портили сантехнику.\n- Вожатые младших отрядов помогают регулировать воду и мыться.\n- На «Отбой» дети в кроватях, свет выключен.\n- После засыпания передайте контроль ночному дежурному, сообщите число детей и тех, кому нужно особое внимание.\n## Права и ответственность\n- Вожатый вправе участвовать в обсуждении решений по воспитательной работе, получать нужную информацию, просить помощи у руководства.\n- Он отвечает за жизнь и здоровье детей отряда, за выполнение обязанностей и за правонарушения в соответствии с законодательством."},{"t":"Игра: как выбрать и провести","cat":"Работа с отрядом","b":"Игра - один из видов деятельности человека. Игру можно рассматривать как непреднамеренное самообучение. Для ребёнка игра предоставляет возможность выбора и принятия ответственности, что является для него самым значимым в таком виде активности.\n## Как подобрать игру: вопросы себе\n- Цель игры: создание и развитие коллектива; выявление и развитие талантов и способностей (интеллектуально-познавательные игры, спортивные игры, упражнения на снятие зажимов); занять паузу.\n- Возраст: младший, средний младший, средний старший, подростковый. Многие игры, интересные детям старшего возраста, малышам покажутся очень сложными, и наоборот: игры, в которые с удовольствием играют малыши, для старших будут неинтересны.\n- Условия: помещение или улица, территория передвижения, возможность сидеть в кругу, актовый зал, спортивная площадка.\n- Стадия формирования коллектива: знакомство, построение структуры, изменение или подтверждение структуры, распад. Неразумно играть в середине смены в игры на знакомство, а при первой встрече проводить элементы верёвочного курса.\n- Количество участников: до 10, до 20, до 30, до 40 человек и больше.\n- Реквизит: бумага, ручка, скрепки, маркеры; мячи, обручи, скакалки; песок, водоросли, галька.\n- Свободное время: 5 минут, 10 минут, 30 минут, 2 часа.\n- Нужный итог: победители, номинации, одобрение, глубокий анализ.\nПод любой из заданных параметров можно подобрать игру. Есть игры, которые требуют подготовки, поэтому при планировании работы с напарником заранее подбирайте игры на следующий день и закладывайте время на подготовку. Умение правильно планировать смену, день, игру станет важным помощником не только в вожатской работе, но и в жизни.\n## Основные функции игры в жизни человека\n- Упражнение. В игре осуществляется ориентировочно-исследовательская деятельность, позволяющая определить и закрепить оптимальные формы поведения в различных жизненных ситуациях. Игра служит упражнением во всех видах деятельности: физической, художественной, интеллектуальной, социальной, учебной и т.д.\n- Изменение отношений с действительностью. В игре моделируются условия, отличные от реальных. В действительности человек несёт реальную ответственность за результаты. Для ребёнка игра даёт возможность выбора и принятия ответственности. Дети с помощью игры моделируют условия реальности, а взрослые, наоборот, могут \"уйти\" от этих условий.\n- Способ управления эмоциональным состоянием. Эмоции отражают степень удовлетворения потребностей человека. Эмоциональные состояния могут быть созданы без непосредственного включения в деятельность. Игра - один из самых эффективных способов управления эмоциональным состоянием.\n## Значение игры для ребёнка\n- Самоанализ. В игре ребёнок постоянно сравнивает себя с другими, анализирует и на основе этого корректирует поведение. Это касается не только физических качеств, но и ума, смелости, коммуникабельности.\n- Эмоциональная близость. Игра даёт больше возможностей для близости через вовлечение в совместную значимую деятельность.\n- Развитие прогностических функций. Ребёнку сложно предположить результаты своих действий, потому что их итог отнесён на неопределённое будущее, а результат игры известен в \"ближайшем будущем\".\n- Социальный опыт. В игре ребёнок приобретает опыт улаживания конфликтов, справедливого распределения результатов совместной деятельности, распределения социальных ролей.\n- Развитие воображения. Особенно важно для дошкольников. Воображение позволяет приобретать опыт, устанавливая связи между предметами и явлениями.\n- Преодоление комплексов и страхов. В игре детям легче преодолеть собственные страхи, потому что моделируемая действительность управляется тем, кто её моделирует.\n- Ощущение полноценности собственного бытия. Одна из важнейших проблем подростка - отчуждённость от мира взрослых. Игра помогает детям создать свой особый мир, отличный от мира взрослых: со своими правилами, традициями, языком, секретами, тайнами и особыми отношениями. В эмоционально-психологическом смысле такой мир уравнивает взрослых и детей.\n## Значение игры для взрослого\nСреди значений игры для взрослого, помимо перечисленных, следует указать возможность манипулятивного воздействия на других людей. Игра часто становится инструментом в руках мошенников и авантюристов. Особо выделяется и игровой компонент в реальной деятельности взрослого: действия, которые только имитируют подлинные, ответственные отношения с окружающим миром.\n## Классификация игр\n- По месту и условиям проведения: подвижные на открытом воздухе, комнатные, компьютерные и т.д.\n- По целям проведения: обучающие, тестовые, тренинговые, развивающие, развлекательные, азартные и др.\n- Комплексные игры.\n- Сюжетно-ролевые игры: в основе сценарий, сюжет, по которому распределяются роли между участниками. В основе могут быть книжные сюжеты.\n- Тематические ролевые игры: сюжет развивается самостоятельно, задана только тема игры (например, игра \"в войну\").\n## Малые игры\nЧерты малых игр: свободная развивающая деятельность; творческое назначение; эмоциональная приподнятость; наличие прямых и косвенных правил.\nЗадачи игр: радость общения, развитие воображения, воспитание решимости.\n## Классификация малых игр\n- По содержанию задач: на знакомство, на сплочение, розыгрыши, познавательные, развлекательные.\n- По форме: танцы, интеллектуальные, эстафеты, тренинги.\n- По месту проведения: на воздухе, в воде, в помещении.\n- По количеству участников: индивидуальные, командные.\n- По составу участников: возрастные, по половому признаку.\n- По скорости и времени проведения: сезонные, игры-минутки, кратковременные, длительные.\n- По степени активности: малоподвижные, подвижные, \"сидячие\".\n- По наличию реквизита: с реквизитом, без реквизита.\n- По уровню организации: спонтанные, управляемые, стихийные.\n## Зачем игры вожатому\nИгра занимает особое место в жизни детей, облегчает передачу социально ценных отношений, позволяет включиться в общение, даёт возможность прожить сложные жизненные ситуации, с которыми предстоит столкнуться. Посредством игры создаётся коллектив, через игру выстраиваются правила поведения и взаимоотношения в нём. Игры развивают творческие способности. Игра - отличный инструмент для работы с детским временным коллективом, и главное - научиться этим инструментом пользоваться."},{"t":"Как сделать из детей команду","cat":"Работа с отрядом","b":"Главная задача вожатого - сделать из сборища детей Отряд: дружную, работоспособную группу, где есть взаимопомощь и поддержка. В опросе детей 88% ответили, что едут в лагерь ради атмосферы, и 86% - чтобы найти друзей. Дисциплина - средство, атмосфера - цель: когда детям уютно, проблем с дисциплиной заметно меньше.\n## Этапы становления временного коллектива\n- Знакомство.\n- Снятие психологических барьеров.\n- Осознание своего места в коллективе.\n- Достижение результата совместной деятельностью.\n- Ощущение, что без тебя коллектив неполон.\nОт активности вожатого зависит, как быстро и успешно отряд пройдёт каждый этап.\n## Как создавать атмосферу\n- Ставьте цель \"стать командой\", а лучше \"одной семьёй\". Говорите \"мы\", а не \"я\" и \"ты\".\n- Единые требования ко всем. Любимчики и нелюбимчики разрушают сплочение.\n- Помогайте детям замечать друг друга и знакомиться, следите, чтобы никто не оказался в изоляции.\n- Не давайте образовываться \"кланам\": если несколько знакомых приехали вместе и ни с кем не общаются, ненавязчиво разделяйте и перемешивайте их.\n- В первые дни собирайте отряд вместе, не дробите на группы.\n- Делите на команды хитро (не \"мальчики против девочек\"), чтобы дети сами не заметили, как перемешались. Игры на деление лежат в игротеке.\n- Играйте в командные игры на взаимовыручку и верёвочный курс.\n- Вводите \"карусель поручений\": меняйте ответственных и помощников, чтобы каждый проявил себя.\n- Давайте обратную связь вместо критики: что получилось хорошо и что можно изменить.\n- Радуйтесь вместе и вместе обсуждайте неудачи.\n- Предлагайте общее дело: что-то необычное, захватывающее, где дети заботятся друг о друге.\n- Вселяйте командный дух (\"Один за всех, все за одного\"), повторяйте \"Мы самый лучший отряд\" и находите этому реальные подтверждения. Дети чувствуют фальшь, если вожатый сам не верит в отряд.\n- Танцуйте и пойте вместе. На дискотеке делайте большой отрядный круг, чтобы дети не расползались по углам.\n- Придумайте отрядные фишки: кричалку, элемент одежды, приветствие, музыку для сбора, эмблему. Не перегибайте со странностями: смешным выглядеть дети боятся больше всего.\n- Заведите традиции: стену настроения, уголок достижений.\n- Проводите свечки и рефлексию. Это момент искренности, а ещё способ понять настроение отряда и заметить тех, кому одиноко или неуютно."},{"t":"Авторитет вожатого","cat":"Работа с отрядом","b":"Авторитет - признание и уважение со стороны детей за дела, знания и опыт. Слова авторитетного вожатого весят больше. Не стремитесь завоевать любовь детей, стремитесь завоевать уважение.\n## Из чего складывается авторитет\n- Любовь к детям и уважение к ребёнку.\n- Внешний вид: аккуратная одежда и чистая обувь, продуманный образ.\n- Речь: чёткая, без жаргона, грубости и слов-паразитов. Подростковый сленг не сближает, а выглядит смешно. Не кричите: крик поднимает шумовой порог и выдаёт неуверенность. Говорите спокойно, короткими весомыми фразами, не повторяйте распоряжение дважды, иначе дети начнут ждать N-го предупреждения.\n- Характер: спокойствие, выдержка, последовательность. Умейте признавать свою неправоту.\n- Внимание к детям: знайте, чем они живут. Если ребёнок пришёл за советом, значит, он вам доверяет.\n- Педагогический оптимизм и чёткий план в голове: поминутный, но гибкий.\n- Субординация: не подрывайте авторитет коллег и администрации, конфликты решайте без детей и зрителей. С детьми можно шутить, но если вы сказали \"нельзя\", спор невозможен. Дистанция - ваш друг, панибратство недопустимо: взрослый здесь вы и несёте ответственность.\n## Две ошибки новичка\n- Дешёвый авторитет: разрешать всё. Вожатый встаёт на один уровень с детьми и теряет уважение, а напарнику приходится быть \"злым\".\n- Злой авторитет: крики, угрозы, наказания. Дети видят в таком вожатом врага, и ему не остаётся запаса жёсткости для случаев, когда она действительно нужна. Спокойный вожатый, который вдруг заговорил \"с металлом в голосе\", работает сильнее.\n## Как строится авторитет по дням\n- До смены: план смены и занятий на любую погоду, продуманные конфликтные ситуации, понимание, чем лично вы интересны детям.\n- День заезда: позитивное первое впечатление. Не суетитесь, будьте уверены, доброжелательны, сглаживайте обострения шуткой.\n- Первая беседа: правила лагеря единые для всех, и вы их тоже соблюдаете. Вы отвечаете за каждого ребёнка и решаете его проблемы.\n- Первое мероприятие: яркое, с заявкой на успех, показывающее, что вы удерживаете дисциплину и с вами не скучно. Вечерняя свечка: личные отношения, доверие, этические нормы отряда.\n- Орг-период: проверка на прочность. Почти каждый ребёнок захочет оспорить ваше лидерство. Сохраняйте тёплое лицо и уверенность, будьте справедливым и внимательным.\n- Конец орг-периода: роли распределены, отношения на смену сложились.\nПервые три дня закладывают отношения на всю смену."},{"t":"Ресурс вожатого: как не выгореть","cat":"Работа с отрядом","b":"Ресурсное состояние - умение поддерживать силы, энергию и работоспособность. Это профессиональный навык вожатого: какой вы, такими будут и дети. Формула баланса: эмоции - мысли - тело. Лучше делать не меньше трёх пунктов в день из подходящего раздела и начинать заранее, не дожидаясь признаков.\n## Признак: физическая усталость, рассеянность, трудно вставать\nПричина: мало сна, много затрат, питание на бегу.\n- Удобное место для работы и для отдыха.\n- Не меньше трёх маленьких приятностей в день (вкусное, обнимашки, солнце, музыка).\n- Чередуйте тяжёлые и лёгкие дела, активные и спокойные.\n- Быстросон: 10-15 минут с закрытыми глазами. Горячий душ. Лучше поспать, чем потусить.\n## Признак: обида и злость на детей, всё раздражает\nПричина: эмоциональный перегруз. Копить эмоции нельзя, но и срываться на детях нельзя.\n- Выплеснуть: покричать в подушку, смять и порвать бумагу, антистресс, спорт.\n- Тайм-аут на минуту-две вне ситуации.\n- Рациональная пауза: назвать два-три чувства и причины, вспомнить три причины, зачем вы здесь.\n- Дыхание: 5 секунд вдох, 5 секунд выдох, минута.\n- Творчество и разговор с тем, кому доверяете.\n## Признак: бесит напарник и коллеги, кажется, что всё сваливают на вас\nПричина: недопонимание, нет контакта, неясные роли.\n- Помнить об общей цели и говорить \"мы\".\n- Искать общее: интересы, взгляды.\n- Проговаривать напряжение словами, не ждать, что вас угадают.\n- Договариваться о ролях диалогом, а не приказами.\n- Неформальный контакт: \"как ты?\", помощь вовремя, общие шутки.\n## Признак: всё надоело, ничего не интересно\nПричина: однообразие, упала мотивация.\n- Делать привычное по-новому: музыка на подъём, другой маршрут в столовую, необычная свечка.\n- Искать вдохновение в любимых треках, книгах, цитатах.\n- Записывать три новинки или факта дня.\n- Придумать \"фишку дня\" (например, день разноцветных носков).\n- Напоминать себе, зачем вам эта смена.\n## Признак: не вижу смысла, зачем всё это\nПричина: нет поддержки и одобрения.\n- Просить поддержки: информационной, методической, эмоциональной.\n- Просить обратную связь у старшего вожатого, коллег, детей на свечке.\n- Искать единомышленников хотя бы по одному пункту.\n- Хвалить себя каждый день 2-3 раза и с обоснованием: \"горжусь собой, потому что...\"."},{"t":"Ребёнок в лагере впервые","cat":"Первые дни","b":"Новичок приезжает с большим чемоданом в незнакомое место: страшно расставаться с родителями, вокруг чужие слова (\"слэнг\"), \"старички\" обнимаются с вожатыми, а его селят в палату с кучей соседей, общий душ и столовая.\n## На что обратить внимание\n- Подготовка до смены: родители объясняют, куда он едет, учат лагерному слэнгу. Если этого не было, объясните сами в первый день.\n- Психологическая готовность: младшие школьники скучают по дому, друзьям, животным. Первые дни нужна поддержка и помощь влиться.\n- Встреча: когда \"старички\" бегут обниматься с вожатыми, новичку обидно. С первой минуты уделите ему внимание, объясните, где он и что будет.\n- Старички как помощники: попросите их провести экскурсию, рассказать, как здесь хорошо. Они любят помогать, главное направить.\n- Родители новичка: им нужно подробно рассказать про документы, оплату, что положить с собой, питание, проживание, и поддержать их тревогу.\n- Быт: общая палата, общий душ, меню по СанПиНу, уборка, общие полочки. Помогите ребёнку привыкнуть, обыграйте бытовые моменты.\nЧем больше вы расскажете новичку о лагере и чем веселее это подадите, тем быстрее он привыкнет и вернётся."},{"t":"Социометрия: симпатии и антипатии в отряде","cat":"Работа с отрядом","b":"Приём, который показывает симпатии и антипатии в группе.\n- Каждый ребёнок подписывает листок и перечисляет не больше трёх человек из отряда по каждому вопросу (вожатых указывать не нужно, имена в именительном падеже).\n- Вопросы: кого бы ты хотел видеть командиром отряда в трудном путешествии; кого капитаном команды на общелагерной олимпиаде; кого пригласил бы в гости или на день рождения.\n- Результаты собирают в матрицу: по строкам кто выбирает, по столбцам кого выбирают, цифры 1, 2, 3 по порядку выбора. Итоги: ВС (сколько выборов сделал), ВП (сколько получил), ВВ (взаимные выборы). Можно нарисовать схему «группировочки»: стрелки от выбирающего к выбранному, каждому вопросу свой цвет.\n- Смотрите, кто получил много выборов (лидеры), кого не выбрал никто, какие пары взаимные. Это повод внимательнее отнестись к детям, а не основание оценивать их."},{"t":"Конфликты: схема и как решать","cat":"Работа с отрядом","b":"## Схема конфликта\n- У каждой стороны свои интересы («я хочу, чтобы он...»). Важно осознать свой и чужой интерес.\n- У каждой стороны свои позиции («он плохой, потому что...»). Внимание нужно уделять интересам, а не позициям.\n- Дети обычно выбирают уступку, бегство или давление, и редко компромисс или третье решение.\n- Конструктивно: убрать эмоции, искать выход, решить, что делать дальше. Не конструктивно: искать виноватого и пытаться победить.\n- В основе повторяющегося плохого поведения лежит неудовлетворённая потребность. Работайте с причиной, а не с симптомами.\n## Как решать\n- Решаем, когда «пар выпущен» и стороны могут держать себя в руках.\n- Говорим о проблеме и фактах, а не об эмоциях и личности.\n- Говорим только за себя, умеем слушать.\n- «Здесь и сейчас»: не вспоминаем прошлые споры.\n- Я-высказывания: «Мне было бы приятно, если бы ты...».\n- Равное участие в поиске решения, уважение, доверие."},{"t":"Разбор конфликта: пошаговый алгоритм","cat":"Работа с отрядом","b":"- Разведите участников, отреагируйте на чувства каждого.\n- Выслушайте по очереди: говорит один, второй слушает. Каждый рассказывает только о своих действиях от первого лица («я пошёл, я увидел, я достал»). Вы нейтральны.\n- Пересскажите, что поняли: «Правильно ли я понял?». Картина событий станет видна без эмоций.\n- Представьте позиции каждого спокойно, найдите третье решение или компромисс.\n- Договоритесь: что каждый мог бы изменить, если бы вернулся к этому моменту, и как сделает так, чтобы конфликт не повторился."},{"t":"Что такое конфликт: структура, фазы, стили поведения","cat":"Работа с отрядом","b":"Конфликт - столкновение людей из-за различий во взглядах, интересах, целях, восприятии, возникающее в социальном взаимодействии. Проще: несколько людей или групп имеют разные взгляды и не могут прийти к согласию. Конфликтное поведение - негативная реакция на такую ситуацию в эмоциях, словах и действиях; это следствие конфликта.\n## Из чего состоит конфликт\n- Предмет: то, из-за чего сталкиваются интересы.\n- Стороны: минимум две.\n- Условия: факторы и обстоятельства, при которых конфликт возможен.\n- Действия участников: само конфликтное взаимодействие.\n- Исход: желаемый образ результата, к которому стремятся стороны.\n## Пять фаз конфликта\n- Прелюдия: все факторы, из-за которых он может возникнуть (непонимание, разница интересов, культуры, образования).\n- Инициирующее событие: то, что запускает конфликт.\n- Инициация: конфликт уже начался; признаки - непреклонность во мнении, словесные разногласия.\n- Дифференциация: стороны высказывают претензии и недовольство, всплывают причины.\n- Разрешение: поиск компромисса и вариантов выхода.\n## В каких отношениях у вожатого бывают конфликты\nПедагог - ребёнок, педагог - родитель, педагог - педагог, педагог - администрация.\n## Пять стилей поведения в конфликте\nЛучшего стиля нет. Учитесь осознанно выбирать подходящий под ситуацию. Свой стиль можно определить по тесту К. Томаса «Способы реагирования в конфликте».\n- Конкуренция (соперничество). Самый типичный стиль, подходит сильному, авторитетному человеку, при веских аргументах или в критической ситуации, где нужно мгновенно действовать. Но редко даёт долгий результат: проигравший не поддержит решение и завтра может отказаться сотрудничать. В близких и личных отношениях не годится: вызывает только отчуждение.\n- Сотрудничество. Самый трудный и самый эффективный стиль: ищется решение, приемлемое для обеих сторон, оппоненты становятся партнёрами. Начать можно фразами \"Я хочу справедливого исхода для нас обоих\", \"Давайте посмотрим, как мы оба можем получить то, что хотим\". Нужно уметь объяснять свои решения, слушать и сдерживать эмоции. Подходит, когда нужно общее решение, отношения долгие и взаимозависимые, власть у сторон равная.\n- Компромисс. Взаимные уступки, более поверхностно, чем сотрудничество: \"мы не можем получить всё, значит, нужно решение, с которым согласен каждый\". Подходит, когда желания несовместимы, аргументы и власть равны, нужно временное решение, или нужно сохранить отношения и хоть что-то получить.\n- Уклонение (отсрочка). Когда вопрос несущественен, нет шансов решить в свою пользу, нужно выиграть время и собрать информацию, открытое обсуждение сейчас ухудшит ситуацию, конфликт могут решить сами, или вы имеете дело с трудным человеком (грубияном, жалобщиком). Это не бегство: проблема может решиться сама, или вы вернётесь к ней, когда будет информация и желание.\n- Приспособление. Вы откладываете свои интересы, чтобы сгладить обстановку, и можете вернуться к ним позже. Подходит, когда важнее восстановить спокойствие, предмет спора не важен, добрые отношения дороже, или у вас мало власти и шансов.\n## Что видно в лагере (из памятки \"Конфликты в лагере\")\n- Уклонение подходит для мелких конфликтов с малознакомыми, но оставляет конфликт неразрешённым и вредит дружбе.\n- Соперничество в отряде не подходит: \"поверженный\" никуда не денется, напряжение в коллективе растёт.\n- Приспособление уместно, если сохранить отношения важнее мелкой размолвки; при серьёзной причине пассивность усиливает обиду и разрушает доверие.\n- Сотрудничество решает конфликт и укрепляет дружбу, если все готовы к диалогу; не работает, если оппонент не хочет искать общее решение.\n- Компромисс - промежуточный вариант, когда сейчас нельзя устроить всех."},{"t":"Как говорить, чтобы услышали: приёмы ненасильственного общения","cat":"Работа с отрядом","b":"Диалог - главный инструмент решения конфликта, но неудачные слова подливают масла в огонь. Правила подходят и для разговора с детьми, и для разговора с коллегами и родителями.\n## Факты, а не выводы\n- \"Ты дурак\" - \"Ты меня толкнул\".\n- \"Ты предатель\" - \"Ты испачкал мою одежду\".\n- \"Ты назло это делаешь!\" - \"Твой поступок мне неприятен, мы уже это обсуждали\".\n- \"Тебе наш отряд не нравится, поэтому ты занижаешь баллы\" - \"Мы считаем, что оценки выставлены нечестно\".\n## Говорим о себе и о чувствах, а не об оппоненте и мыслях\n- \"Я чувствую, что ты мне не друг\" - \"Меня задевает, когда вы при мне шепчетесь\".\n- \"Мне кажется, ты врёшь\" - \"Мне грустно, когда со мной не разговаривают\".\n- \"Тебе неинтересно то, что я рассказываю!\" - \"Мне неприятно, когда я рассказываю, а ты смотришь в телефон\".\n## Озвучиваем потребность, а не возмущение\n- \"Ты мало со мной играешь!\" - \"Я бы хотел ещё поиграть, мне с тобой интересно\".\n- \"Ты опять без меня ушёл!\" - \"Мне нравится проводить с тобой время, было бы приятно, если бы ты меня подождал\".\n- \"Ты постоянно меня перебиваешь, что за дурацкая манера?\" - \"Мне неприятно, когда меня перебивают, дай мне, пожалуйста, договорить\".\n## Просим, а не требуем\n- \"Быстро положи на место!\" - \"Пожалуйста, спрашивай меня, если хочешь взять моё\".\n- \"Слушай, что я говорю!\" - \"Послушай меня, пожалуйста\".\n## Как сказать \"нет\"\n- Прямо, но не грубо, медленно и дружелюбно.\n- Не оправдываться. Вместо \"я не могу\" говорить \"я не хочу\".\n- Можно сказать: \"Мне сложно отказать, но я всё же это сделаю\".\n## Ты имеешь право\n- Оценивать своё поведение, мысли и эмоции и отвечать за их последствия.\n- Самому решать, насколько ты отвечаешь за проблемы других.\n- Менять мнение, ошибаться и отвечать за свои ошибки.\n- Быть независимым от плохого отношения и навязчивой доброжелательности.\n- Говорить \"я не знаю\", \"я не хочу\", \"я тебя не понимаю\", \"меня это не интересует\"; принимать нелогичные решения.\n## Принципы личной ответственности\n- Вы отвечаете за результат своих отношений с другими.\n- Если стратегия не даёт результата, смените стратегию.\n- Не спрашивайте \"кто виноват, что мне плохо\".\n- Не ждите, что окружающие изменятся.\n- Только вы знаете свои потребности и отвечаете за их удовлетворение.\nБыть вместе против проблемы, а не против друг друга."},{"t":"Конфликт или травля: как отличить и что делать","cat":"Работа с отрядом","b":"Если ссоры чаще возникают между знакомыми детьми, то травля (буллинг) может быть направлена и на незнакомого. Важно понять, что перед вами: если это травля, советы по разрешению конфликта не помогут.\n## Чем травля отличается от конфликта\n- В конфликте стороны равны, в травле силы неравны: \"охотник - жертва\".\n- У конфликта есть причина. Для травли причины не нужны, обидчик получает удовольствие от процесса, жертвой может стать любой.\n- В конфликте обе стороны испытывают примерно одинаковые эмоции. В травле с одной стороны агрессия и веселье, с другой - страх, боль, бессилие.\n- Цель конфликта - разрешение, цель травли - психологическое насилие, которое может перерасти в физическое.\n- Конфликт обычно короткий, травля может длиться месяцами.\n- Конфликт редко вредит психике, травля причиняет существенный вред.\n- Конфликт можно решить, травлю можно только прекратить.\n## Как ребёнку реагировать на оскорбления\nНеважно, за что травят: что-то не так с обидчиками, а не с ребёнком. Способы ответить, чтобы у обидчика пропала охота:\n- Превратить обидное слово в комплимент (\"Очкарик!\" - \"Спасибо, я люблю Гарри Поттера\").\n- Ответить вопросом (\"О, ты тоже играешь в эту игру?\").\n- Согласиться (\"Зубрила!\" - \"Да, я собираюсь в МГУ\").\n- Отшутиться.\n- Удивиться (\"Тупой!\" - \"Правда? Спасибо, что сказал\").\n## Почему дети не просят о помощи\n- Хотят быть взрослыми и решать сами.\n- Боятся выглядеть нелепо, стесняются.\n- Раньше просили, но помощи не получили.\n- Сильный страх парализует.\n- Решение просто не приходит в голову.\n## Как научить ребёнка разбирать проблему\n- Что сейчас происходит?\n- Как я хочу, чтобы это выглядело в будущем?\n- Как этого достичь? Составить несколько решений, одно из которых - попросить о помощи.\n- Какое оптимально и почему (плюсы и минусы)?\n- Выбрать решение, применить, оценить результат, при необходимости взять другое, похвалить себя.\nПросьба о помощи к взрослому часто самое подходящее решение: у взрослых больше возможностей. Ребёнок может обратиться к вожатому (он рядом 24 часа в сутки), к родителям (позвонить) или к любому сотруднику лагеря.\n## Что делает вожатый\n- Замечает признаки: один ребёнок постоянно в роли жертвы, насмешки, изоляция, порча вещей, онлайн-буллинг. Не списывайте на \"сами разберутся\".\n- Сообщает старшему вожатому и администрации.\n- Не пытается \"помирить\" стороны как равные.\n- Делает видимой для отряда позицию: у нас так не поступают.\n## Если родитель обращается о травле\n- Родителя просят сообщить вожатому и убедиться, что он занимается проблемой.\n- Если за сутки проблема не решена, он обращается к администрации.\n- Если и это не помогло, родитель может приехать и забрать ребёнка.\n- Для фиксации: скриншоты оскорблений, запись на диктофон или видео.\n- При физическом насилии или порче вещей: собрать имена и телефоны свидетелей, сфотографировать испорченные вещи, провести медосвидетельствование, написать заявление в полицию.\nМатериал по мотивам памятки «Конфликты в лагере» (программа «Травли Net»)."},{"t":"Конфликтное поведение детей и родителей: как работать","cat":"Работа с отрядом","b":"## Дети: поведение, за которым стоит потребность\nДети знают, что нарушают правила, но могут не осознавать истинных мотивов; при этом поведение они выбирают сами. За деструктивным поведением стоит потребность быть значимым и эффективным, которую ребёнок пытается удовлетворить неконструктивно. Выделяют четыре типа: на привлечение внимания, на стремление к власти, мстительное, на избегание неудач. Для каждого нужна своя стратегия вмешательства.\n## Как избегать и гасить конфронтации\n- Сосредоточьтесь на поступке, а не на ребёнке.\n- Разряжайте отрицательные эмоции.\n- Не обостряйте ситуацию.\n- Обсуждайте проступок позже.\n- Позвольте ребёнку сохранить лицо.\n- Подавайте пример неагрессивного поведения.\n## Как строить отношения с детьми\n- Принимать, проявлять внимание и симпатию.\n- Признавать значимость и ценность, подкреплять достоинство.\n- Поощрять вклад каждого в дела отряда и взаимопомощь.\n## Родители\nОбщение с родителями бывает позитивным и негативным. Негативное обычно звучит так: \"не устраивают условия проживания\", \"у ребёнка конфликты\", \"не нравится программа\", \"ребёнок плачет, хочет домой\", \"сделайте так, чтобы ему понравилось и чтобы с кем-то подружился\", \"успокойте его\", \"он мне не звонил\".\nПричины конфликтов: и вожатый, и родитель - взрослые со своим опытом, особенностями и взглядом на проблему. Источник претензий - беспокойство за ребёнка и значимость родительского статуса. Ваша задача - сохранить стабильное состояние и подойти к решению конструктивно, помнить о ранимости родительских чувств и не оценивать ребёнка бестактно.\n## Типы \"проблемных\" родителей\n- Агрессивные, конфликтные, жалующиеся.\n- Отстранённые, отсутствующие, игнорирующие.\n## Родитель в позиции \"родителя\" (требует, поучает)\n- Выслушать.\n- Снять напряжение, разделить ценности.\n- Озвучить своё видение ситуации.\n- Предложить возможные на сейчас решения; если не устраивают, спросить, какой выход родитель считает оптимальным.\n- Выработать общее решение.\n## Родитель в позиции \"ребёнка\" (жалуется, плачет, обижен)\nТе же шаги, но на втором шаге разделяете эмоции. Важно \"поднять\" собеседника на уровень взрослого.\n## Важно\nЧто делать, если родитель пишет о травле, смотрите на странице \"Конфликт или травля\".\nЧасть слайдов исходной презентации состояла из картинок. Если у вас есть их содержание (примеры стратегий вмешательства по типам поведения), пришлите, и я дополню страницу."}],"songs":[{"t":"Будь готов! (Гимн сибирских скаутов)","cat":"Песни","b":"","num":1},{"t":"Семья","cat":"Песни","b":"","num":2},{"t":"Жизнь разнообразна!","cat":"Песни","b":"","num":3},{"t":"Все расстояния когда-нибудь в круг замыкаются","cat":"Песни","b":"","num":4},{"t":"Про рыцарей","cat":"Песни","b":"","num":5},{"t":"Волшебник Починки","cat":"Песни","b":"","num":6},{"t":"В парусиновых брюках...","cat":"Песни","b":"","num":7},{"t":"Ты, да я, да мы с тобой!","cat":"Песни","b":"","num":8},{"t":"Землю обмотали","cat":"Песни","b":"","num":9},{"t":"У синего моря","cat":"Песни","b":"","num":10},{" function route(){const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h))st.tab=h}

function renderTabs(){$('tabs').innerHTML=TABS.map(([k,n])=>`<button class="tab" role="tab" aria-selected="${st.tab===k}" data-tab="${k}">${n}</button>`).join('')}
function blocks(b){
 const out=[];let ul=null;
 for(const raw of b.split('\n')){const l=raw.trimEnd();
  if(!l.trim()){ul=null;continue}
  if(l.startsWith('## ')){ul=null;out.push(`<h3>${esc(l.slice(3))}</h3>`)}
  else if(l.startsWith('- ')){if(!ul){ul=[];out.push(ul)}ul.push(l.slice(2))}
  else{ul=null;out.push(`<p>${esc(l)}</p>`)}}
 return out.map(x=>Array.isArray(x)?'<ul>'+x.map(i=>`<li>${esc(i)}</li>`).join('')+'</ul>':x).join('')}
function gameCard(g){
 const dots=g.a.map(a=>`<span class="dot" style="background:${BANDS[a-1].c}" title="${BANDS[a-1].name}"></span>`).join('');
 const meta=[g.time,g.n&&('игроков: '+g.n)].filter(Boolean).map(esc).join(' · ');
 const on=fav.has(g.id);
 return `<details class="card"><summary><div class="ttl"><b>${esc(g.t)}</b><div class="meta"><span class="ages">${dots}</span><span>${meta}</span></div></div><button class="star" data-fav="${g.id}" aria-pressed="${on}" aria-label="В избранное">${on?'★':'☆'}</button></summary>
 <div class="body"><dl class="facts">${g.goal?`<dt>Цель</dt><dd>${esc(g.goal)}</dd>`:''}<dt>Реквизит</dt><dd>${esc(g.props||'нет')}</dd><dt>Назначение</dt><dd>${g.p.map(p=>`<span class="tag">${esc(p)}</span>`).join(' ')}</dd></dl><p>${esc(g.b)}</p></div></details>`}

 const q=st.q.trim().toLowerCase();
 let base=list.filter(g=>(!st.band||g.a.includes(st.band))&&(!st.favOnly||fav.has(g.id))&&(!st.noprops||/^(нет|-|)$/i.test((g.props||'').trim()))&&match(g,q));
 const types={},purps={};
 base.forEach(g=>{types[g.ty]=(types[g.ty]||0)+1});
 const base2=base.filter(g=>!st.type||g.ty===st.type);
 base2.forEach(g=>g.p.forEach(p=>{purps[p]=(purps[p]||0)+1}));
 const res=base2.filter(g=>!st.purp||g.p.includes(st.purp));
 const groups={};res.forEach(g=>{(groups[g.ty]=groups[g.ty]||[]).push(g)});
 const chips=(o,key,cur)=>Object.entries(o).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<button class="chip" aria-pressed="${cur===k}" data-${key}="${esc(k)}">${esc(k)}<span class="n">${n}</span></button>`).join('');
 let h=`<h2 class="sec">${title}</h2><p class="lead">${lead}</p>
 <div class="bands">${BANDS.map(b=>`<button class="band" style="--c:${b.c}" aria-pressed="${st.band===b.k}" data-band="${b.k}"><b><i></i>${b.name}</b><span>${b.age}</span></button>`).join('')}</div>
 <div class="filters">
  <div class="row"><span class="lbl">Тип</span>${chips(types,'type',st.type)}</div>
  <div class="row"><span class="lbl">Зачем</span>${chips(purps,'purp',st.purp)}</div>
  <div class="row"><button class="chip" aria-pressed="${st.noprops}" data-noprops="1">Без реквизита</button><button class="chip" aria-pressed="${st.favOnly}" data-favonly="1">★ Избранное</button></div>
 </div>
 <div class="tools"><span class="count">Найдено: ${res.length}</span><div class="row"><button class="btn" data-reset="1">Сбросить</button><button class="btn pri" data-rand="1">Случайная игра</button></div></div><div id="list">`;
 if(!res.length)h+='<p class="empty">Ничего не найдено. Снимите часть фильтров или измените поиск.</p>';
 Object.keys(groups).sort().forEach(t=>{h+=`<section class="group"><h3>${esc(t)}</h3>${groups[t].map(gameCard).join('')}</section>`});
 return h+'</div>'}

 if(!t)return;
 if(t.dataset.fav){e.preventDefault();e.stopPropagation();const id=t.dataset.fav;fav.has(id)?fav.delete(id):fav.add(id);saveFav();t.setAttribute('aria-pressed',fav.has(id));t.textContent=fav.has(id)?'★':'☆';return}
 if(t.dataset.tab){setTab(t.dataset.tab);return}
 if(t.dataset.go){setTab(t.dataset.go);return}
 if(t.dataset.agepage){const i=ageDocIdx(+t.dataset.agepage);setTab('ref');st.doc=i;render();window.scrollTo(0,0);return}
 if(t.dataset.trackgames){Object.assign(st,{band:0,type:'Следопытство и ориентирование',purp:'',noprops:false,favOnly:false});setTab('games');return}
 if(t.dataset.bandGo){st.band=+t.dataset.bandGo;setTab('games');return}
 if(t.dataset.quick){st.purp=t.dataset.quick;st.type='';st.band=0;setTab('games');return}
 if(t.dataset.band){const b=+t.dataset.band;st.band=st.band===b?0:b}
 else if(t.dataset.type!==undefined&&t.hasAttribute('data-type')){st.type=st.type===t.dataset.type?'':t.dataset.type}
 else if(t.dataset.purp!==undefined&&t.hasAttribute('data-purp')){st.purp=st.purp===t.dataset.purp?'':t.dataset.purp}
 else if(t.dataset.noprops){st.noprops=!st.noprops}
 else if(t.dataset.favonly){st.favOnly=!st.favOnly}
 else if(t.dataset.reset){Object.assign(st,{band:0,type:'',purp:'',noprops:false,favOnly:false});$('q').value='';st.q=''}
 else if(t.dataset.rand){render();const c=[...document.querySelectorAll('#list details.card')];if(c.length){c.forEach(x=>x.open=false);const p=c[Math.floor(Math.random()*c.length)];p.open=true;p.scrollIntoView({block:'center'})}return}
 else if(t.dataset.doc!==undefined&&t.hasAttribute('data-doc')){st.doc=+t.dataset.doc;render();window.scrollTo(0,0);return}
 else if(t.dataset.back){st.doc=null}
 render()});
let timer;$('q').addEventListener('input',e=>{clearTimeout(timer);timer=setTimeout(()=>{st.q=e.target.value;st.doc=null;render()},150)});
window.addEventListener('hashchange',()=>{route();render()});
route();render();
</script>
