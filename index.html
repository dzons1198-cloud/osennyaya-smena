<!doctype html>
<title>Осенняя смена</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: sticky header with search and section tabs; content as a single readable column; games filtered by age band, type and purpose. */
:root{
 --bg:#eef1ec; --surface:#fbfcfa; --ink:#17261f; --muted:#5a6b62; --line:#d5dcd3;
 --spruce:#1f5d4a; --spruce-ink:#ffffff; --amber:#b86e00; --amber-bg:#f6e6c8; --chip:#e1e8df;
 --lark:#2f7d8c; --starling:#6b5aa8; --owl:#a9442f;
 --font-body:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
 --font-display:'Unbounded','Manrope',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0f1a15; --surface:#16251e; --ink:#e6eee8; --muted:#9bb0a3; --line:#294036;
 --spruce:#5fc2a0; --spruce-ink:#0b1712; --amber:#f0b457; --amber-bg:#3a2d12; --chip:#213a30;
 --lark:#6cc3d2; --starling:#b3a6ec; --owl:#f08f78; color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#0f1a15; --surface:#16251e; --ink:#e6eee8; --muted:#9bb0a3; --line:#294036;
 --spruce:#5fc2a0; --spruce-ink:#0b1712; --amber:#f0b457; --amber-bg:#3a2d12; --chip:#213a30;
 --lark:#6cc3d2; --starling:#b3a6ec; --owl:#f08f78; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--font-body);padding-block:0}
button,input{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;padding-block:12px 8px;flex-wrap:wrap}
.brand{font:700 15px/1.1 var(--font-display);letter-spacing:.02em;margin:0;flex:0 0 auto}
.brand{display:flex;align-items:center;gap:10px}.logo{height:46px;width:auto;display:block}
.brand small{display:block;font:500 11px var(--font-body);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.search{flex:1 1 200px;min-width:0;position:relative}
.search input{width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:0;background:transparent;padding:8px 12px;border-radius:10px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab[aria-selected=true]{background:var(--spruce);color:var(--spruce-ink)}
.tab:focus-visible,.chip:focus-visible,button:focus-visible,summary:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
main{padding-block:20px 64px}
h1,h2,h3{text-wrap:balance}
h2.sec{font:700 22px/1.2 var(--font-display);margin:0 0 6px}
.lead{color:var(--muted);margin:0 0 18px;max-width:62ch}
.bands{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.band{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;cursor:pointer}
.band b{display:block;font-size:17px}
.band span{color:var(--muted);font-size:13px}
.band[aria-pressed=true]{border-color:var(--c,var(--spruce));box-shadow:inset 0 0 0 1px var(--c,var(--spruce))}
.band i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c,var(--muted));margin-right:8px}
.filters{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row .lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:4px;flex:0 0 auto}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--spruce);color:var(--spruce-ink);border-color:var(--spruce)}
.chip .n{opacity:.65;margin-left:4px;font-variant-numeric:tabular-nums}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:12px}
.count{color:var(--muted);font-size:14px}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:10px;cursor:pointer;font-weight:600}
.btn.pri{background:var(--amber);border-color:var(--amber);color:var(--spruce-ink)}
.group h3{font:600 13px/1.2 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px;display:flex;gap:8px;align-items:center}
.group h3::after{content:"";flex:1;height:1px;background:var(--line)}
details.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
details.card summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
details.card summary::-webkit-details-marker{display:none}
.card .ttl{flex:1;min-width:0}
.card .ttl b{display:block;font-size:16px;overflow-wrap:anywhere}
.card .meta{display:flex;flex-wrap:wrap;gap:4px 10px;color:var(--muted);font-size:13px;margin-top:2px}
.card .body{padding:0 14px 14px;border-top:1px dashed var(--line)}
.card .body p{margin:12px 0 0;max-width:68ch;white-space:pre-line}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin-top:12px}
.facts dt{color:var(--muted)} .facts dd{margin:0}
.tag{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--amber-bg);color:var(--amber);font-weight:600}
.star{border:0;background:transparent;font-size:20px;line-height:1;cursor:pointer;color:var(--muted);padding:2px 4px}
.star[aria-pressed=true]{color:var(--amber)}
.ages{display:flex;gap:3px;margin-top:2px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.doc h3{font:600 17px/1.3 var(--font-body);margin:18px 0 4px}
.doc p{margin:8px 0;max-width:68ch;white-space:pre-line}
.doc ul{margin:8px 0;padding-left:20px;max-width:68ch}
.doc li{margin:3px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.tile{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;min-width:0}
.tile b{display:block;overflow-wrap:anywhere}
.tile span{color:var(--muted);font-size:13px}
.back{margin-bottom:14px}
.songs{columns:2 260px;column-gap:24px;padding:0;list-style:none;margin:0}
.songs li{break-inside:avoid;padding:6px 0;border-bottom:1px solid var(--line);display:flex;gap:10px}
.songs .no{color:var(--muted);font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.gdesc{margin:0 0 8px;color:var(--muted,#666);font-size:14px}
.note{background:var(--amber-bg);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:14px;margin:12px 0;max-width:68ch}
.start{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin:14px 0 22px}
.empty{color:var(--muted);padding:24px 0}
@media (prefers-reduced-motion:no-preference){details.card[open]{box-shadow:0 1px 0 var(--line)}}
</style>

const DATA={"games":[{"t":"«Да» и «нет» (угадай слово)","a":[1,2,3],"ty":"Творческие и интеллектуальные","goal":"Логика","n":"6-20","time":"10 мин","props":"нет","b":"Водящий выходит, остальные загадывают существительное. Водящий возвращается и задаёт вопросы, на которые отвечают только «да» или «нет».","p":["Внимание и мышление"],"id":"даинет","i":0},{"t":"А ну-ка, обнимись","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Взаимовыручка","n":"10-30","time":"10 мин","props":"нет","b":"Вариант салок: осалить нельзя того, кто обнимается с другими. Для динамики объявляют, что в безопасности только группы по три-четыре человека.","p":["Движение и разминка","Сплочение"],"id":"анукаобнимись","i":1},{"t":"Автогонки","a":[2,3],"ty":"Подвижные и эстафеты","goal":"Смех","n":"2-6","time":"5-10 мин","props":"детские трёхколёсные велосипеды","b":"Игроки на детских велосипедах как можно быстрее проезжают дистанцию и возвращаются. Смешно смотреть на взрослых, едущих на детских велосипедах.","p":["Движение и разминка"],"id":"автогонки","i":2},{"t":"Автопортрет","a":[1,2,3],"ty":"Творческие и интеллектуальные","goal":"Смех, творчество","n":"4-10","time":"10 мин","props":"листы ватмана с двумя прорезями для рук, краски","b":"Участник продевает руки в прорези листа и, не глядя, рисует свой портрет. Чей «шедевр» удачнее - тот победитель.","p":["Творчество"],"id":"автопортрет","i":3},{"t":"Агенты 007","a":[1,2,3],"ty":"Знакомство и сплочение","goal":"Найти пару, слух","n":"10-30","time":"10-15 мин","props":"баночки от плёнки, наполнители (крупа, песок, камешки)","b":"Каждому по баночке с наполнителем (звук у пары одинаковый). Не открывая, по звуку нужно найти свою пару. Можно разделить на команды.","p":["Деление на команды"],"id":"агенты007","i":4},{"t":"Азимут и шаги","a":[2,3],"ty":"Следопытство и ориентирование","goal":"Работа с компасом","n":"5-6 одновременно","time":"30 мин","props":"щиты с буквами, компасы, планшеты","b":"В центре поляны щит А, по радиусам на разных расстояниях 5-6 щитов с другими буквами. Участник определяет азимуты на щиты и измеряет шагами расстояния, записывает и сдаёт. Побеждает самый точный и быстрый.","p":["Следопытство"],"id":"азимутишаги","i":5},{"t":"Ай да я (Карамба)","a":[1,2],"ty":"В кругу, на месте и в тишине","goal":"Внимание","n":"6-30","time":"5 мин","props":"нет","b":"Считаем по порядку, но вместо чисел, которые делятся на 3 или содержат цифру 3, говорим «Карамба». Ошибся - выбыл. Усложнение: два числа и два слова.","p":["Заполнить паузу","Внимание и мышление"],"id":"айдая","i":6},{"t":"Алфавитный порядок","a":[2,3],"ty":"В кругу, на месте и в тишине","goal":"Скорость мышления","n":"любое","time":"5 мин","props":"нет","b":"Ведущий называет короткое слово («ручка»), все в уме выстраивают его буквы по алфавиту, быстрее всех.","p":["Заполнить паузу","Внимание и мышление"],"id":"алфавитныйпорядок","i":7},{"t":"Американский треугольник","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Реакция, взаимовыручка","n":"четвёрки","time":"10 мин","props":"нет","b":"Трое образуют треугольник, взявшись за руки, четвёртый осаливает одного из них. Двое защищают. Салить через круг рукой нельзя, только обегать. Осаленный становится водящим.","p":["Движение и разминка","Внимание и мышление","Сплочение"],"id":"американскийтреугольник","i":8},{"t":"Ассоциации","a":[1,2,3],"ty":"Знакомство и сплочение","goal":"Мышление, пятиминутка","n":"6-20","time":"5-10 мин","props":"мяч","b":"Мяч перебрасывают по кругу, у кого мяч, называет слово-ассоциацию к слову предыдущего. Можно задать тему (чувства, приятные вещи). Хорошо для перехода между темами.","p":["Знакомство","Внимание и мышление"],"id":"ассоциации","i":9},{"t":"Атлантида (колонии и империя)","a":[2,3],"ty":"Музыка, праздники и большие игры","goal":"Командная стратегия, объединение","n":"30-80","time":"120 мин","props":"погоны разных цветов, карта, куски карты, фонарики","b":"Остров Атлантида с Императором (вожатый), его воинами с белыми погонами и Инквизицией. Остальные отряды - колонии с погонами своего цвета. Задачи колоний: не попасться инквизитору (он налагает шуточные наказания: петь, ходить на четвереньках), найти кусочки карты, по точкам определить место и «украсть Единорога» (тогда император теряет бессмертие), победить воинов императора (у них 10 жизней) и в финальной битве догадаться объединиться против Атлантов. Вожатые подсказывают. Вместо петард используйте сигнал свистком или фонариком.","p":["Событие"],"id":"атлантида","i":10},{"t":"БИП","a":[1,2],"ty":"В кругу, на месте и в тишине","goal":"Внимание, смех","n":"10-20","time":"10 мин","props":"повязка, стулья","b":"Водящий с завязанными глазами ходит внутри круга и садится на колени к игроку (спиной, нащупывать нельзя). Тот говорит «БИП» изменённым голосом. Угадал - меняются.","p":["Внимание и мышление"],"id":"бип","i":11},{"t":"Баба-Яга в ступе","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Ловкость, смех","n":"команды","time":"10 мин","props":"ведро, швабра","b":"Игрок ставит одну ногу в ведро (ступа), держит ведро за ручку, во второй руке швабра (метла) и так проходит дистанцию. Передаёт «ступу» следующему.","p":["Движение и разминка"],"id":"бабаягавступе","i":12},{"t":"Бабочка (сачки и шарики)","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Ловкость","n":"2","time":"5 мин","props":"2 сачка, 2 воздушных шарика","b":"Двое с сачками и воздушным шариком в сачке. Нужно поймать соперника сачком, не потеряв свой шарик.","p":["Движение и разминка"],"id":"бабочка","i":13},{"t":"Бабочка-ледышка","a":[1],"ty":"В кругу, на месте и в тишине","goal":"Воображение, чувства","n":"6-10","time":"5-10 мин","props":"мячик","b":"По кругу передаётся мячик, который по команде то бабочка, то ледышка, то горячая картошка. Нужно показать это движениями и прикосновением.","p":["Творчество"],"id":"бабочкаледышка","i":14},{"t":"Баклуши","a":[1,2],"ty":"Музыка, праздники и большие игры","goal":"Смех, ловкость","n":"пары","time":"10 мин","props":"мягкие «дубины» из поролона в ткани","b":"Пары бьются мягкими баклушами, глаза можно завязать или оставить открытыми. Побеждает тот, кто первым 10 раз ударит или дольше продержится. Бить только по туловищу, в голову нельзя.","p":["Событие","Движение и разминка"],"id":"баклуши","i":15},{"t":"Баллы на пальцах","a":[3],"ty":"Знакомство и сплочение","goal":"Рефлексия","n":"пары","time":"5 мин","props":"нет","b":"По счёту «три» пара показывает на пальцах уровень доверия от 1 (совсем нет) до 5 (полное). Затем пары меняются, а потом обсуждают.","p":["Доверие","Сплочение"],"id":"баллынапальцах","i":16},{"t":"Барыня","a":[1,2],"ty":"Творческие и интеллектуальные","goal":"Внимание, самообладание","n":"5-15","time":"10 мин","props":"нет","b":"Ведущий читает: «Барыня прислала сто рублей. Что хотите, то берите. Чёрное с белым не берите, да и нет не говорите, не смеяться, не улыбаться». Затем задаёт вопросы («Вы поедете на бал?»). Нельзя говорить «да», «нет», «чёрное», «белое», смеяться и улыбаться. Нарушил - выбыл.","p":["Внимание и мышление"],"id":"барыня","i":17},{"t":"Бег в связке","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Командность","n":"пары, тройки","time":"10 мин","props":"ленты","b":"Нужно пробежать дистанцию со связанными ногами в паре или тройке. Связывать мягкой лентой, не туго.","p":["Движение и разминка"],"id":"бегвсвязке","i":18},{"t":"Бегство из ловушки","a":[1,2],"ty":"В кругу, на месте и в тишине","goal":"Тихий шаг","n":"6-15","time":"10 мин","props":"нет","b":"Надзиратель отвернулся, пленные должны тихо пройти мимо его комнаты, чтобы он не услышал. Сторож слушает и показывает пальцем, откуда шум.","p":["Успокоение"],"id":"бегствоизловушки","i":19},{"t":"Без рук","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Ловкость","n":"команды","time":"10 мин","props":"мандарины, сливы","b":"Команды переносят фрукты в заданное место без помощи рук (коленями, подбородком и т.д.).","p":["Движение и разминка"],"id":"безрук","i":20},{"t":"Без скрипа","a":[1,2],"ty":"В кругу, на месте и в тишине","goal":"Слух, осторожность","n":"6-15","time":"10 мин","props":"предмет","b":"«Больной» (ребёнок или вожатый) лежит в комнате с закрытыми глазами. Игрок должен тихо войти, взять предмет и выйти. Услышав скрип или шаги, «больной» громко стонет, и тогда нужно начать сначала.","p":["Успокоение"],"id":"безскрипа","i":21},{"t":"Белки, зайцы, мышки","a":[1],"ty":"Подвижные и эстафеты","goal":"Реакция","n":"15-30","time":"10 мин","props":"3 обруча","b":"Три группы живут в трёх «домиках»-обручах. Ведущий командует, например, «Белки-мышки!» - названные группы меняются домиками. Пойманный становится водящим. Команда «Мышки, белки, зайцы!» - все три группы бегут в любые другие домики.","p":["Движение и разминка","Внимание и мышление"],"id":"белкизайцымышки","i":22},{"t":"Белки-стрелки (казаки-разбойники)","a":[2,3],"ty":"Подвижные и эстафеты","goal":"Ориентирование, командная игра","n":"10-30","time":"30-40 мин","props":"мел для стрелок","b":"Две команды. «Стрелки» убегают и рисуют стрелки на поворотах, «ловцы» идут по следам. Когда найдена последняя стрелка и поймана команда, меняются.","p":["Движение и разминка"],"id":"белкистрелки","i":23},{"t":"Белочка, несущая орех","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Прыгучесть","n":"команды по 5-8","time":"10 мин","props":"5-7 обручей и мяч на команду","b":"Обручи лежат на земле так, чтобы можно было допрыгнуть из одного в другой. «Белочка» несёт мяч-орех, прыгая из обруча в обруч до отметки и обратно. Усложнение - два или три ореха.","p":["Движение и разминка"],"id":"белочканесущаяорех","i":24},{"t":"Белый мяч и чёрный мяч","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Скорость и командный дух","n":"12-24","time":"10 мин","props":"2 мяча разных цветов","b":"Две команды, у каждой ведущий со своим мячом. Ведущие бросают мячи как можно дальше, по второму сигналу по одному игроку из каждой команды бегут за мячом и приносят ведущему. Кто быстрее, получает очко.","p":["Движение и разминка"],"id":"белыймячичерныймяч","i":25},{"t":"Белый тополь, зелёный тополь","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Размяться, познакомиться","n":"14-30","time":"10 мин","props":"нет","b":"Две шеренги держатся за руки лицом друг к другу и поют вопрос «От нас кто вам нужен?». Другая шеренга называет одного человека по имени, он бежит и пытается разорвать цепь соперников. Удалось - уводит с собой одного из их команды, не удалось - остаётся у соперников. Называем только одного игрока, у каждого одна попытка.","p":["Движение и разминка","Знакомство"],"id":"белыйтопользеленыйтополь","i":26},{"t":"Берег-река","a":[1],"ty":"Подвижные и эстафеты","goal":"Внимание","n":"8-25","time":"5 мин","props":"верёвка или мел","b":"Линия делит поле на «берег» и «реку». По команде «река» или «берег» все прыгают на нужную сторону. Если уже стоишь в нужной - просто подпрыгиваешь на месте.","p":["Движение и разминка","Внимание и мышление"],"id":"берегрека","i":27},{"t":"Берегись, Буратино!","a":[1],"ty":"Подвижные и эстафеты","goal":"Быстрота, внимание","n":"8-20","time":"10 мин","props":"колпачок","b":"У одного на голове колпачок (Буратино). Водящий ловит именно его, но на бегу колпачок можно передавать. Запятнал Буратино - меняются.","p":["Движение и разминка","Внимание и мышление"],"id":"берегисьбуратино","i":28},{"t":"Бесконечное кольцо","a":[1,2,3],"ty":"Знакомство и сплочение","goal":"Сплочение","n":"8-25","time":"10 мин","props":"верёвочное кольцо","b":"Круг, все держатся за руки. Кольцо висит на руке ведущего, и его надо передать вокруг, пролезая сквозь, не разрывая рук. Можно пустить второе кольцо в другую сторону.","p":["Сплочение"],"id":"бесконечноекольцо","i":29},{"t":"Бильбоке","a":[1,2,3],"ty":"В кругу, на месте и в тишине","goal":"Ловкость","n":"2-6","time":"10 мин","props":"нитка 40 см, шарик для настольного тенниса, пластиковый стаканчик","b":"Шарик привязан нитью к дну стаканчика. Подбрасываем шарик и ловим стаканчиком: ловим по очереди до промаха. Победитель первым набирает условленное число очков.","p":["Успокоение","Движение и разминка"],"id":"бильбоке","i":30},{"t":"Бим-бом","a":[1],"ty":"Музыка, праздники и большие игры","goal":"Размяться","n":"любое","time":"3-5 мин","props":"музыка","b":"Все стоят рядами. На счёт делаем круговые движения правой рукой («моем окно»), затем левой. Потом сцепляем руки в замок и хлопаем по правому, левому плечу, по правому, левому колену. Два подскока с поворотом спиной - и всё сначала.","p":["Движение и разминка"],"id":"бимбом","i":31},{"t":"Блохи","a":[1,2],"ty":"В кругу, на месте и в тишине","goal":"Внимание, реакция","n":"от 10","time":"8-10 мин","props":"2 одинаковых предмета","b":"В кругу быстро передаём два одинаковых предмета (блох). Если оба оказались в одних руках - вылетаешь. При большой группе пускаем три предмета.","p":["Внимание и мышление"],"id":"блохи","i":32},{"t":"Бой петухов","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Равновесие, сила","n":"20-40 парами","time":"10 мин","props":"нет","b":"Пара стоит лицом к лицу на одной ноге, руки за спиной. Плечом нужно вывести соперника из равновесия, чтобы он встал на две ноги. Руками не толкать, ногу менять только по команде.","p":["Движение и разминка"],"id":"бойпетухов","i":33},{"t":"Болото (кочки)","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Ловкость, равновесие","n":"команды","time":"10 мин","props":"по две картонки на игрока","b":"Нужно пересечь «болото», перемещаясь только по двум картонкам: одну ставишь вперёд, встаёшь на неё, переносишь вторую.","p":["Движение и разминка"],"id":"болото","i":34},{"t":"Больная кошка","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Размяться","n":"от 5","time":"10 мин","props":"нет","b":"Здоровая кошка салит остальных. Осаленный кладёт руку на то место, где его коснулись, и становится больной кошкой: она ловит только здоровой рукой. Кто остался неосаленным, побеждает и становится здоровой кошкой.","p":["Движение и разминка"],"id":"больнаякошка","i":35},{"t":"Большая охота","a":[2,3],"ty":"Музыка, праздники и большие игры","goal":"Командная игра на территории лагеря","n":"3-4 команды","time":"60 мин","props":"мелкие одинаковые предметы (по 50 на команду), ленты","b":"Каждая команда собирает 50 зубочисток (или других предметов) у вожатых, которые маскируются. Среди вожатых есть «убийцы» - отмечают участника полоской маркера на открытой коже. «Раненый» не может собирать, пока не сбегает на базу и не «вылечится». Собрав нужное число, команда получает план-схему клада (коробка со сладостями). Маркер нужно брать безопасный и смываемый.","p":["Событие"],"id":"большаяохота","i":36},{"t":"Бомбардировка","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Ловкость, меткость","n":"2 команды","time":"15 мин","props":"несколько мягких мячей","b":"Мячи на линии. По сигналу команды берут мячи и бросают в соперников, не заступая за линию. Попавший выбывает, а пойманный мяч не считается. Побеждает команда с большим числом оставшихся игроков.","p":["Движение и разминка"],"id":"бомбардировка","i":37},{"t":"Борьба за мяч","a":[2,3],"ty":"Подвижные и эстафеты","goal":"Командная игра","n":"12-30","time":"15-20 мин","props":"мяч, площадка 18x36 м","b":"Две команды, в парах игроки из разных команд. Ведущий подбрасывает мяч между капитанами. Цель - сделать десять передач подряд между своими. Вырывать мяч нельзя, можно перехватить или выбить. Больше трёх шагов с мячом нельзя, можно вести как в баскетболе. Если передал неудачно - начинаем счёт заново.","p":["Движение и разминка"],"id":"борьбазамяч","i":38},{"t":"Борьба за флаг","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Быстрота, ловкость","n":"12-30","time":"15 мин","props":"флажок","b":"Две шеренги на расстоянии 15-20 шагов, у каждого номер. Флажок посередине ближе к одной команде. Ведущий называет номер, выбегают двое, один хватает флажок и бежит к своим, другой догоняет и пятнает. За каждого пленного - очко. Заранее огласите, до скольких очков играем.","p":["Движение и разминка"],"id":"борьбазафлаг","i":39},{"t":"Бревно","a":[1,2,3],"ty":"Знакомство и сплочение","goal":"Доверие","n":"8-20","time":"10 мин","props":"коврик","b":"Группа ложится на пол рядом, один человек сверху поперёк. Совместным перекатыванием нужно передвинуть его из начала ряда в конец, не помогая руками.","p":["Сплочение"],"id":"бревно","i":40},{"t":"Брейн-ринг (жесты)","a":[2,3],"ty":"Творческие и интеллектуальные","goal":"Командность","n":"2-4 команды","time":"15 мин","props":"список слов","b":"От каждой команды подходит один, ведущий шепчет ему слово. Он показывает команде жестами, пальцем на предмет показывать нельзя. Кто быстрее. Вариант: рисовать или лепить.","p":["Внимание и мышление"],"id":"брейнринг","i":41},{"t":"Бросок с завязанными глазами","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Меткость","n":"любое","time":"10 мин","props":"10 картофелин или мячиков, ведро, повязка","b":"Игрок кидает с 2,5-3 м как можно больше предметов в ведро. Сначала пара тренировочных бросков, затем с завязанными глазами.","p":["Движение и разминка"],"id":"бросоксзавязаннымиглазами","i":42},{"t":"Брось в кольцо","a":[2,3],"ty":"Подвижные и эстафеты","goal":"Меткость","n":"любое","time":"10 мин","props":"кольцо, палочки","b":"Кольцо на высоте 1,5 м. С 10-15 шагов нужно добежать, бросить палочку сквозь кольцо и поймать - 2 очка; не поймал - 1; промах не считается. Игра 5 минут.","p":["Движение и разминка"],"id":"бросьвкольцо","i":43},{"t":"Брось улыбку","a":[1,2,3],"ty":"В кругу, на месте и в тишине","goal":"Позитив","n":"6-25","time":"5 мин","props":"нет","b":"Ведущий улыбается, стирает улыбку ладонью и «бросает» её соседу. Тот ловит, надевает на лицо, стирает и бросает дальше. Улыбнувшийся не вовремя теряет «жизнь».","p":["Движение и разминка"],"id":"бросьулыбку","i":44},{"t":"Буги-вуги","a":[1],"ty":"Музыка, праздники и большие игры","goal":"Размяться, повторение движений","n":"любое","time":"5 мин","props":"музыка","b":"В кругу повторяем за ведущим слова и движения: «Руку правую вперёд, потом назад, опять вперёд и потрясём, танцуем буги-вуги, поворачиваясь в круге, и в ладоши хлопаем вот так». Затем меняем часть тела: левая рука, правое ухо и т.д.","p":["Движение и разминка"],"id":"бугивуги","i":45},{"t":"Бумажная стрела","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Меткость","n":"две команды","time":"10 мин","props":"бумажный самолётик","b":"Команды по очереди бросают самолётик с места падения предыдущего в противоположные стороны. Побеждает команда, у которой упал последний самолётик.","p":["Движение и разминка"],"id":"бумажнаястрела","i":46},{"t":"Буратино (Иа-Иа)","a":[1],"ty":"Подвижные и эстафеты","goal":"Ориентировка, смех","n":"любое","time":"10-15 мин","props":"рамка или лист с рисунком, повязка, нос или хвост","b":"На стене вешают рисунок Буратино без носа (или ослика Иа-Иа без хвоста). Участнику завязывают глаза, он идёт с шести шагов и должен прикрепить нос или хвост на место. Безопасно: используйте липкую бумагу или скотч с петелькой, а не булавку.","p":["Движение и разминка"],"id":"буратино","i":47},{"t":"Буриме","a":[3],"ty":"Творческие и интеллектуальные","goal":"Рифма, творчество","n":"команды по 3-5","time":"15-20 мин","props":"бумага, ручки","b":"Дают заранее четыре рифмующихся слова (дело, класс, смело, раз) и просят написать стихотворение, которое заканчивается именно ими. Зачитывают вслух, выбирают самое смешное и самое красивое.","p":["Творчество"],"id":"буриме","i":48},{"t":"Бурундуки","a":[1,2],"ty":"В кругу, на месте и в тишине","goal":"Разрядка, смех","n":"10-30","time":"10 мин","props":"нет","b":"Ведущий тайно называет каждого участника животным. Все в кругу берутся за локти. Ведущий вызывает животное, и этот игрок пытается выскочить в центр, а круг его не пускает. Кульминация - когда называют самое «многочисленное» животное.","p":["Движение и разминка"],"id":"бурундуки","i":49},{"t":"Бусинки","a":[1],"ty":"Творческие и интеллектуальные","goal":"Зрительная память","n":"6-12","time":"10 мин","props":"шапочки или значки трёх цветов","b":"Дети - бусинки красного, жёлтого, зелёного цвета. Ведущий выстраивает «нитку» с чередованием, водящий запоминает. Бусины разбегаются, по «Стоп!» водящий собирает бусы в прежнем порядке.","p":["Внимание и мышление"],"id":"бусинки","i":50},{"t":"Быстрая щётка","a":[1,2],"ty":"В кругу, на месте и в тишине","goal":"Ловкость, внимание","n":"10-20","time":"10 мин","props":"щётка или любой небольшой предмет","b":"Плотный круг, руки за спиной. Предмет незаметно передают по кругу, а водящий внутри пытается понять, где он. Водящий кладёт руку на плечо игрока, тот вытягивает руки вперёд. Если предмет у него, он становится водящим.","p":["Внимание и мышление","Движение и разминка"],"id":"быстраящетка","i":51},{"t":"Быстрые водоносы","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Скорость, аккуратность","n":"2","time":"5 мин","props":"2 миски с водой, 2 ложки, 2 стакана","b":"Двое переливают воду ложкой из миски в стакан на соседнем стуле. Кто первым наполнит стакан, победил.","p":["Движение и разминка"],"id":"быстрыеводоносы","i":52},{"t":"Бычий глаз","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Меткость","n":"4-12","time":"10 мин","props":"стул, бутылка, булавки (лучше заменить на крупные пуговицы или фишки)","b":"Стул стоит спинкой к бутылке. Игрок становится на колени на сиденье и бросает по очереди через спинку предметы в бутылку позади. Руки ниже уровня спинки не опускать. Для детей безопаснее использовать крупные пуговицы, а не булавки.","p":["Движение и разминка"],"id":"бычийглаз","i":53},{"t":"В воду - на берег","a":[1],"ty":"Подвижные и эстафеты","goal":"Внимание, реакция","n":"8-25","time":"5-10 мин","props":"мел","b":"Все в круге. По команде «на берег» выскакивают из круга, по команде «в воду» запрыгивают. Если «в воду» сказали, когда все уже в круге, двигаться нельзя. Две ошибки - выбывает.","p":["Движение и разминка","Внимание и мышление"],"id":"вводунаберег","i":54},{"t":"В лагерь я с собой беру...","a":[1,2],"ty":"Знакомство и сплочение","goal":"Выучить имена и вещи, которые можно брать в лагерь","n":"8-30","time":"10 мин","props":"нет","b":"Как «Снежный ком», только каждый добавляет предмет на первую букву имени: «Слава - сумку, Маша - майку». Если назвали запрещённую вещь (нож), вожатый останавливает игру и объясняет, что этого брать нельзя, затем начинаем сначала.","p":["Знакомство"],"id":"влагерьяссобойберу","i":55},{"t":"В лес по ягоды пойдём","a":[1],"ty":"Творческие и интеллектуальные","goal":"Знания о природе, безопасность","n":"8-25","time":"10 мин","props":"нет","b":"Ведущий называет грибы и ягоды. Съедобные - дети говорят «Берём!», несъедобные - молчат. Хорошо закрепить правило «чужое не пробуем».","p":["Внимание и мышление"],"id":"влеспоягодыпойдем","i":56},{"t":"В магазине за углом","a":[2,3],"ty":"В кругу, на месте и в тишине","goal":"Логика","n":"6-20","time":"5-10 мин","props":"нет","b":"Ведущий называет две вещи, которые хочет купить (одну носят выше талии, другую ниже). Выбор верный, если названные вещи надеты на соседях: верх - на соседе справа, низ - слева.","p":["Заполнить паузу","Внимание и мышление"],"id":"вмагазинезауглом","i":57},{"t":"В поле выросла рубашка","a":[1,2],"ty":"Творческие и интеллектуальные","goal":"Логика, последовательность","n":"команды","time":"10 мин","props":"карточки с рисунками","b":"В конверте карточки (рулон ткани, клубок, прялка, куст льна, веретено, рубашка). Нужно быстро выложить в правильный порядок путь льна до рубашки. Вариант можно сделать про хлеб, молоко.","p":["Внимание и мышление"],"id":"вполевыросларубашка","i":58},{"t":"Вальс дружбы","a":[1,2],"ty":"Музыка, праздники и большие игры","goal":"Знакомство, смена партнёра","n":"чётное, парами","time":"5-10 мин","props":"музыка","b":"Пары в большом кругу: приставные шаги по кругу, маятник ногой, поворот вокруг себя, хлопок партнёру. После этого девочки идут вправо, мальчики влево к следующей паре. Хорош как финал игры на знакомство.","p":["Движение и разминка","Знакомство"],"id":"вальсдружбы","i":59},{"t":"Ведробол","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Меткость","n":"2 команды","time":"15 мин","props":"ведро или корзина, мяч","b":"Баскетбол с ведром или корзиной на полу. Очко не засчитывается, если мяч не остался в ведре или оно перевернулось.","p":["Движение и разминка"],"id":"ведробол","i":60},{"t":"Великий кулинар","a":[1,2,3],"ty":"В кругу, на месте и в тишине","goal":"Смех, пятиминутка","n":"любое","time":"5-10 мин","props":"две ложки, повязка, продукты и предметы","b":"Добровольцу завязывают глаза, дают две ложки. Нужно «опознать» предметы на ощупь ложками: продукты или неедобные вещи (монетка, книга, пульт).","p":["Успокоение"],"id":"великийкулинар","i":61},{"t":"Верблюд (внимание)","a":[1,2],"ty":"В кругу, на месте и в тишине","goal":"Внимание","n":"8-25","time":"5 мин","props":"нет","b":"Вожатый шёпотом называет каждому игроку в кругу «Верблюд». Затем в центре перечисляет животных: «Кошка! Лошадь! Верблюд!». Тот, у кого «верблюд», должен поджать ноги и повиснуть на соседях. Лучше без унижения ребёнка.","p":["Внимание и мышление"],"id":"верблюд","i":62},{"t":"Верная рука","a":[1,2,3],"ty":"Подвижные и эстафеты","goal":"Ловкость","n":"3-10","time":"5 мин","props":"газеты","b":"Одной рукой взять газету за уголок и по команде собрать её в кулак. Кто быстрее, тот победил.","p":["Движение и разминка"],"id":"вернаярука","i":63},{"t":"Верёвочка (построй фигуру с закрытыми глазами)","a":[2,3],"ty":"Знакомство и сплочение","goal":"Сплочение, выявление лидера","n":"6-20","time":"5-10 мин","props":"верёвка 6 м, связанная в кольцо","b":"Все держатся за верёвку внутри круга и закрывают глаза. Задача: построить треугольник, не выпуская верёвки и не открывая глаз. Сначала пауза, потом кто-то предлагает план (например, рассчитаться) и руководит. Затем можно построить квадрат, звезду, ромб.","p":["Сплочение"],"id":"веревочка","i":64},{"t":"Верёвочка за руки","a":[2,3],"ty":"Знакомство и сплочение","goal":"Командность","n":"8-20","time":"10 мин","props":"верёвка","b":"Верёвка натянута чуть ниже пояса самого высокого, группа держится за руки. Всем нужно перейти через неё, не задев. Прыгать нельзя.","p":["Сплочение"],"id":"веревочказаруки","i":65},{"t":"Верёвочка с двумя стульями","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Реакция","n":"2","time":"5 мин","props":"2 стула, верёвка","b":"Стулья спинками друг к другу, под ними протянута верёвка. По команде двое ходят вокруг стульев, по сигналу садятся и выдёргивают верёвку из-под своего стула. До трёх раз, кто выиграл дважды - получает приз.","p":["Движение и разминка","Внимание и мышление"],"id":"веревочкасдвумястульями","i":66},{"t":"Весёлая география","a":[2,3],"ty":"Творческие и интеллектуальные","goal":"Знания, командность","n":"2 команды","time":"15 мин","props":"нет","b":"Одна команда называет букву, вторая за пять минут вспоминает как можно больше географических названий на неё. Потом первая команда две минуты добавляет то, что пропущено, и получает очки. Затем меняются ролями и буквой.","p":["Внимание и мышление"],"id":"веселаягеография","i":67},{"t":"Весёлые мартышки","a":[1],"ty":"В кругу, на месте и в тишине","goal":"Размяться","n":"любое","time":"3-5 мин","props":"нет","b":"Ведущий проговаривает: «Мы весёлые мартышки, мы играем громко слишком, в ладоши хлопаем, ногами топаем, надуваем щёчки, скачем на носочках...» Все повторяют движения. На цифре «три» все замирают с гримасами.","p":["Заполнить паузу"],"id":"веселыемартышки","i":68},{"t":"Весёлые поварята","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Скорость, смех","n":"две команды","time":"15 мин","props":"2 колпака, 2 фартука, миски с водой, ложки, пустые бутылки","b":"Игрок надевает форму повара, бежит, ложкой переливает воду из миски в бутылку, возвращается, передаёт одежду следующему. Побеждает команда, быстрее наполнившая бутылку.","p":["Движение и разминка"],"id":"веселыеповарята","i":69},{"t":"Вечернее платье из газет","a":[2,3],"ty":"Творческие и интеллектуальные","goal":"Командное творчество","n":"две пары или команды","time":"15 мин","props":"газеты, булавки, прищепки, ножницы","b":"Пары или команды создают «вечернее платье» из газет, булавок и прищепок. Победителей выбирают зрители. Следите, чтобы булавки не кололи «модель».","p":["Творчество","Успокоение"],"id":"вечернееплатьеизгазет","i":70},{"t":"Взгляд","a":[2,3],"ty":"В кругу, на месте и в тишине","goal":"Внимание друг к другу","n":"8-25","time":"5 мин","props":"нет","b":"Все закрывают глаза. На счёт «3-4» открывают и смотрят на одного человека. Те, чьи взгляды встретились, выходят.","p":["Заполнить паузу","Внимание и мышление"],"id":"взгляд","i":71},{"t":"Взглядом поменяться","a":[1,2,3],"ty":"В кругу, на месте и в тишине","goal":"Внимание","n":"10-25","time":"10 мин","props":"нет","b":"Ведущий в центре пытается занять чьё-то место. Остальные договариваются взглядом, кто с кем меняется. Потерявший место становится ведущим.","p":["Внимание и мышление"],"id":"взглядомпоменяться","i":72},{"t":"Взломщики","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Смекалка","n":"2-6","time":"5-10 мин","props":"связка ключей, замок","b":"Нужно быстро подобрать ключ из связки к замку. Замок можно повесить на ящик с призом.","p":["Движение и разминка"],"id":"взломщики","i":73},{"t":"Водовозы","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Аккуратность","n":"4-8","time":"10 мин","props":"миски с водой, мел","b":"На четвереньках с миской с водой на спине пройти 10 м и вернуться. Очки за скорость и за то, сколько воды сохранено. Только в тёплую погоду.","p":["Движение и разминка"],"id":"водовозы","i":74},{"t":"Водолаз","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Смех, ловкость","n":"команды","time":"10 мин","props":"ласты, бинокль","b":"Игрок надевает ласты и смотрит в бинокль с обратной стороны, проходит маршрут. Играть в помещении или во дворе лагеря, без обрывов и ступенек.","p":["Движение и разминка"],"id":"водолаз","i":75},{"t":"Водохлёбы","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Командная работа, летний вариант","n":"команды","time":"10 мин","props":"дуршлаг, вода","b":"Команды руками переносят воду в дуршлаг. Чей дуршлаг переполнится первым, тот победил. Играть в тёплую погоду.","p":["Движение и разминка"],"id":"водохлебы","i":76},{"t":"Волшебные руки","a":[1,2],"ty":"В кругу, на месте и в тишине","goal":"Расслабление","n":"любое","time":"3 мин","props":"нет","b":"Прижать руки к бокам, зацепив большие пальцы за пояс, и минуту пытаться развести руки в стороны. Затем резко отпустить пояс - руки поднимутся сами.","p":["Заполнить паузу","Успокоение"],"id":"волшебныеруки","i":77},{"t":"Вопрос соседу","a":[1,2,3],"ty":"В кругу, на месте и в тишине","goal":"Внимание, смех","n":"8-25","time":"5-10 мин","props":"фанты","b":"Ведущий в центре задаёт вопрос игроку, но отвечать должен его сосед слева. Ответил сам - отдаёт фант. Фанты потом разыгрывают.","p":["Внимание и мышление"],"id":"вопроссоседу","i":78},{"t":"Вопросы мудрецу","a":[3],"ty":"В кругу, на месте и в тишине","goal":"Откровенный разговор","n":"6-20","time":"20-30 мин","props":"бумажки, шляпа, свеча","b":"Каждый пишет на бумажке вопрос, на который хочет получить ответ (или сам хотел бы ответить), бумажки смешиваются в шляпе. Каждый вытягивает чужой вопрос и отвечает как «мудрец». Лучше проводить при свечах в доверительной группе. Если попался шуточный вопрос, всё равно надо отвечать всерьёз.","p":["Итоги и разговор"],"id":"вопросымудрецу","i":79},{"t":"Воробьи-попрыгунчики","a":[1],"ty":"Подвижные и эстафеты","goal":"Ловкость","n":"8-20","time":"10 мин","props":"мел","b":"Воробьи вокруг круга, кот внутри. Воробьи впрыгивают в круг и выпрыгивают, кот ловит тех, кто внутри. Пойманный - новый кот.","p":["Движение и разминка"],"id":"воробьипопрыгунчики","i":80},{"t":"Восковая палочка","a":[3],"ty":"Знакомство и сплочение","goal":"Доверие","n":"8-12","time":"10 мин","props":"нет","b":"В плотном кругу стоит человек с прямым телом и закрытыми глазами. Он медленно наклоняется, группа ловит и возвращает. Правила безопасности: правая нога вперёд, левая сзади, руки вытянуты, ловят на ладони. Слабого игрока ставят между сильными. Никого не принуждать.","p":["Доверие","Сплочение"],"id":"восковаяпалочка","i":81},{"t":"Времена года (картинки)","a":[1],"ty":"Творческие и интеллектуальные","goal":"Восприятие","n":"4 или подгруппы","time":"15 мин","props":"большие картинки времён года, маленькие символы (санки, лодка, ягоды)","b":"Дети раскладывают маленькие картинки вокруг больших. Побеждает тот, кто быстро и верно подобрал все.","p":["Внимание и мышление"],"id":"временагода","i":82},{"t":"Все на колбасу!","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Реакция, выплеск энергии","n":"8-20","time":"5-15 мин","props":"предмет («колбаса»)","b":"Две команды стоят напротив через 5 шагов, участникам присвоены номера. В центре лежит предмет. Ведущий кричит «На колбасу... вторые!», и вторые номера бегут схватить предмет. Быстрый приносит очко. Хорошо играть, пока ждём столовую.","p":["Движение и разминка","Внимание и мышление"],"id":"всенаколбасу","i":83},{"t":"Все по очереди","a":[2,3],"ty":"Знакомство и сплочение","goal":"Договариваться вслепую","n":"до 20","time":"10 мин","props":"карточки с числами, повязки","b":"Всем завязывают глаза и шёпотом сообщают число от 1 до 100. Без слов надо построиться по возрастанию. Одна рука вытянута вперёд для безопасности. Когда группа решит, что готова, открываем глаза.","p":["Сплочение"],"id":"всепоочереди","i":84},{"t":"Вспомнить всё","a":[2,3],"ty":"В кругу, на месте и в тишине","goal":"Внимание к людям","n":"чётное","time":"5-10 мин","props":"нет","b":"Пары стоят спиной друг к другу. Нужно по очереди вспомнить: имя партнёра, цвет глаз, длину брюк, какая обувь. Подсматривать нельзя.","p":["Успокоение","Внимание и мышление"],"id":"вспомнитьвсе","i":85},{"t":"Встреча","a":[3],"ty":"Творческие и интеллектуальные","goal":"Эмпатия, импровизация","n":"10-30","time":"15-20 мин","props":"нет","b":"Внутренний и внешний круги, пары разыгрывают сценки встречи: друзья детства, один сделал для другого непростое доброе дело, поддержка перед важным разговором, встреча давних знакомых. После каждой сценки внешний круг сдвигается.","p":["Творчество"],"id":"встреча","i":86},{"t":"Встречный маршрут по азимутам","a":[2,3],"ty":"Следопытство и ориентирование","goal":"Работа с компасом","n":"2 команды по 8-12","time":"90 мин","props":"компасы, конверты со схемой, цветные «пропуска»","b":"Две команды идут по одной ломаной линии в противоположных направлениях (1-1,5 км, 5-7 этапов). В конце каждого этапа судья даёт «пропуск» своего цвета. Командиры определяют азимуты следующего этапа. Выигрывает команда, первой вернувшаяся с пропусками. Лучше несколько компасов на команду.","p":["Следопытство"],"id":"встречныймаршрутпоазимутам","i":87},{"t":"Вызов","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Быстрота, командность","n":"12-30","time":"15 мин","props":"нет","b":"Две команды в «городах» на расстоянии 15-40 шагов. Посланный игрок касается ладоней противников, на третье касание «вызывает» игрока и убегает в свой город. Вызванный догоняет: поймал - пленник, нет - сам становится пленником. Пленных можно выручить новым вызовом. Выигрывает команда с большим числом пленных через 5-10 минут.","p":["Движение и разминка"],"id":"вызов","i":88},{"t":"Выйти по числу","a":[2,3],"ty":"Знакомство и сплочение","goal":"Понимание без слов","n":"8-25","time":"5 мин","props":"нет","b":"Группа в шеренге. Ведущий называет число, столько человек должны выйти вперёд без договорённости. Повторять до результата.","p":["Сплочение"],"id":"выйтипочислу","i":89},{"t":"Вымпел в яме","a":[2,3],"ty":"Следопытство и ориентирование","goal":"Меткость, скрытность","n":"2 команды по 15-20","time":"60 мин","props":"вымпелы, теннисные мячи (по три на нападающего), горн","b":"Вымпелы стоят в ямках на расстоянии 400-600 м, вокруг каждого круг радиусом 5 м. Нападающие пробираются на чужую территорию и бросают мячи в ямку, защитники мешают, но не касаются вымпела руками. Израсходовавший мячи возвращается и меняется с защитником. Побеждает команда, забросившая больше мячей.","p":["Следопытство"],"id":"вымпелвяме","i":90},{"t":"Выполни в темноте","a":[1,2],"ty":"Следопытство и ориентирование","goal":"Память, ориентация","n":"любое","time":"10 мин","props":"журналы, стол, повязка","b":"Все 1-3 минуты запоминают обстановку комнаты. Игроку завязывают глаза и дают задание: подойти к столу, взять нужный журнал, открыть на 20-й странице, отдать участнику и вернуться.","p":["Следопытство","Внимание и мышление"],"id":"выполнивтемноте","i":91},{"t":"Выражение чувств","a":[2,3],"ty":"Творческие и интеллектуальные","goal":"Язык тела и эмоции","n":"от 10","time":"10-15 мин","props":"карточки с названиями чувств","b":"Каждый берёт карточку с чувством и молча показывает его мимикой, ходит и находит других с тем же чувством. В конце группы проверяют, насколько совпали.","p":["Творчество"],"id":"выражениечувств","i":92},{"t":"Выслеживание зверя","a":[1,2],"ty":"Следопытство и ориентирование","goal":"Скрытность","n":"8-20","time":"15 мин","props":"нет","b":"«Олень» стоит на открытом месте, остальные подкрадываются как можно ближе. Кого заметил олень - выбывает. Побеждает подобравшийся ближе всех.","p":["Следопытство"],"id":"выслеживаниезверя","i":93},{"t":"Высота деревьев","a":[2,3],"ty":"Следопытство и ориентирование","goal":"Измерение","n":"пары","time":"30 мин","props":"палка известной длины, карточки, булавки, ручки","b":"Пары измеряют высоту деревьев с помощью палки (без лазания) и записывают, пока сумма высот не станет равна названному числу. Замеры от земли до первого сучка, если так договорились. Побеждает самая быстрая и точная пара.","p":["Следопытство"],"id":"высотадеревьев","i":94},{"t":"Выход-вход в круг","a":[2,3],"ty":"Знакомство и сплочение","goal":"Умение убеждать и отказывать","n":"6-12","time":"10 мин","props":"нет","b":"Один пытается любым способом выйти из круга (или войти в него), группа не пускает: можно убеждать, уговаривать, но не применять грубую силу.","p":["Доверие","Сплочение"],"id":"выходвходвкруг","i":95},{"t":"Выше ножки от земли","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Размяться","n":"8-25","time":"10 мин","props":"нет","b":"Салки, где можно спастись, если ступни не касаются земли (залезть на скамейку, повиснуть).","p":["Движение и разминка"],"id":"вышеножкиотземли","i":96},{"t":"Вышибалы","a":[1,2,3],"ty":"Подвижные и эстафеты","goal":"Меткость, командная игра","n":"от 8","time":"15-20 мин","props":"мягкий мяч","b":"Поле 8-10 м, вышибалы стоят за линиями с двух сторон и бросают мяч в игроков в середине. Вариант: выбитый становится вышибалой. Вариант с командами: выбитые уходят за линию, пока не выбьют всю команду. Поймавший «свечку» (мяч налету) может вернуть выбитого. Мяч мягкий, в голову не бросать.","p":["Движение и разминка"],"id":"вышибалы","i":97},{"t":"Вышибалы по цепочке","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Командность","n":"10-12","time":"10 мин","props":"мяч","b":"Одна команда цепочкой за пояс, вторая образует круг и выбивает последнего. Отбивать мяч руками может только первый. Выбитый уходит.","p":["Движение и разминка"],"id":"вышибалыпоцепочке","i":98},{"t":"Вышибалы с переходом","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Ловкость","n":"10-20","time":"15 мин","props":"4-8 мягких мячей или подушек","b":"Две команды выбивают друг друга мячом, но попавший не выбывает, а переходит на другую сторону. Игра заканчивается, когда команды поменялись местами.","p":["Движение и разминка"],"id":"вышибалыспереходом","i":99},{"t":"Вьюнок","a":[1],"ty":"В кругу, на месте и в тишине","goal":"Расслабление","n":"пары","time":"5 мин","props":"нет","b":"В паре один «вьюнок» перебирает пальчиками по спине второго снизу вверх. Потом меняются.","p":["Успокоение"],"id":"вьюнок","i":100},{"t":"Газета","a":[2,3],"ty":"Музыка, праздники и большие игры","goal":"Самостоятельная работа коллективом","n":"несколько отрядов","time":"3 часа","props":"бумага, ватман, фломастеры, краски, клей","b":"Отряды создают газеты на выбранную жеребьёвкой тему. Первые 1-1,5 часа журналисты ходят брать интервью у «интересных людей» (взрослых) по расписанию встреч в штабе. Второй час - оформление и текст, рекламная кампания, разведка у соседних редакций. В конце газеты вывешивают, читают, независимая комиссия вручает призы в разных номинациях.","p":["Событие"],"id":"газета","i":101},{"t":"Газетка","a":[1,2],"ty":"Знакомство и сплочение","goal":"Имена, реакция","n":"10-25","time":"10 мин","props":"свёрнутая газета","b":"Ведущий в центре с «газеткой» называет имя из круга и пытается осалить. Названный должен успеть назвать кого-то другого. Не успел - водит. Если много незнакомых, названный поднимает руку.","p":["Знакомство","Внимание и мышление"],"id":"газетка","i":102},{"t":"Газетные ленты","a":[1,2],"ty":"В кругу, на месте и в тишине","goal":"Мелкая моторика","n":"любое","time":"5 мин","props":"газеты","b":"За 4 минуты разорвать газетный лист в самую длинную целую ленту.","p":["Заполнить паузу"],"id":"газетныеленты","i":103},{"t":"Газетные танцы","a":[2,3],"ty":"Музыка, праздники и большие игры","goal":"Смех, сближение","n":"пары","time":"10 мин","props":"газеты, музыка","b":"Каждая пара танцует на своём листе газеты. Вышли за лист - выбыли. Через несколько минут лист складывают вдвое. Чем меньше места, тем веселее.","p":["Движение и разминка"],"id":"газетныетанцы","i":104},{"t":"Гвалт","a":[2,3],"ty":"Творческие и интеллектуальные","goal":"Концентрация","n":"8-20","time":"10 мин","props":"нет","b":"Водящий выходит. Группа выбирает строчку известной песни и делит её по словам между игроками. Когда водящий возвращается, все хором выкрикивают свои слова, а он собирает песню по словам.","p":["Внимание и мышление"],"id":"гвалт","i":105},{"t":"Геральдика","a":[2,3],"ty":"Творческие и интеллектуальные","goal":"Знания, внимание","n":"команды","time":"10 мин","props":"разрезанные пополам рисунки гербов","b":"Рисунки гербов городов и стран разрезаны по горизонтали. Нужно быстро найти половинки и предъявить жюри. Побеждает команда с наибольшим числом правильных гербов.","p":["Внимание и мышление"],"id":"геральдика","i":106},{"t":"Глазомер","a":[1,2],"ty":"Следопытство и ориентирование","goal":"Глазомер","n":"6-20","time":"15 мин","props":"листы, флажки","b":"Все оценивают на глаз расстояние до предмета и записывают. Потом ведущий ведёт группу к предмету и ставит каждого на расстоянии, которое он записал: видно, у кого точнее. Вариант: между двумя флажками, определяя расстояние сбоку.","p":["Следопытство"],"id":"глазомер","i":107},{"t":"Гномы","a":[1,2,3],"ty":"Музыка, праздники и большие игры","goal":"Доброжелательная атмосфера","n":"10-60","time":"от вечера до 3 дней","props":"шляпа, листочки","b":"Каждый пишет имя на листочке, все тянут чужое. Тот, чьё имя вытянул, - «великан», а ты его добрый «гном». Нужно делать своему великану тайные сюрпризы, не раскрывая себя. Вожатые тоже участвуют. В конце бал: гномы лично дарят подарки великанам.","p":["Событие"],"id":"гномы","i":108},{"t":"Говори!","a":[1],"ty":"В кругу, на месте и в тишине","goal":"Сдерживание импульсов","n":"любое","time":"5 мин","props":"нет","b":"Ведущий задаёт простые и сложные вопросы, но отвечать можно только после команды «Говори!». Тренируются на простом вопросе.","p":["Заполнить паузу"],"id":"говори","i":109},{"t":"Голова дракона","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Размяться, командные действия","n":"8-25","time":"5-10 мин","props":"нет","b":"Игроки цепляются друг за друга цепочкой-«драконом». Первый (голова) пытается поймать последнего (хвост), цепочка при этом изгибается. Пойманный хвост становится головой.","p":["Движение и разминка"],"id":"головадракона","i":110},{"t":"Гонки на помеле","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Ловкость","n":"команды","time":"10-15 мин","props":"помело или палка, 10 кеглей","b":"Бег верхом на палке зигзагом мимо 10 кеглей. Побеждает тот, кто быстрее и сбил меньше.","p":["Движение и разминка"],"id":"гонкинапомеле","i":111},{"t":"Гоп-доп","a":[2,3],"ty":"В кругу, на месте и в тишине","goal":"Внимание, чтение эмоций","n":"6-20","time":"15 мин","props":"монетка, стол","b":"Две команды сидят напротив через стол. Команда с монеткой прячет руки под столом. Соперники кричат «Гоп!» (монетка стучит о стол) или «Гоп-доп!» (все руки с плотно сжатыми кулаками появляются над столом и по счёту хлопают ладонями). Угадать, под какой ладонью монета. Нашли - монета у искателей, нашли под последней - очко удерживающим. Проигравшие выполняют фант.","p":["Успокоение","Внимание и мышление"],"id":"гопдоп","i":112},{"t":"Горелки","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Быстрота","n":"10-30","time":"10-15 мин","props":"нет","b":"Пары стоят колонной, впереди водящий. Он говорит «Гори, гори ясно, чтобы не погасло. Раз, два, три, последняя пара, беги!» Последняя пара бежит вперёд с двух сторон колонны, водящий старается коснуться одного из них, пока они не соединили руки. Пойманный встаёт с водящим, а оставшийся становится водящим.","p":["Движение и разминка"],"id":"горелки","i":113},{"t":"Город вежливых","a":[1],"ty":"Музыка, праздники и большие игры","goal":"Правила поведения, итог смены","n":"20-60","time":"90 мин","props":"жетоны, маршрутные карточки, оборудование «учреждений»","b":"Площадка превращается в город с почтой, магазином, фабрикой игрушек, кинотеатром и стадионом. У каждого роль и жетоны, за нарушение вежливости жетон отбирают. Дети ходят по маршрутным карточкам. В конце называют тех, кто ни разу не нарушил правил.","p":["Событие"],"id":"городвежливых","i":114},{"t":"Город из букв","a":[2,3],"ty":"Следопытство и ориентирование","goal":"Разведка, командность","n":"2 отряда","time":"2 часа","props":"щиты 50×50 см с буквами на колышках, шапочки двух цветов, горн","b":"Щиты с буквами названия города расставлены по обе стороны просеки, видны с 10-12 м. Каждая команда делится на защитников (треть) и нападающих. Нападающие находят буквы на чужой стороне, возвращаются и сообщают, складывая название. Сорвать шапочку у соперника - 10 очков, найти букву - 10, потерявший шапочку идёт за новой.","p":["Следопытство"],"id":"городизбукв","i":115},{"t":"Города (мяч)","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Реакция, счёт, память","n":"8-20","time":"10-15 мин","props":"мяч, мел","b":"Каждый выбирает название города. Ведущий подбрасывает мяч и называет город. Игрок, чей город назван, должен поймать мяч (если нет - все разбегаются). Поймав мяч, кричит «Стоп!», выбирает любой город, называет число километров (шагов) до него и идёт считать шаги. Если достанет рукой - игроки меняются ролями.","p":["Движение и разминка","Внимание и мышление"],"id":"города","i":116},{"t":"Горячие ручки","a":[1],"ty":"Подвижные и эстафеты","goal":"Реакция","n":"6-20","time":"5-10 мин","props":"нет","b":"Игроки вытягивают руки ладонями вверх. Водящий ходит по кругу и старается хлопнуть кого-нибудь по ладони, а тот отдёргивает руки. Хлопнули - меняетесь ролями. При большой группе водят двое.","p":["Движение и разминка","Внимание и мышление"],"id":"горячиеручки","i":117},{"t":"Горячий стул","a":[3],"ty":"В кругу, на месте и в тишине","goal":"Обратная связь","n":"10-20","time":"15-20 мин","props":"стул","b":"Желающий садится в центр, остальные говорят, с чем или кем он ассоциируется и какие чувства вызывает. Затем обсуждаем переживания. Подходит только группам с высоким уровнем доверия, правило: не оценивать друг друга.","p":["Итоги и разговор"],"id":"горячийстул","i":118},{"t":"Градусник","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Командная работа","n":"две команды","time":"10 мин","props":"пустая бутылка 1,5 л или муляж градусника","b":"Передаём «градусник» по цепочке без помощи рук, каждый держит его под мышкой или зажимает между собой и соседом.","p":["Движение и разминка"],"id":"градусник","i":119},{"t":"Границы - скажи «стоп»","a":[3],"ty":"Знакомство и сплочение","goal":"Понять личные границы","n":"парами","time":"10 мин","props":"нет","b":"Один подходит к партнёру разными способами, второй говорит «Стоп», когда подошли слишком близко. Обсуждаем, что чувствовали и у всех ли границы одинаковые.","p":["Доверие","Сплочение"],"id":"границыскажистоп","i":120},{"t":"Громче - тише","a":[1,2],"ty":"В кругу, на месте и в тишине","goal":"Слух, внимание","n":"8-20","time":"10 мин","props":"небольшой предмет, гитара по желанию","b":"Водящий выходит, остальные прячут предмет. Водящий ищет, а все поют знакомую песню: громче, когда он приближается, тише, когда удаляется. Нашёл - водящий меняется.","p":["Внимание и мышление"],"id":"громчетише","i":121},{"t":"Групповая картинка","a":[1,2,3],"ty":"Творческие и интеллектуальные","goal":"Сплочение","n":"любое","time":"10 мин","props":"листы, фломастеры","b":"Каждый подписывает лист и делает один-два штриха. Лист идёт по кругу, все дорисовывают. Лист возвращается хозяину.","p":["Творчество","Сплочение"],"id":"групповаякартинка","i":122},{"t":"Гуляющий алфавит","a":[1,2,3],"ty":"Подвижные и эстафеты","goal":"Знания, быстрота","n":"команды","time":"15 мин","props":"карточки с буквами","b":"Команды получают одинаковый набор букв. Ведущий задаёт вопрос (например, из Библии), команда решает, кто выходит вперёд и становится в правильном порядке, составляя слово ответа.","p":["Движение и разминка"],"id":"гуляющийалфавит","i":123},{"t":"Гусеница (сцепка телами)","a":[3],"ty":"Знакомство и сплочение","goal":"Смех","n":"8-16","time":"10 мин","props":"записки с частями тела","b":"Скрытая версия: в мешок кладут записки «ладонь», «плечо», «спина»; участники по очереди соединяются в цепь, касаясь указанными частями. Важно выбирать безопасные части и не принуждать.","p":["Сплочение"],"id":"гусеница","i":124},{"t":"Гусеница с шарами","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Командность","n":"команды по 5-8","time":"10 мин","props":"воздушные шарики, стулья, верёвки","b":"Колонна, руки на плечах. Между животом заднего и спиной переднего зажат шар. Первый держит свой на вытянутых руках. Пройти по маршруту с препятствиями, не касаясь шаров руками.","p":["Движение и разминка"],"id":"гусеницасшарами","i":125},{"t":"Да и нет по-болгарски","a":[1,2,3],"ty":"В кругу, на месте и в тишине","goal":"Внимание","n":"любое","time":"5 мин","props":"нет","b":"Ведущий напоминает, что у болгар кивок головой означает «нет», а покачивание - «да». Задаёт вопросы по-русски, а все отвечают словами по-русски, но жестами по-болгарски. Путаница гарантирована.","p":["Успокоение","Внимание и мышление"],"id":"даинетпоболгарски","i":126},{"t":"Да-нет (большой палец)","a":[2,3],"ty":"В кругу, на месте и в тишине","goal":"Увидеть общее и особенное","n":"любое","time":"5-10 мин","props":"нет","b":"Ведущий произносит утверждения: если согласен, большой палец вверх, нет - вниз. От лёгких («Я люблю футбол») к серьёзным («Мне бывает одиноко»). Хороший переход к серьёзной теме.","p":["Итоги и разговор"],"id":"данет","i":127},{"t":"Дай ответ","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Внимание, самообладание","n":"12-30","time":"5-10 мин","props":"нет","b":"Две шеренги в 3-4 м друг от друга. Ведущий по очереди задаёт каждой вопросы, но отвечать нельзя. Кто ответил, выполняет шуточный штраф (спеть, станцевать). Выигрывает команда с меньшим числом ошибок. За нарочные ответы игрока можно отстранить.","p":["Движение и разминка","Внимание и мышление"],"id":"дайответ","i":128},{"t":"Два вола","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Сила, смех","n":"2","time":"5 мин","props":"длинная верёвка, приз","b":"Верёвку надевают как упряжку на двоих, каждый тянет к призу в своей стороне. Тот, кто дотянулся до своего приза, побеждает. Верёвку лучше брать мягкую и накидывать на пояс.","p":["Движение и разминка"],"id":"двавола","i":129},{"t":"Два кольца","a":[2,3],"ty":"Подвижные и эстафеты","goal":"Равновесие, тактика","n":"8-20","time":"10 мин","props":"мел","b":"Вокруг нарисованного кольца стоят, взявшись за руки. Внутри большого кольца малое. Находиться можно только вне большого кольца или внутри малого. Нужно заставить других наступить на запретную территорию, самому удержавшись. Без грубой силы.","p":["Движение и разминка"],"id":"двакольца","i":130},{"t":"Два круга","a":[1,2,3],"ty":"Знакомство и сплочение","goal":"Словарный запас, реакция","n":"8-20","time":"10 мин","props":"нет","b":"Малый круг (3-4 человека) идёт с ведущим и говорит «С собой берём сладкое». Дети большого круга быстро называют сладкое, первый переходит в малый. Потом «мягкое», «кислое», «твёрдое». Последнего просто хвалят и дают весёлое задание.","p":["Знакомство","Внимание и мышление"],"id":"двакруга","i":131},{"t":"Два паровозика","a":[2,3],"ty":"Знакомство и сплочение","goal":"Доверие, ответственность","n":"10-30","time":"10 мин","props":"просторное помещение","b":"Команды по 5-6 человек - «паровозики»: первый видит, остальные идут с закрытыми глазами, держась за плечи. Паровозики двигаются, не задевая друг друга. По касанию ведущего последний «вагон» переходит в голову поезда. Ведущий следит за безопасностью.","p":["Доверие","Сплочение"],"id":"двапаровозика","i":132},{"t":"Двугорбый верблюд","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Согласованность","n":"пары","time":"10 мин","props":"два волейбольных мяча на пару","b":"Двое друг за другом наклонились, второй держится за пояс первого, на спинах лежат мячи-горбы. Пройти до поворота и обратно, придерживая мячи и не расцепляясь.","p":["Движение и разминка"],"id":"двугорбыйверблюд","i":133},{"t":"Дедушка водяной","a":[1],"ty":"В кругу, на месте и в тишине","goal":"Внимание, тактильное восприятие","n":"8-20","time":"5-10 мин","props":"повязка","b":"Водяной сидит с закрытыми глазами, остальные идут по кругу и поют «Дедушка Водяной, что сидишь ты под водой? Выйди на минуточку, поиграем в шуточку!». Водяной касается одного игрока и угадывает. Угадал - тот становится водяным.","p":["Внимание и мышление"],"id":"дедушкаводяной","i":134},{"t":"День и ночь","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Размяться, развить реакцию","n":"12-30","time":"5-10 мин","props":"нет","b":"Две шеренги: «День» и «Ночь» на линиях по краям, ведущий между ними. На команду «День!» догоняет команда «День», на «Ночь!» - ночная. Осаленные переходят в команду соперника.","p":["Движение и разминка","Внимание и мышление"],"id":"деньиночь","i":135},{"t":"День медика (станционная игра)","a":[1,2,3],"ty":"Следопытство и ориентирование","goal":"Закрепление первой помощи","n":"отряды","time":"до 60 мин на отряд","props":"карты, компасы, маршрутные листы, материалы постов","b":"Отряды стартуют по очереди (интервал 5-15 минут) с картой и компасом и проходят санитарные посты по порядку. Посты: транспортировка пострадавшего (младшие вдвоём, средние «сиденьем» из рук, старшие носилки из жердей и курток, 25-30 м), экология (узнать лекарственные растения и ядовитые - борщевик, болиголов), доврачебная помощь по возрасту (носовое кровотечение, порезы, ожог борщевиком, тепловой удар, переломы, укусы, сотрясение). Руководитель поста ставит отметку «отлично», «хорошо» или «плохо» в маршрутный лист своим цветом. Побеждает команда с большим числом «отлично». Награждают на линейке. Название можно менять: «День туриста», «День геолога».","p":["Следопытство"],"id":"деньмедика","i":136},{"t":"Держи свою мелодию","a":[2,3],"ty":"В кругу, на месте и в тишине","goal":"Концентрация","n":"любое","time":"5-10 мин","props":"нет","b":"Каждый выбирает песню. По одному хлопку ведущего все поют про себя, по двум - вслух громко. Задача - не сбиться с мелодии и слов. Сбился - выбыл. Победитель получает право допеть любимый куплет без помех.","p":["Успокоение"],"id":"держисвоюмелодию","i":137},{"t":"Детективы (да, нет, может быть)","a":[2,3],"ty":"В кругу, на месте и в тишине","goal":"Логика","n":"8-20","time":"10-15 мин","props":"нет","b":"Один-двое «детективов» выходят, им говорят, что надо «раскрыть преступление», задавая вопросы с ответом «да», «нет» или «может быть». Группа отвечает по тайному правилу (последняя буква вопроса: гласная - да, согласная - нет, мягкий знак - может быть). Цель: догадаться, как их «дурачат».","p":["Успокоение","Внимание и мышление"],"id":"детективы","i":138},{"t":"Джойстик","a":[2,3],"ty":"Знакомство и сплочение","goal":"Слаженность","n":"10-20","time":"5-10 мин","props":"монета","b":"Все в цепочке держат соседа за большой палец. Первый тянет руку над столом, где лежит предмет. Все закрывают глаза, кроме последнего, он «управляет джойстиком» через цепочку нажатий. Цель - опустить палец первого точно на предмет. Для соревнования нужны независимые судьи.","p":["Сплочение"],"id":"джойстик","i":139},{"t":"Диалог","a":[2,3],"ty":"Творческие и интеллектуальные","goal":"Воображение, актёрство","n":"6-20","time":"40 мин","props":"нет","b":"Дан набор реплик: «Что случилось? - Ничего. - Ты что с ума сошёл? - А в чём дело? - Помогите». Группы придумывают и показывают ситуацию, в которой это может быть сказано. Потом сравниваем сценки.","p":["Творчество"],"id":"диалог","i":140},{"t":"Дизайнеры-модельеры","a":[1,2,3],"ty":"Творческие и интеллектуальные","goal":"Творчество","n":"команды","time":"20 мин","props":"старые футболки, брызгалки с красками (пищевые красители)","b":"Команды украшают футболку из пульверизаторов или краской. Победителя выбирают зрители, футболки на память участникам. Только на улице.","p":["Творчество"],"id":"дизайнерымодельеры","i":141},{"t":"Доверяющее падение","a":[3],"ty":"Знакомство и сплочение","goal":"Доверие","n":"7-15","time":"10 мин","props":"невысокая опора","b":"Игрок падает спиной с небольшой высоты на сцепленные руки группы. Обязательно подготовить «ловцов», объяснить технику и помнить о безопасности.","p":["Доверие","Сплочение"],"id":"доверяющеепадение","i":142},{"t":"Дом (ролевая сказка)","a":[1,2],"ty":"Творческие и интеллектуальные","goal":"Разрядка, диагностика настроения группы","n":"6-20","time":"8-10 мин","props":"нет","b":"Ведущий рассказывает про дом, а дети по желанию берут роли: крыша, стены, окошко, кошка, кактус, дождик, крылечко, лягушка, ветер. Роли должны хватить почти на всех. Игра показывает настроение в группе: люди выбирают роль, созвучную состоянию. Конец у сказки хороший.","p":["Творчество"],"id":"дом","i":143},{"t":"Дом - дерево - собака","a":[1,2,3],"ty":"Знакомство и сплочение","goal":"Сработанность без слов","n":"пары","time":"10 мин","props":"ватман, один фломастер на пару, повязки","b":"Пара с завязанными глазами одним фломастером на двоих молча рисует дом, дерево и собаку.","p":["Сплочение"],"id":"домдеревособака","i":144},{"t":"Домики","a":[1],"ty":"Подвижные и эстафеты","goal":"Внимание, реакция","n":"8-25","time":"10 мин","props":"мел","b":"Кружков-домиков на один меньше, чем игроков. Водящий обходит домики и рассказывает историю («пошли погулять гномики, оставили домики...»), собирая игроков в цепочку. Неожиданно: «По домам!». Кто остался без дома, водит.","p":["Движение и разминка","Внимание и мышление"],"id":"домики","i":145},{"t":"Достань коробок","a":[2,3],"ty":"Подвижные и эстафеты","goal":"Смех, ловкость","n":"2-4","time":"5 мин","props":"табурет, спичечный коробок (пустой)","b":"Сидя на табуретке с поджатыми ногами достать зубами коробок за задней ножкой, не касаясь пола руками и ногами.","p":["Движение и разминка"],"id":"достанькоробок","i":146},{"t":"Достань яблоко","a":[1,2,3],"ty":"Подвижные и эстафеты","goal":"Ловкость, летняя игра","n":"4-12","time":"10 мин","props":"таз с водой, яблоки","b":"Руки за спиной, зубами достать яблоко из воды. Играть в тёплую погоду.","p":["Движение и разминка"],"id":"достаньяблоко","i":147},{"t":"Дотронься до...","a":[1],"ty":"В кругу, на месте и в тишине","goal":"Внимание","n":"8-30","time":"5 мин","props":"нет","b":"Ведущий называет: «Дотронься до дерева, железа, красного, ткани». Дотрагиваться можно до чего угодно или кого угодно, только не до себя.","p":["Заполнить паузу","Внимание и мышление"],"id":"дотроньсядо","i":148},{"t":"Дубинушка","a":[1,2],"ty":"В кругу, на месте и в тишине","goal":"Внимание, смех","n":"8-20","time":"10 мин","props":"свёрнутая газета","b":"Все в кругу, у каждого название (фрукт, животное). В центре ведущий с газетой. Игроки называют себя и чужое название («лев - тигр»), названный должен тут же продолжить. Забылся и ведущий успел «стукнуть» - меняются.","p":["Внимание и мышление"],"id":"дубинушка","i":149},{"t":"Дуй на купюру (бумажку)","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Смех, дыхание","n":"4-12","time":"5 мин","props":"бумажные листочки","b":"С трёх попыток «отдуть» листочек как можно дальше. После каждой попытки подходим к месту, где он упал. Вариант: командная эстафета.","p":["Движение и разминка"],"id":"дуйнакупюру","i":150},{"t":"Дурдом (воздушные шары)","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Размяться, смех","n":"10-40","time":"5 мин","props":"30 воздушных шаров","b":"Две шеренги по обе стороны линии, на полу около 30 шаров. По сигналу каждая команда выбрасывает шары со своей территории на чужую. Через несколько минут подсчитывают, где их меньше.","p":["Движение и разминка"],"id":"дурдом","i":151},{"t":"Дурэстафета","a":[1,2,3],"ty":"Подвижные и эстафеты","goal":"Смех, командность","n":"2-4 команды","time":"30 мин","props":"шишки, ведро, шарики, стаканы с водой, табуретки, канат, палка с резиной","b":"Серия смешных этапов: «Стрельба» шишками в ведро; «Бадминтон» - ракеткой довести шарик до ведра; «Подводное плавание» - бег со стаканом воды над головой; «Скачки» - на табуретке; «Ночное ориентирование» - с завязанными глазами, команда направляет голосом; «Спортивная ходьба» - лилипутскими шажками; «Прыжки в длину» - каждый следующий прыгает от места приземления предыдущего; «Перетягивание» - канат между ног, команды спиной друг к другу; «Штангисты» - палка с бутафорскими дисками и резиновым жгутом, который держат ногами.","p":["Движение и разминка"],"id":"дурэстафета","i":152},{"t":"Енотовы круги","a":[2,3],"ty":"Знакомство и сплочение","goal":"Командность","n":"8-20","time":"10 мин","props":"верёвочное кольцо, повязки","b":"Все с завязанными глазами держатся за кольцо. По команде нужно построить фигуру: треугольник, квадрат. Рядом наблюдатель с открытыми глазами.","p":["Сплочение"],"id":"енотовыкруги","i":153},{"t":"Ехали цыгане","a":[2,3],"ty":"Знакомство и сплочение","goal":"Выявить роли в группе","n":"две группы по 10","time":"15-20 мин","props":"нет","b":"Группа показывает «цыганскую повозку» из людей: телега, лошади, колёса, стены, крыша, кучер, пассажиры, жеребёнок на привязи (3-5 минут на подготовку). Интерпретация: кучер - лидер-организатор, стены и крыша - надёжные исполнители, колёса и лошади - лидеры помельче, жеребёнок - «выпавший», но с претензиями, пассажиры - основная масса. Потом спросить, все ли согласны со своей ролью. Это инструмент наблюдения, а не оценка детей.","p":["Сплочение"],"id":"ехалицыгане","i":154},{"t":"Желейные китайцы","a":[1,2,3],"ty":"Подвижные и эстафеты","goal":"Смех, ловкость","n":"команды","time":"10 мин","props":"желе, спички или зубочистки","b":"Съесть желе как можно быстрее, пользуясь только спичками или зубочистками (можно использовать палочки-шпажки без острых концов, следить за безопасностью).","p":["Движение и разминка"],"id":"желейныекитайцы","i":155},{"t":"Животные на спину","a":[1,2],"ty":"Знакомство и сплочение","goal":"Вопросы, общение","n":"8-25","time":"10-15 мин","props":"картинки, скотч","b":"На спину крепят картинку животного. Игрок угадывает, задавая другим вопросы с ответом «да» или «нет» («У меня есть перья?»). Угадал - вешают следующее. Вариант: качества людей из отряда (только добрые).","p":["Знакомство"],"id":"животныенаспину","i":156},{"t":"Живые картины","a":[2,3],"ty":"Творческие и интеллектуальные","goal":"Выразительность, сплочение","n":"2 команды","time":"15-20 мин","props":"нет","b":"Первая команда придумывает картину (сюжет, сказку), вторая молча изображает её скульптурной группой. Один из второй команды ждёт за дверью, потом входит и угадывает сюжет. Затем меняются.","p":["Творчество","Сплочение"],"id":"живыекартины","i":157},{"t":"Жизненная линия","a":[3],"ty":"В кругу, на месте и в тишине","goal":"Самопознание","n":"до 20","time":"20-30 мин","props":"бумага, фломастеры","b":"Каждый рисует шкалу жизни и отмечает 8-12 событий: хорошие вверх, плохие вниз. Точки соединяются линией. Делиться по желанию.","p":["Итоги и разговор"],"id":"жизненнаялиния","i":158},{"t":"Жучок","a":[1,2],"ty":"В кругу, на месте и в тишине","goal":"Внимание","n":"6-15","time":"5-10 мин","props":"нет","b":"Водящий становится спиной к полукругу, правой ладонью закрывает правую сторону лица, левую руку держит у бока ладонью наружу. Один из игроков легонько хлопает по ладони, и все выставляют правую руку с поднятым большим пальцем. Водящий оборачивается и угадывает. Угадал - тот становится водящим.","p":["Успокоение","Внимание и мышление"],"id":"жучок","i":159},{"t":"За границу!","a":[2,3],"ty":"В кругу, на месте и в тишине","goal":"Логика","n":"любое","time":"10 мин","props":"нет","b":"Ведущий - таможенник, спрашивает «Какой один предмет возьмёшь с собой?». Пропускает, если предмет на первую букву имени (или другое тайное правило). Задача игроков - понять правило.","p":["Успокоение","Внимание и мышление"],"id":"заграницу","i":160},{"t":"Завяжи верёвку","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Ловкость","n":"пары","time":"10 мин","props":"верёвки","b":"Один в паре завязывает 5 узлов, а партнёр как можно скорее их развязывает.","p":["Движение и разминка"],"id":"завяживеревку","i":161},{"t":"Загадочные числа","a":[2,3],"ty":"В кругу, на месте и в тишине","goal":"Логика","n":"6-15","time":"5-10 мин","props":"палочки","b":"Ведущий выкладывает из палочек странные фигуры и говорит, что так древнее племя писало 4, 5 и другие. Секрет в том, сколькими пальцами ведущий касается земли, называя число.","p":["Заполнить паузу","Внимание и мышление"],"id":"загадочныечисла","i":162},{"t":"Загадочный сундук","a":[1,2,3],"ty":"Подвижные и эстафеты","goal":"Смех","n":"2 или команды","time":"10 мин","props":"два чемодана с одеждой, повязки","b":"Игрокам завязывают глаза, и они по сигналу надевают на себя всё из чемодана. Побеждает тот, кто быстрее оделся.","p":["Движение и разминка"],"id":"загадочныйсундук","i":163},{"t":"Задави змею","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Реакция","n":"12-30","time":"10 мин","props":"верёвочки","b":"«Змеи» держат один конец верёвки и трясут так, чтобы она извивалась, и бегают по площадке. «Ловцы» должны наступить на хвост. Выпустивший верёвку становится ловцом, и наоборот.","p":["Движение и разминка","Внимание и мышление"],"id":"задавизмею","i":164},{"t":"Зажигается свеча (воронка)","a":[2,3],"ty":"В кругу, на месте и в тишине","goal":"Фокус, смех","n":"2-6","time":"5 мин","props":"воронка, свеча","b":"Нужно как можно быстрее задуть свечу через воронку с расстояния 50 см. Получится, только если пламя находится на продолжении стороны воронки. Следим за безопасностью и огнём.","p":["Успокоение"],"id":"зажигаетсясвеча","i":165},{"t":"Заколдованный мир","a":[1],"ty":"В кругу, на месте и в тишине","goal":"Внимание","n":"8-30","time":"5-10 мин","props":"свисток","b":"Волшебник заколдовывает город: на свисток все мгновенно замирают в той позе, в которой были. Через несколько десятков секунд чары снимаются. Хорошо вставлять посреди любой другой игры.","p":["Заполнить паузу","Внимание и мышление"],"id":"заколдованныймир","i":166},{"t":"Законники","a":[2,3],"ty":"Творческие и интеллектуальные","goal":"Командность","n":"2 команды","time":"10 мин","props":"записки со словами","b":"Фразу-«закон» разрезают на отдельные слова, записки перемешивают. Какая команда соберёт фразу по порядку быстрее?","p":["Внимание и мышление"],"id":"законники","i":167},{"t":"Закрашивание контура человека","a":[2,3],"ty":"Творческие и интеллектуальные","goal":"Связать чувства и тело","n":"любое","time":"15-20 мин","props":"листы с контуром человека, фломастеры","b":"Под спокойную музыку вспоминаем, когда испытывали чувство, где оно ощущалось в теле, и закрашиваем этот участок контура цветом.","p":["Творчество"],"id":"закрашиваниеконтурачеловека","i":168},{"t":"Западня","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Внимание, реакция","n":"12-30","time":"10 мин","props":"нет","b":"Два круга движутся в разные стороны, по сигналу внутренний поднимает руки «воротами». Внешние пробегают под ними туда-сюда. Неожиданно ворота опускают, и все, кто остался внутри, попали в «западню» и присоединяются к внутреннему кругу. Остаются три победителя.","p":["Движение и разминка","Внимание и мышление"],"id":"западня","i":169},{"t":"Запрещённое движение","a":[1],"ty":"В кругу, на месте и в тишине","goal":"Внимание, самоконтроль","n":"8-25","time":"5 мин","props":"музыка","b":"Под музыку дети повторяют за ведущим движения руками на каждый такт. Затем договариваемся об одном «запрещённом» движении: кто его повторил, выбывает. Хорошо успокаивает слишком активных детей.","p":["Успокоение","Внимание и мышление","Движение и разминка"],"id":"запрещенноедвижение","i":170},{"t":"Заря","a":[1],"ty":"В кругу, на месте и в тишине","goal":"Размяться, потренировать внимание","n":"10-25","time":"5-10 мин","props":"лента или платок","b":"Дети стоят в кругу, руки за спиной. Водящий («заря») ходит снаружи круга с лентой и проговаривает речёвку. На последнем слове он тихо кладёт ленту на плечо кому-то из игроков. Тот хватает ленту и оба бегут по кругу в разные стороны: кто опоздал занять свободное место, становится новой зарёй. Бежать можно только снаружи круга, оборачиваться нельзя.","p":["Внимание и мышление"],"id":"заря","i":171},{"t":"Захват флага","a":[2,3],"ty":"Музыка, праздники и большие игры","goal":"Тактика, командная игра","n":"12-40","time":"30-60 мин","props":"2 флага, ленты","b":"Территорию делим на две половины. Каждая команда вешает свой флаг и охраняет не более 3 человек в радиусе 4-5 м от флага (внутри этой зоны охраняющие не салят). Цель: захватить флаг соперника и пронести на свою территорию. Салить можно только на своей территории. Пойманных отводят в «тюрьму», их может освободить касанием игрок их команды. Освобождённый и освободитель идут домой беспрепятственно.","p":["Событие"],"id":"захватфлага","i":172},{"t":"Зашифрованная фраза","a":[2,3],"ty":"В кругу, на месте и в тишине","goal":"Командная работа","n":"8-25","time":"10 мин","props":"нет","b":"Один выходит. Остальным раздаются слова известной фразы из песни. Вошедший должен догадаться: либо все кричат свои слова одновременно, либо он задаёт вопросы, а ответ содержит слово из фразы.","p":["Движение и разминка"],"id":"зашифрованнаяфраза","i":173},{"t":"Заяц, петляющий по лесу","a":[1,2],"ty":"Подвижные и эстафеты","goal":"Ловкость","n":"команды","time":"10 мин","props":"3-4 стула","b":"Игрок опирается на руки, прыгает ногами вперёд, огибая стулья-деревья, как заяц, и возвращается тем же способом.","p":["Движение и разминка"],"id":"заяцпетляющийполесу","i":174},{"t":"Звезда из газеты","a":[1,2],"ty":"В кругу, на месте и в тишине","goal":"Аккуратность","n":"любое","time":"5 мин","props":"газеты","b":"За 3 минуты сделать из газеты самую ровную и большую пятиконечную звезду, отрывая лишнее.","p":["Заполнить паузу"],"id":"звездаизгазеты","i":175},{"t":"Звезда шерифа","a":[1,2,3],"ty":"Музыка, праздники и большие игры","goal":"Командная игра на территории","n":"весь лагерь","time":"60-90 мин","props":"погоны-«жизни», записки, факелы или фонарики, жетон","b":"Шериф потерял жетон, видимо, украли индейцы (их играют вожатые, у каждого 15 «жизней»-погон). Отряды ловят индейцев, ведут в беседку и обыскивают, находят записки. Командиры расшифровывают описание тайников: жетон в пещере духа Мониту. Все ищут факелы и зажигают священный огонь, младшие отвлекают Мониту песнями и танцами, средние забирают жетон. Жетон приносят шерифу и «получают счастье». Для младших отрядов оставить только поиск факелов и возврат жетона.","p":["Событие"],"id":"звездашерифа","i":176},{"t":"Звериное семейство","a":[1,2],"ty":"Знакомство и сплочение","goal":"Разбиться на команды, посмеяться","n":"8-30","time":"10 мин","props":"записки с «членами семейств»","b":"На записках члены звериных семей (дед-обезьяна, баба-обезьяна, папа, мама, сын, дочка), также лягушки, свиньи и т.д. Каждый вытягивает записку, затем
