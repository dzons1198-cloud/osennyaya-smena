,"id":"змея","i":180},{"t":"Знакомство (танец-игра)","a":[1,2],"ty":"Знакомство","goal":"Знакомство","n":"чётное, парами в двух кругах","time":"10 мин","props":"музыка","b":"Внутренний и внешний круги бегут в разные стороны под музыку. Когда музыка останавливается, каждый подаёт руку и знакомится с тем, кто напротив. При следующей встрече с уже знакомыми приветствуют поднятой рукой. После 5-6 раз общий танец с последним знакомым.","p":["Знакомство"],"id":"знакомство","i":181},{"t":"Знаменитые люди","a":[2,3],"ty":"Словесные и интеллектуальные","goal":"Эрудиция","n":"6-25","time":"10 мин","props":"нет","b":"Игрок описывает знаменитую личность или героя, не называя имени. Кто первым угадал, загадывает следующего.","p":["Внимание и мышление"],"id":"знаменитыелюди","i":182},{"t":"Золотой ключик (нос и ключ)","a":[1,2],"ty":"Эстафеты и состязания","goal":"Командная ловкость","n":"2 команды по 6-8","time":"10-15 мин","props":"бумажные «носы» на резинке, колечко с ключиком, стулья","b":"Игроки с бумажным носом на резинке по очереди переносят ключ на кольце носом на нос следующему, обегая стул. Побеждает команда, закончившая первой.","p":["Движение и разминка"],"id":"золотойключик","i":183},{"t":"Золотые ворота (планеты)","a":[1,2],"ty":"Подвижные","goal":"Размяться, внимание","n":"12-30","time":"10 мин","props":"музыка","b":"Группы по 3-4 человека («планеты») встают кругом и держатся за руки, остальные змейкой за талию пробегают под поднятыми руками. На стоп-сигнал или слова «Золотые ворота пропускают не всегда...» руки опускаются, пойманные присоединяются к планетам. Побеждает самый шустрый.","p":["Движение и разминка","Внимание и мышление"],"id":"золотыеворота","i":184},{"t":"Золушка","a":[1,2],"ty":"Эстафеты и состязания","goal":"Тактильное внимание","n":"2-6","time":"10 мин","props":"смесь гороха, фасоли, чечевицы, повязки","b":"Разобрать на кучки 3-4 вида круп с завязанными глазами. Чужая крупа в куче - штраф два зерна.","p":["Движение и разминка","Внимание и мышление"],"id":"золушка","i":185},{"t":"Зомби (завернуть пакет одной рукой)","a":[2,3],"ty":"Эстафеты и состязания","goal":"Взаимодействие","n":"2 пары","time":"10 мин","props":"свёртки, тесёмка","b":"Пара стоит рядом, внутренние руки связаны (мягкой лентой). Свободными руками нужно завернуть свёрток, обвязать тесёмкой и завязать бантик.","p":["Движение и разминка","Сплочение"],"id":"зомби","i":186},{"t":"Зоопарк (сюжетная игра)","a":[1],"ty":"Творческие и ролевые","goal":"Знания о природе, рассказывание","n":"группы по 4-6","time":"60 мин","props":"картинки, пластилин, бумага, клей, кубики","b":"Группы строят «зоопарки»: решают, какие животные, из чего делают вольеры, кто экскурсовод. Лепят и рисуют животных, готовят рассказ: где живёт, чем питается, чем полезно. Потом группы ходят друг к другу на экскурсии и задают вопросы. Не знаешь ответ - ищи в книгах или спроси взрослых.","p":["Творчество"],"id":"зоопарк","i":187},{"t":"И нет человека","a":[1,2],"ty":"Тихие и спокойные","goal":"Внимание, память","n":"от 8","time":"5-10 мин","props":"одеяло","b":"Водящий выходит, группа накрывает одеялом одного игрока, остальные меняются местами. Водящий должен угадать, кто пропал и где сидел.","p":["Успокоение","Внимание и мышление"],"id":"инетчеловека","i":188},{"t":"Иванка","a":[1,2],"ty":"Подвижные","goal":"Размяться, развить ловкость","n":"10-20","time":"10 мин","props":"мел, прутик","b":"Рисуем круг 5-10 м (это лес) и квадрат внутри (дом лесовика). В доме стоит Иванка, лесовик охраняет, остальные - лебеди. Лебеди залетают в лес и пытаются вывести Иванку, а лесовик ловит их рукой или прутиком. Кто вывел Иванку, становится лесовиком. В дом заходить нельзя, лесовик обязан двигаться по площадке, а не стоять у дома.","p":["Движение и разминка"],"id":"иванка","i":189},{"t":"Игра по станциям (шаблон)","a":[1,2,3],"ty":"Большие игры","goal":"Универсальная форма для любой темы","n":"отряды","time":"1-2 часа","props":"по теме","b":"Универсальная форма: отряды ходят по станциям с заданиями. Для подготовки определите цель, тему, место, материалы, способ проведения и время. Менять можно тему и подачу, а структура остаётся.","p":["Событие"],"id":"играпостанциям","i":190},{"t":"Игроград","a":[2,3],"ty":"Большие игры","goal":"Командная сюжетно-ролевая игра на несколько дней","n":"5 народов по 10-25","time":"1-3 дня","props":"валюта «блики», реликвии, карта города, жетоны «Нить Жизни»","b":"Подготовка: каждый народ пишет легенду, распределяет роли (предводитель, хранитель очага, хранитель реликвий, посол), изготавливает реликвию и готовит представление. На открытии на площади («торжище») народы рассказывают о себе, а Верховный Маг объявляет: тёмные силы похитили главные реликвии и раздали другим народам. До установленного времени каждый народ должен вернуть свою, иначе «перестаёт существовать».\nРеликвию можно купить (в казне 100 «бликов»), обменять на другую реликвию или на «Нити Жизни» или выиграть в честном поединке на Ристалище. Проигравший теряет «Нить Жизни» и на час уходит в «Страну Мёртвых». В кварталах народов работают правительство, мудрецы, мастерские, принимают посольства, заключают союзы. Маги (вожатые) судят споры, продают сведения, у них свой «график настроения», который меняется каждые три часа. Волшебные вещи: карта города, заклинание (один честный ответ Верховного Мага), кольцо бессмертия (любое одно решение). В конце на площади показывают добытое и вручают знаки города.","p":["Событие"],"id":"игроград","i":191},{"t":"Игры на внимание: искра, ритм, тишина, пальцы","a":[1,2,3],"ty":"Пятиминутки на ожидание","goal":"Собрать внимание","n":"любое","time":"3-5 мин","props":"нет","b":"«Искра» - хлопок по кругу как можно быстрее; «Ритм» - повторить ритм ведущего, каждый хлопает один раз; «Тишина» - сосчитать звуки в комнате и на улице; «Пальцы» - ведущий быстро показывает числа пальцами, все хором называют. Подходят в начале занятия.","p":["Заполнить паузу","Внимание и мышление","Успокоение"],"id":"игрынавниманиеискраритмтишинапальцы","i":192},{"t":"Идеальный вожатый / идеальный ребёнок в лагере","a":[2,3],"ty":"Рефлексия и разговор","goal":"Договориться об ожиданиях","n":"группы до 10","time":"20-30 мин","props":"ватман, маркеры, журналы, клей","b":"В группах один ложится на лист, второй обводит контур, затем дорисовывают лицо и пишут черты «идеального вожатого» или «идеального ребёнка». Работы вывешивают и защищают. Хорошо в первые дни смены для составления правил отряда.","p":["Итоги и разговор"],"id":"идеальныйвожатыйидеальныйребеноквлагере","i":193},{"t":"Изготовим крышечки","a":[1,2],"ty":"Тихие и спокойные","goal":"Глазомер","n":"4-10","time":"10 мин","props":"банки разной формы, картон, ножницы","b":"Банки на столе издали, трогать нельзя. Нужно вырезать крышки, которые подойдут к каждой банке. Побеждает тот, у кого больше точных совпадений.","p":["Успокоение"],"id":"изготовимкрышечки","i":194},{"t":"Изучаем азбуку","a":[2,3],"ty":"Словесные и интеллектуальные","goal":"Фантазия, смех","n":"8-25","time":"10 мин","props":"нет","b":"Начинаем с буквы А и по алфавиту каждый придумывает фразу-поздравление, начинающуюся на эту букву. Весело на Г, Ж, П, Ы, Ь, Ъ. Приз за самую смешную.","p":["Внимание и мышление","Творчество"],"id":"изучаемазбуку","i":195},{"t":"Изюминка","a":[2],"ty":"Подвижные","goal":"Меткость, внимание","n":"16-30","time":"15 мин","props":"мячи","b":"Круг, внутри одна команда, снаружи другая. Некоторым игрокам снаружи тайно дают мячи и номера, номера знает ведущий. Ведущий называет номер, и этот игрок кидает мяч в «кругового». Осаленный выбывает, промазавший выбывает сам и передаёт мяч другому. Игра идёт, пока в команде не останется один игрок.","p":["Движение и разминка","Внимание и мышление"],"id":"изюминка","i":196},{"t":"Имена на ритм","a":[1,2,3],"ty":"Знакомство","goal":"Запомнить имена, внимание","n":"8-25","time":"10 мин","props":"нет","b":"Каждый выбирает имя из двух слогов с ударением на первый. Ведущий задаёт ритм хлопками: «Катя-Катя - Петя-Петя». Названный сразу называет два раза себя и два раза другого. Темп растёт. Ошибившийся получает смешное прозвище и далее отзывается только на него. Третья ошибка - выбывает.","p":["Знакомство","Внимание и мышление"],"id":"именанаритм","i":197},{"t":"Индикатор","a":[3],"ty":"Сплочение","goal":"Выявление лидера","n":"8-20","time":"5-10 мин","props":"просторное помещение","b":"Четыре движения: руки вверх, присесть, сойтись в центр, разойтись к стенам. Задача: чтобы как можно больше людей делали одно и то же. Потом отнимаем голос, жесты, мимику. Видно, кто лидер, кто подчиняется.","p":["Сплочение"],"id":"индикатор","i":198},{"t":"Искатели (карточки на части тела)","a":[1,2],"ty":"Тихие и спокойные","goal":"Наблюдательность, смех","n":"4-12","time":"5-10 мин","props":"карточки с буквами","b":"Игроки прикладывают и удерживают карточки к частям тела, название которых начинается с указанной буквы. Побеждает тот, кто разместил и не уронил больше.","p":["Успокоение"],"id":"искатели","i":199},{"t":"Испорченный телефон","a":[1,2,3],"ty":"Тихие и спокойные","goal":"Внимание, смех","n":"6-30","time":"5 мин","props":"нет","b":"Все в ряд. Первый шёпотом передаёт слово или фразу, последний произносит то, что дошло, первый - что хотел передать. После каждого раунда пересаживаемся, чтобы все побывали на концах «провода».","p":["Успокоение","Внимание и мышление"],"id":"испорченныйтелефон","i":200},{"t":"Испорченный факс","a":[1,2,3],"ty":"Эстафеты и состязания","goal":"Внимание, смех","n":"команды от 4","time":"10-15 мин","props":"простые картинки, листы, ручки","b":"Команды в колоннах. Последнему показывают простую картинку, он рисует её пальцем на спине впереди стоящему и так до первого, который рисует итог на бумаге. Побеждает команда, чей рисунок хоть издали напоминает оригинал.","p":["Движение и разминка","Внимание и мышление"],"id":"испорченныйфакс","i":201},{"t":"Исторический фильм","a":[2,3],"ty":"Словесные и интеллектуальные","goal":"Выразительность, знания","n":"2 команды","time":"15 мин","props":"нет","b":"Команда без слов разыгрывает историческое событие или сцену из книги, другая отгадывает.","p":["Внимание и мышление"],"id":"историческийфильм","i":202},{"t":"Ищите его (слова в слове)","a":[2,3],"ty":"Словесные и интеллектуальные","goal":"Словарный запас","n":"команды","time":"10 мин","props":"бумага, ручки","b":"Дано короткое слово (мак). За время надо записать как можно больше слов, в которых оно спрятано (гамак, макака). Читаем по очереди, соревнуемся командами.","p":["Внимание и мышление"],"id":"ищитеего","i":203},{"t":"Кадриль","a":[1,2],"ty":"Танцы и музыкальные","goal":"Народный танец","n":"пары в кругу","time":"10 мин","props":"музыка","b":"Пары в кругу: три шага в центр, «ковырялочка», три шага назад. Обходим партнёра по кругу, берёмся за правые руки и скачем вперёд-назад, затем переходим к новой паре.","p":["Движение и разминка"],"id":"кадриль","i":204},{"t":"Камень, ножницы, бумага","a":[1,2,3],"ty":"Пятиминутки на ожидание","goal":"Удача, реакция","n":"пары","time":"3-5 мин","props":"нет","b":"На счёт «три» показывают одну из фигур: камень (кулак), ножницы (два пальца), бумага (ладонь). Ножницы режут бумагу, бумага накрывает камень, камень тупит ножницы. Можно устроить десять раундов или турнир.","p":["Заполнить паузу","Внимание и мышление"],"id":"каменьножницыбумага","i":205},{"t":"Кандалы","a":[2],"ty":"Подвижные","goal":"Размяться","n":"12-30","time":"10-15 мин","props":"нет","b":"Две команды в 4 м друг от друга держатся за руки. Команды по очереди говорят «Кандалы - Закованы - Раскуйте нас - Кем из нас?» Выбранный игрок бежит и разрывает цепь соперников. Не удалось - остаётся у них. Играем, пока в одной команде никого не останется.","p":["Движение и разминка"],"id":"кандалы","i":206},{"t":"Капуска-редиска","a":[1],"ty":"Пятиминутки на ожидание","goal":"Внимание","n":"6-30","time":"5 мин","props":"нет","b":"Руки «тюльпаном». На слово «редиска» руки пальцами вниз, на «капуска» - вверх. Ведущий нарочно показывает неверно, чтобы запутать. Ошибся - выбыл.","p":["Заполнить паузу","Внимание и мышление"],"id":"капускаредиска","i":207},{"t":"Капуста (одеваем на время)","a":[1,2,3],"ty":"Эстафеты и состязания","goal":"Смех, командная работа","n":"команды","time":"10 мин","props":"куча одежды","b":"Команда за 5 минут надевает на одного игрока как можно больше одежды.","p":["Движение и разминка"],"id":"капуста","i":208},{"t":"Карта моей души","a":[3],"ty":"Творческие и ролевые","goal":"Самопознание","n":"10-20","time":"20-30 мин","props":"бумага, фломастеры","b":"Каждый рисует на чистом листе (или на заготовке с «территориями») свою «карту души». По желанию рассказывает о ней. Рисунки остаются у детей.","p":["Творчество"],"id":"картамоейдуши","i":209},{"t":"Карта под охраной","a":[1,2],"ty":"Следопытство и ориентирование","goal":"Скрытность","n":"6-15","time":"30 мин","props":"карта, предмет (флажок, кегля)","b":"Рядом с картой, спрятанной в кустах, сидят два сторожа. Игрок должен незаметно подползти ближе чем на 10 шагов и посмотреть карту 20 секунд. Окликнули по имени - выбыл. По карте найти предмет. Побеждает тот, кто первым принесёт предмет.","p":["Следопытство"],"id":"картаподохраной","i":210},{"t":"Карточки «Найди такого же»","a":[2,3],"ty":"Знакомство","goal":"Общие интересы","n":"10-30","time":"15 мин","props":"карточки с квадратами, ручки","b":"В клетках карточки написано: «Люблю петь», «Есть собака», «Умею играть на гитаре». Нужно найти людей с каждым признаком и вписать их имена. Пусть вожатый включит качества, которые важны для отряда.","p":["Знакомство"],"id":"карточкинайдитакогоже","i":211},{"t":"Картошка (мяч в кругу)","a":[1,2,3],"ty":"Подвижные","goal":"Ловкость","n":"6-15","time":"10-15 мин","props":"лёгкий мяч","b":"В круге перебрасывают мяч. Уронивший - «картошка» садится на корточки в круг, в него бросают мяч остальные. Если «картошка» поймала мяч, роль переходит к бросавшему.","p":["Движение и разминка"],"id":"картошка","i":212},{"t":"Картошка в ложке","a":[1,2],"ty":"Эстафеты и состязания","goal":"Равновесие","n":"команды","time":"10 мин","props":"ложка, картофель","b":"Пробежать дистанцию с картофелиной в ложке в вытянутой руке. Упала - положи и продолжай. Засекаем время или играем эстафетой.","p":["Движение и разминка"],"id":"картошкавложке","i":213},{"t":"Кегельбан","a":[1,2,3],"ty":"Эстафеты и состязания","goal":"Меткость","n":"любое","time":"10-20 мин","props":"пластиковые бутылки 1,5 л, мяч","b":"Бутылки-кегли пронумерованы по очкам. Катим мяч, считаем очки. Победитель получает приз.","p":["Движение и разминка"],"id":"кегельбан","i":214},{"t":"Кегля с завязанными глазами","a":[1,2],"ty":"Эстафеты и состязания","goal":"Ориентация","n":"3-10","time":"10 мин","props":"стул, кегля, повязка","b":"Игрок идёт от стула 8-10 шагов, останавливается, ему завязывают глаза и разворачивают на месте. Нужно вернуться к стулу и опустить руку точно на кеглю.","p":["Движение и разминка"],"id":"кеглясзавязаннымиглазами","i":215},{"t":"Кельтское колесо","a":[3],"ty":"Сплочение","goal":"Роли в команде","n":"12-30","time":"40 мин","props":"бумага","b":"Участники выбирают сторону света по характеру. Север - люди дела, лидеры. Запад - порядок, расчёты, дисциплина. Восток - идеи и творчество. Юг - тепло и комфорт в группе. Каждая группа готовит «рекламу» своих качеств, называет слабые стороны других и объясняет, почему без остальных не обойтись. Потом решают, как распределить роли. Если какой-то стороны нет, ведущий обращает на это внимание.","p":["Сплочение"],"id":"кельтскоеколесо","i":216},{"t":"Кенгуру","a":[1,2],"ty":"Эстафеты и состязания","goal":"Прыгучесть","n":"команды","time":"10 мин","props":"сумка или рюкзак, мяч","b":"Сумка с мячом-«малышом» на поясе. Нужно прыжками пройти дистанцию, не выронив мяч. Дать потренироваться заранее.","p":["Движение и разминка"],"id":"кенгуру","i":217},{"t":"Клубок (разговор)","a":[2,3],"ty":"Рефлексия и разговор","goal":"Сплочение вокруг темы","n":"любое","time":"15-30 мин","props":"клубок ниток","b":"По кругу: говорящий держит клубок, рассказывает, как его касается обсуждаемая тема, наматывает нитку на палец и передаёт клубок следующему. Получается «паутинка» общего. Нужен серьёзный настрой.","p":["Итоги и разговор","Сплочение"],"id":"клубок","i":218},{"t":"Клумба","a":[1,2],"ty":"Игры в кругу и со стульями","goal":"Внимание, реакция","n":"10-20","time":"10-15 мин","props":"стулья","b":"Играют парами на стульях по кругу, у каждого своё название цветка. Один без пары в центре - водящий. Тот, у кого освободилось место рядом, зовёт названием цветка любого, а водящий старается сесть раньше. Опоздавший водит.","p":["Внимание и мышление"],"id":"клумба","i":219},{"t":"Ковёр-самолёт","a":[2,3],"ty":"Доверие","goal":"Доверие","n":"8-12","time":"10 мин","props":"коврик","b":"Человек ложится с закрытыми глазами. «Зима» - группа стоит вокруг, «весна» - кладут руки, «лето» - осторожно поднимают и обносят по кругу, «осень» - медленно опускают. Поднимать прямой спиной, за счёт ног. Отряд должен быть серьёзным.","p":["Доверие","Сплочение"],"id":"коверсамолет","i":220},{"t":"Кого нет и как одет","a":[1,2],"ty":"Тихие и спокойные","goal":"Внимание, память","n":"от 8","time":"5-10 мин","props":"повязка на глаза","b":"Водящему завязывают глаза, один игрок выходит из комнаты. Нужно угадать, кого нет, и описать его одежду.","p":["Успокоение","Внимание и мышление"],"id":"когонетикакодет","i":221},{"t":"Койот и кролик","a":[2,3],"ty":"Игры в кругу и со стульями","goal":"Реакция, сплочение","n":"6-15","time":"10 мин","props":"2 мяча","b":"Сидящие в кругу передают два мяча: «кролик» может прыгать через человека, «койот» передаётся только соседу. Если оба мяча в одних руках - койот поймал кролика. Для детей с медленной реакцией игра сложновата.","p":["Внимание и мышление","Сплочение"],"id":"койотикролик","i":222},{"t":"Колдуны в деревне","a":[1,2],"ty":"Подвижные","goal":"Взаимовыручка","n":"12-30","time":"15 мин","props":"нет","b":"Колдуны заколдовывают жителей касанием. Заколдованный замирает. Расколдовать может другой житель, дотронувшись до него рукой и сказав заклинание (например, дружное слово). Задача колдунов - заморозить всю деревню, жителей - не дать этого сделать.","p":["Движение и разминка","Сплочение"],"id":"колдунывдеревне","i":223},{"t":"Коленочки","a":[1,2],"ty":"Доверие","goal":"Внимание","n":"8-20","time":"5 мин","props":"нет","b":"Сидя в кругу каждый кладёт руки на колени соседям. Нужно хлопать по очереди, как лежат руки. Сбившийся убирает руку.","p":["Доверие","Сплочение","Внимание и мышление"],"id":"коленочки","i":224},{"t":"Колечко","a":[1,2],"ty":"Игры в кругу и со стульями","goal":"Внимательность, наблюдательность","n":"6-15","time":"10 мин","props":"колечко или монетка","b":"Игроки сидят в ряд, ладони лодочкой. Водящий проходит и незаметно оставляет колечко у одного. Тот не подаёт виду и после слов «Колечко, колечко, выйди на крылечко!» пытается выскочить, остальные его удерживают. Не вырвался - водящий остаётся прежним.","p":["Движение и разминка"],"id":"колечко","i":225},{"t":"Колечко на спичках","a":[2,3],"ty":"Эстафеты и состязания","goal":"Командная ловкость","n":"2 команды","time":"10 мин","props":"спички без головок или зубочистки, колечко","b":"Колечко передают от человека к человеку с одной палочки на другую (держат губами) без рук, туда и обратно. Для детей безопаснее использовать пластиковые трубочки.","p":["Движение и разминка"],"id":"колечконаспичках","i":226},{"t":"Колечко-колечко","a":[1,2],"ty":"Игры в кругу и со стульями","goal":"Внимание","n":"от 5","time":"10 мин","props":"колечко","b":"Игроки сидят в ряд, ладони лодочкой. Водящий с колечком в ладонях проходит вдоль ряда и тайно оставляет колечко одному. Говорит «Колечко, колечко, выйди на крылечко». Получивший должен вскочить, остальные держат его. Успели - он остаётся.","p":["Внимание и мышление"],"id":"колечкоколечко","i":227},{"t":"Колобок (игра-сказка)","a":[1],"ty":"Пятиминутки на ожидание","goal":"Выплеснуть энергию","n":"от 10","time":"5-8 мин","props":"стулья","b":"Стулья расставлены на расстоянии. Каждому даём две роли: колобок и ещё одна (дед, баба, лиса, волк, медведь, тропинка). Ведущий рассказывает сказку, и при названии своей роли игрок обегает свой стул. Слово «колобок» звучит всё чаще, пока дети не перестанут успевать. Можно рассказать «Репку» или «Теремок».","p":["Заполнить паузу","Движение и разминка"],"id":"колобок","i":228},{"t":"Коломийка","a":[1,2],"ty":"Танцы и музыкальные","goal":"Размяться","n":"10-30","time":"5-10 мин","props":"музыка","b":"В большом кругу восемь пробежек вправо и влево, шаг «чарли», подскоки-ножницы с хлопками, четыре шага в центр и назад.","p":["Движение и разминка"],"id":"коломийка","i":229},{"t":"Колпак на колпаке","a":[1,2],"ty":"Эстафеты и состязания","goal":"Меткость, смех","n":"4-12","time":"10 мин","props":"большой колпак, маленькие колпаки на нитях","b":"Игрок надевает большой колпак, закрывает глаза, поворачивается три раза, приседает и, выпрямляясь, должен «поймать» большим колпаком маленький.","p":["Движение и разминка"],"id":"колпакнаколпаке","i":230},{"t":"Кольцо-растяжка","a":[2,3],"ty":"Сплочение","goal":"Доверие, поддержка","n":"8-16","time":"10 мин","props":"прочное верёвочное кольцо","b":"Все держатся за кольцо и осторожно отклоняются назад, натягивая его. Потом можно присесть и встать вместе, отпустить одну руку, пустить волну. Обсудите: если кто-то отпустит - упадут все.","p":["Сплочение"],"id":"кольцорастяжка","i":231},{"t":"Компас (игра)","a":[1,2],"ty":"Следопытство и ориентирование","goal":"Стороны света","n":"8-25","time":"10 мин","props":"колышки","b":"На земле рисуют круг и колышками отмечают стороны света (север - двумя). Ведущий называет сторону, дети бегут к нужному колышку. Первому - очко.","p":["Следопытство"],"id":"компас","i":232},{"t":"Комплименты на букву","a":[2,3],"ty":"Словесные и интеллектуальные","goal":"Словарный запас, доброжелательность","n":"2 или команды","time":"5-10 мин","props":"нет","b":"Двое по очереди говорят комплименты на заданную букву. Проигрывает тот, у кого закончились слова.","p":["Внимание и мышление","Знакомство"],"id":"комплиментынабукву","i":233},{"t":"Кондуктор","a":[1,2],"ty":"Словесные и интеллектуальные","goal":"География, знания","n":"8-25","time":"10-15 мин","props":"карточки-билеты с названиями городов","b":"Игроки получают «билеты» с городами. «Кондуктор» спрашивает: «В какой стране этот город?». Ответил верно - билет «компостируют». Побеждает тот, у кого больше компостированных билетов.","p":["Внимание и мышление"],"id":"кондуктор","i":234},{"t":"Конкурс свистунов","a":[1,2,3],"ty":"Эстафеты и состязания","goal":"Смех","n":"любое","time":"5 мин","props":"музыка","b":"Чей свист окажется самым громким или мелодичным. Лучший «соловей-разбойник» получает приз.","p":["Движение и разминка"],"id":"конкурссвистунов","i":235},{"t":"Конь - кот","a":[1,2],"ty":"Подвижные","goal":"Реакция","n":"12-30","time":"10 мин","props":"мел","b":"Две команды (кони и коты) в шеренгах в 20-30 шагах. Ведущий в центре «кудахчет», обе команды идут навстречу. Вдруг он выкрикивает «Кот!» или «Конь!». Названные убегают к своей линии, другие ловят. Побеждает команда с меньшими потерями.","p":["Движение и разминка","Внимание и мышление"],"id":"конькот","i":236},{"t":"Конь вороной","a":[1],"ty":"Подвижные","goal":"Выручка, объятия","n":"8-25","time":"10 мин","props":"нет","b":"Ведущий догоняет и касается плеч. Пятнанный замирает с раскинутыми руками и кричит «Расколдуйте меня, вороного коня!». Расколдовать можно только «горячим объятием». Цель ведущего - запятнать всех.","p":["Движение и разминка"],"id":"коньвороной","i":237},{"t":"Кораблекрушение","a":[3],"ty":"Сплочение","goal":"Отстаивать мнение, групповые роли","n":"5-20","time":"от 40 мин","props":"список предметов, бумага","b":"Сначала каждый сам ранжирует список предметов, которые спасут после кораблекрушения, потом в парах, затем в группах по 3-4, наконец всей группой. Видно, кто лидер, кто пассивен, кто давит на группу. Возможны ссоры, поэтому нужно время на обсуждение.","p":["Сплочение"],"id":"кораблекрушение","i":238},{"t":"Корзинка (мирное решение)","a":[2,3],"ty":"Рефлексия и разговор","goal":"Находить мирные выходы из конфликта","n":"5-15","time":"15-20 мин","props":"картинки конфликтных сцен, корзинка","b":"Игрок вытягивает картинку (например, драка двух подростков). Ведущий спрашивает: что сказать, чтобы ребята помирились? Игрок быстро предлагает выход («сыграть в футбол») и передаёт ход. Кто не придумал - вытягивает картинку, а предыдущий становится ведущим. Оценок нет, хорошо для новой группы.","p":["Итоги и разговор"],"id":"корзинка","i":239},{"t":"Коробейники","a":[1,2,3],"ty":"Народные и праздничные","goal":"Праздник","n":"ярмарка","time":"на фестиваль","props":"сушки, баранки, конфеты, шарики","b":"Актёры, увешанные шарами, баранками и конфетами, ходят по ярмарке и продают товар за частушку или потешку.","p":["Событие"],"id":"коробейники","i":240},{"t":"Король в плену","a":[1],"ty":"Пятиминутки на ожидание","goal":"Реакция","n":"2","time":"3 мин","props":"нет","b":"Двое по очереди кладут руку на руку друг друга, считая до девяти. Кто успел схватить руку соперника, говорит «Король в плену». Нельзя задерживать руку партнёра и класть две руки подряд.","p":["Заполнить паузу","Внимание и мышление"],"id":"корольвплену","i":241},{"t":"Король зверей","a":[1],"ty":"Подвижные","goal":"Внимание и меткость","n":"8-15","time":"10 мин","props":"мяч","b":"Все - звери и тихо называют королю своё имя. Король называет зверя - тот бежит, а король пытается попасть в него мячом. Подстреленный становится помощником короля. После пары названных зверей король кричит «Ловлю всех зверей!». Бросать мяч нельзя за линию короля.","p":["Движение и разминка","Внимание и мышление"],"id":"корользверей","i":242},{"t":"Король и принцесса (хоровод)","a":[1],"ty":"Игры в кругу и со стульями","goal":"Размяться","n":"8-25","time":"5 мин","props":"нет","b":"Хоровод вокруг «короля» со словами «Шёл король по лесу, нашёл себе принцессу... давай с тобой попрыгаем, и ножками потопаем, и ручками похлопаем». Король выбирает принцессу с закрытыми глазами.","p":["Движение и разминка"],"id":"корольипринцесса","i":243},{"t":"Король обезьян","a":[1,2],"ty":"Творческие и ролевые","goal":"Внимание, пародия","n":"от 8","time":"10 мин","props":"нет","b":"Выбираем «короля» и все повторяют его движения. Гость, которого пригласили из-за двери, должен догадаться, кого все пародируют.","p":["Творчество","Внимание и мышление"],"id":"корольобезьян","i":244},{"t":"Коршун и клуша","a":[1],"ty":"Подвижные","goal":"Защита, взаимовыручка","n":"8-20","time":"10 мин","props":"нет","b":"Цыплята колонной за клушей, держатся друг за друга. Коршун пытается утащить цыплёнка, клуша защищает, раскинув руки. Пойманный становится коршуном.","p":["Движение и разминка","Сплочение"],"id":"коршуниклуша","i":245},{"t":"Космонавты","a":[1],"ty":"Подвижные","goal":"Размяться, внимание","n":"10-25","time":"10 мин","props":"мел","b":"По краям площадки рисуем 6-8 «ракетодромов» (треугольников) с кругами-«ракетами», которых меньше, чем игроков. Все идут по кругу и говорят «Ждут нас быстрые ракеты для прогулок по планетам... опоздавшим места нет!», затем бегут занять круг. Не успевший выбывает.","p":["Движение и разминка","Внимание и мышление"],"id":"космонавты","i":246},{"t":"Коснись тени","a":[1,2],"ty":"Подвижные","goal":"Размяться (солнечная погода)","n":"любое","time":"10 мин","props":"солнце","b":"Салки, где нужно коснуться не игрока, а его тени. Спастись можно, спрятавшись в тень. Остальные стоят на месте, пока бегают двое.","p":["Движение и разминка"],"id":"коснисьтени","i":247},{"t":"Кот и мышь","a":[1],"ty":"Подвижные","goal":"Размяться","n":"6-10","time":"10 мин","props":"нет","b":"Два ряда лицом друг к другу, руки сцеплены - получается нора. Кот ловит мышь, та бегает вокруг, а в опасный момент прячется в норе. Коту в нору заходить нельзя. Пара за парой.","p":["Движение и разминка"],"id":"котимышь","i":248},{"t":"Кочки","a":[2,3],"ty":"Сплочение","goal":"Групповая стратегия","n":"7-10","time":"10-15 мин","props":"листы А4, карточки со словами пословицы","b":"На каждом листе - слово из пословицы или строки песни. Участники стоят на листах и без касания пола должны выстроиться в правильный порядок. Наступил на пол - всё сначала. Нужен строгий судья. Большую группу можно разделить на две соревнующиеся команды.","p":["Сплочение"],"id":"кочки","i":249},{"t":"Кошки-мышки (защити мышку)","a":[1,2],"ty":"Подвижные","goal":"Взаимовыручка","n":"12-25","time":"10 мин","props":"нет","b":"Круг держится за руки, внутри мышка, снаружи кошка. Круг защищает мышку, кошка может прыгать через руки и пробираться в круг. Поймала - они встают в круг, выбирают новых.","p":["Движение и разминка","Сплочение"],"id":"кошкимышки","i":250},{"t":"Красные, синие, зелёные","a":[1,2],"ty":"Сплочение","goal":"Командное деление","n":"12-40","time":"5-10 мин","props":"листы цветной бумаги, скотч","b":"Каждому на спину клеят цветной лист. Нужно построиться в колонны по цветам. Усложнение - молча, не видя своего цвета.","p":["Сплочение"],"id":"красныесиниезеленые","i":251},{"t":"Кремена","a":[2],"ty":"Танцы и музыкальные","goal":"Размяться","n":"10-30","time":"5-10 мин","props":"музыка","b":"Круг, покачивание бёдрами в стороны, три шага в круг и прыжок на 180 градусов, хлопки снизу вверх, три шага из круга. Повторить.","p":["Движение и разминка"],"id":"кремена","i":252},{"t":"Крепость","a":[2,3],"ty":"Подвижные","goal":"Стратегия и взаимодействие","n":"12-30","time":"15 мин","props":"доска или камень","b":"Две команды: одни защищают «крепость» (камень в центре), другие нападают. Защитники кольцом на расстоянии 2-3 м. Нападающие отвлекают и прорываются, цель - наступить на камень. Прорвавшийся, но пойманный до камня выбывает, защитники, оставшиеся за прорванной линией, тоже. Очко получает команда за захваченную крепость, играем до пяти очков.","p":["Движение и разминка","Сплочение"],"id":"крепость","i":253},{"t":"Кривая дорожка","a":[1,2],"ty":"Эстафеты и состязания","goal":"Равновесие, смех","n":"любое","time":"10 мин","props":"мел, бинокль","b":"По змеящейся мелом линии надо пройти, глядя под ноги через перевёрнутый бинокль (смотреть с обратной стороны). Идём медленно, рядом страхующий.","p":["Движение и разминка"],"id":"криваядорожка","i":254},{"t":"Кривые зеркала","a":[1,2],"ty":"Пятиминутки на ожидание","goal":"Внимание, координация","n":"6-25","time":"5-10 мин","props":"музыка по желанию","b":"Ведущий показывает движения, а игроки делают заранее оговорённые «неправильные» ответы: поднял руки вверх - все кладут руки на колени; согнул в локтях - все поднимают; развёл в стороны - сгибают в локтях; выбросил вперёд - тоже выбрасывают вперёд. Кто перепутал, выбывает. Игра идёт, пока не останутся двое.","p":["Заполнить паузу","Внимание и мышление"],"id":"кривыезеркала","i":255},{"t":"Кричалки - шепталки - молчалки","a":[1,2],"ty":"Пятиминутки на ожидание","goal":"Саморегуляция","n":"любое","time":"5 мин","props":"три картонные ладони (красная, жёлтая, синяя)","b":"Красная ладонь - можно бегать и кричать, жёлтая - только тихо и шёпотом, синяя - замереть. Заканчивать игру «молчалкой». Хорошо для перехода от шумной игры к спокойной.","p":["Заполнить паузу"],"id":"кричалкишепталкимолчалки","i":256},{"t":"Крокодил","a":[1,2,3],"ty":"Творческие и ролевые","goal":"Пантомима, командная работа","n":"две команды","time":"15-20 мин","props":"нет","b":"Одна команда загадывает слово, говорит его игроку соперников, а тот показывает его без слов, мимикой и жестами. Его команда угадывает. После этого меняются. Можно усложнить: загадывать фразы.","p":["Творчество"],"id":"крокодил","i":257},{"t":"Круги (командная викторина)","a":[2,3],"ty":"Большие игры","goal":"Повторить пройденное","n":"несколько отрядов","time":"3 часа","props":"листочки, ручки, табло, призы","b":"Отряды сидят по кругу, в центре нарисованы пронумерованные круги по числу команд. Ведущий задаёт вопрос, быстрый ответчик бежит в первый круг (если занят - во второй и т.д.). Помощники собирают ответы, счетовод считает. Нужны заводной ведущий, музыкальные паузы и много призов.","p":["Событие"],"id":"круги","i":258},{"t":"Круглый ушастик","a":[1],"ty":"Тихие и спокойные","goal":"Снять злость","n":"1-5","time":"5 мин","props":"мишень с ушами, мяч","b":"На щите наклеен круг с ушами. Кому-то обидно или злится - бросает мяч в «ушастика». Обидчика называть не нужно.","p":["Успокоение"],"id":"круглыйушастик","i":259},{"t":"Крючком за мяч","a":[2],"ty":"Эстафеты и состязания","goal":"Ловкость","n":"пары","time":"10 мин","props":"обруч, мяч с кольцом, палки с крючком","b":"В обруче лежит мяч с петлёй. Двое с палками-крючками пытаются подцепить мяч и вытащить из обруча, мешая друг другу.","p":["Движение и разминка"],"id":"крючкомзамяч","i":260},{"t":"Кто быстрее (с веревкой)","a":[1,2,3],"ty":"Эстафеты и состязания","goal":"Реакция","n":"2","time":"5 мин","props":"2 стула, верёвка, приз","b":"Два стула спинками друг к другу, под ними верёвка, посередине привязан приз. По сигналу игроки вскакивают, обегают стул, садятся и подтягивают верёвку. Приз достаётся быстрейшему.","p":["Движение и разминка","Внимание и мышление"],"id":"ктобыстрее","i":261},{"t":"Кто быстрее оденется","a":[1,2,3],"ty":"Эстафеты и состязания","goal":"Смех, скорость","n":"команды","time":"10 мин","props":"чемоданы с одеждой (рубашка, брюки, шапка, шарф, кроссовки)","b":"Первый бежит к чемодану, надевает всё, хлопает в ладоши, снимает, складывает, закрывает чемодан и бежит обратно. Затем следующий. Побеждает первая команда.","p":["Движение и разминка"],"id":"ктобыстрееоденется","i":262},{"t":"Кто быстрее пришьёт","a":[1,2],"ty":"Эстафеты и состязания","goal":"Командная работа","n":"две команды","time":"10 мин","props":"ложки, нитки","b":"Команды «пришивают» друг к другу всех игроков: вместо иглы чайная ложка с ниткой. Нить продевают через ремешок или петлю, но не прокалывая одежды.","p":["Движение и разминка"],"id":"ктобыстреепришьет","i":263},{"t":"Кто быстрее схватит (стульчики с бутылками)","a":[1,2,3],"ty":"Подвижные","goal":"Реакция","n":"6-20","time":"10 мин","props":"пластиковые бутылки или фигурки, музыка","b":"Кегли или фигурки в круге, их на одну меньше, чем игроков. Под музыку ходим вокруг, музыка остановилась - хватай. Кто остался без предмета, выбывает, один предмет убираем.","p":["Движение и разминка","Внимание и мышление"],"id":"ктобыстреесхватит","i":264},{"t":"Кто летит?","a":[1],"ty":"Пятиминутки на ожидание","goal":"Внимание","n":"8-25","time":"5 мин","props":"нет","b":"Ведущий: «Скворец летит!» (поднимает руки), дети повторяют. Неожиданно: «Медведь летит!». Кто поднял руки, делает шаг из круга.","p":["Заполнить паузу","Внимание и мышление"],"id":"ктолетит","i":265},{"t":"Кто проворней?","a":[1,2],"ty":"Эстафеты и состязания","goal":"Ловкость","n":"2","time":"5 мин","props":"две катушки или палки, верёвка 6-8 м с лентой посередине","b":"Двое расходятся на длину верёвки, по сигналу быстро наматывают её на катушки. Выигрывает тот, кто первым дошёл до ленты.","p":["Движение и разминка"],"id":"ктопроворней","i":266},{"t":"Кто сильнее (кольцо из верёвки)","a":[2,3],"ty":"Эстафеты и состязания","goal":"Сила, ловкость","n":"пары","time":"10 мин","props":"верёвка 6 м","b":"Верёвка связана в кольцо. Двое внутри, верёвка за лопатками, растягивают её в разные стороны, пока один не перетянет противника за черту.","p":["Движение и разминка"],"id":"ктосильнее","i":267},{"t":"Кто скорее?","a":[1],"ty":"Подвижные","goal":"Быстрота","n":"8-25","time":"10 мин","props":"нет","b":"Игроки стоят по кругу. Водящий бежит за кругом, хлопает кого-нибудь по плечу и продолжает бег в том же направлении. Тот бежит в обратную сторону. Нужно обогнуть круг и первым занять свободное место, оставшийся без места водит.","p":["Движение и разминка"],"id":"ктоскорее","i":268},{"t":"Кто спрятался?","a":[1],"ty":"Знакомство","goal":"Внимательность, знакомство","n":"8-20","time":"10 мин","props":"музыка","b":"Дети ходят по кругу под музыку, повторяя движения вожатого. Водящий закрывает глаза, один уходит и прячется. Водящий должен понять, кого нет. Играть, пока каждый не побывает в центре.","p":["Знакомство"],"id":"ктоспрятался","i":269},{"t":"Кто что любит делать?","a":[1,2],"ty":"Знакомство","goal":"Знакомство, выразительность","n":"8-20","time":"10 мин","props":"нет","b":"Игроки по очереди выходят в центр и показывают, что любят делать (играть в футбол, поливать цветы, петь). Остальные угадывают. Вариант: показать, что они делают для младших.","p":["Знакомство"],"id":"кточтолюбитделать","i":270},{"t":"Кто это? (составной рисунок)","a":[1,2,3],"ty":"Творческие и ролевые","goal":"Фантазия, смех","n":"5-20","time":"10 мин","props":"листы, ручки","b":"Каждый рисует голову (человека, животного, птицы), загибает лист так, чтобы видна была только шея, и передаёт соседу. Тот рисует туловище, снова загибает, следующий дорисовывает ноги. В конце разворачиваем и смотрим, что за существа получились.","p":["Творчество"],"id":"ктоэто","i":271},{"t":"Кто я такой?","a":[2,3],"ty":"Словесные и интеллектуальные","goal":"Логика, вопросы","n":"5-15","time":"15 мин","props":"бумажки, скотч","b":"Каждый записывает имя известного героя, листок крепят на спину соседу слева. Участник по очереди задаёт другим вопросы, на которые отвечают только «да» или «нет». Ответили «да» - задаёшь следующий вопрос, «нет» - переходишь к другому собеседнику. Игра заканчивается, когда все узнали, кто они.","p":["Внимание и мышление"],"id":"ктоятакой","i":272},{"t":"Кузнечик","a":[1,2],"ty":"Игры в кругу и со стульями","goal":"Разрядка, ритм","n":"6-15","time":"5-10 мин","props":"одинаковые предметы, песня про кузнечика","b":"Все сидят в кругу на коленях, у каждого предмет. Поём «В траве сидел кузнечик», и на каждый такт передаём предмет соседу справа. На припеве предмет просто переставляем перед собой. Запутавшиеся могут выбывать.","p":["Движение и разминка"],"id":"кузнечик","i":273},{"t":"Кузнечики (самый длинный прыжок)","a":[1,2],"ty":"Эстафеты и состязания","goal":"Прыгучесть, командность","n":"команды по 4-8","time":"10 мин","props":"лента или мел","b":"Первый прыгает от линии, второй от места приземления первого и т. д. Побеждает команда с самым длинным общим прыжком. Можно в сторону, на одной ноге.","p":["Движение и разминка"],"id":"кузнечики","i":274},{"t":"Курица (пишем ногой)","a":[1,2],"ty":"Эстафеты и состязания","goal":"Смех, ловкость","n":"команды","time":"10 мин","props":"фломастеры, скотч, бумага","b":"Фломастер крепим к ноге (можно держать между пальцами) и пишем заданное слово. Побеждает тот, у кого быстро и понятно.","p":["Движение и разминка"],"id":"курица","i":275},{"t":"Кухня (отвечаем одним словом)","a":[2,3],"ty":"Тихие и спокойные","goal":"Выдержка, смех","n":"6-15","time":"10 мин","props":"нет","b":"Каждый берёт название кухонной вещи (вилка, нож, тарелка). Водящий задаёт смешные вопросы, а отвечать можно только своим названием и предлогами. Кто засмеялся, выбывает. Вопросы подбираем безобидные.","p":["Успокоение"],"id":"кухня","i":276},{"t":"Лабиринт","a":[1,2],"ty":"Подвижные","goal":"Реакция","n":"12-30","time":"10 мин","props":"нет","b":"Игроки стоят в шеренгах на расстоянии вытянутых рук, заяц бегает по «улицам», не пробегая под руками, волк догоняет. По команде «направо» все поворачиваются, и лабиринт меняется. Догнал - меняются ролями.","p":["Движение и разминка","Внимание и мышление"],"id":"лабиринт","i":277},{"t":"Лавата","a":[1],"ty":"Танцы и музыкальные","goal":"Размяться, посмеяться","n":"любое","time":"5 мин","props":"музыка","b":"Идём по кругу и поём «Дружно танцуем мы, тра-та-та, танец весёлый наш - это Лавата». Ведущий спрашивает «Наши руки хороши? - Хороши!», «А у соседа лучше? - Лучше!» и называет части тела, показывая новое движение.","p":["Движение и разминка"],"id":"лавата","i":278},{"t":"Лавочник","a":[1,2],"ty":"Словесные и интеллектуальные","goal":"Память","n":"6-12","time":"10 мин","props":"нет","b":"Покупатели по очереди заказывают товары («полкило сахара», «три яблока»). Лавочник выслушивает всех, потом выдаёт каждому его заказ: «Вот ваши полкило сахара». Сбился - меняется.","p":["Внимание и мышление"],"id":"лавочник","i":279},{"t":"Лагерная почта","a":[2,3],"ty":"Большие игры","goal":"Доброжелательная атмосфера","n":"от 15","time":"вся смена","props":"почтовый ящик, цветной картон","b":"У каждого свой номер-адрес и визитка. Все пишут друг другу добрые и весёлые записки и опускают в ящик. Почту раздают вслух или через почтальонов. Вожатые вначале сами пишут записки как можно большему числу детей, чтобы никто не остался без писем.","p":["Событие"],"id":"лагернаяпочта","i":280},{"t":"Ладошка","a":[2,3],"ty":"Рефлексия и разговор","goal":"Позитивная обратная связь","n":"6-20","time":"15 мин","props":"бумага, ручки","b":"Обводим ладонь, в центре имя, в пальцах - что нравится в себе. Лист идёт по кругу: каждый за 30 секунд пишет снаружи ладони что-то хорошее о владельце. Лист возвращается хозяину.","p":["Итоги и разговор"],"id":"ладошка","i":281},{"t":"Ладошки","a":[2,3],"ty":"Тихие и спокойные","goal":"Доверие, чуткость","n":"пары","time":"10 мин","props":"нет","b":"Один закрывает глаза и протягивает ладони. Второй без слов касанием передаёт образ (дождь, осень, снегопад, двое на лавочке). Потом обсуждают, что хотели передать и что почувствовали.","p":["Успокоение","Сплочение"],"id":"ладошки","i":282},{"t":"Ласковые ладошки","a":[1],"ty":"Тихие и спокойные","goal":"Расслабление","n":"6-15","time":"5 мин","props":"нет","b":"Дети стоят друг за другом и легко гладят ладошками впереди стоящего по голове, спине, рукам. Сначала покажите, как гладить.","p":["Успокоение"],"id":"ласковыеладошки","i":283},{"t":"Ласковые лапки","a":[1],"ty":"Тихие и спокойные","goal":"Расслабление, доверие","n":"2 (пара)","time":"10 мин","props":"6-7 предметов разной фактуры","b":"Ребёнок закрывает глаза, «зверёк» (кусочек меха, кисточка, бусы, вата) мягко касается его руки. Нужно угадать предмет. Прикосновения только приятные, поглаживающие. Можно поменяться ролями.","p":["Успокоение","Сплочение"],"id":"ласковыелапки","i":284},{"t":"Левой - правой","a":[2,3],"ty":"Пятиминутки на ожидание","goal":"Координация","n":"любое","time":"5 мин","props":"карандаши или мел","b":"Двумя руками одновременно рисовать разное: одной цифру 2, другой 7; квадрат правой и треугольник левой; домик и солнышко.","p":["Заполнить паузу"],"id":"левойправой","i":285},{"t":"Ледяная ладонь","a":[1,2],"ty":"Подвижные","goal":"Взаимовыручка","n":"10-30","time":"10-15 мин","props":"нет","b":"Несколько водящих с «ледяной ладонью», остальные разбегаются. Водящие считают до 10 и ловят. Осаленный замирает со стойкой смирно или с раскинутыми руками. Расколдовать его может любой неводящий: потрясти за руку или пролезть между ног. Потом считают, кто скольких расколдовал.","p":["Движение и разминка","Сплочение"],"id":"ледянаяладонь","i":286},{"t":"Лесная эстафета","a":[2,3],"ty":"Следопытство и ориентирование","goal":"Выносливость, командность","n":"2-4 команды по 12-15","time":"40 мин","props":"эстафетная палочка","b":"Маршрут 1,5 км по лесу с препятствиями. Игроков расставляют вдоль маршрута, каждый бежит 100-150 м (на трудных участках 80-100). Судьи на старте, финише и в середине. Побеждает команда, первой доставившая палочку. Маршрут заранее проверить.","p":["Следопытство","Движение и разминка"],"id":"леснаяэстафета","i":287},{"t":"Лесное пятиборье","a":[2,3],"ty":"Следопытство и ориентирование","goal":"Ловкость, выносливость","n":"6-8 одного возраста","time":"40 мин","props":"жерди, шесты, ленты, номера, секундомер","b":"Кольцевая трасса 400-600 м, старт с интервалом 1 минута. Этапы: пробежать 60 м и прыгнуть в «окно»; зигзаг вокруг десяти деревьев; проползти по коридору из жердей 6-7 м высотой 50 см и перепрыгнуть канаву 2 м с шестом; пробежать по бревну и прыгнуть через канаву 1,5 м; пробежать по пенькам и метнуть десять шишек в дерево. Время плюс штрафные секунды. Девочки и мальчики отдельно. Все препятствия низкие, судьи на каждом этапе.","p":["Следопытство","Движение и разминка"],"id":"лесноепятиборье","i":288},{"t":"Лесной телефон (связисты и разведчики)","a":[2,3],"ty":"Следопытство и ориентирование","goal":"Внимание, скрытность","n":"12-30","time":"40 мин","props":"листок с 5-6 короткими фразами","b":"«Связисты» цепью по 10-15 шагов друг от друга в лесу передают шёпотом «телефонограмму» (5-6 фраз по 5-6 слов). Через 10-15 минут идут «разведчики» и пытаются подкрасться и подслушать. Если связист заметил разведчика и окликнул по имени, тот выбывает. Разведчики побеждают, если записали половину сообщения.","p":["Следопытство","Внимание и мышление"],"id":"леснойтелефон","i":289},{"t":"Летающее яйцо","a":[2,3],"ty":"Сплочение","goal":"Командная работа, поиск решений","n":"4-6 в команде","time":"30-40 мин","props":"сырое яйцо, 2 листа А4, трубочки, ножницы, скотч, стаканчик","b":"Команда придумывает упаковку так, чтобы яйцо не разбилось при падении со второго этажа. 10 минут обсуждения без касания материалов, потом 20 минут сборки молча (за каждое слово штраф 30 секунд). Затем эксперимент. Можно устроить соревнование нескольких команд, выявляет лидеров.","p":["Сплочение"],"id":"летающееяйцо","i":290},{"t":"Летопись отряда","a":[1,2,3],"ty":"Большие игры","goal":"Сплочение, память о смене","n":"отряд","time":"вся смена","props":"бумага, краски","b":"Каждые 1-2 дня отряд вместе вписывает в летопись новую страницу: что произошло, кто отличился, иллюстрации. Единственный экземпляр забирает вожатый, чтобы никого не обидеть.","p":["Событие","Внимание и мышление","Сплочение"],"id":"летописьотряда","i":291},{"t":"Летучая мышь и мотыльки","a":[1,2],"ty":"Игры в кругу и со стульями","goal":"Слух","n":"8-20","time":"10 мин","props":"повязка","b":"В круге «летучая мышь» с завязанными глазами и 3 «мотылька». Мышь кричит «Летучая мышь!», мотыльки отвечают «Мотылёк!», по голосу мышь ловит. Расскажите детям об ультразвуке.","p":["Движение и разминка"],"id":"летучаямышьимотыльки","i":292},{"t":"Летящие птицы","a":[1],"ty":"Игры в кругу и со стульями","goal":"Реакция","n":"8-20","time":"10 мин","props":"повязка","b":"Каждый выбирает название птицы, названия разные. Водящий с завязанными глазами в центре зовёт двух птиц, они быстро меняются местами. Водящий ловит. Пойманный водит.","p":["Внимание и мышление"],"id":"летящиептицы","i":293},{"t":"Линия из одежды","a":[2,3],"ty":"Эстафеты и состязания","goal":"Командная работа","n":"две команды от 4","time":"10 мин","props":"простор, приз","b":"Каждая команда выкладывает на земле линию из своей одежды. Побеждает более длинная. Шнурки и украшения считаем по договорённости, можно ограничить по времени. Обязательно учитывать погоду и чувство комфорта детей (брать только верхнюю одежду, шапки, шарфы).","p":["Движение и разминка"],"id":"линияизодежды","i":294},{"t":"Лиса Алиса и кот Базилио","a":[1,2],"ty":"Эстафеты и состязания","goal":"Доверие, смех","n":"2 пары","time":"10 мин","props":"повязка","b":"Пары обнимаются: «Лиса» стоит на одной ноге (вторую держит рукой), «Кот» идёт с завязанными глазами. Первые добравшиеся до финиша получают «золотой ключик» (приз).","p":["Движение и разминка","Сплочение"],"id":"лисаалисаикотбазилио","i":295},{"t":"Лиски","a":[1],"ty":"Подвижные","goal":"Размяться","n":"10-20","time":"10 мин","props":"небольшие предметы","b":"Игроки в кругу диаметром 10-20 м, перед каждым лежит «лиска» (предмет). Лис обходит круг и ведёт диалог с одним из игроков: «Где был? - В лесу. Кого поймал? - Лиску. Верни лиску. - За так не отдам. Если обгонишь - отдам». Оба бегут по кругу в разные стороны, кто первым займёт свободное место, становится хозяином, оставшийся - лисом.","p":["Движение и разминка"],"id":"лиски","i":296},{"t":"Лисы и охотники","a":[2,3],"ty":"Следопытство и ориентирование","goal":"Выслеживание, выносливость","n":"8-10 охотников и 1-2 лисы","time":"40-60 мин","props":"100-150 бумажек 6×6 см (по цвету для каждой лисы), сумки, горн","b":"От сборного пункта в 2-3 км намечен финиш, там судьи. «Лисы» с сумками бумажек убегают, через 3-4 минуты вдогонку бегут «охотники». Лисы через 10-15 шагов бросают бумажки (следы), петляют и держатся недалеко друг от друга, чтобы помогать. Охотники собирают бумажки и сдают на финише. Лиса пойманная - если её запятнали. Если хоть одна лиса добралась до финиша, побеждают лисы. Границы территории обозначить, у всех часы или горн для общего сбора.","p":["Следопытство","Движение и разминка"],"id":"лисыиохотники","i":297},{"t":"Литературоведы","a":[2,3],"ty":"Словесные и интеллектуальные","goal":"Знание книг","n":"команды","time":"10-15 мин","props":"цитаты","b":"Зачитываем фразу из произведения, команды угадывают книгу. Первый правильный ответ - победа.","p":["Внимание и мышление"],"id":"литературоведы","i":298},{"t":"Лихие шофёры","a":[1,2],"ty":"Эстафеты и состязания","goal":"Аккуратность","n":"3-6","time":"10 мин","props":"машинки, стаканы с водой, бечёвка, палочки","b":"На машинки ставят стаканы с водой, к машинке привязана бечёвка 10-15 м. По сигналу наматываем бечёвку на палочку. Если вода плещется, ведущий называет номер, и игрок на секунду останавливается. Выигрывает тот, кто быстрее подтянул и не расплескал.","p":["Движение и разминка"],"id":"лихиешоферы","i":299},{"t":"Лови-бросай","a":[1],"ty":"Игры в кругу и со стульями","goal":"Ловкость","n":"6-20","time":"5-10 мин","props":"мяч","b":"В кругу бросаем мяч: «Лови, бросай, упасть не давай». Старшим можно усложнить: говорить слова с противоположным значением («узкий - широкий»).","p":["Движение и разминка"],"id":"ловибросай","i":300},{"t":"Ловим комаров","a":[1],"ty":"Пятиминутки на ожидание","goal":"Снять напряжение кистей","n":"любое","time":"3-5 мин","props":"нет","b":"Дети «ловят комаров» в воздухе, сжимая и разжимая кулаки в своём темпе. На «Стоп!» садятся, встряхивают расслабленными руками. Можно повторить.","p":["Заполнить паузу","Успокоение"],"id":"ловимкомаров","i":301},{"t":"Ловишка в кругу","a":[1],"ty":"Подвижные","goal":"Размяться","n":"8-20","time":"5-10 мин","props":"палка, мел","b":"Чертим круг от 3 м, посередине кладём палку. Один игрок - ловишка, бегает за остальными внутри круга. Перепрыгивать палку можно только убегающим, ловишке нельзя, а наступать на неё не разрешено никому. Пойманный сам становится ловишкой и вырываться не вправе.","p":["Движение и разминка"],"id":"ловишкавкругу","i":302},{"t":"Ловкие обезьянки","a":[1,2],"ty":"Эстафеты и состязания","goal":"Ловкость","n":"команды","time":"10 мин","props":"длинные верёвки","b":"Верёвки-«лианы» на земле вдоль трассы. Участники идут на четырёх конечностях, наступая руками на верёвку. Пальцы беречь.","p":["Движение и разминка"],"id":"ловкиеобезьянки","i":303},{"t":"Ловушки","a":[1],"ty":"Подвижные","goal":"Размяться","n":"10-30","time":"10 мин","props":"нет","b":"Ведущий догоняет игроков. Пойманный берёт ведущего за руки, и вместе они ловят остальных, пока не поймают всех.","p":["Движение и разминка"],"id":"ловушки","i":304},{"t":"Ложный портрет","a":[2,3],"ty":"Знакомство","goal":"Знакомство, внимание","n":"пары в группе","time":"10-20 мин","props":"нет","b":"Пары расспрашивают друг друга, потом каждый рассказывает группе о партнёре 4 факта, один из них выдуман. Группа угадывает ложный.","p":["Знакомство","Внимание и мышление"],"id":"ложныйпортрет","i":305},{"t":"Лопни шар (боксёрские перчатки)","a":[1,2,3],"ty":"Эстафеты и состязания","goal":"Смех, ловкость","n":"2-8","time":"5 мин","props":"перчатки, воздушные шары","b":"В перчатках за время лопнуть как можно больше воздушных шаров.","p":["Движение и разминка"],"id":"лопнишар","i":306},{"t":"Лот (аукцион идей)","a":[2,3],"ty":"Словесные и интеллектуальные","goal":"Творчество, реклама","n":"команды по 5-7","time":"40 мин","props":"предметы для лотов, жюри","b":"Ведущий представляет лот (например, обычная кружка). У команды 3-5 минут, чтобы придумать рекламу или нестандартное применение. Потом команды по очереди называют новые применения. Жюри выбирает лучшую команду, которой достаётся лот. Так продают все предметы.","p":["Внимание и мышление","Творчество"],"id":"лот","i":307},{"t":"Лучший шофёр (на нитке)","a":[1,2],"ty":"Эстафеты и состязания","goal":"Скорость","n":"2","time":"5 мин","props":"2 машинки, нитки, карандаши","b":"К машинкам привязаны длинные нитки с карандашами на концах. По команде мотаем нитку на карандаш. Чья машинка быстрее дойдёт до финиша, тот победил.","p":["Движение и разминка"],"id":"лучшийшофер","i":308},{"t":"Людоед","a":[1],"ty":"Подвижные","goal":"Смелость, реакция","n":"6-15","time":"5-10 мин","props":"нет","b":"«Людоед» сидит с закрытыми глазами, остальные подкрадываются и касаются его. Кого схватили за руку, тот становится людоедом.","p":["Движение и разминка","Внимание и мышление"],"id":"людоед","i":309},{"t":"Лягушка на охоте","a":[1,2],"ty":"Эстафеты и состязания","goal":"Ловкость","n":"команды по 5-8","time":"10 мин","props":"теннисные мячи, ласты по желанию","b":"«Лягушка» прыжками на корточках добирается до отметки, разворачивается, следующий бросает ей мяч-«комара». Поймав, возвращается и передаёт эстафету. Без ласт прыгать безопаснее.","p":["Движение и разминка"],"id":"лягушканаохоте","i":310},{"t":"Ляпка","a":[1],"ty":"Подвижные","goal":"Размяться","n":"8-30","time":"5-10 мин","props":"нет","b":"Водящий («ляпка») салит убегающих со словами «На тебе ляпку, отдай её другому!». Осаленный становится водящим. Вариант с диалогом: у пойманного спрашивают «У кого был? Что ел? Кому отдал?», и он называет следующего водящего. Нельзя гоняться всё время за одним и тем же игроком.","p":["Движение и разминка"],"id":"ляпка","i":311},{"t":"М-м-м по кругу","a":[2,3],"ty":"Доверие","goal":"Единство","n":"8-25","time":"5 мин","props":"нет","b":"Круг сидя. Первый тянет звук «м-м-м», когда заканчивает, следующий подхватывает без паузы. Звук не должен прерываться.","p":["Доверие","Сплочение"],"id":"мммпокругу","i":312},{"t":"МПС (Мой правый сосед)","a":[2,3],"ty":"Тихие и спокойные","goal":"Внимание, смех","n":"5-40","time":"20 мин","props":"нет","b":"Игра «одноразовая». Водящих выводят за дверь. Группа договаривается, что каждый отвечает на вопросы про своего правого соседа (МПС). Водящий задаёт вопросы о загаданном человеке и должен понять, как всё устроено.","p":["Успокоение","Внимание и мышление"],"id":"мпс","i":313},{"t":"Магазин (сюжетная игра)","a":[1],"ty":"Творческие и ролевые","goal":"Счёт, взаимопомощь","n":"8-25","time":"40 мин","props":"товары, жетоны, весы","b":"Дети готовят «товары», настоящие меры, жетоны вместо денег и прейскурант. Роли: продавцы, кассиры (выдают чеки), покупатели. Самых привлекательных товаров мало, но хватит каждому, если не брать помногу. Игра идёт, пока товары не распроданы.","p":["Творчество","Сплочение"],"id":"магазин","i":314},{"t":"Магический шифр","a":[2,3],"ty":"Следопытство и ориентирование","goal":"Ориентирование, словарный запас","n":"личные, пары или команды","time":"60 мин","props":"карты с КП, красно-белые призмы с буквами, карточки участников","b":"Вожатый придумывает слово-шифр (например, «разведчик»). В лесу прячут столько КП, сколько букв, на каждом - одна буква. Участники стартуют по очереди с интервалом в минуту и в любом порядке находят КП, переписывают буквы в карточку. Затем составляют из этих букв как можно больше слов (существительные в единственном числе, имена и географические названия нельзя). На всё один час, общая дистанция до 3 км. Срывать КП и править буквы запрещено - дисквалификация. Победитель - тот, кто составил больше слов или первым угадал шифр. В первый раз играть лучше командами или группами по 2-3.","p":["Следопытство"],"id":"магическийшифр","i":315},{"t":"Магнит","a":[2,3],"ty":"Сплочение","goal":"Внимание, группа","n":"8-20","time":"10 мин","props":"нет","b":"Все стоят у стены и «прилипли». Один - магнит, закрывает глаза и «притягивает» людей. Кто почувствовал, отлипает и присоединяется. По порядку можно увидеть отношение группы к человеку.","p":["Сплочение","Внимание и мышление"],"id":"магнит","i":316},{"t":"Майские жуки","a":[1],"ty":"Тихие и спокойные","goal":"Расслабление","n":"6-20","time":"5 мин","props":"нет","b":"Дети - жуки, летают и жужжат. «Падают, устали, на спинке полежали, ножками болтают, затихли, отдыхают». Повторить 2-3 раза.","p":["Успокоение"],"id":"майскиежуки","i":317},{"t":"Макарена","a":[2,3],"ty":"Танцы и музыкальные","goal":"Размяться","n":"любое","time":"3-5 мин","props":"музыка","b":"Правая рука вперёд, левая рука вперёд, правая на левое плечо, левая на правое, правая за голову, левая за голову, руки на бёдра (бёдра покачиваем три раза), прыжок с поворотом - и сначала.","p":["Движение и разминка"],"id":"макарена","i":318},{"t":"Маленькая деталь","a":[1,2],"ty":"Тихие и спокойные","goal":"Внимание","n":"от 6","time":"5-10 мин","props":"нет","b":"Водящий выходит, у него незаметно меняют одну деталь одежды (расстегнули пуговицу, закатали штанину). Вернувшийся угадывает. Вариант - поднос с 10-15 предметами, где что-то убирают или добавляют.","p":["Успокоение","Внимание и мышление"],"id":"маленькаядеталь","i":319},{"t":"Марафон (спринцовка)","a":[1,2],"ty":"Эстафеты и состязания","goal":"Ловкость","n":"команды","time":"10 мин","props":"груша для спринцевания или трубка, шарик для настольного тенниса","b":"Провести шарик по дистанции, подгоняя воздухом, быстрее соперников.","p":["Движение и разминка"],"id":"марафон","i":320},{"t":"Масленичные бои: конные","a":[2,3],"ty":"Народные и праздничные","goal":"Сила, ловкость","n":"четвёрки","time":"10 мин","props":"мягкая площадка","b":"Всадники на плечах «лошадей» стараются сбросить друг друга толчками. Бить нельзя. Подходит только подготовленным и сильным ребятам, на ровной мягкой траве.","p":["Событие","Движение и разминка"],"id":"масленичныебоиконные","i":321},{"t":"Масленичные бои: петушиные","a":[1,2],"ty":"Народные и праздничные","goal":"Равновесие, весёлое соревнование","n":"пары","time":"10 мин","props":"мел","b":"Двое прыгают на одной ноге, поджав другую, и стараются вытолкнуть соперника из круга. Отпустил ногу - выходит или заново поджимает. Играть на траве или мате, толкать плечом, не руками в лицо.","p":["Событие"],"id":"масленичныебоипетушиные","i":322},{"t":"Математика","a":[1,2],"ty":"Знакомство","goal":"Запомнить имена, внимание","n":"8-25","time":"5-10 мин","props":"нет","b":"Считаем по кругу по часовой стрелке. На ком число, кратное 3 (можно 4 или 5), тот вместо числа называет своё имя.","p":["Знакомство","Внимание и мышление"],"id":"математика","i":323},{"t":"Матрёна (платки)","a":[1,2,3],"ty":"Эстафеты и состязания","goal":"Смех, командная работа","n":"две команды","time":"10 мин","props":"платки","b":"Команды в шеренгах, у каждого платок. Второй завязывает платок первому на голове (поправлять нельзя), третий второму и т.д. Последний кричит «готовы!». Жюри оценивает скорость и смешность.","p":["Движение и разминка"],"id":"матрена","i":324},{"t":"Матрёшки","a":[1],"ty":"Эстафеты и состязания","goal":"Смех","n":"2 или команды","time":"5 мин","props":"2 сарафана, 2 косынки","b":"Кто быстрее наденет сарафан и косынку, тот победитель.","p":["Движение и разминка"],"id":"матрешки","i":325},{"t":"Медведь в западне","a":[1,2],"ty":"Подвижные","goal":"Командность","n":"10-20","time":"10 мин","props":"нет","b":"Круг держится за руки, медведь внутри. Он пытается вырваться, но не руками. Вырвался - все бегут за ним. Первый, кто задел, становится медведем.","p":["Движение и разминка"],"id":"медведьвзападне","i":326},{"t":"Медведь на бору","a":[1],"ty":"Подвижные","goal":"Размяться","n":"8-20","time":"10 мин","props":"мел","b":"Медведь «спит» в берлоге в углу. Дети идут в «бор» за грибами и ягодами и говорят «У медведя на бору грибы-ягоды беру, а медведь сидит и на нас рычит». На последнем слове медведь вскакивает и ловит. Пойманный становится медведем.","p":["Движение и разминка"],"id":"медведьнабору","i":327},{"t":"Мельница (мяч по кругу)","a":[2,3],"ty":"Игры в кругу и со стульями","goal":"Быстрота реакции","n":"8-20","time":"10 мин","props":"мяч","b":"В большом кругу передаём мяч всё быстрее. Упустил мяч или неправильно бросил - выбыл. Побеждает последний.","p":["Внимание и мышление","Движение и разминка"],"id":"мельница","i":328},{"t":"Менуэт","a":[2,3],"ty":"Танцы и музыкальные","goal":"Бальный шаг","n":"пары","time":"10 мин","props":"музыка","b":"Пары: шаг вправо с приседанием, шаг влево, поворот друг к другу, движение вправо и круг по правым рукам. Повторять.","p":["Движение и разминка"],"id":"менуэт","i":329},{"t":"Менялки","a":[1,2,3],"ty":"Игры в кругу и со стульями","goal":"Знакомство, сплочение","n":"10-25","time":"10 мин","props":"стулья","b":"Стулья по кругу, на один меньше, чем игроков. Водящий говорит: «Меняются местами те, у кого... светлые волосы (часы, кроссовки)». Названные быстро меняются, водящий занимает свободный стул. Оставшийся без стула водит.","p":["Знакомство","Сплочение"],"id":"менялки","i":330},{"t":"Месим тесто","a":[1],"ty":"Тихие и спокойные","goal":"Успокоение","n":"1-6","time":"15 мин","props":"тесто","b":"Мять и лепить из солёного теста. Рецепт: 2 стакана муки, 1 стакан соли, 1 стакан подкрашенной воды, 2 ст. ложки масла. Хранить в пакете в холодильнике.","p":["Успокоение"],"id":"месимтесто","i":331},{"t":"Меткость (в банку)","a":[1,2,3],"ty":"Эстафеты и состязания","goal":"Меткость","n":"любое","time":"10 мин","props":"банка, мелкие предметы (шишки)","b":"С 3 м бросаем мелкие предметы в трёхлитровую банку. Три попытки на каждого.","p":["Движение и разминка"],"id":"меткость","i":332},{"t":"Мешочек по кругу","a":[1,2],"ty":"Игры в кругу и со стульями","goal":"Сплочение, ловкость","n":"8-20","time":"10 мин","props":"мешочек с горохом","b":"Стоим, взявшись под руки, перебрасываем мешочек по кругу. Уронили - сначала. Потом перебрасываем через одного, через двоих.","p":["Сплочение","Движение и разминка"],"id":"мешочекпокругу","i":333},{"t":"Мешочек с горохом","a":[1,2],"ty":"Сплочение","goal":"Внимание, ловкость","n":"8-20","time":"10 мин","props":"мешочек","b":"Круг, руки сцеплены под локти и вытянуты. Нужно передать мешочек по кругу, не уронив. Потом через одного и через двух.","p":["Сплочение","Внимание и мышление","Движение и разминка"],"id":"мешочексгорохом","i":334},{"t":"Мигалки","a":[1,2,3],"ty":"Пятиминутки на ожидание","goal":"Реакция","n":"12-30","time":"5-10 мин","props":"нет","b":"Пары: один (внутренний круг) стоит лицом в центр, за ним в полушаге напарник, руки за спиной. Водящий без пары подмигивает кому-то из внутреннего круга. Тот пытается убежать, напарник его удерживает. Убежал - встаёт за водящего, упустивший становится водящим.","p":["Заполнить паузу","Внимание и мышление"],"id":"мигалки","i":335},{"t":"Мигалки со стульями","a":[1,2],"ty":"Игры в кругу и со стульями","goal":"Внимание","n":"10-20","time":"10 мин","props":"стулья","b":"Половина игроков сидит на стульях по кругу, остальные стоят позади, один стул пустой. Тот, кто стоит за пустым, подмигивает кому-то из сидящих, чтобы переманить. Стоящие позади стараются удержать «своих».","p":["Внимание и мышление"],"id":"мигалкисостульями","i":336},{"t":"Миксер","a":[2,3],"ty":"Знакомство","goal":"Знакомство, разбиться на группы","n":"15-40","time":"15 мин","props":"листочки, ручки","b":"Каждый записывает на листке рост, цвет глаз, знак зодиака, любимое блюдо и т.д. и обменивается информацией. Потом ведущий называет признак («соберитесь по росту 150-160 см»), и все собираются в группы.","p":["Знакомство"],"id":"миксер","i":337},{"t":"Мистер Икс","a":[2,3],"ty":"Словесные и интеллектуальные","goal":"Логика","n":"6-15","time":"10 мин","props":"нет","b":"Водящий выходит. Остальные договариваются, что «Мистер Икс» - тот, кто сидит слева от отвечающего. Водящий задаёт вопросы «да/нет» и пытается понять, о ком речь. Одноразовая игра.","p":["Внимание и мышление"],"id":"мистерикс","i":338},{"t":"Михасик","a":[1],"ty":"Игры в кругу и со стульями","goal":"Развить внимание и реакцию","n":"8-15","time":"5-10 мин","props":"пары обуви или шапок, музыка","b":"Предметов (пар обуви) по кругу на одну пару меньше, чем игроков. Пока играет музыка, все двигаются по кругу снаружи. Когда музыка смолкает, каждый спешит обуться или схватить предмет. Оставшийся без пары выбывает, один предмет убирают. Играем до последнего игрока.","p":["Внимание и мышление"],"id":"михасик","i":339},{"t":"Мишки","a":[1],"ty":"Тихие и спокойные","goal":"Выпустить пар","n":"6-20","time":"5 мин","props":"нет","b":"«Раз, два, три, четыре, пять, вышли мишки погулять. Раз, два, три, ну-ка порычи!» Дети изображают медведей и рычат.","p":["Успокоение"],"id":"мишки","i":340},{"t":"Мне в тебе нравится","a":[1,2,3],"ty":"Сплочение","goal":"Доброе слово","n":"8-15","time":"10-15 мин","props":"нет","b":"Сидя в кругу, каждый говорит соседу, что ему нравится (в одежде, улыбке, причёске, но можно и качество характера). Цель - тёплая обстановка. Только добрые слова.","p":["Сплочение"],"id":"мневтебенравится","i":341},{"t":"Могикане на тропе войны","a":[3],"ty":"Следопытство и ориентирование","goal":"Скрытность, разведка","n":"два племени","time":"3-4 часа","props":"условные \"костры\"","b":"Первое племя уходит не дальше 5 км и ставит стоянку. Через 2,5 часа второе идёт искать. Охрана не подпускает, лазутчик должен незаметно «потушить» костёр. Обнаруженный лазутчик выбывает. Костёр - условный (флаг или таз).","p":["Следопытство"],"id":"могиканенатропевойны","i":342},{"t":"Модельер","a":[2,3],"ty":"Творческие и ролевые","goal":"Творчество","n":"3-5 команд","time":"20 мин","props":"ткани, шарфы, шляпы, перья, галстуки","b":"Из материалов собираем яркий неповторимый костюм на «модель». Зрители выбирают лучшего модельера.","p":["Творчество"],"id":"модельер","i":343},{"t":"Мои особенности и преимущества","a":[2,3],"ty":"Рефлексия и разговор","goal":"Здоровая самооценка","n":"7-15","time":"15-20 мин","props":"бумага, фломастеры","b":"Каждый рисует или заполняет шаблон (шарики, звёздочки) о своих особенностях и сильных сторонах. По желанию показывает группе. Рисунки лучше оставить детям.","p":["Итоги и разговор"],"id":"моиособенностиипреимущества","i":344},{"t":"Мокрый шарик","a":[1,2],"ty":"Подвижные","goal":"Ловкость","n":"пары","time":"10 мин","props":"шарики, наполненные водой","b":"Пары перебрасывают водяной шарик, после каждых двух бросков расходятся на шаг. Лопнувший шарик - повод посмеяться и обняться или обменяться комплиментами.","p":["Движение и разминка"],"id":"мокрыйшарик","i":345},{"t":"Молекулы","a":[1,2,3],"ty":"Деление на команды","goal":"Разбиться на группы","n":"10-40","time":"5 мин","props":"нет","b":"Все хаотично двигаются. Ведущий называет число - надо быстро объединиться в группы по 3 (4, 5) и обняться. Остальные в игре, пока не наберётся нужное число микрогрупп. Вариант: каждая микрогруппа получает задание изобразить слона, любовь, слона до любви и после.","p":["Деление на команды"],"id":"молекулы","i":346},{"t":"Молча построиться","a":[1,2,3],"ty":"Сплочение","goal":"Невербальное общение","n":"8-40","time":"5 мин","props":"повязки по желанию","b":"Построиться по росту с закрытыми глазами или по дням рождения, не говоря ни слова.","p":["Сплочение"],"id":"молчапостроиться","i":347},{"t":"Молчаливое собрание","a":[1,2],"ty":"Пятиминутки на ожидание","goal":"Выразительность, внимание","n":"6-15","time":"10 мин","props":"нет","b":"Участники сидят рядом и по цепочке шепчут соседу на ухо слово. Потом каждый встаёт и показывает своё слово мимикой и жестами без звука, остальные угадывают. Показывает, пока не угадают. Смеяться нельзя, за смех - маленькое задание (фант).","p":["Заполнить паузу","Внимание и мышление"],"id":"молчаливоесобрание","i":348},{"t":"Моргалы","a":[1,2],"ty":"Игры в кругу и со стульями","goal":"Внимание","n":"11-21","time":"10 мин","props":"стулья","b":"Нечётное число игроков. Один не имеет пары и моргает сидящим. Сидящий, увидев подмигивание, пересаживается на свободный стул, а стоящий за его стулом должен успеть удержать его, положив руки на плечи. Не успел - начинает моргать сам.","p":["Внимание и мышление"],"id":"моргалы","i":349},{"t":"Море волнуется","a":[1,2],"ty":"Подвижные","goal":"Фантазия, выразительность","n":"8-25","time":"10 мин","props":"нет","b":"Водящий говорит: «Море волнуется раз, море волнуется два, море волнуется три, морская фигура, на месте замри!» Игроки замирают в позе. Водящий выбирает одну фигуру и угадывает, что она изображает, или просит показать действие. Вариант: ведущий заказывает «фигуру балерины, медвежонка, дождя», обходит фигуры и выбирает самую артистичную, этот игрок становится ведущим.","p":["Движение и разминка","Творчество"],"id":"мореволнуется","i":350},{"t":"Мороз - Красный нос","a":[1],"ty":"Подвижные","goal":"Размяться","n":"10-30","time":"10 мин","props":"мел","b":"Два «дома» на концах площадки, в одном стоят дети, посередине Мороз. «Я Мороз, Красный нос. Кто из вас решится в путь-дороженьку пуститься?» - «Не боимся мы угроз и не страшен нам мороз!». Дети перебегают в другой дом, Мороз их касается («замораживает»), замороженные стоят на месте до конца перебежки.","p":["Движение и разминка"],"id":"морозкрасныйнос","i":351},{"t":"Морские волны","a":[1],"ty":"Пятиминутки на ожидание","goal":"Переключение внимания, снятие напряжения","n":"10-30","time":"5 мин","props":"нет","b":"По слову «Штиль» все замирают, по слову «Волны» ряды по очереди встают с паузой 2-3 секунды, затем все хлопают и первые садятся. «Шторм» - то же самое, но без пауз. Заканчивать словом «Штиль».","p":["Заполнить паузу","Внимание и мышление","Успокоение"],"id":"морскиеволны","i":352},{"t":"Морской волк","a":[1,2],"ty":"Эстафеты и состязания","goal":"Ловкость","n":"2-4","time":"10 мин","props":"бескозырка, верёвка","b":"Вариант 1: завязать ленты бескозырки под подбородком одной рукой. Вариант 2: завязать на толстой верёвке пять узлов как можно туже, потом развязать. Побеждает быстрейший.","p":["Движение и разминка"],"id":"морскойволк","i":353},{"t":"Московские прятки","a":[1,2],"ty":"Подвижные","goal":"Размяться","n":"8-20","time":"15 мин","props":"нет","b":"Водящий стоит спиной, кто-то ударяет его по спине. Он угадывает кто, ему отвечают «Сколько дашь?» (кругов пробежать вокруг здания). Не угадал - бежит штраф, пока остальные прячутся. Потом ищет и бежит к месту сбора.","p":["Движение и разминка"],"id":"московскиепрятки","i":354},{"t":"Мост","a":[1,2],"ty":"Сплочение","goal":"Взаимопомощь","n":"2 команды по 4-8","time":"10 мин","props":"скамья или бревно шириной полметра","b":"Две команды идут навстречу по скамье или бревну длиной 3-5 м и должны разойтись, не упав. Не на скорость. Вожатые страхуют с обеих сторон, скамья невысокая.","p":["Сплочение"],"id":"мост","i":355},{"t":"Мост и защитники","a":[2,3],"ty":"Следопытство и ориентирование","goal":"Ловкость","n":"2 команды","time":"20 мин","props":"невысокое бревно или скамья, мягкие мячи","b":"Защитники в 5-7 м от переправы с двумя мягкими мячами у каждого. Нападающие по одному перебегают по бревну, защитники бросают мячи. Перебравшийся получает 3 очка, поймавший мяч - 5, соскочивший теряет команде 3. Бревно невысоко над землёй, только мягкие мячи, не шишки.","p":["Следопытство","Движение и разминка"],"id":"мостизащитники","i":356},{"t":"Мумия","a":[1,2,3],"ty":"Эстафеты и состязания","goal":"Командное творчество","n":"2-3 пары","time":"10 мин","props":"туалетная бумага","b":"В паре один «мумия», другой «мумификатор». Нужно как можно быстрее и аккуратнее замотать «мумию» туалетной бумагой. Оцениваем скорость и качество.","p":["Движение и разминка","Творчество"],"id":"мумия","i":357},{"t":"Муравьиная тропа","a":[2,3],"ty":"Сплочение","goal":"Командность","n":"8-16","time":"10 мин","props":"длинная доска","b":"Две подгруппы стоят на доске по разные стороны от середины и должны поменяться местами, не касаясь земли. Коснулись - сначала. Доска должна быть устойчивой, нужен страхующий.","p":["Сплочение"],"id":"муравьинаятропа","i":358},{"t":"Мы все дружные ребята (скакалка)","a":[1,2],"ty":"Подвижные","goal":"Ловкость","n":"4-12","time":"5-10 мин","props":"длинная скакалка","b":"Попрыгать со скакалкой как можно дольше в парах, тройках, четвёрках.","p":["Движение и разминка"],"id":"мывседружныеребята","i":359},{"t":"Мыльные пузыри (движения)","a":[1],"ty":"Тихие и спокойные","goal":"Расслабление","n":"6-20","time":"5 мин","props":"нет","b":"Ведущий читает: «Осторожно, пузыри! Ой, какие! Ой, смотри! Раздуваются, блестят, отрываются, летят и лопаются!» Дети изображают пузыри и по хлопку падают на ковёр отдыхать.","p":["Успокоение","Движение и разминка"],"id":"мыльныепузыри","i":360},{"t":"Мышеловка","a":[2,3],"ty":"Сплочение","goal":"Внимание, чуткость","n":"10-20","time":"10 мин","props":"нет","b":"Две тройки встают кольцами, глаза закрыты, группа цепочкой проходит сквозь кольца. В какой-то момент кольца резко опускают руки - «мышеловка». Задача троек - молча понять, сколько людей оказалось в кольце.","p":["Сплочение","Внимание и мышление"],"id":"мышеловка","i":361},{"t":"Мышки-домики","a":[1,2],"ty":"Деление на команды","goal":"Размяться и перемешать группу","n":"от 6 (кратно 3)","time":"5-10 мин","props":"нет","b":"Тройки: двое - «домик» (держатся за руки), третий - «мышка» внутри. Команда «Мышки!» - мышки меняют домики; «Домики!» - домики вместе переходят к новой мышке; «Землетрясение!» - тройки распадаются и собираются заново. Можно играть на выбывание и менять ведущих.","p":["Деление на команды"],"id":"мышкидомики","i":362},{"t":"Мяукаем и хрюкаем","a":[1,2],"ty":"Подвижные","goal":"Слух, смех","n":"10-30","time":"5-10 мин","props":"повязки","b":"Две команды с завязанными глазами в одной куче: одни «мяукают», другие «хрюкают». Нужно собраться командой вместе, не выходя за круг зрителей.","p":["Движение и разминка"],"id":"мяукаемихрюкаем","i":363},{"t":"Мяч между ног","a":[1],"ty":"Игры в кругу и со стульями","goal":"Ловкость","n":"8-20","time":"10 мин","props":"мяч","b":"Игроки стоят в кругу, ноги расставлены так, что стопы касаются соседних. Водящий в центре пытается выкатить мяч между ног. Остановить мяч можно только руками, ноги не двигать. Пропустивший водит.","p":["Движение и разминка"],"id":"мячмеждуног","i":364},{"t":"Мяч под подбородком","a":[1,2,3],"ty":"Эстафеты и состязания","goal":"Командная ловкость","n":"две команды","time":"10 мин","props":"мяч","b":"Передаём мяч в шеренге, удерживая его только подбородком и шеей, руками трогать нельзя. Касаться друг друга можно, чтобы не уронить.","p":["Движение и разминка"],"id":"мячподподбородком","i":365},{"t":"Мяч с именами","a":[1,2],"ty":"Знакомство","goal":"Запомнить имена","n":"8-25","time":"10 мин","props":"мяч","b":"Круг сидя. Первый называет чьё-то имя и бросает мяч, тот называет другое имя и бросает дальше. Мяч побывает у каждого один раз. Потом можно повторить быстрее.","p":["Знакомство"],"id":"мячсименами","i":366},{"t":"Мяч слепого судьи","a":[1,2],"ty":"Подвижные","goal":"Командность","n":"2 команды","time":"10 мин","props":"мяч, свисток, повязка","b":"Двум командам нужно выбросить мяч за линию на чужую половину. Один игрок с повязкой и свистком свистит когда хочет, и команда, у которой на половине оказался мяч, получает штрафное очко.","p":["Движение и разминка"],"id":"мячслепогосудьи","i":367},{"t":"Мячи без рук","a":[1,2],"ty":"Эстафеты и состязания","goal":"Ловкость","n":"пары, команды","time":"15 мин","props":"мячи, теннисные ракетки, палочки","b":"Набор состязаний: скакать с мячом между коленями; бежать вдвоём, зажав мяч между лбами (один вперёд, другой назад), плечами или спинами; «крокодильчик» - команда ползёт, зажав мячи между спинами и грудью; нести мяч на ракетке; пройти с мячом на голове; удерживать мячик палочками в паре; мяч через голову по колонне с пробежкой последнего вперёд.","p":["Движение и разминка"],"id":"мячибезрук","i":368},{"t":"Мячик в руке","a":[1,2],"ty":"Подвижные","goal":"Внимание, реакция","n":"8-20","time":"10 мин","props":"мячик или камешек","b":"Игроки стоят в шеренге, руки за спиной с раскрытыми ладонями. Водящий идёт вдоль и тайно опускает мячик одному. Получивший вырывается из шеренги, а соседи должны успеть его осалить, не сходя с места. Поймали - меняется с водящим.","p":["Движение и разминка","Внимание и мышление"],"id":"мячиквруке","i":369},{"t":"Мячик кверху","a":[1,2],"ty":"Подвижные","goal":"Реакция, меткость","n":"8-20","time":"10 мин","props":"мяч","b":"Водящий бросает мяч вверх, называя имя. Все разбегаются, названный ловит мяч и кричит «Стоп!». Новый водящий делает три больших шага и бросает мяч в кого-то. Попал - тот водит, не попал - водит снова.","p":["Движение и разминка","Внимание и мышление"],"id":"мячиккверху","i":370},{"t":"Мёртвая зона","a":[1,2,3],"ty":"Сплочение","goal":"Сила, ловкость","n":"8-20","time":"10 мин","props":"длинная верёвка, мел","b":"Все держатся за общую связанную верёвку, внутри круга меньший «мёртвый» круг. Каждый тянет, пытаясь заставить других ступить в него. Наступивший выбывает. Тянуть плавно, без рывков, в перчатках.","p":["Сплочение","Движение и разминка"],"id":"мертваязона","i":371},{"t":"На болоте (листы)","a":[1,2],"ty":"Эстафеты и состязания","goal":"Ловкость","n":"2","time":"5 мин","props":"4 листа бумаги","b":"Двое проходят «болото» по листам-«кочкам»: встали на лист, положили вперёд другой, перешагнули, переложили первый и так далее. Нужно дойти и вернуться.","p":["Движение и разминка"],"id":"наболоте","i":372},{"t":"На золотом крыльце сидели","a":[1,2],"ty":"Подвижные","goal":"Ловкость, прыгучесть","n":"6-15","time":"10 мин","props":"скакалка","b":"Водящий крутит скакалку у земли, приговаривая по слову на оборот: «На золотом крыльце сидели царь, царевич, король, королевич, сапожник, портной». Остальные прыгают. Кто задел - водит.","p":["Движение и разминка"],"id":"назолотомкрыльцесидели","i":373},{"t":"На обломках корабля","a":[1,2,3],"ty":"Подвижные","goal":"Размяться","n":"от 4","time":"10-15 мин","props":"подушки, покрывала, возвышения","b":"Пол - «море», безопасные места - «обломки» (стулья, подушки). «Пират» ловит остальных. Осаленный, у которого хоть одна нога в «море», становится пиратом. Больше 10 секунд на одном месте стоять нельзя, два игрока не занимают одно место.","p":["Движение и разминка"],"id":"наобломкахкорабля","i":374},{"t":"На ощупь","a":[1,2,3],"ty":"Тихие и спокойные","goal":"Тактильное внимание","n":"любое","time":"5-10 мин","props":"мешок, 8-10 мелких предметов","b":"В тканевом мешке лежат предметы (ножницы, пробка, катушка, пуговица, ложка). Через ткань нужно угадать, что в мешке. Для безопасности без острых краёв.","p":["Успокоение","Внимание и мышление"],"id":"наощупь","i":375},{"t":"Наблюдатели","a":[1,2],"ty":"Следопытство и ориентирование","goal":"Зрительная память","n":"6-20","time":"15 мин","props":"флажки, палки","b":"Минуту рассматривают ландшафт (дорога, колодец, дом, мостик), поворачиваются спиной, отвечают на вопросы. Очко за правильный ответ. Усложнение: другая группа пробегает или проползает в пределах видимости с предметами, наблюдатели сообщают, что видели.","p":["Следопытство","Внимание и мышление"],"id":"наблюдатели","i":376},{"t":"Надень колпак","a":[1,2],"ty":"Подвижные","goal":"Ловкость","n":"2","time":"5 мин","props":"бумажные колпаки на палках","b":"У каждого длинная палка с колпаком. Нужно «околпачить» соперника: надеть колпак ему на голову, не получив своего.","p":["Движение и разминка"],"id":"наденьколпак","i":377},{"t":"Надписи на спине","a":[2,3],"ty":"Сплочение","goal":"Тёплая обратная связь","n":"от 8","time":"10-15 мин","props":"листы, скотч, ручки","b":"Каждому прикрепляют лист на спину, все ходят и пишут друг другу на спинах то, что нравится в человеке. Потом читают и обсуждают. Хорошо для конца смены, но можно и для знакомства.","p":["Сплочение"],"id":"надписинаспине","i":378},{"t":"Найди кольцо","a":[1,2],"ty":"Игры в кругу и со стульями","goal":"Внимание","n":"10-20","time":"10 мин","props":"верёвка, большое кольцо, повязка","b":"Все держатся за общую верёвку с кольцом, водящему в центре завязывают глаза. Игроки передвигают кольцо по верёвке, водящий должен найти у кого оно. У кого нашли, тот водит.","p":["Внимание и мышление"],"id":"найдикольцо","i":379},{"t":"Найди место (стулья в р
